<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>集运费用明细</title>
  <link rel="stylesheet" href="../hgj-ui.css">
  <style>
    :root{--bg:var(--hgj-bg);--panel:var(--hgj-card);--text:var(--hgj-text);--muted:var(--hgj-muted);--line:var(--hgj-line);--accent:var(--hgj-primary);--nav:#00132E;--bad:var(--hgj-danger);--warn:var(--hgj-warn)}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--hgj-font)}button,input,select{height:34px;border:1px solid var(--line);border-radius:0;background:var(--panel);color:var(--text);padding:0 10px;box-shadow:none}button{cursor:pointer}.primary{background:#006AFF;border-color:#006AFF;color:#fff}.app{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:100vh}.side{background:var(--nav);color:#fff}.brand{height:56px;padding:17px 16px;font-weight:700}.navitem{height:48px;display:flex;align-items:center;padding:0 16px;color:#d9e6ff;border-left:3px solid #006AFF}.main{padding:18px 20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:12px}.title{font-size:18px;line-height:20px;margin:0;color:var(--hgj-title);padding-left:10px;border-left:3px solid #006AFF}.sub,.muted{color:var(--muted);font-size:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px}.field{display:grid;gap:4px}.field label{font-size:12px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:0;box-shadow:none}.card{padding:12px}.num{font-size:22px;font-weight:700;margin-top:2px}.panel{margin-bottom:10px;overflow:hidden}.head{height:42px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px}.head b{padding-left:9px;border-left:3px solid #006AFF}.body{padding:12px}.pill{display:inline-block;border:1px solid #006AFF;color:#006AFF;background:var(--hgj-primary-bg);padding:1px 7px;font-size:12px;margin:0 4px 4px 0}.warn{color:var(--warn)}.bad{color:var(--bad)}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:8px 9px;text-align:left;vertical-align:top}th{background:var(--bg);color:var(--muted);font-size:12px}.empty{padding:18px;color:var(--muted);text-align:center}.note{padding:8px 0;color:var(--muted);font-size:12px}@media(max-width:900px){.app{display:block}.side{display:none}.main{padding:14px}.top,.filters{display:grid;grid-template-columns:1fr}.cards{grid-template-columns:1fr}table{display:block;overflow-x:auto;white-space:nowrap}}
  </style>
<script src="../wb-open-tab.js" data-protocol="sanlyn:open-tab"></script>
</head>
<body class="hgj-page">
  <div class="app">
    <aside class="side"><div class="brand">Sanlyn</div><div class="navitem">集运费用明细</div></aside>
    <main class="main">
      <header class="top">
        <div><h1 class="title hgj-panel-title">集运费用明细</h1><div id="stamp" class="sub">v2026.09.05-1 · 加载中</div></div>
        <button id="reload" class="primary" type="button">刷新</button>
      </header>
      <section class="panel">
        <div class="body filters">
          <div class="field"><label>关键词</label><input id="q" placeholder="BL / 柜号 / 供应商 / 费目"></div>
          <div class="field"><label>月份</label><input id="month" placeholder="YYYY-MM"></div>
          <div class="field"><label>供应商</label><input id="supplier" placeholder="全部"></div>
          <div class="field"><label>费目</label><input id="category" placeholder="全部"></div>
          <div class="field"><label>付款状态</label><select id="status"><option value="">全部</option><option value="unpaid">未付</option><option value="partial">部分付</option><option value="paid">已付</option></select></div>
          <button id="search" class="primary" type="button">查询</button>
        </div>
      </section>
      <section class="cards">
        <div class="card"><div class="muted">接入状态</div><div id="mState" class="num warn">未接入</div></div>
        <div class="card"><div class="muted">真实明细行</div><div id="mRows" class="num">未接入</div></div>
        <div class="card"><div class="muted">提单数</div><div id="mBl" class="num">未接入</div></div>
        <div class="card"><div class="muted">供应商数</div><div id="mSup" class="num">未接入</div></div>
      </section>
      <section class="panel"><div class="head"><b>字段填充率</b><span class="pill">真实字段</span></div><div id="coverage" class="body"></div></section>
      <section class="panel"><div class="head"><b>币种小计</b><span class="pill">只汇总已接入金额</span></div><div id="totals" class="body"></div></section>
      <section class="panel"><div class="head"><b>费用明细</b><span class="pill">freight_supplier_bills</span></div><div id="rows" class="body"></div></section>
    </main>
  </div>
  <script src="./consolidated-fee-details.js"></script>
</body>
</html>
