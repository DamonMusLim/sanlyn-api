<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>海运工作台</title>
  <link rel="stylesheet" href="/public/hgj-ui.css">
  <link rel="stylesheet" href="/public/wb-tabs.css">
  <style>
    body.hy-shell{grid-template-columns:180px minmax(0,1fr)}
    .side-logo strong{font-size:16px}
    .side-nav{padding:4px 0}
    .nav-main,.nav-leaf{justify-content:space-between}
    .nav-main-title,.nav-leaf-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .nav-status{flex:0 0 auto;margin-left:6px;color:#fff;background:rgba(153,160,171,.28);font-size:11px;line-height:18px;padding:0 5px}
    .nav-main:not(.pending) .nav-status,.nav-leaf:not(.pending) .nav-status{background:rgba(0,106,255,.9)}
    .nav-main:not(.pending) .nav-status:empty,.nav-leaf:not(.pending) .nav-status:empty{display:none}
    .nav-leaf{padding-right:8px}
    .module-brand{gap:10px}
    .top-logo{font-size:13px}
    .hy-version{color:var(--hgj-muted);font-size:12px;white-space:nowrap}
    .hy-workbench{padding:18px;overflow:auto;background:var(--hgj-bg)}
    .workbench-head{padding:16px;margin:0 0 12px}
    .workbench-head p{margin:8px 0 0;color:var(--hgj-muted);font-size:13px}
    .workbench-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .workbench-card{display:grid;gap:8px;min-height:118px;padding:16px;text-align:left;border:1px solid var(--hgj-line);color:var(--hgj-text);cursor:pointer}
    .workbench-card:hover{border-color:var(--hgj-primary)}
    .workbench-card-title{color:var(--hgj-title);font-size:16px;font-weight:700}
    .workbench-card-url{width:max-content;max-width:100%;padding:2px 7px;background:var(--hgj-primary-bg);color:var(--hgj-primary);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .workbench-card-desc{color:var(--hgj-muted);font-size:13px}
    .placeholder-card ul{margin:10px 0 0;padding-left:18px;color:var(--hgj-muted)}
    @media(max-width:1100px){.workbench-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:860px){body.hy-shell{grid-template-columns:1fr}.hy-version{display:none}.workbench-grid{grid-template-columns:1fr}.hy-workbench{padding:14px}}
  </style>
</head>
<body class="hgj-page hy-shell">
  <aside class="side hgj-side">
    <div class="side-logo">
      <strong>海运工作台</strong>
      <span>v2026.08.28-1 · <span id="generatedAt">生成时间 --</span></span>
    </div>
    <nav id="sideNav" class="side-nav" aria-label="海运导航"></nav>
  </aside>
  <section class="workspace">
    <header class="topbar">
      <div class="module-brand">
        <span class="top-logo">HY</span>
        <span class="module-title" id="moduleTitle">工作台</span>
      </div>
      <div id="topSearch" class="top-search"></div>
      <div class="top-actions">
        <span class="hy-version">v2026.08.28-1</span>
        <button class="icon-btn" id="noticeBtn" type="button" title="通知" aria-label="通知">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16v-5a6 6 0 0 0-12 0v5l-2 2h16z"/><path d="M9.5 20a2.5 2.5 0 0 0 5 0"/></svg>
        </button>
        <div class="company">Sanlyn</div>
      </div>
    </header>
    <nav id="tabs" class="tabs hgj-tabbar" aria-label="海运标签页"></nav>
    <main id="stage" class="stage" aria-label="标签页内容"></main>
  </section>
  <div class="float-tools" aria-label="快捷工具">
    <button type="button" data-tool="刷新" title="刷新当前页"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v6h-6"/></svg></button>
    <button type="button" data-tool="搜索" title="聚焦搜索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
    <button type="button" data-tool="返回首页" title="返回首页"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg></button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/global-search.js"></script>
  <script src="/hy/shell.js"></script>
</body>
</html>
