<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>海运工作台</title>
  <link rel="stylesheet" href="../hgj-ui.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:var(--hgj-bg,#eef2f4);color:var(--hgj-text,#14202a);font:14px/1.55 var(--hgj-font,system-ui,sans-serif)}
    .wrap{max-width:1180px;margin:0 auto;padding:18px;display:flex;flex-direction:column;gap:14px}
    .top{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap}
    h1{margin:0;color:var(--hgj-title,#111827);font-size:22px}.meta{color:var(--hgj-muted,#667085);font-size:12px}
    .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filters label{color:var(--hgj-muted,#667085);font-size:12px}.filters input{height:32px;border:1px solid var(--hgj-line,#d4dee3);border-radius:6px;padding:0 9px;background:#fff}.btn{height:32px;border:1px solid var(--hgj-line,#d4dee3);border-radius:6px;background:#fff;color:var(--hgj-text,#14202a);padding:0 10px;cursor:pointer}.btn.primary{background:var(--hgj-primary,#0e6f6f);border-color:var(--hgj-primary,#0e6f6f);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}
    .panel{background:#fff;border:1px solid var(--hgj-line,#d4dee3);border-radius:8px;overflow:hidden}.ph{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--hgj-line,#d4dee3);background:#f7fafb}.ph h2{margin:0;font-size:15px}.sub{color:var(--hgj-muted,#667085);font-size:12px}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    table{width:100%;border-collapse:collapse}th,td{padding:9px 11px;border-bottom:1px solid #e8eef1;text-align:left;vertical-align:top}th{font-size:12px;color:var(--hgj-muted,#667085);font-weight:600;background:#fbfcfd}tr[data-url]{cursor:pointer}tr[data-url]:hover{background:#f3f8f8}.type{display:inline-flex;min-width:50px;justify-content:center;border:1px solid #d7e5e2;background:#eef8f6;color:#0e6f6f;border-radius:999px;font-size:12px;padding:1px 7px}.excluded{background:#fff7e8;border-color:#f1c27d;color:#8a5200}.empty{padding:24px 14px;text-align:center;color:var(--hgj-muted,#667085)}.note{padding:9px 13px;color:#805800;background:#fff8e8;border-bottom:1px solid #f0dfbd;font-size:12px}
    .tabs{display:flex;gap:3px}.tabs button{height:30px;border:0;background:transparent;border-radius:6px;padding:0 10px;cursor:pointer;color:var(--hgj-muted,#667085)}.tabs button[aria-selected=true]{background:#e7f2f1;color:#0e6f6f;font-weight:600}.tabs button:disabled{opacity:.45;cursor:not-allowed}.warnrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 13px;border-bottom:1px solid #e8eef1}.warnrow[data-url]{cursor:pointer}.warnrow[data-url]:hover{background:#f3f8f8}.line{font-weight:600}.detail{font-size:12px;color:var(--hgj-muted,#667085);margin-top:3px}.actions{display:flex;gap:7px;align-items:center}.count{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--hgj-muted,#667085)}
    .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px}.audit{border:1px solid #e1e8ec;border-radius:7px;padding:11px;cursor:pointer}.audit:hover{border-color:#0e6f6f;background:#f6fbfa}.audit b{display:block;font-size:14px}.audit span{display:block;margin-top:4px;color:var(--hgj-muted,#667085);font-size:12px}
    @media(max-width:820px){.wrap{padding:12px}.cards{grid-template-columns:1fr}table{font-size:12px}th,td{padding:7px}.warnrow{grid-template-columns:1fr}.actions{justify-content:flex-end}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div><h1>工作台</h1><div class="meta" id="stamp">v2026.09.05-1 · 生成时间 --</div></div>
      <div class="filters">
        <label>开始 <input id="from" type="date"></label>
        <label>结束 <input id="to" type="date"></label>
        <button class="btn primary" id="reload" type="button">刷新</button>
      </div>
    </header>
    <section class="panel">
      <div class="ph"><div><h2>待办</h2><div class="sub">默认今天-60天到今天+30天；催款只统计已过账期的部分；没有账期日期的单独列出、不计入催款金额。</div></div><div class="toolbar"><div class="tabs" role="tablist" id="todoTabs"><button data-todo-tab="all" aria-selected="true">全部</button><button data-todo-tab="mail" aria-selected="false">邮件</button><button data-todo-tab="collection" aria-selected="false">催款</button><button data-todo-tab="nodate" aria-selected="false">待补账期</button><button data-todo-tab="audit" aria-selected="false">待审核</button></div><span class="count" id="todoCount">未接入</span></div></div>
      <div id="todoNotes"></div>
      <table><thead><tr><th>类型</th><th>跟进时间</th><th>跟进事项</th><th>往来单位</th></tr></thead><tbody id="todos"></tbody></table>
    </section>
    <section class="panel">
      <div class="ph"><div><h2>费用预警</h2><div class="sub" id="warnNote">系统尚未记录收付时间（收款 0%、付款 1.2%），所以这里是“没有记录”，不是“确认没核销”。</div></div><div class="toolbar"><div class="tabs" role="tablist"><button data-tab="uninvoiced" aria-selected="true">未开票 <span id="uninvoicedCount">未接入</span></button><button data-tab="unsettled" aria-selected="false">未核销 <span id="unsettledCount">未接入</span></button></div><button class="btn" id="ignoreAll" type="button">全部忽略</button><button class="btn" id="detail" type="button">查看详情</button></div></div>
      <div id="warnings"></div>
    </section>
    <section class="panel">
      <div class="ph"><div><h2>待审核</h2><div class="sub">来源 v_hy_audit_all</div></div><span class="count" id="auditCount">未接入</span></div>
      <div class="cards" id="audits"></div>
    </section>
  </main>
  <script src="../wb-open-tab.js"></script>
  <script>
  (function(){
    "use strict";
    var API="/api/db/hy-workbench",state={tab:"uninvoiced",todoTab:"all",data:null},NF=new Intl.NumberFormat("zh-CN",{maximumFractionDigits:2}),IGNORE_KEY="sanlyn.hy.workbench.ignore.v1";
    function $(id){return document.getElementById(id)}
    function token(){return localStorage.getItem("sanlyn_jwt")||localStorage.getItem("sanlyn_token")||localStorage.getItem("token")||sessionStorage.getItem("token")||""}
    function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])})}
    function money(v,c){var n=Number(v);return Number.isFinite(n)?(c?c+" ":"")+NF.format(n):"未接入"}
    function ignored(){try{return JSON.parse(localStorage.getItem(IGNORE_KEY)||"{}")}catch(e){return{}}}
    function setIgnored(id){var x=ignored();x[id]=1;localStorage.setItem(IGNORE_KEY,JSON.stringify(x))}
    function dateShift(days){var d=new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
    function open(title,url){if(window.SanlynOpenTab)window.SanlynOpenTab(title,url);else window.open(url,"_blank")}
    function rowClick(e){var btn=e.target.closest("button");if(btn)return;var r=e.target.closest("[data-url]");if(r)open(r.dataset.title||"详情",r.dataset.url)}
    function note(text){return text?'<div class="note">'+esc(text)+'</div>':""}
    function billLabel(r){return r.bl_no?[r.bl_no,r.cost_category].filter(Boolean).join(" · "):(r.id?"内部号 "+String(r.id).slice(0,8):"未接入")}
    async function load(){
      var h={},t=token();if(t)h.Authorization="Bearer "+t;
      var q="?from="+encodeURIComponent($("from").value)+"&to="+encodeURIComponent($("to").value);
      var r=await fetch(API+q,{headers:h}),j=await r.json().catch(function(){return{success:false,error:"接口返回异常"}});
      if(!r.ok||j.success===false)throw new Error(j.error||j.detail||("HTTP "+r.status));
      state.data=j;render();
    }
    function renderTodos(j){
      var allRows=Array.isArray(j.todos)?j.todos:[], notes=j.notes||{}, tab=state.todoTab||"all";
      function isNoBillDate(r){return r.type==="催款"&&(r.excluded===true||String(r.title||"").indexOf("无账期日期")>=0)}
      function inTab(r,t){
        if(t==="all")return true;
        if(t==="mail")return r.type==="邮件";
        if(t==="collection")return r.type==="催款"&&!isNoBillDate(r);
        if(t==="nodate")return isNoBillDate(r);
        if(t==="audit")return r.type==="待审核";
        return true;
      }
      var counts={all:allRows.length,mail:0,collection:0,nodate:0,audit:0};
      allRows.forEach(function(r){
        if(r.type==="邮件")counts.mail++;
        if(isNoBillDate(r))counts.nodate++;
        else if(r.type==="催款")counts.collection++;
        if(r.type==="待审核")counts.audit++;
      });
      var labels={all:"全部",mail:"邮件",collection:"催款",nodate:"待补账期",audit:"待审核"};
      document.querySelectorAll("#todoTabs button").forEach(function(b){
        var k=b.dataset.todoTab, n=counts[k]||0;
        b.textContent=labels[k]+" "+n;
        b.disabled=n===0&&k!=="all";
        b.setAttribute("aria-selected",String(k===tab));
      });
      var rows=allRows.filter(function(r){return inTab(r,tab)});
      $("todoCount").textContent=rows.length?rows.length+" 条":(allRows.length?"0 条":"无数据·原因见下");
      $("todoNotes").innerHTML=Object.keys(notes).map(function(k){return note(notes[k])}).join("");
      $("todos").innerHTML=rows.length?rows.map(function(r){
        var cls=r.excluded?"type excluded":"type", time=r.time?String(r.time).slice(0,10):"—";
        return '<tr data-url="'+esc(r.url||"")+'" data-title="'+esc(r.title||"待办")+'"><td><span class="'+cls+'">'+esc(r.type)+'</span></td><td>'+esc(time)+'</td><td>'+esc(r.title)+(r.amount?' · '+money(r.amount,r.ccy):"")+'</td><td>'+esc(r.party||"未接入")+'</td></tr>';
      }).join(""):'<tr><td colspan="4"><div class="empty">'+(allRows.length?"无数据·原因：当前分类下没有待办。":"无数据·原因：接口没有返回可展示待办或对应来源未接入。")+'</div></td></tr>';
    }
    function warnRows(){
      var w=(state.data&&state.data.warnings&&state.data.warnings[state.tab])||{rows:[],state:"not_connected"};
      var ig=ignored(), rows=(w.rows||[]).filter(function(r){return !ig[state.tab+":"+r.id]});
      if(w.note)return $("warnings").innerHTML=note(w.note);
      if(!rows.length)return $("warnings").innerHTML='<div class="empty">无数据·原因：当前 tab 没有可展示记录，或已被本地忽略。</div>';
      $("warnings").innerHTML=rows.map(function(r){
        var id=state.tab+":"+r.id, text=state.tab==="uninvoiced"?billLabel(r)+" 尚未开票":billLabel(r)+" 没有核销时间记录，请按没记录口径查看。";
        return '<div class="warnrow" data-url="/hy/consolidated-fee-details.html" data-title="费用详情"><div><div class="line">'+esc(text)+'</div><div class="detail">'+esc([r.bill_month,r.supplier,r.bl_no,r.cost_category].filter(Boolean).join(" · "))+" · "+money(r.amount,r.currency)+'</div></div><div class="actions"><button class="btn ignore" data-id="'+esc(id)+'" type="button">忽略</button></div></div>';
      }).join("");
    }
    function renderAudits(j){
      var rows=(j.todos||[]).filter(function(r){return r.type==="待审核"}), total=j.audit_summary&&j.audit_summary.total;
      $("auditCount").textContent=total?total+" 条":(rows.length?rows.length+" 条":"无数据·原因见待办说明");
      $("audits").innerHTML=rows.length?rows.slice(0,12).map(function(r){return '<div class="audit" data-url="'+esc(r.url)+'" data-title="待审核"><b>'+esc(r.title)+'</b><span>'+esc((r.time?String(r.time).slice(0,16)+" · ":"")+(r.party||"未接入"))+'</span></div>'}).join(""):'<div class="empty">无数据·原因：v_hy_audit_all 未返回可展示记录。</div>';
    }
    function render(){
      var j=state.data||{};
      $("stamp").textContent=(j.version||"v2026.09.05-1")+" · 生成时间 "+(j.generated_at?new Date(j.generated_at).toLocaleString("zh-CN"):"--");
      var w=j.warnings||{};
      $("uninvoicedCount").textContent=w.uninvoiced&&w.uninvoiced.total?String(w.uninvoiced.total):"无数据·原因见下";
      $("unsettledCount").textContent=w.unsettled&&w.unsettled.total?String(w.unsettled.total):"无数据·原因见下";
      renderTodos(j);warnRows();renderAudits(j);
    }
    $("from").value=dateShift(-60);$("to").value=dateShift(30);
    $("reload").onclick=function(){load().catch(function(e){$("todoNotes").innerHTML=note("读取失败: "+e.message)})};
    document.body.addEventListener("click",function(e){var ig=e.target.closest(".ignore");if(ig){setIgnored(ig.dataset.id);warnRows();return}rowClick(e)});
    document.querySelectorAll(".tabs button[data-tab]").forEach(function(b){b.onclick=function(){state.tab=b.dataset.tab;document.querySelectorAll(".tabs button[data-tab]").forEach(function(x){x.setAttribute("aria-selected",String(x===b))});warnRows()}});
    document.querySelectorAll("#todoTabs button").forEach(function(b){b.onclick=function(){if(b.disabled)return;state.todoTab=b.dataset.todoTab;renderTodos(state.data||{})}});
    $("ignoreAll").onclick=function(){var w=(state.data&&state.data.warnings&&state.data.warnings[state.tab])||{rows:[]};(w.rows||[]).forEach(function(r){setIgnored(state.tab+":"+r.id)});warnRows()};
    $("detail").onclick=function(){open(state.tab==="uninvoiced"?"开票记录":"核销管理",state.tab==="uninvoiced"?"/hy/invoice-records.html":"/hy/settlement-management.html")};
    load().catch(function(e){$("todoNotes").innerHTML=note("读取失败: "+e.message)});
  })();
  </script>
</body>
</html>
