<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>业务表格</title>
  <link rel="stylesheet" href="/public/hgj-ui.css">
  <style>
    body{margin:0;background:var(--hgj-bg);color:var(--hgj-text);font:14px/1.5 var(--hgj-font)}
    .page{min-height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
    .bar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--hgj-card);border-bottom:1px solid var(--hgj-line)}
    .title{min-width:130px;color:var(--hgj-title);font-weight:700}
    .module-select{width:220px;height:32px;border:1px solid var(--hgj-line);border-radius:0;background:var(--hgj-card);color:var(--hgj-text);padding:0 8px}
    .search{display:flex;align-items:center;gap:6px;min-width:240px;max-width:420px;flex:1}
    .search input{width:100%;height:32px;border:1px solid var(--hgj-line);border-radius:0;background:var(--hgj-card);color:var(--hgj-text);padding:0 9px}
    .btn{height:32px;border:1px solid var(--hgj-line);border-radius:0;background:var(--hgj-card);color:var(--hgj-text);cursor:pointer}
    .btn.primary{border-color:var(--hgj-primary);background:var(--hgj-primary-bg);color:var(--hgj-primary)}
    .status{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;color:var(--hgj-muted);font-size:12px}
    .stamp{white-space:nowrap}
    .connectivity{display:grid;gap:8px;padding:10px 12px;background:var(--hgj-card);border-top:1px solid var(--hgj-line);border-bottom:1px solid var(--hgj-line);color:var(--hgj-muted);font-size:12px}
    .connectivity.ready{display:none}.connectivity b{color:var(--hgj-warn);font-size:14px}.connectivity .chips{display:flex;gap:6px;flex-wrap:wrap}.connectivity span{border:1px solid var(--hgj-line);padding:2px 6px;color:var(--hgj-text)}
    .grid-wrap{min-width:0;overflow:auto;background:var(--hgj-card);border-top:1px solid var(--hgj-line);border-bottom:1px solid var(--hgj-line)}
    table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}
    th,td{height:36px;max-width:360px;border-right:1px solid var(--hgj-line);border-bottom:1px solid var(--hgj-line);padding:0 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    th{position:sticky;top:0;z-index:1;background:var(--hgj-card);color:var(--hgj-title);font-weight:700;text-align:left}
    td.num,th.num{text-align:right}
    td.mid,th.mid{text-align:center}
    .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;background:var(--hgj-card)}
    .pager{display:flex;align-items:center;gap:6px}
    .pager input{width:64px;height:32px;border:1px solid var(--hgj-line);border-radius:0;background:var(--hgj-card);color:var(--hgj-text);text-align:center}
    .cols{position:relative}
    .menu{position:absolute;right:0;top:36px;width:260px;max-height:420px;overflow:auto;padding:8px;background:var(--hgj-card);border:1px solid var(--hgj-line);box-shadow:none;display:none}
    .cols.open .menu{display:block}
    .menu label{display:flex;align-items:center;gap:8px;padding:5px 4px;color:var(--hgj-text)}
    .empty{padding:24px;color:var(--hgj-muted)}
    @media(max-width:720px){.bar{flex-wrap:wrap}.title{width:100%}.search{min-width:0;max-width:none}.foot{flex-wrap:wrap}}
  </style>
</head>
<body>
  <main class="page">
    <header class="bar">
      <div id="title" class="title">业务表格</div>
      <select id="moduleSelect" class="module-select" aria-label="模块"></select>
      <form id="searchForm" class="search">
        <input id="q" type="search" placeholder="搜索" autocomplete="off">
        <button class="btn primary" type="submit">搜索</button>
      </form>
      <div id="cols" class="cols">
        <button id="colsBtn" class="btn" type="button">列</button>
        <div id="colsMenu" class="menu"></div>
      </div>
    </header>
    <div class="status"><span id="status">加载中</span><span id="stamp" class="stamp">v2026.08.28-1 · 生成时间 --</span></div>
    <section id="connectivity" class="connectivity ready"></section>
    <section id="grid" class="grid-wrap"></section>
    <footer class="foot">
      <span id="summary"></span>
      <div class="pager">
        <button id="prev" class="btn" type="button">上一页</button>
        <span>第</span><input id="page" type="number" min="1" value="1"><span>页</span>
        <button id="next" class="btn" type="button">下一页</button>
        <select id="size" class="btn"><option>25</option><option selected>50</option><option>100</option><option>200</option></select>
      </div>
    </footer>
  </main>
  <script src="/hy/grid.js"></script>
</body>
</html>
