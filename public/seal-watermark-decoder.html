<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>印章水印解码器 · Sanlyn内部</title>
<style>
body{font-family:-apple-system,sans-serif;background:#0f172a;color:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.box{background:#1e293b;border-radius:16px;padding:32px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
h1{font-size:18px;font-weight:800;margin-bottom:6px;color:#f8fafc;}
.sub{font-size:12px;color:#64748b;margin-bottom:24px;}
.drop{border:2px dashed #334155;border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:20px;}
.drop:hover,.drop.drag{border-color:#7c3aed;background:#1d1040;}
.drop p{font-size:14px;color:#64748b;margin:8px 0 0;}
#previewImg{max-width:200px;max-height:200px;margin:10px auto;display:none;border-radius:8px;}
.result{background:#0f172a;border-radius:10px;padding:16px;font-family:monospace;font-size:13px;display:none;}
.result .row{display:flex;gap:10px;margin-bottom:6px;}
.result .lbl{color:#64748b;min-width:80px;}
.result .val{color:#7dd3fc;font-weight:700;}
.result .val.warn{color:#fbbf24;}
.result .val.ok{color:#4ade80;}
.btn{width:100%;padding:12px;background:#7c3aed;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px;}
.btn:hover{background:#6d28d9;}
.hint{font-size:11px;color:#475569;text-align:center;margin-top:16px;}
input[type=file]{display:none;}
</style>
</head>
<body>
<div class="box">
  <h1>🔍 印章隐形水印解码器</h1>
  <div class="sub">仅限内部使用 · 上传从合同中截取的印章图片</div>
  <input type="file" id="fileInput" accept="image/*" onchange="onFile(event)">
  <div class="drop" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <div style="font-size:36px;">🔴</div>
    <p>点击选择 或 拖入印章图片</p>
    <p style="font-size:11px;color:#475569;margin-top:4px;">PNG / JPG 均可（截图或扫描件）</p>
  </div>
  <img id="previewImg" />
  <div class="result" id="result">
    <div class="row"><span class="lbl">水印状态</span><span class="val" id="rStatus">-</span></div>
    <div class="row"><span class="lbl">操作人</span><span class="val" id="rUser">-</span></div>
    <div class="row"><span class="lbl">时间</span><span class="val" id="rTime">-</span></div>
    <div class="row"><span class="lbl">盖章方</span><span class="val" id="rWho">-</span></div>
    <div class="row"><span class="lbl">合同买方</span><span class="val" id="rDoc">-</span></div>
  </div>
  <div class="hint">⚠️ 此工具仅 Damon 知晓存在，请勿对外暴露 URL</div>
</div>
<script>
var dz = document.getElementById('dropZone');
dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('drag');});
dz.addEventListener('dragleave',function(){dz.classList.remove('drag');});
dz.addEventListener('drop',function(e){e.preventDefault();dz.classList.remove('drag');var f=e.dataTransfer.files[0];if(f)processFile(f);});
function onFile(e){if(e.target.files[0])processFile(e.target.files[0]);}

function processFile(file){
  var reader=new FileReader();
  reader.onload=function(ev){
    var src=ev.target.result;
    var img=document.getElementById('previewImg');
    img.src=src; img.style.display='block';
    decode(src);
  };
  reader.readAsDataURL(file);
}

function decode(dataUrl){
  var img=new Image();
  img.onload=function(){
    var c=document.createElement('canvas');
    c.width=img.width; c.height=img.height;
    var ctx=c.getContext('2d');
    ctx.drawImage(img,0,0);
    var d=ctx.getImageData(0,0,c.width,c.height).data;
    // Extract LSB of blue channel from non-transparent pixels
    var bits=[];
    for(var i=0;i<d.length;i+=4){ if(d[i+3]>64) bits.push(d[i+2]&1); }
    // Read magic (8 bits)
    var magic=0; for(var b=0;b<8;b++) magic=(magic<<1)|bits[b];
    var res=document.getElementById('result');
    res.style.display='block';
    if(magic!==0xAB){
      document.getElementById('rStatus').textContent='❌ 未检测到水印';
      document.getElementById('rStatus').className='val warn';
      document.getElementById('rUser').textContent='-';
      document.getElementById('rTime').textContent='-';
      document.getElementById('rWho').textContent='-';
      document.getElementById('rDoc').textContent='-';
      return;
    }
    // Read length (16 bits)
    var len=0; for(var b=8;b<24;b++) len=(len<<1)|bits[b];
    // Read bytes
    var bytes=[];
    for(var j=0;j<len;j++){
      var byt=0; for(var b=0;b<8;b++) byt=(byt<<1)|bits[24+j*8+b];
      bytes.push(byt);
    }
    try{
      var str=String.fromCharCode.apply(null,bytes);
      var meta=JSON.parse(str);
      document.getElementById('rStatus').textContent='✅ 水印验证成功';
      document.getElementById('rStatus').className='val ok';
      document.getElementById('rUser').textContent=meta.u||'未知';
      var d2=new Date(meta.t*1000);
      document.getElementById('rTime').textContent=d2.toLocaleString('zh-CN');
      document.getElementById('rWho').textContent=meta.w==='buyer'?'买方':'卖方';
      document.getElementById('rDoc').textContent=meta.doc||'-';
    }catch(e){
      document.getElementById('rStatus').textContent='⚠️ 数据损坏（可能经过压缩）';
      document.getElementById('rStatus').className='val warn';
    }
  };
  img.src=dataUrl;
}
</script>
</body>
</html>
