<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statement of account · Sanlyn</title>
<style>
  :root{--bg:#f6f6f4;--card:#fff;--line:#e6e4dd;--line2:#d7d5cc;--text:#22201c;--muted:#7a776f;--accent:#2f6db0;--accent-bg:#eaf1fa;--warn:#9a6a15;--warn-bg:#faf1dc;--ok:#2c7a5b;--ok-bg:#e7f4ee;--pro:#6b4ea6;--pro-bg:#efe9f7;--dark:#1a1a17}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 14px 40px}
  header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .head-in{max-width:1080px;margin:0 auto;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600}
  .logo{width:26px;height:26px;border-radius:6px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
  .rt{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .lang{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;font-size:12px}
  .lang button{border:0;background:transparent;padding:4px 11px;cursor:pointer;color:var(--muted);border-left:1px solid var(--line2)}
  .lang button:first-child{border-left:0}
  .lang button.on{background:var(--dark);color:#fff}
  .who{font-size:12px;color:var(--muted)}
  h1{font-size:20px;font-weight:600;margin:18px 0 3px}
  .sub{font-size:12.5px;color:var(--muted)}
  .titlerow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .btn{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:8px 13px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn.primary{background:var(--dark);color:#fff;border-color:var(--dark)}
  .dl{position:relative}
  .dl-menu{position:absolute;right:0;top:40px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.1);padding:4px;min-width:150px;display:none;z-index:6}
  .dl.open .dl-menu{display:block}
  .dl-menu div{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px}
  .dl-menu div:hover{background:var(--bg)}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .kpi.warn{background:var(--warn-bg);border-color:#ead8ac}
  .kpi .l{font-size:12px;color:var(--muted)}.kpi.warn .l{color:var(--warn)}
  .kpi .v{font-size:16px;font-weight:600;margin-top:3px}.kpi.warn .v{color:var(--warn)}
  .filters{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:9px}
  .frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .frow .lab{font-size:11.5px;color:var(--muted);width:64px}
  .pill{border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:999px;padding:5px 14px;font-size:12.5px;cursor:pointer}
  .pill.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}
  .hint{font-size:12px;color:var(--muted);margin-bottom:8px}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:820px}
  th{background:var(--bg);color:var(--muted);text-align:left;font-weight:400;padding:9px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--line)}
  tr.sel td{background:var(--accent-bg)}
  .num{text-align:right}.ctr{text-align:center}
  .chip{border-radius:999px;padding:2px 9px;font-size:11px;white-space:nowrap}
  .chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.ok{background:var(--ok-bg);color:var(--ok)}
  .cat{border-radius:5px;padding:1px 6px;font-size:10.5px;margin-right:5px}
  .cat.product{background:var(--pro-bg);color:var(--pro)}.cat.logistics{background:var(--accent-bg);color:var(--accent)}
  .grp-toggle{cursor:pointer;display:inline-block;width:13px;color:var(--muted)}
  .grp-badge{font-size:10.5px;color:var(--muted);font-weight:400;margin-left:3px}
  tr.subrow td{background:#faf9f6;padding:0}
  .subwrap{padding:2px 10px 8px 34px}
  .subwrap .sr{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:12px;color:var(--muted);border-bottom:1px dashed var(--line)}
  .subwrap .sr:last-child{border-bottom:0}
  .subwrap .sr b{color:var(--text);font-weight:600}
  .actionbar{display:none;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding:11px 13px;background:var(--accent-bg);border-radius:10px}
  .actionbar.show{display:flex}
  .actionbar .info{font-size:13px;color:var(--accent)}
  .pay{margin-top:16px}
  .pay .ttl{font-size:13px;font-weight:600;margin-bottom:8px}
  .paygrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .paycard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card)}
  .paytag{font-size:11px;display:inline-block;padding:1px 7px;border-radius:5px;margin-bottom:7px}
  .paytag.product{background:var(--pro-bg);color:var(--pro)}.paytag.logistics{background:var(--accent-bg);color:var(--accent)}
  .payname{font-size:12.5px;font-weight:600}.paybank{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.7}
  .paynote{font-size:11px;color:var(--muted);margin-top:8px}
  .state{padding:34px;text-align:center;color:var(--muted)}
  @media(max-width:720px){.cards{grid-template-columns:1fr 1fr}.paygrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="brand"><span class="logo">S</span><span id="brand">Sanlyn</span></div>
    <div class="rt">
      <div class="lang" id="lang"></div>
      <div class="who">🔒 <span id="who"></span></div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="titlerow">
    <div><h1 id="ttl">Statement of account</h1><div class="sub" id="sub"></div></div>
    <div class="dl" id="dl">
      <button class="btn primary" id="dlbtn"><span id="dllabel">Download</span> ▾</button>
      <div class="dl-menu"><div data-dl="pdf" id="dlpdf">PDF</div><div data-dl="excel" id="dlxls">Excel</div></div>
    </div>
  </div>

  <div class="cards" id="cards"></div>
  <div class="filters" id="filters"></div>
  <div class="hint" id="hint"></div>

  <div id="body"><div class="state" id="state">Loading…</div></div>

  <div class="actionbar" id="actionbar">
    <div class="info" id="selinfo"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" id="btnslip"></button>
      <button class="btn" id="btnconfirm"></button>
      <button class="btn" id="btndispute"></button>
    </div>
  </div>

  <div class="pay" id="pay"></div>
</div>

<script>
// ---- inlined statement-portal-i18n.js ----
// Customer statement portal i18n dictionary (EN / 中 / BM). Payee legal names are NOT translated.
const LANGS = ["en", "zh", "ms"];

const I18N = {
  en: {
    brand: "Sanlyn Reconciliation",
    statement_title: "Statement of account", period: "Period", updated: "Updated",
    download: "Download", dl_pdf: "PDF statement", dl_excel: "Excel details",
    outstanding: "Outstanding", paid: "Paid / prepaid", receivable: "Total receivable", orders: "Orders",
    status: "Status", f_unpaid: "Unpaid", f_paid: "Paid", f_all: "All", unpaid_first: "unpaid first",
    category: "Category", c_all: "All", c_product: "Products", c_logistics: "Logistics",
    col_order: "Order", col_item: "Item / charge", col_bl: "B/L", col_shipped: "Shipped",
    col_amount: "Amount", col_prepaid: "Prepaid", col_due: "Due", col_status: "Status",
    st_unpaid: "Unpaid", st_partial: "Partial", st_paid: "Paid",
    multi_hint: "Select one or more orders, then upload one payment slip to claim them.",
    selected: "Selected", upload_slip: "Upload payment slip", confirm: "Confirm", dispute: "Dispute",
    payment_instructions: "Payment instructions", pi_fixed: "fixed templates",
    pi_products: "Products", pi_logistics: "Logistics",
    pi_note: "Products are billed by the trading entity, logistics by the forwarding entity.",
    empty: "No records.", loading: "Loading…", load_error: "Could not load your statement.",
  },
  zh: {
    brand: "Sanlyn 对账中心",
    statement_title: "对账单", period: "对账期间", updated: "更新于",
    download: "下载账单", dl_pdf: "PDF 对账单", dl_excel: "Excel 明细",
    outstanding: "未付余额", paid: "已付 / 已预付", receivable: "应收合计", orders: "订单数",
    status: "状态", f_unpaid: "未付款", f_paid: "已付款", f_all: "全部", unpaid_first: "未付款优先",
    category: "类别", c_all: "全部", c_product: "产品", c_logistics: "物流",
    col_order: "订单号", col_item: "货品 / 费用", col_bl: "提单 BL", col_shipped: "发货",
    col_amount: "金额", col_prepaid: "已预付", col_due: "未付", col_status: "状态",
    st_unpaid: "未付", st_partial: "部分", st_paid: "已付",
    multi_hint: "勾选一笔或多笔订单，可一次上传水单认领（一张水单可对应多个订单）。",
    selected: "已勾选", upload_slip: "上传水单认领所选", confirm: "确认对账", dispute: "有异议",
    payment_instructions: "收款信息", pi_fixed: "固定模版",
    pi_products: "产品", pi_logistics: "物流",
    pi_note: "产品由贸易主体开收款，物流由承运主体开收款。",
    empty: "暂无记录。", loading: "加载中…", load_error: "对账单加载失败。",
  },
  ms: {
    brand: "Penyata Sanlyn",
    statement_title: "Penyata akaun", period: "Tempoh", updated: "Dikemas kini",
    download: "Muat turun", dl_pdf: "Penyata PDF", dl_excel: "Butiran Excel",
    outstanding: "Baki tertunggak", paid: "Dibayar / prabayar", receivable: "Jumlah belum terima", orders: "Pesanan",
    status: "Status", f_unpaid: "Belum bayar", f_paid: "Dibayar", f_all: "Semua", unpaid_first: "belum bayar dahulu",
    category: "Kategori", c_all: "Semua", c_product: "Produk", c_logistics: "Logistik",
    col_order: "Pesanan", col_item: "Item / caj", col_bl: "B/L", col_shipped: "Dihantar",
    col_amount: "Jumlah", col_prepaid: "Prabayar", col_due: "Perlu bayar", col_status: "Status",
    st_unpaid: "Belum bayar", st_partial: "Separa", st_paid: "Dibayar",
    multi_hint: "Pilih satu atau lebih pesanan, kemudian muat naik satu slip bayaran untuk menuntutnya.",
    selected: "Dipilih", upload_slip: "Muat naik slip bayaran", confirm: "Sahkan", dispute: "Pertikai",
    payment_instructions: "Arahan pembayaran", pi_fixed: "templat tetap",
    pi_products: "Produk", pi_logistics: "Logistik",
    pi_note: "Produk dibilkan oleh entiti dagangan, logistik oleh entiti penghantaran.",
    empty: "Tiada rekod.", loading: "Memuatkan…", load_error: "Gagal memuatkan penyata anda.",
  },
};

function normalizeLang(v) {
  const s = String(v || "").toLowerCase();
  if (s.startsWith("ms") || s.startsWith("bm") || s.includes("melayu")) return "ms";
  if (s.startsWith("zh") || s.includes("cn") || s.includes("中")) return "zh";
  return "en";
}

function t(lang, key) {
  const L = I18N[lang] || I18N.en;
  return L[key] ?? (I18N.en[key] ?? key);
}
// Reused: none (new dict). Lines: ~78.

// ---- inlined statement-portal-payee.js ----
// Fixed payee templates for the customer statement portal.
// TODO(mini): fill bank / account / swift from mini `companies` table bank_accounts
//   for BABI (trade) and OCEANBABY (forwarder). Do NOT fabricate bank numbers —
//   leave empty until verified; UI shows "—" for empty fields.
const PAYEES = {
  trade: {
    company_code: "BABI",
    name_en: "XIAMEN PET BABY IMPORT AND EXPORT CO., LTD.",
    bank: "",
    account: "",
    swift: "",
  },
  forwarder: {
    company_code: "OCEANBABY",
    name_en: "SHANGHAI OCEAN BABY INTERNATIONAL LOGISTICS CO., LTD.",
    bank: "",
    account: "",
    swift: "",
  },
};

function payeeFor(key) {
  return PAYEES[key] || PAYEES.trade;
}
// Reused: none (static config). Lines: ~24.



const qs = new URLSearchParams(location.search);
const TOKEN = qs.get("token") || "";
const state = {
  lang: normalizeLang(qs.get("lang") || navigator.language || "en"),
  status: "unpaid", category: "all",
  rows: [], summary: {}, customer: "", selected: new Set(), expanded: new Set(), loaded: false, error: false,
};
const $ = (id) => document.getElementById(id);
const T = (k) => t(state.lang, k);
const rowKey = (r, i) => `${i}:${r.order_no || ""}:${r.category}:${r.bl_no || ""}`;
function fmtMoney(cur, n) { return `${cur || "CNY"} ${Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`; }
function fmtDate(v) { if (!v) return "—"; return String(v).slice(0, 10); }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m])); }

async function load() {
  try {
    const r = await fetch(`/api/db/statement-portal-data?token=${encodeURIComponent(TOKEN)}`, { headers: { Accept: "application/json" } });
    const d = await r.json();
    if (!r.ok || !d.success) throw new Error(d.error || "load failed");
    state.rows = d.rows || [];
    state.summary = d.summary || {};
    state.loaded = true;
    state.selected.clear();
    state.expanded.clear();
  } catch (e) { state.error = true; }
  render();
}

function visibleRows() {
  let rows = state.rows.map((r, i) => ({ r, i }));
  if (state.category !== "all") rows = rows.filter((x) => x.r.category === state.category);
  if (state.status !== "all") rows = rows.filter((x) => state.status === "paid" ? x.r.status === "paid" : x.r.status !== "paid");
  rows.sort((a, b) => {
    const ua = a.r.status !== "paid" ? 0 : 1, ub = b.r.status !== "paid" ? 0 : 1;
    if (ua !== ub) return ua - ub;
    return String(b.r.shipped_date || "").localeCompare(String(a.r.shipped_date || ""));
  });
  return rows;
}

function renderChrome() {
  document.documentElement.lang = state.lang;
  $("brand").textContent = T("brand");
  $("ttl").textContent = T("statement_title");
  $("dllabel").textContent = T("download");
  $("dlpdf").textContent = T("dl_pdf"); $("dlxls").textContent = T("dl_excel");
  $("who").textContent = state.customer || "";
  $("hint").textContent = T("multi_hint");
  $("btnslip").textContent = "⬆ " + T("upload_slip");
  $("btnconfirm").textContent = "✓ " + T("confirm");
  $("btndispute").textContent = "✎ " + T("dispute");
  $("lang").innerHTML = LANGS.map((l) => `<button data-lang="${l}" class="${l === state.lang ? "on" : ""}">${l === "zh" ? "中" : l === "ms" ? "BM" : "EN"}</button>`).join("");
  $("sub").textContent = `${T("period")} · ${T("updated")} ${new Date().toISOString().slice(0, 10)}`;
}

function renderCards() {
  const cur = Object.keys(state.summary)[0];
  const s = state.summary[cur] || { outstanding: 0, paid: 0, receivable_total: 0, order_count: 0 };
  const cards = [
    ["warn", T("outstanding"), fmtMoney(cur, s.outstanding)],
    ["", T("paid"), fmtMoney(cur, s.paid)],
    ["", T("receivable"), fmtMoney(cur, s.receivable_total)],
    ["", T("orders"), String(s.order_count || 0)],
  ];
  $("cards").innerHTML = cards.map(([c, l, v]) => `<div class="kpi ${c}"><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div></div>`).join("");
}

function pill(key, val, cur, label) { return `<button class="pill ${val === cur ? "on" : ""}" data-${key}="${val}">${esc(label)}</button>`; }

function renderFilters() {
  const cnt = (fn) => state.rows.filter(fn).length;
  $("filters").innerHTML = `
    <div class="frow"><span class="lab">${esc(T("status"))}</span>
      ${pill("status", "unpaid", state.status, `${T("f_unpaid")} ${cnt((r) => r.status !== "paid")}`)}
      ${pill("status", "paid", state.status, `${T("f_paid")} ${cnt((r) => r.status === "paid")}`)}
      ${pill("status", "all", state.status, `${T("f_all")} ${state.rows.length}`)}
      <span class="lab" style="width:auto;color:#a7a49b">· ${esc(T("unpaid_first"))}</span></div>
    <div class="frow"><span class="lab">${esc(T("category"))}</span>
      ${pill("category", "all", state.category, T("c_all"))}
      ${pill("category", "product", state.category, T("c_product"))}
      ${pill("category", "logistics", state.category, T("c_logistics"))}</div>`;
}

function renderTable() {
  const rows = visibleRows();
  if (!state.loaded) { $("body").innerHTML = `<div class="state">${esc(T("loading"))}</div>`; return; }
  if (state.error) { $("body").innerHTML = `<div class="state">${esc(T("load_error"))}</div>`; return; }
  if (!rows.length) { $("body").innerHTML = `<div class="state">${esc(T("empty"))}</div>`; return; }
  const head = `<tr><th style="width:32px"></th><th>${T("col_order")}</th><th>${T("col_item")}</th><th>${T("col_bl")}</th><th>${T("col_shipped")}</th><th class="num">${T("col_amount")}</th><th class="num">${T("col_prepaid")}</th><th class="num">${T("col_due")}</th><th class="ctr">${T("col_status")}</th></tr>`;
  const stChip = (s) => s === "paid" ? `<span class="chip ok">${T("st_paid")}</span>` : s === "partial" ? `<span class="chip warn">${T("st_partial")}</span>` : `<span class="chip warn">${T("st_unpaid")}</span>`;
  const catChip = (c) => `<span class="cat ${c}">${c === "logistics" ? T("c_logistics") : T("c_product")}</span>`;
  const trs = rows.map(({ r, i }) => {
    const k = rowKey(r, i), on = state.selected.has(k);
    const grp = !!r.is_group && Array.isArray(r.details) && r.details.length > 1;
    const open = grp && state.expanded.has(k);
    const orderCell = grp
      ? `<span class="grp-toggle" data-grp="${esc(k)}">${open ? "▾" : "▸"}</span>${esc(r.order_no || "—")}<span class="grp-badge">+${r.order_nos.length - 1}</span>`
      : esc(r.order_no || "—");
    const mainRow = `<tr class="${on ? "sel" : ""}"><td><input type="checkbox" data-k="${esc(k)}" ${on ? "checked" : ""}></td>
      <td style="font-weight:600">${orderCell}</td>
      <td>${catChip(r.category)}${esc(r.item_desc || "")}</td>
      <td style="color:var(--muted)">${esc(r.bl_no || "—")}</td>
      <td style="color:var(--muted)">${esc(fmtDate(r.shipped_date))}</td>
      <td class="num">${esc(fmtMoney(r.currency, r.amount))}</td>
      <td class="num" style="color:var(--ok)">${r.prepaid > 0 ? esc(Number(r.prepaid).toLocaleString(undefined, { minimumFractionDigits: 2 })) : "—"}</td>
      <td class="num" style="font-weight:600">${esc(Number(r.due || 0).toLocaleString(undefined, { minimumFractionDigits: 2 }))}</td>
      <td class="ctr">${stChip(r.status)}</td></tr>`;
    if (!open) return mainRow;
    const subItems = r.details.map((d) => `<div class="sr"><span><b>${esc(d.order_no)}</b> · ${esc(d.item_desc || "")}</span><span>${esc(fmtMoney(r.currency, d.amount))}</span></div>`).join("");
    return `${mainRow}<tr class="subrow"><td colspan="9"><div class="subwrap">${subItems}</div></td></tr>`;
  }).join("");
  $("body").innerHTML = `<div class="tablewrap"><table><thead>${head}</thead><tbody>${trs}</tbody></table></div>`;
}

function renderAction() {
  const bar = $("actionbar");
  if (!state.selected.size) { bar.classList.remove("show"); return; }
  bar.classList.add("show");
  $("selinfo").textContent = `${T("selected")} ${state.selected.size}`;
}

function renderPay() {
  const block = (key, tag) => { const p = payeeFor(key); const bank = [p.bank, p.account, p.swift].filter(Boolean).join(" · ") || "—";
    return `<div class="paycard"><div class="paytag ${key === "trade" ? "product" : "logistics"}">${esc(tag)}</div><div class="payname">${esc(p.name_en)}</div><div class="paybank">${esc(bank)}</div></div>`; };
  $("pay").innerHTML = `<div class="ttl">🏦 ${esc(T("payment_instructions"))} <span style="font-weight:400;color:var(--muted);font-size:11px">· ${esc(T("pi_fixed"))}</span></div>
    <div class="paygrid">${block("trade", T("pi_products"))}${block("forwarder", T("pi_logistics"))}</div>
    <div class="paynote">${esc(T("pi_note"))}</div>`;
}

function render() { renderChrome(); renderCards(); renderFilters(); renderTable(); renderAction(); renderPay(); }

document.addEventListener("click", (e) => {
  const lang = e.target.closest("[data-lang]"); if (lang) { state.lang = lang.dataset.lang; render(); return; }
  const st = e.target.closest("[data-status]"); if (st) { state.status = st.dataset.status; render(); return; }
  const ca = e.target.closest("[data-category]"); if (ca) { state.category = ca.dataset.category; render(); return; }
  const grp = e.target.closest("[data-grp]"); if (grp) { const k = grp.dataset.grp; state.expanded.has(k) ? state.expanded.delete(k) : state.expanded.add(k); render(); return; }
  const dl = e.target.closest("#dlbtn"); if (dl) { $("dl").classList.toggle("open"); return; }
  const dlp = e.target.closest("[data-dl]"); if (dlp) { $("dl").classList.remove("open"); if (dlp.dataset.dl === "pdf") window.print(); else window.location = `/api/db/statement-portal-data?token=${encodeURIComponent(TOKEN)}&format=xlsx`; return; }
  if (!e.target.closest("#dl")) $("dl").classList.remove("open");
});
document.addEventListener("change", (e) => {
  const cb = e.target.closest("[data-k]"); if (!cb) return;
  if (cb.checked) state.selected.add(cb.dataset.k); else state.selected.delete(cb.dataset.k);
  cb.closest("tr").classList.toggle("sel", cb.checked);
  renderAction();
});
$("btnslip").addEventListener("click", () => {
  const orders = [...state.selected].flatMap((k) => {
    const r = state.rows[parseInt(k.split(":")[0], 10)];
    if (!r) return [];
    return r.order_nos && r.order_nos.length ? r.order_nos : [r.order_no];
  }).filter(Boolean);
  // Reuse existing slip-upload flow; pass preselected orders + token. Merged rows expand to all their order_nos.
  window.location = `/slip-upload.html?token=${encodeURIComponent(TOKEN)}&orders=${encodeURIComponent(orders.join(","))}`;
});
$("btnconfirm").addEventListener("click", () => alert(T("confirm")));
$("btndispute").addEventListener("click", () => alert(T("dispute")));

render();
load();
</script>
</body>
</html>
