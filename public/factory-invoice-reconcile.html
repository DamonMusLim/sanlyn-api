<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工厂开票对账</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#18212f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:0 auto;padding:22px 14px 56px}.top{margin-bottom:14px}.brand{font-size:22px;font-weight:800}.sub{font-size:13px;color:#667085;margin-top:4px}.card{background:#fff;border:1px solid #d9e0e8;border-radius:8px;margin:14px 0;padding:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}.mtitle{font-size:17px;font-weight:800}.kv{font-size:13px;color:#475467}.kv b{color:#111}.tableBox{overflow:auto;border:1px solid #eef1f5;border-radius:8px}table{width:100%;border-collapse:collapse;min-width:980px}th,td{border-bottom:1px solid #eef1f5;padding:9px 10px;font-size:13px;text-align:left;vertical-align:middle}th{color:#667085;background:#fafbfc;font-weight:700;font-size:11px;letter-spacing:.04em}.num{text-align:right;font-variant-numeric:tabular-nums}.empty{text-align:center;padding:42px;color:#667085}.btn{border:1px solid #cbd5e1;background:#fff;color:#1f2937;border-radius:6px;padding:7px 10px;cursor:pointer;font-weight:700}.btn:disabled{opacity:.45;cursor:not-allowed}.pending{color:#667085}.bad{color:#b91c1c;font-weight:800}.ok{color:#15803d}.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;justify-content:center;padding:28px 12px;z-index:20;overflow:auto}.modal.on{display:flex}.modalBody{width:min(1080px,100%);background:#fff;border-radius:8px;padding:14px}.modalTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.invoice{position:relative;border:2px solid #b91c1c;padding:16px 16px 14px;color:#621313;background:#fffdfb}.invTitle{text-align:center;font-size:28px;font-weight:800;color:#b91c1c;margin:2px 0 12px}.officialTop{display:grid;grid-template-columns:110px 1fr 230px;gap:12px;align-items:start;margin-bottom:10px}.qrBox{width:96px;height:96px;border:1px solid #b91c1c}.seal{justify-self:center;width:118px;height:58px;border:2px solid rgba(185,28,28,.35);border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(185,28,28,.42);font-size:14px;font-weight:800;transform:rotate(-8deg);margin-top:8px}.invMeta{display:grid;gap:8px;color:#7f1d1d;font-size:13px}.metaLine{display:flex;justify-content:space-between;border-bottom:1px solid #f3caca;padding-bottom:4px}.placeholder{color:#9ca3af}.partyWrap{display:grid;grid-template-columns:1fr 1fr;border:1px solid #efb5b5;border-bottom:0}.party{display:grid;grid-template-columns:34px 1fr;min-height:92px}.party+.party{border-left:1px solid #efb5b5}.pLabel{display:flex;align-items:center;justify-content:center;border-right:1px solid #efb5b5;color:#9f1239;font-weight:800;writing-mode:vertical-rl;letter-spacing:2px}.pGrid{display:grid;gap:8px;padding:10px 12px}.field{font-size:14px;line-height:1.45}.field b{font-weight:700;color:#4b1111}.invTable{overflow:auto;border-left:1px solid #efb5b5;border-right:1px solid #efb5b5}.invTable table{min-width:920px;table-layout:fixed}.invTable th,.invTable td{border-bottom:1px solid #efb5b5;border-right:1px solid #f3caca}.invTable th{color:#9f1239;background:#fff7f7;text-align:center}.center{text-align:center}.sumLabel{text-align:center;font-weight:800;color:#9f1239;background:#fffdfb}.grand{display:grid;grid-template-columns:1fr 260px;border:1px solid #efb5b5;border-top:0;font-size:15px}.grand>div{padding:10px 12px}.grandSmall{border-left:1px solid #efb5b5}.money{font-size:20px;font-weight:900;color:#991b1b}.remarkBox{display:grid;grid-template-columns:54px 1fr;border:1px solid #efb5b5;border-top:0;min-height:58px}.remarkLabel{display:flex;align-items:center;justify-content:center;border-right:1px solid #efb5b5;color:#9f1239;font-weight:800}.remarkBody{padding:9px 12px;font-size:12px;color:#6b7280}.issuer{display:flex;justify-content:flex-end;border:1px solid #efb5b5;border-top:0;padding:9px 12px;color:#621313}@media(max-width:760px){.partyWrap{grid-template-columns:1fr}.party+.party{border-left:0;border-top:1px solid #efb5b5}.officialTop{grid-template-columns:98px 1fr}.seal{display:none}.invMeta{grid-column:1/3}.grand{grid-template-columns:1fr}.grandSmall{border-left:0;border-top:1px solid #efb5b5}}
</style></head><body><div class="wrap"><div class="top"><div class="brand" id="fname">工厂开票对账</div><div class="sub">请按订单核对采购价开具增值税专用发票。待确认行请先联系我司补采购价。</div></div><div id="app"><div class="card"><div class="empty" id="msg">加载中...</div></div></div></div>
<div class="modal" id="modal"><div class="modalBody"><div class="modalTop"><b id="modalTitle">发票模板</b><button class="btn" onclick="closeTpl()">关闭</button></div><div id="tpl"></div></div></div>
<script>
const qs=new URLSearchParams(location.search),CODE=qs.get("c")||"",MT=qs.get("mt")||"",API="/api/db/factory-invoice-reconcile",MONTHS="2026-04,2026-05,2026-06";let DATA=null,LINES=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),money=v=>v==null?"待确认":"¥"+Number(v).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2}),num=v=>Number(v||0).toLocaleString("zh-CN",{maximumFractionDigits:3});
const q=()=>{const auth=MT?("mt="+encodeURIComponent(MT)):("c="+encodeURIComponent(CODE));return qs.get("from")&&qs.get("to")?auth+"&from="+encodeURIComponent(qs.get("from"))+"&to="+encodeURIComponent(qs.get("to")):auth+"&months="+encodeURIComponent(qs.get("months")||MONTHS)},rate=n=>(Number(n||0.13)*100).toFixed(0)+"%";
function upperMoney(n){let s=(Math.round((Number(n)||0)*100)/100).toFixed(2),[i,d]=s.split("."),u="零壹贰叁肆伍陆柒捌玖",a=["","拾","佰","仟"],b=["","万","亿"],out="";if(i==="0")out="零";else{let gs=[];while(i){gs.unshift(i.slice(-4));i=i.slice(0,-4)}gs.forEach((g,gi)=>{let p="",z=false;g.padStart(4,"0").split("").forEach((c,ci)=>{let n=Number(c),pos=3-ci;if(n){if(z){p+="零";z=false}p+=u[n]+a[pos]}else if(p)z=true});if(p)out+=p+b[gs.length-1-gi]})}const j=Number(d[0]),f=Number(d[1]);return out+"元"+(j?u[j]+"角":"")+(f?u[f]+"分":j?"":"整")}
async function load(){try{const r=await fetch(API+"?action=factory&"+q()),d=await r.json();if(!r.ok)throw new Error(d.error||"链接无效或已过期");DATA=d;document.getElementById("fname").textContent=(d.factory?.name||"工厂")+" · 开票对账";render()}catch(e){document.getElementById("msg").textContent=e.message;document.getElementById("msg").className="empty bad"}}
function flatten(){LINES=[];(DATA.groups||[]).forEach(g=>(g.lines||[]).forEach(l=>LINES.push({...l,period:g.period,factory_name:g.factory_name})));return LINES.sort((a,b)=>(b.period||"").localeCompare(a.period||"")||(a.order_no||"").localeCompare(b.order_no||""))}
function statusText(l){if(l.status==="pending_price")return '<span class="pending">采购价待确认</span>';if(l.status==="inverted")return '<span class="bad">倒挂告警</span>';if(l.status==="matched")return '<span class="ok">已匹配</span>';return "待开票"}
function render(){const rows=flatten();if(!rows.length){document.getElementById("app").innerHTML='<div class="card"><div class="empty">本期暂无需开票订单</div></div>';return}const total=rows.reduce((s,l)=>s+Number(l.amount_incl_tax||0),0),pending=rows.filter(l=>l.status==="pending_price").length;
  document.getElementById("app").innerHTML=`<div class="card"><div class="mhead"><div class="mtitle">订单开票明细</div><div class="kv">含税应开 <b>${money(total)}</b> · 订单 <b>${rows.length}</b> · 待确认 <b>${pending}</b></div></div><div class="tableBox"><table><thead><tr><th>订单号</th><th>品名</th><th>单位</th><th class="num">数量</th><th class="num">含税单价</th><th class="num">含税应开</th><th class="num">已开</th><th class="num">差额</th><th>查看发票</th><th>状态</th></tr></thead><tbody>${rows.map((l,i)=>rowHtml(l,i)).join("")}</tbody></table></div></div>`}
function rowHtml(l,i){const amt=l.amount_incl_tax,qty=Number(l.qty_ctn||0),uploaded=(l.uploaded||[]).reduce((s,x)=>s+Number(x.amount_incl_tax||0),0),diff=amt==null?null:Number(amt)-uploaded,disabled=!l.invoice_template||l.status==="pending_price";
  return `<tr><td>${esc(l.order_no)}</td><td>${esc(l.declaration_name||"*宠物用品*猫砂")}</td><td>箱</td><td class="num">${num(qty)}</td><td class="num ${amt==null?"pending":""}">${amt==null?"待确认":money(Number(amt)/Math.max(qty,1))}</td><td class="num ${amt==null?"pending":""}">${money(amt)}</td><td class="num">${money(uploaded)}</td><td class="num ${diff==null?"pending":""}">${money(diff)}</td><td><button class="btn" onclick="openTpl(${i})" ${disabled?"disabled":""}>查看发票</button></td><td>${statusText(l)}</td></tr>`}
function party(label,rows){return `<div class="party"><div class="pLabel">${label}</div><div class="pGrid">${rows.map(r=>`<div class="field"><b>${r[0]}：</b><span>${esc(r[1]||"")}</span></div>`).join("")}</div></div>`}
function openTpl(i){const t=LINES[i].invoice_template;if(!t)return;document.getElementById("modalTitle").textContent=`${LINES[i].order_no} · 发票模板`;document.getElementById("tpl").innerHTML=tplHtml(t);document.getElementById("modal").classList.add("on")}
function closeTpl(){document.getElementById("modal").classList.remove("on")}
function tplHtml(t){const l=t.lines[0]||{},seller=t.seller||{},buyer=t.buyer||{},bank=[seller.bank_name,seller.bank_account].filter(Boolean).join(" / ");
  return `<div class="invoice"><div class="invTitle">电子发票（增值税专用发票）</div><div class="officialTop"><div class="qrBox"></div><div class="seal">国家税务总局<br>监制</div><div class="invMeta"><div class="metaLine"><span>发票号码：</span><span class="placeholder">开票时生成</span></div><div class="metaLine"><span>开票日期：</span><span class="placeholder">开票时生成</span></div></div></div><div class="partyWrap">${party("购买方信息",[["名称",buyer.name],["统一社会信用代码/纳税人识别号",buyer.tax_id]])}${party("销售方信息",[["名称",seller.name],["统一社会信用代码/纳税人识别号",seller.tax_id]])}</div><div class="invTable"><table><thead><tr><th>项目名称</th><th>规格型号</th><th>单位</th><th>数量</th><th>单价</th><th>金额</th><th>税率/征收率</th><th>税额</th></tr></thead><tbody><tr><td>${esc(l.goods_name||"*宠物用品*猫砂")}</td><td></td><td class="center">箱</td><td class="num">${num(l.qty_ctn)}</td><td class="num">${money(l.unit_price_incl)}</td><td class="num">${money(l.subtotal_ex)}</td><td class="num">${rate(l.tax_rate)}</td><td class="num">${money(l.tax_amount)}</td></tr></tbody><tfoot><tr><td colspan="5" class="sumLabel">合计</td><td class="num">${money(t.amount_ex)}</td><td></td><td class="num">${money(t.tax_amount)}</td></tr></tfoot></table></div><div class="grand"><div><b>价税合计（大写）</b> ${upperMoney(t.total_incl)}</div><div class="grandSmall"><b>（小写）</b> <span class="money">${money(t.total_incl)}</span></div></div><div class="remarkBox"><div class="remarkLabel">备注</div><div class="remarkBody">${bank?`开户行/账号：${esc(bank)}`:""}</div></div><div class="issuer">开票人：<span class="placeholder">开票时填写</span></div></div>`}
load();
</script></body></html>
