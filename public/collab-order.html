<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Collaboration · Sanlyn</title>
<!-- 订单协同 · 客户版（Damon 0926）：跟工厂版采购单协同同一个模板（样式直接取自 collab-po.html），主题换成 巴匕卖→客户买的 PI。
     ⛔ 页面上只有客户价；工厂名/工厂价/内部单号后端根本不下发。 -->
<!-- 样式取自 collab-po.html（同一个模板）-->
<style>
:root{
  --ink:#1A1D21;--ink2:#4A5159;--dim:#8A9199;
  --bg:#EEF0F3;--page:#FFF;--line:#D9DDE2;--line2:#EBEEF1;
  --head:#2C3E50;--accent:#1F4B7A;
  --miss:#D64541;--miss-bg:#FDF0EF;--miss-line:#F0C4C1;
  --ok:#2E7D5B;--ok-bg:#EDF6F1;--warn:#B8860B;--edit:#FFF8DC;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.7;
 font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;background:var(--page);border-bottom:1px solid var(--line);
 padding:9px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font-size:12px;font-weight:600;padding:6px 12px;border-radius:3px;border:1px solid var(--line);
 background:var(--page);color:var(--ink2);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{margin-left:auto;font-size:11px;color:var(--dim)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 322px;gap:16px;max-width:1300px;margin:0 auto;padding:16px}
@media(max-width:1000px){.layout{grid-template-columns:1fr}}
.sheet{background:var(--page);border:1px solid var(--line);border-radius:3px;padding:26px 24px 30px}
.title-wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:18px}
.t-mid{grid-column:2;text-align:center}
.t-act{grid-column:3;justify-self:end;text-align:right}
@media(max-width:700px){.title-wrap{grid-template-columns:1fr}.t-mid,.t-act{grid-column:1;justify-self:center;text-align:center}}
.cn{font-size:23px;font-weight:700;letter-spacing:.5em;text-indent:.5em}
.en{font-size:10px;letter-spacing:.42em;color:var(--dim);text-indent:.42em}
.savebtn{background:var(--line2);color:var(--dim);border:1px solid var(--line);border-radius:5px;
 padding:11px 26px;font-size:17px;font-weight:700;letter-spacing:.04em;cursor:not-allowed;white-space:nowrap}
.savebtn.on{background:var(--ok);border-color:var(--ok);color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(46,125,91,.28)}
.savehint{display:block;font-size:11px;color:var(--miss);margin-top:5px}
.party{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);font-size:11.5px}
.party>div{padding:9px 11px}.party>div+div{border-left:1px solid var(--line)}
.party b.t{display:block;font-size:11px;margin-bottom:5px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:3px 6px;align-items:baseline}
.kv>span{color:var(--dim)}
.fill{border-bottom:1px dashed var(--line);min-height:19px;padding:0 3px;outline:none}
.fill:focus{background:var(--edit);border-bottom-color:var(--accent)}
.fill.empty{border-bottom-color:var(--miss);background:var(--miss-bg);color:var(--miss)}
.fill.touched{background:var(--edit)}
.metarow{display:flex;gap:16px;flex-wrap:wrap;border:1px solid var(--line);border-top:0;padding:8px 11px;font-size:11.5px}
input[type=date]{border:1px solid var(--line);border-radius:2px;padding:2px 6px;font:inherit;font-size:11px}
input[type=date].empty{border-color:var(--miss);background:var(--miss-bg)}
table.items{width:100%;border-collapse:collapse;font-size:11px}
table.items th{background:var(--head);color:#fff;padding:6px 5px;border:1px solid var(--head);font-size:10px;line-height:1.35}
table.items td{border:1px solid var(--line);padding:4px 5px;vertical-align:middle}
td.c{text-align:center}td.r{text-align:right;font-variant-numeric:tabular-nums}
#tb td[data-k]{outline:none;cursor:text;position:relative}
#tb td[data-k]:hover{box-shadow:inset 0 0 0 1px var(--accent)}
#tb td.editing{background:var(--edit)!important;box-shadow:inset 0 0 0 2px var(--accent)!important;
 color:var(--ink)!important;cursor:text}
#tb td.editing::after{content:"回车确认 · Esc 取消";position:absolute;left:0;top:100%;z-index:5;
 background:var(--accent);color:#fff;font-size:9px;padding:1px 5px;border-radius:0 0 3px 3px;white-space:nowrap}
td.miss{background:var(--miss-bg);color:var(--miss);text-align:center;font-size:10px;border:1px dashed var(--miss-line)!important}
td.touched{background:var(--edit)}
.grp td{background:var(--ok-bg);color:var(--accent);font-weight:600}
.zero{color:var(--miss);font-weight:700}
.hs-sus{color:var(--warn);cursor:help}
#tb td.soft-miss{color:var(--dim);font-size:10px;background:transparent;
 border:1px dashed var(--line)!important}
#tb td.auto{color:var(--dim);font-style:italic;background:repeating-linear-gradient(45deg,
 transparent,transparent 4px,rgba(0,0,0,.02) 4px,rgba(0,0,0,.02) 8px);cursor:default}
#tb td.auto:hover{box-shadow:none}
.colbtn{font-size:9.5px;padding:1px 6px;border-radius:2px;border:1px solid rgba(255,255,255,.45);
 background:transparent;color:#fff;margin-left:5px;white-space:nowrap}
.colbtn:hover{background:rgba(255,255,255,.15)}
th.folded{width:auto!important;background:#3E5568}
th.folded .colbtn{border-color:rgba(255,255,255,.7)}
.thumb{width:26px;height:26px;border:1px dashed var(--miss-line);border-radius:2px;display:inline-flex;
 align-items:center;justify-content:center;background:var(--miss-bg);color:var(--miss);cursor:pointer}
.thumb.has{border:1px solid var(--ok);background:var(--ok-bg);color:var(--ok)}
tfoot td{background:var(--line2);font-weight:700}
.terms{border:1px solid var(--line);border-top:0;padding:9px 11px;font-size:10.5px;color:var(--ink2)}
.tline{display:block;padding:2px 4px;border-radius:2px;outline:none}
.tline:focus{background:var(--edit);box-shadow:inset 0 0 0 1px var(--accent)}
.tline.edited{background:var(--edit);border-left:2px solid var(--warn);padding-left:6px}
.tmark{font-size:9.5px;color:var(--warn);border:1px solid var(--warn);border-radius:2px;padding:0 5px;margin-left:6px}
.bagtd{cursor:pointer}.bagtd::after{content:attr(data-sub);display:block;font-size:10px;font-weight:400}
.bagtd.bag-ok{color:var(--ok)}.bagtd.bag-ok::after{color:var(--dim)}
.bagtd.bag-short{color:var(--miss);font-weight:700}.bagtd.bag-short::after{color:var(--miss)}
.btn.pri{background:var(--accent,#1F4B7A);border-color:var(--accent,#1F4B7A);color:#fff}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:-4px 0 14px;text-align:left;font-size:12px;line-height:1.7}
@media(max-width:700px){.steps{grid-template-columns:1fr}}
.steps .stp{border:1px solid var(--line);border-radius:4px;padding:8px 12px}
.steps .alldone{grid-column:1/-1}
.sealbox{display:flex;gap:12px;align-items:flex-start;border:1px dashed var(--line);border-radius:4px;padding:10px;margin:6px 0;background:var(--page)}
.sealpic{flex:none;width:72px;height:72px;border:1px solid var(--line);border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10.5px;color:var(--dim);line-height:1.4}
.sealpic img{width:100%;height:100%;object-fit:contain}
.sealtxt{flex:1;min-width:0}.sealtxt em{font-size:10.5px}.sealtxt .sealflow{color:var(--dim)}
.sealinner{margin:4px 0 6px;padding:6px 8px;border-radius:4px;background:#FFF6E0;border:1px solid #E8C66A;color:#7A5A00;font-size:11.5px;line-height:1.5}
.sealbtns{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}.sealbtns .btn{margin-left:0}
.orline{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:10.5px;margin:6px 0}
.orline::before,.orline::after{content:"";flex:1;border-top:1px dashed var(--line)}
.sealspot{position:relative}.sealspot img{position:absolute;width:120px;height:120px;object-fit:contain;opacity:.35}
@media print{.sealspot img{display:none}}body.pdfmode .sealspot img{display:none}
.stp{padding:3px 0}.stp em{display:block;font-style:normal;font-size:10.5px;color:var(--dim)}
.stp .st{font-size:10.5px;padding:0 6px;border-radius:8px;background:var(--miss-bg,#FDF0EF);color:var(--miss)}
.stp.done .st{background:var(--ok-bg,#EDF6F1);color:var(--ok)}
.stp .btn{font-size:11px;padding:2px 8px;margin-left:4px}
.steps .alldone{margin-top:4px;font-weight:700;color:var(--ok)}
input.need{outline:2px solid var(--miss)}
.swbar{max-width:1300px;margin:10px auto 0;padding:0 16px}
.swtabs{display:flex;gap:6px;margin-bottom:6px}.swtabs button{font:inherit;font-size:12px;padding:4px 12px;border:1px solid var(--line);border-radius:14px;background:var(--page);color:var(--ink2);cursor:pointer}
.swtabs button.on{background:var(--head,#2C3E50);border-color:var(--head,#2C3E50);color:#fff}.swtabs button.red{color:var(--miss)}.swtabs button.red.on{background:var(--miss);border-color:var(--miss);color:#fff}
.swlist{display:flex;gap:8px;flex-wrap:wrap}.swchip{font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--page);cursor:pointer;line-height:1.5}
.swchip.todo{border-color:var(--miss);color:var(--miss)}.swchip.cur{box-shadow:0 0 0 2px var(--accent,#1F4B7A)}.swchip small{display:block;font-size:10.5px;opacity:.85}
.loginbox{max-width:320px;margin:40px auto;background:var(--page);border:1px solid var(--line);border-radius:6px;padding:20px}
.loginbox input{display:block;width:100%;margin:6px 0 10px;padding:8px;border:1px solid var(--line);border-radius:4px;font:inherit}
.loginbox button{width:100%;padding:9px;border:0;border-radius:4px;background:var(--accent,#1F4B7A);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.signrow{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-top:0;font-size:11.5px;page-break-inside:avoid}
.signrow>div{padding:10px 12px}.signrow>div+div{border-left:1px solid var(--line)}
.sealspot{width:170px;height:130px;margin-top:6px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px}
body.pdfmode .sealspot{border-color:transparent;color:transparent}
/* PDF：去掉外层留白/边框，表格按页宽排，不溢出右边（0926 实测右边被裁） */
html.pdfmode .layout,body.pdfmode .layout{display:block!important;padding:0!important;max-width:none!important;margin:0!important}
html.pdfmode .sheet,body.pdfmode .sheet{border:0!important;padding:0!important;width:100%!important;max-width:100%!important;box-sizing:border-box}
body.pdfmode table.items{width:100%!important}
.tplbox{border:1px solid var(--line);border-top:0;padding:11px 12px;background:var(--line2);
 display:grid;grid-template-columns:minmax(150px,auto) minmax(0,1fr);gap:14px;align-items:center}
.tplbox>div{min-width:0}
.histbox{border:1px solid var(--line);border-top:0;background:#fff;padding:11px 12px}
.histbox>b{font-size:12px}
.histbox .hsub{font-size:10.5px;color:var(--dim);margin-left:6px}
.histrow{display:grid;grid-template-columns:104px 72px 1fr;gap:8px;align-items:baseline;
  padding:5px 0;border-top:1px dashed var(--line);font-size:11px}
.histrow .ht{color:var(--dim);font-variant-numeric:tabular-nums}
.histrow .hw{font-weight:600}
.histrow .hf{color:var(--dim)}
.histrow .ho{color:var(--dim);text-decoration:line-through}
.histrow .hn{color:var(--ok);font-weight:600}
.histempty{font-size:11px;color:var(--dim);padding:6px 0}
@media(max-width:760px){.histrow{grid-template-columns:1fr}}
@media(max-width:760px){.tplbox{grid-template-columns:1fr}}
.tpl-up{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:4px;
 padding:9px 12px;background:var(--page);min-width:0;flex-wrap:wrap}
.tpl-up>div{flex:1 1 220px;min-width:0}
.side{position:sticky;top:56px;align-self:start;border:2px solid var(--miss);border-radius:4px;background:var(--page);overflow:hidden}
.side.clean{border-color:var(--ok)}
.side-h{background:var(--miss-bg);border-bottom:1px solid var(--miss-line);padding:10px 13px}
.side.clean .side-h{background:var(--ok-bg);border-bottom-color:var(--ok)}
.side-h .n{font-size:27px;font-weight:700;line-height:1;color:var(--miss)}
.side.clean .side-h .n{color:var(--ok)}
.side-h .l{font-size:11.5px;color:var(--miss);font-weight:600}
.side.clean .side-h .l{color:var(--ok)}
.side-h .s{font-size:10.5px;color:var(--dim);margin-top:2px}
.mi{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;padding:7px 13px;
 border-bottom:1px solid var(--line2);font-size:12px;cursor:pointer}
.mi:hover{background:var(--line2)}
.mi .nm em{display:block;font-size:10.5px;color:var(--dim);line-height:1.5}
.mi .ct{font-weight:700;color:var(--miss);font-variant-numeric:tabular-nums}
.mi.soft .ct{color:var(--warn)}.mi.done .ct{color:var(--ok)}
.quick{padding:10px 13px;border-top:1px solid var(--line2)}
.quick b{display:block;margin-bottom:5px;font-size:11px;color:var(--ink2)}
.qbtn{display:block;width:100%;text-align:left;padding:6px 9px;margin-bottom:4px;border-radius:3px;
 border:1px solid var(--line);background:var(--page);font-size:11.5px;color:var(--ink2)}
.qbtn em{color:var(--dim);font-size:10.5px;font-style:normal}
.side-f{border-top:1px solid var(--line);padding:11px 13px;background:var(--line2)}
.gate{font-size:11.5px;color:var(--miss);font-weight:600;line-height:1.6}
.gate.ok{color:var(--ok)}
#state{padding:40px;text-align:center;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--head);color:#fff;
 padding:10px 22px;border-radius:4px;font-size:13px;z-index:99;box-shadow:0 4px 18px rgba(0,0,0,.25);display:none}
.toast.err{background:var(--miss)}
@media print{
  .topbar,.side,.tplbox,.histbox,.no-print,.toast{display:none!important}
  .layout{grid-template-columns:1fr;padding:0;gap:0}
  .sheet{border:0;padding:0}
  body{background:#fff}
  td.miss{background:transparent!important;border:1px solid var(--line)!important;color:transparent!important}
  .fill.empty{background:transparent;border-bottom-color:var(--line);color:transparent}
  .title-wrap{display:block;text-align:center}
}
.askmask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
.askbox{background:#fff;border-radius:6px;max-width:420px;width:100%;padding:18px 18px 14px;box-shadow:0 8px 30px rgba(0,0,0,.25);font-size:13.5px;line-height:1.7;white-space:pre-line;color:#222}
.askbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.askbtns button{font:inherit;font-size:13px;padding:6px 16px;border-radius:4px;border:1px solid #ccc;background:#fff;cursor:pointer}
.askbtns button.ok{background:#1F4B7A;border-color:#1F4B7A;color:#fff}
</style>
<style>
.lang{display:flex;gap:4px}.lang button{font-size:11px;padding:2px 8px;border:1px solid var(--line);border-radius:10px;background:var(--page);color:var(--ink2)}
.lang button.on{background:var(--head);border-color:var(--head);color:#fff}
.meta2{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-top:0;font-size:11.5px}
.meta2>div{padding:6px 11px;border-right:1px solid var(--line2)}.meta2>div:last-child{border-right:0}
.meta2 span{display:block;color:var(--dim);font-size:10.5px}.meta2 b{font-weight:600}
@media(max-width:700px){.meta2{grid-template-columns:1fr 1fr}}
.reqrow{display:grid;grid-template-columns:200px 1fr;gap:10px;border:1px solid var(--line);border-top:0;padding:8px 11px;font-size:11.5px;align-items:start}
@media(max-width:700px){.reqrow{grid-template-columns:1fr}}
.reqrow label{color:var(--dim);font-size:10.5px;display:block}
.reqrow input,.reqrow textarea{width:100%;font:inherit;font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:3px}
.reqrow textarea{min-height:44px}
.edited{background:var(--edit)!important;box-shadow:inset 0 0 0 1px var(--warn)}
td input.cq{width:70px;text-align:right;font:inherit;border:1px solid var(--line);border-radius:2px;padding:2px 4px}
td input.cn{width:100%;font:inherit;border:1px solid var(--line);border-radius:2px;padding:2px 4px}
.paybox{border:1px solid var(--line);border-top:0;padding:9px 11px;font-size:11.5px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.paybox{grid-template-columns:1fr}}
.paybox b.t{display:block;font-size:11px;color:var(--ink2);margin-bottom:4px}
.tbc{color:var(--warn)}
.shipbar{max-width:1300px;margin:8px auto 0;padding:0 16px;font-size:12px}
.shipbar a{color:var(--accent);font-weight:600;cursor:pointer}.shipbar .off{color:var(--dim)}
.spot-mark{color:transparent;font-size:9px}
.spot-lbl{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:var(--dim);font-size:11px}
body.pdfmode .spot-lbl{display:none}
body.pdfmode input,body.pdfmode textarea{border:0!important;background:transparent!important}
.retmsg{background:var(--miss-bg);border:1px solid var(--miss-line);color:var(--miss);padding:8px 12px;border-radius:4px;margin-bottom:12px;font-size:12px}
.histbox{margin-top:14px;font-size:11.5px}.histbox summary{cursor:pointer;color:var(--ink2)}
.histbox li{color:var(--ink2)}
.duebar{background:#FFF8E6;border:1px solid #E8C66A;color:#7A5A00;padding:8px 12px;border-radius:4px;margin-bottom:12px;font-size:12.5px}
.duebar.done{background:var(--ok-bg,#EDF6F1);border-color:var(--ok,#2E7D5B);color:var(--ok,#2E7D5B)}
.s1f{margin-top:8px}.s1f label{display:block;font-size:11px;color:var(--ink2);font-weight:600}
.s1f input{font:inherit;font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:3px}
.s1row{display:flex;gap:6px}.s1row input{flex:1;min-width:0}
#piTerms{margin:4px 0 0;padding-left:18px}#piTerms li{margin:2px 0}
.pdfval{font-size:12px;padding:2px 0;white-space:pre-wrap}
#tb td:nth-child(2){min-width:230px}body.pdfmode #tb td:nth-child(2){min-width:0}
/* 数字列按内容收窄、不换行；剩下的宽度全给品名 */
table.items th.num,table.items td.num{width:1%;white-space:nowrap}
table.items td.num input.cq{width:64px}
table.items.noimg th.col-img,table.items.noimg td.col-img{display:none}body.pdfmode table.items td:nth-child(2){min-width:0}
body.pdfmode .edited{background:transparent!important;box-shadow:none!important}
body.pdfmode .col-note.empty{display:none}
body.pdfmode table.items{table-layout:fixed}
body.pdfmode table.items th:nth-child(1){width:26px!important}body.pdfmode table.items th:nth-child(3){width:58px!important}body.pdfmode table.items th:nth-child(4){width:44px!important}body.pdfmode table.items th:nth-child(5){width:62px!important}body.pdfmode table.items th:nth-child(6){width:78px!important}body.pdfmode table.items th:nth-child(7){width:92px!important}body.pdfmode table.items th:nth-child(8){width:96px!important}
.reqnote{font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-top:0;padding:5px 11px;display:none}
body.pdfmode .reqnote.on{display:block}
</style>
</head>
<body>
<div class="topbar no-print">
  <button class="btn" id="bPdf" type="button">📄 <span data-t="dl_pdf"></span></button>
  <button class="btn" id="bPrint" type="button">🖨 <span data-t="print"></span></button>
  <div class="lang" id="lang"></div>
  <span class="tag" id="tag"></span>
</div>
<div class="swbar no-print" id="swBar" style="display:none"><div class="swtabs" id="swTabs"></div><div class="swlist" id="swList"></div></div>
<div class="shipbar no-print" id="shipBar" style="display:none"></div>
<div id="state">Loading…</div>
<div class="layout" id="wrap" style="display:none">
  <div class="sheet" id="sheet">
    <div id="retMsg" class="retmsg no-print" style="display:none"></div>
    <div id="dueBar" class="duebar no-print" style="display:none"></div>
    <div class="title-wrap">
      <div class="t-mid"><div class="cn" data-t="title"></div><div class="en" data-t="subtitle"></div></div>
      <div class="t-act no-print">
        <button class="savebtn on" id="bSave" type="button">💾 <span data-t="submit"></span></button>
        <span class="savehint" id="saveHint"></span>
      </div>
    </div>
    <div class="steps no-print" id="steps">
      <div class="stp" id="stp1"><b>①</b> <span data-t="s1"></span> <span class="st" id="st1"></span>
        <em data-t="s1a"></em><em data-t="s1b"></em>
        <div class="s1f"><label data-t="req_delivery"></label><input type="date" id="rqDelivery"></div>
        <div class="s1f"><label data-t="notify_emails"></label>
          <div class="s1row"><input id="ntEmails" placeholder="name@company.com, name2@company.com"><button class="btn" id="bNt" type="button" data-t="save"></button></div>
          <em id="ntHint"></em></div></div>
      <div class="stp" id="stp2"><b>②</b> <span data-t="s2"></span> <span class="st" id="st2"></span>
        <div class="sealbox">
          <div class="sealpic" id="sealPic"></div>
          <div class="sealtxt">
            <b id="sealTitle"></b><em id="sealDesc"></em>
            <em class="sealflow" data-t="seal_flow"></em>
            <em id="sealMsg" style="display:none"></em>
            <div class="sealbtns">
              <button class="btn pri" id="bSeal" type="button" style="display:none"></button>
              <button class="btn" id="bSealUp" type="button"></button>
            </div>
            <input type="file" id="sealFile" accept="image/png,image/jpeg" style="display:none">
          </div>
        </div>
        <div class="orline"><span data-t="or"></span></div>
        <button class="btn" id="bSigned" type="button"></button>
        <span id="cfLinks" style="display:none;margin-left:4px"><a href="#" id="cfView" data-t="view"></a> · <a href="#" id="cfDl" data-t="download"></a></span>
        <em data-t="s2b"></em>
        <input type="file" id="fileInput" accept=".pdf,image/png,image/jpeg" style="display:none">
      </div>
    </div>

    <div class="party">
      <div><b class="t" data-t="seller"></b><div class="kv" id="seller"></div></div>
      <div><b class="t" data-t="buyer"></b><div class="kv" id="buyer"></div></div>
    </div>
    <div class="meta2" id="meta"></div>
    <div class="reqrow">
      <div><label data-t="req_delivery"></label><div class="pdfval" id="rqDeliveryTxt">—</div></div>
      <div><label data-t="marks"></label><textarea id="rqMarks"></textarea></div>
    </div>

    <table class="items">
      <thead><tr>
        <th class="num" data-t="no"></th><th data-t="item"></th><th class="no-print col-img"></th>
        <th class="num" data-t="qty"></th><th class="num" data-t="pack"></th>
        <th class="num" id="thPrice"></th><th class="num" id="thAmt"></th>
        <th class="num" data-t="barcode"></th><th style="width:150px" class="col-note" data-t="note"></th>
      </tr></thead>
      <tbody id="tb"></tbody>
      <tfoot><tr><td colspan="3" class="r" id="totLbl" data-t="total"></td><td class="c" id="totQty"></td><td></td><td></td><td class="r" id="totAmt"></td><td></td><td class="col-note"></td></tr></tfoot>
    </table>
    <div class="reqnote" id="reqNote" data-t="req_note"></div>

    <div class="paybox">
      <div><b class="t" data-t="payment"></b><div id="payTerms"></div></div>
      <div><b class="t" data-t="payee"></b><div id="payee"></div></div>
    </div>
    <div class="reqrow"><div><label data-t="remarks"></label></div><div><textarea id="rqRemarks"></textarea></div></div>
    <div class="terms" id="piTermsBox"><b data-t="terms_title"></b><ol id="piTerms"></ol></div>

    <div class="signrow">
      <div><b data-t="seller_sign"></b><br><span id="sigSeller"></span></div>
      <div><b data-t="buyer_sign"></b><br><span id="sigBuyer"></span>
        <div class="sealspot" id="sealSpot"><div class="spot-mark">（盖章）</div><div class="spot-lbl" data-t="seal_here"></div></div></div>
    </div>
    <details class="histbox no-print" id="histBox"><summary data-t="history"></summary><ul id="histList"></ul></details>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="collab-order.js"></script>

</body>
</html>
