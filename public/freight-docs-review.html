<body>
<div class="wrap">

  <div id="app"></div>

<script src="/public/sanlyn-table.js"></script>
<script>
var T=[
 {f:"51.cp-4",          po:"40-CP-4",              bl:"MEDUWZ495815",  docs:["fob_invoice"],                 note:"FOB·只收海运费"},
 {f:"52.LL-3.LL-4.DG-1",po:"40-DG-1+40-LL-3+40-LL-4",bl:"ESLCHNQIN061639",docs:["fob_invoice","fob_portcharge"],note:"EXW·含港杂/拖车原价"},
 {f:"53.LL-5 CP-5 DG-4",po:"40-CP-5+40-DG-3+40-DG-4+…",bl:"MEDUXS320232", docs:["fob_invoice","fob_portcharge"],note:"EXW+FOB混·港杂按EXW柜50%"},
 {f:"54.CL-16-19",      po:"40-CL-16~19",          bl:"COAU6460522270",docs:["fob_invoice"],                 note:"FOB·含驳船线"},
 {f:"55.xm-1",          po:"40-XM-1",              bl:"AXI0361194",    docs:["fob_invoice"],                 note:"FOB"},

];
var NAMES={fob_invoice:"海运费单 INVOICE",fob_portcharge:"港杂费账单"};
var tok=SanlynTable.token();
document.getElementById("app").innerHTML=T.map(function(t){

    return '<a target="_blank" href="/api/db/shipping-plan-pdf?bl='+encodeURIComponent(t.bl)+'&type='+d+'&token='+encodeURIComponent(tok)+'">'+NAMES[d]+'</a>'}).join(" ");
  return '<div class="card"><b>'+SanlynTable.esc(t.f)+'</b><span class="bl">'+SanlynTable.esc(t.bl)+'</span>'+links+'<span class="note">'+SanlynTable.esc(t.po)+' · '+SanlynTable.esc(t.note)+'</span></div>'}).join("");
if(!tok)document.getElementById("app").innerHTML='<div class="err">请先在对账主表登录一次再刷新本页(共用登录态)</div>'+document.getElementById("app").innerHTML;
</script>
