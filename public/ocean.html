<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海运总表 · 洋宝宝</title>
    <link rel="stylesheet" href="/public/hgj-ui.css">
    <link rel="stylesheet" href="/public/ocean.css">
<script src="/public/wb-open-tab.js" data-protocol="sanlyn:open-tab"></script>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>海运总表</h1>
        <span class="sub">只读 · 数据生成时间: <span id="gen-time">—</span></span>
    </div>

    <div class="toolbar">
        <div class="filter-selects">
            <select id="filter-pol"><option value="">起运港</option></select>
            <select id="filter-pod"><option value="">目的港</option></select>
            <select id="filter-carrier"><option value="">船公司</option></select>
            <select id="filter-customer"><option value="">客户</option></select>
        </div>
        <div class="quick-btns" id="quick-btns"></div>
        <div class="right-actions">
            <button class="btn" id="btn-cols">⚙ 自定义列</button>
            <button class="btn" id="btn-export">导出CSV</button>
        </div>
    </div>

    <div id="table-container"></div>
    <div id="unmatched-section" class="unmatched-block"></div>
    <div class="footer-note">金额按币种分行 · 绝不折算 · 毛差0为正常业务</div>
</div>

<div id="col-panel" class="col-panel" style="display:none;"></div>
<div id="overlay" class="overlay" style="display:none;"></div>

<script src="/public/ocean.js"></script>
</body>
</html>
