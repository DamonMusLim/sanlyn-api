<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>舱单录单 · 配置驱动版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #1f2937;
            padding: 20px;
            line-height: 1.4;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 12px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #111827;
        }
        .status-bar {
            font-size: 12px;
            color: #6b7280;
            background: #f9fafb;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #e5e7eb;
            display: inline-block;
        }
        .header-actions {
            display: flex;
            gap: 8px;
        }
        .btn {
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            color: #374151;
            transition: background 0.1s;
        }
        .btn:hover {
            background: #f3f4f6;
        }
        .btn:active {
            background: #e5e7eb;
        }
        .raw-panel {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 20px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }
        .raw-panel.visible {
            display: block;
        }
        .section {
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            margin-bottom: 20px;
            background: #ffffff;
        }
        .section-header {
            background: #6b74a8;
            color: #ffffff;
            padding: 8px 16px;
            font-weight: 500;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            border-radius: 3px 3px 0 0;
        }
        .section-header .arrow {
            font-size: 12px;
            transition: transform 0.1s;
        }
        .section.collapsed .arrow {
            transform: rotate(-90deg);
        }
        .section-body {
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .section.collapsed .section-body {
            display: none;
        }
        .field-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }
        .field-label {
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .field-label .badge {
            font-size: 10px;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 0 6px;
            color: #6b7280;
            font-weight: 400;
        }
        .field-label .unlabeled {
            font-size: 11px;
            color: #9ca3af;
            font-weight: 400;
        }
        .field-control {
            width: 100%;
            height: 32px;
            font-size: 14px;
            border: 1px solid rgb(215, 219, 224);
            border-radius: 2px;
            padding: 0 8px;
            background: #ffffff;
            color: #1f2937;
            outline: none;
            transition: border 0.1s;
        }
        .field-control:focus {
            border-color: #6b74a8;
        }
        .field-control[readonly] {
            background: #f9fafb;
            cursor: default;
        }
        .select-wrapper {
            position: relative;
        }
        .select-panel {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            margin-top: 2px;
            max-height: 160px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            display: none;
        }
        .select-panel.active {
            display: block;
        }
        .select-option {
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid #f3f4f6;
        }
        .select-option:hover {
            background: #f3f4f6;
        }
        .reference-hint {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 2px;
            min-height: 14px;
        }
        .loading, .error, .empty {
            padding: 40px 20px;
            text-align: center;
            font-size: 14px;
            color: #6b7280;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            background: #fafafa;
        }
        .error {
            color: #b91c1c;
            background: #fef2f2;
            border-color: #fecaca;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
            border-top: 1px solid #e5e7eb;
            padding-top: 16px;
        }
        @media (max-width: 768px) {
            .section-body {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>舱单录单 · 配置驱动版</h1>
        <div>
            <span class="status-bar" id="statusBar">加载中...</span>
        </div>
        <div class="header-actions">
            <button class="btn" id="reloadBtn">重新拉取配置</button>
            <button class="btn" id="rawBtn">查看原始配置</button>
        </div>
    </div>
    <div id="rawPanel" class="raw-panel"></div>
    <div id="mainContent">
        <div class="loading">正在加载配置...</div>
    </div>
    <div class="footer-note">
        本页不含任何写死字段。要加字段/改标签/改下拉选项,去改 field_layouts 表 module_key=manifest 的配置,刷新即生效。
    </div>
</div>

<script src="/manifest-child-modules.js"></script>
<script src="/manifest-cfg.js"></script>
</body>
</html>
