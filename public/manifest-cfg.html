<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>舱单录单 · 配置驱动版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #1f2937;
            padding: 20px;
            line-height: 1.4;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 12px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #111827;
        }
        .status-bar {
            font-size: 12px;
            color: #6b7280;
            background: #f9fafb;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #e5e7eb;
            display: inline-block;
        }
        .header-actions {
            display: flex;
            gap: 8px;
        }
        .btn {
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            color: #374151;
            transition: background 0.1s;
        }
        .btn:hover {
            background: #f3f4f6;
        }
        .btn:active {
            background: #e5e7eb;
        }
        .raw-panel {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 20px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }
        .raw-panel.visible {
            display: block;
        }
        .section {
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            margin-bottom: 20px;
            background: #ffffff;
        }
        .section-header {
            background: #6b74a8;
            color: #ffffff;
            padding: 8px 16px;
            font-weight: 500;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            border-radius: 3px 3px 0 0;
        }
        .section-header .arrow {
            font-size: 12px;
            transition: transform 0.1s;
        }
        .section.collapsed .arrow {
            transform: rotate(-90deg);
        }
        .section-body {
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .section.collapsed .section-body {
            display: none;
        }
        .field-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }
        .field-label {
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .field-label .badge {
            font-size: 10px;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 0 6px;
            color: #6b7280;
            font-weight: 400;
        }
        .field-label .unlabeled {
            font-size: 11px;
            color: #9ca3af;
            font-weight: 400;
        }
        .field-control {
            width: 100%;
            height: 32px;
            font-size: 14px;
            border: 1px solid rgb(215, 219, 224);
            border-radius: 2px;
            padding: 0 8px;
            background: #ffffff;
            color: #1f2937;
            outline: none;
            transition: border 0.1s;
        }
        .field-control:focus {
            border-color: #6b74a8;
        }
        .field-control[readonly] {
            background: #f9fafb;
            cursor: default;
        }
        .select-wrapper {
            position: relative;
        }
        .select-panel {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            margin-top: 2px;
            max-height: 160px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            display: none;
        }
        .select-panel.active {
            display: block;
        }
        .select-option {
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid #f3f4f6;
        }
        .select-option:hover {
            background: #f3f4f6;
        }
        .reference-hint {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 2px;
            min-height: 14px;
        }
        .loading, .error, .empty {
            padding: 40px 20px;
            text-align: center;
            font-size: 14px;
            color: #6b7280;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            background: #fafafa;
        }
        .error {
            color: #b91c1c;
            background: #fef2f2;
            border-color: #fecaca;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
            border-top: 1px solid #e5e7eb;
            padding-top: 16px;
        }
        @media (max-width: 768px) {
            .section-body {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>舱单录单 · 配置驱动版</h1>
        <div>
            <span class="status-bar" id="statusBar">加载中...</span>
        </div>
        <div class="header-actions">
            <button class="btn" id="reloadBtn">重新拉取配置</button>
            <button class="btn" id="rawBtn">查看原始配置</button>
        </div>
    </div>
    <div id="rawPanel" class="raw-panel"></div>
    <div id="mainContent">
        <div class="loading">正在加载配置...</div>
    </div>
    <div class="footer-note">
        本页不含任何写死字段。要加字段/改标签/改下拉选项,去改 field_layouts 表 module_key=manifest 的配置,刷新即生效。
    </div>
</div>

<script>
    (function() {
        // ---------- 工具函数 ----------
        function getToken() {
            return localStorage.getItem("sanlyn_jwt") || 
                   localStorage.getItem("sanlyn_token") || 
                   localStorage.getItem("token") || "";
        }

        function extractLayout(data) {
            // 兼容三种结构: 直接对象 / data.layout_json / layout_json
            if (!data) return null;
            if (data.layout_json && typeof data.layout_json === 'object') return data.layout_json;
            if (data.data && data.data.layout_json && typeof data.data.layout_json === 'object') return data.data.layout_json;
            if (data.sections && Array.isArray(data.sections)) return data; // 直接就是layout对象
            return null;
        }

        // ---------- 全局状态 ----------
        let currentLayout = null;
        let currentRawText = '';
        let fetchTime = '';

        // ---------- DOM 元素 ----------
        const mainContent = document.getElementById('mainContent');
        const statusBar = document.getElementById('statusBar');
        const rawPanel = document.getElementById('rawPanel');
        const reloadBtn = document.getElementById('reloadBtn');
        const rawBtn = document.getElementById('rawBtn');

        // ---------- 渲染函数 ----------
        function render(layout) {
            if (!layout || !layout.sections || !Array.isArray(layout.sections)) {
                mainContent.innerHTML = '<div class="empty">配置为空或格式不正确</div>';
                return;
            }

            const props = layout.props || {};
            const sections = layout.sections;
            let totalFields = 0;
            let propCount = 0;

            // 统计字段数和props数
            sections.forEach(sec => {
                if (sec.fields) totalFields += sec.fields.length;
            });
            propCount = Object.keys(props).length;

            // 构建HTML
            let html = '';
            sections.forEach((section, idx) => {
                const sectionKey = section.key || `section_${idx}`;
                const sectionLabel = section.label || sectionKey;
                const fields = section.fields || [];
                html += `<div class="section" data-section-key="${sectionKey}">`;
                html += `<div class="section-header" data-action="toggle">
                            <span>${escapeHtml(sectionLabel)}</span>
                            <span class="arrow">▼</span>
                        </div>`;
                html += `<div class="section-body">`;

                fields.forEach(fieldKey => {
                    const fieldProps = props[fieldKey];
                    const hasProps = !!fieldProps;
                    const label = (fieldProps && fieldProps.label) ? fieldProps.label : null;
                    const displayLabel = label || fieldKey;
                    const unlabeledMark = label ? '' : '<span class="unlabeled">未配label</span>';
                    const badge = hasProps ? '<span class="badge">配置</span>' : '<span class="badge">默认</span>';

                    // 控件类型
                    let controlHtml = '';
                    const inputKind = fieldProps?.input_kind;
                    const reference = fieldProps?.reference;

                    if (inputKind === 'select' && fieldProps.options && Array.isArray(fieldProps.options)) {
                        // 自定义下拉面板
                        const options = fieldProps.options;
                        const optionsHtml = options.map(opt => 
                            `<div class="select-option" data-value="${escapeHtml(opt)}">${escapeHtml(opt)}</div>`
                        ).join('');
                        controlHtml = `
                            <div class="select-wrapper">
                                <input class="field-control select-input" readonly placeholder="点击选择" value="" data-field="${escapeHtml(fieldKey)}">
                                <div class="select-panel">${optionsHtml}</div>
                            </div>
                        `;
                    } else if (reference && reference.enabled) {
                        // 联想输入框
                        const targetTable = reference.target_table || '';
                        controlHtml = `
                            <input class="field-control reference-input" autocomplete="off" placeholder="输入以联想" 
                                   data-field="${escapeHtml(fieldKey)}" data-target-table="${escapeHtml(targetTable)}"
                                   data-carry-enabled="${reference.carry_enabled ? 'true' : 'false'}"
                                   data-carry-fields='${escapeHtml(JSON.stringify(reference.carry_fields || []))}'
                                   data-display-field="${escapeHtml(reference.target_display_field || '')}"
                                   data-key-field="${escapeHtml(reference.target_key_field || '')}">
                            <div class="reference-hint" data-hint-for="${escapeHtml(fieldKey)}"></div>
                        `;
                    } else {
                        // 普通文本框
                        controlHtml = `<input class="field-control" type="text" data-field="${escapeHtml(fieldKey)}">`;
                    }

                    html += `
                        <div class="field-item" data-field-key="${escapeHtml(fieldKey)}">
                            <div class="field-label">
                                <span>${escapeHtml(displayLabel)}</span>
                                ${unlabeledMark}
                                ${badge}
                            </div>
                            ${controlHtml}
                        </div>
                    `;
                });

                html += `</div></div>`;
            });

            mainContent.innerHTML = html;

            // 绑定事件
            bindEvents();

            // 更新状态栏
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            statusBar.textContent = `module_key=manifest · 分区${sections.length}个 · 字段${totalFields}个 · 配props ${propCount}个 · 拉取时间${timeStr}`;
        }

        function bindEvents() {
            // 折叠/展开
            document.querySelectorAll('.section-header').forEach(header => {
                header.addEventListener('click', function() {
                    const section = this.closest('.section');
                    section.classList.toggle('collapsed');
                });
            });

            // 自定义下拉面板
            document.querySelectorAll('.select-wrapper').forEach(wrapper => {
                const input = wrapper.querySelector('.select-input');
                const panel = wrapper.querySelector('.select-panel');
                if (!input || !panel) return;

                input.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // 关闭其他面板
                    document.querySelectorAll('.select-panel.active').forEach(p => {
                        if (p !== panel) p.classList.remove('active');
                    });
                    panel.classList.toggle('active');
                });

                panel.querySelectorAll('.select-option').forEach(opt => {
                    opt.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const value = opt.getAttribute('data-value') || '';
                        input.value = value;
                        panel.classList.remove('active');
                    });
                });
            });

            // 点击外部关闭面板
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.select-wrapper')) {
                    document.querySelectorAll('.select-panel.active').forEach(p => p.classList.remove('active'));
                }
            });

            // 联想输入框
            document.querySelectorAll('.reference-input').forEach(input => {
                let debounceTimer;
                input.addEventListener('input', function() {
                    const query = this.value.trim();
                    const fieldKey = this.getAttribute('data-field');
                    const targetTable = this.getAttribute('data-target-table');
                    const hintEl = document.querySelector(`[data-hint-for="${CSS.escape(fieldKey)}"]`);
                    if (!query) {
                        if (hintEl) hintEl.textContent = '';
                        return;
                    }
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(() => {
                        // 调用联想接口
                        const token = getToken();
                        const url = `/api/db/${targetTable}?q=${encodeURIComponent(query)}`;
                        fetch(url, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        })
                        .then(res => {
                            if (!res.ok) throw new Error(`HTTP ${res.status}`);
                            return res.json();
                        })
                        .then(data => {
                            // 假设返回数组或 {data: []}
                            let list = Array.isArray(data) ? data : (data.data || []);
                            if (!list.length) {
                                if (hintEl) hintEl.textContent = '无匹配候选';
                                return;
                            }
                            // 简单处理: 显示第一个匹配的display字段
                            const displayField = input.getAttribute('data-display-field') || 'name';
                            const first = list[0];
                            const displayVal = first[displayField] || first.name || JSON.stringify(first);
                            // 填充主字段
                            input.value = displayVal;
                            // 处理carry
                            const carryEnabled = input.getAttribute('data-carry-enabled') === 'true';
                            if (carryEnabled) {
                                const carryFields = JSON.parse(input.getAttribute('data-carry-fields') || '[]');
                                carryFields.forEach(cf => {
                                    const localField = cf.local_field;
                                    const targetField = cf.target_field;
                                    const targetVal = first[targetField] || '';
                                    const targetInput = document.querySelector(`[data-field="${CSS.escape(localField)}"]`);
                                    if (targetInput) {
                                        targetInput.value = targetVal;
                                    }
                                });
                            }
                            if (hintEl) hintEl.textContent = `已选: ${displayVal}`;
                        })
                        .catch(err => {
                            // 降级: 显示提示
                            if (hintEl) hintEl.textContent = `联想接口未接:${targetTable}`;
                            // 保留输入内容, 不填充
                        });
                    }, 300);
                });
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, function(m) {
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
            });
        }

        // ---------- 数据加载 ----------
        async function loadConfig() {
            mainContent.innerHTML = '<div class="loading">正在加载配置...</div>';
            statusBar.textContent = '加载中...';
            const token = getToken();
            try {
                const res = await fetch('/api/db/field-layout?module_key=manifest', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) {
                    const errText = await res.text().catch(() => '');
                    throw new Error(`HTTP ${res.status} ${errText}`);
                }
                const data = await res.json();
                const layout = extractLayout(data);
                if (!layout) {
                    throw new Error('配置格式无法识别');
                }
                currentLayout = layout;
                currentRawText = JSON.stringify(layout, null, 2);
                render(layout);
                // 更新原始面板
                rawPanel.textContent = currentRawText;
            } catch (err) {
                mainContent.innerHTML = `<div class="error">加载失败: ${escapeHtml(err.message)}</div>`;
                statusBar.textContent = '加载失败';
                rawPanel.textContent = '';
            }
        }

        // ---------- 事件绑定 ----------
        reloadBtn.addEventListener('click', loadConfig);
        rawBtn.addEventListener('click', function() {
            rawPanel.classList.toggle('visible');
            if (rawPanel.classList.contains('visible') && currentRawText) {
                rawPanel.textContent = currentRawText;
            }
        });

        // 初始化
        loadConfig();
    })();
</script>
</body>
</html>
