<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>订舱平台</title>
  <link rel="stylesheet" href="/public/hgj-ui.css">
  <style>
    :root{--bg:var(--hgj-bg);--panel:var(--hgj-card);--text:var(--hgj-text);--muted:var(--hgj-muted);--line:var(--hgj-line);--accent:var(--hgj-primary);--chip:var(--hgj-primary-bg);--warn:var(--hgj-warn);--bad:var(--hgj-danger);--side:var(--hgj-side-bg);--sideText:var(--hgj-side-text)}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--hgj-font)}.shell{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:100vh}.side{background:var(--side);color:var(--sideText)}.side h2{height:48px;margin:0;padding:0 16px;font-size:16px;line-height:48px;color:#fff}.side div{height:48px;padding:0 16px;line-height:48px}.wrap{padding:22px;max-width:1360px;width:100%;margin:0 auto}
    .top{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:14px}.title{font-size:16px;line-height:16px;margin:0 0 8px;padding-left:10px;border-left:3px solid var(--accent);color:var(--hgj-title);font-weight:700}.sub,.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    button,input,select{border:1px solid var(--line);border-radius:0;background:var(--panel);color:var(--text);height:34px;padding:0 11px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{opacity:.5;cursor:not-allowed}
    .notice{border-left:3px solid var(--warn);padding:10px 14px;margin-bottom:10px;color:var(--hgj-title);font-weight:700}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}.metric{padding:13px 14px;background:var(--panel)}.metric .num{font-size:24px;font-weight:700;margin-top:3px}.warn{color:var(--warn)}.bad{color:var(--bad)}
    .grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:10px}.panel{background:var(--panel);border:0;border-radius:0;box-shadow:none;margin-bottom:10px;overflow:hidden}.panel-head{display:flex;justify-content:space-between;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}.panel-title{font-weight:700;color:var(--hgj-title);padding-left:10px;border-left:3px solid var(--accent);line-height:16px}.body{padding:14px}
    .list{display:grid;gap:1px;background:var(--line);max-height:calc(100vh - 270px);overflow:auto}.row{border:0;background:var(--panel);padding:11px 12px;text-align:left;height:auto}.row.active{outline:2px solid var(--accent);outline-offset:-2px}.row strong{display:block;font-size:14px;overflow-wrap:anywhere}.row span{display:block;color:var(--muted);font-size:12px;margin-top:4px;overflow-wrap:anywhere}
    .pill{display:inline-block;border:1px solid var(--accent);border-radius:0;background:var(--chip);color:var(--accent);padding:2px 7px;font-size:12px}.pill.warn{border-color:var(--warn);background:transparent;color:var(--warn)}.pill.bad{border-color:var(--bad);background:transparent;color:var(--bad)}
    table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}th{background:var(--bg);color:var(--muted);font-size:12px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.field{border:1px solid var(--line);padding:8px}.field b{display:block;font-size:13px}.field span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.empty,.error{padding:24px;text-align:center;color:var(--muted)}.error{color:var(--bad)}
    @media(max-width:900px){.shell{display:block}.side{display:none}.wrap{padding:14px}.top,.grid{display:block}.actions{margin-top:10px}.metrics,.fields{grid-template-columns:1fr}table{display:block;overflow-x:auto;white-space:nowrap}.list{max-height:none}}
  </style>
<script src="/public/wb-open-tab.js" data-protocol="sanlyn:open-tab"></script>
</head>
<body class="hgj-page">
  <div class="shell">
    <aside class="side"><h2>订舱平台</h2><div>订舱平台</div><div>海运执行</div><div>单证跟踪</div></aside>
    <div class="wrap">
      <header class="top">
        <div><h1 class="title hgj-panel-title">订舱平台</h1><div id="summary" class="sub">加载中</div></div>
        <div class="actions">
          <input id="search" placeholder="CY / 订舱号 / SO / BL / 客户 / 货代">
          <select id="state"><option value="">全部</option><option value="ready">已有订舱号</option><option value="missing_booking">缺订舱号</option></select>
          <button id="nextTicket" type="button">下一票</button>
          <button id="reload" type="button">刷新</button>
          <button id="sendBtn" class="primary" type="button" disabled>发送订舱</button>
          <button id="openWb" type="button">工作台打开</button>
        </div>
      </header>
      <div class="notice hgj-card">本页只读；不会向货代或船公司发送订舱，不改价、不改费用、不改物流事实。</div>
      <section class="metrics">
        <div class="metric hgj-card"><div class="muted">订舱样本</div><div id="mRows" class="num">未接入</div></div>
        <div class="metric hgj-card"><div class="muted">订舱号填充</div><div id="mBooking" class="num warn">未接入</div></div>
        <div class="metric hgj-card"><div class="muted">船期填充</div><div id="mSchedule" class="num warn">未接入</div></div>
        <div class="metric hgj-card"><div class="muted">订舱通道</div><div id="mChannel" class="num bad">未接入</div></div>
      </section>
      <main class="grid">
        <section class="panel hgj-card"><div class="panel-head"><div class="panel-title">订舱列表</div><span id="listCount" class="pill">未接入</span></div><div id="list" class="list"></div></section>
        <section>
          <section class="panel hgj-card"><div class="panel-head"><div class="panel-title">当前订舱</div><span id="readyPill" class="pill">未接入</span></div><div id="detail" class="body"></div></section>
          <section class="panel hgj-card"><div class="panel-head"><div class="panel-title">提单/签单资料下载</div><span id="docPill" class="pill bad">未接入</span></div><div id="docs" class="body"></div></section>
          <section class="panel hgj-card"><div class="panel-head"><div class="panel-title">字段填充率</div><span class="pill">真实字段</span></div><div id="coverage" class="body fields"></div></section>
          <section class="panel hgj-card"><div class="panel-head"><div class="panel-title">订舱通道接入状态</div><span class="pill bad">禁止忽略</span></div><div id="channelState" class="body"></div></section>
        </section>
      </main>
    </div>
  </div>
  <script src="/public/booking-platform.js"></script>
</body>
</html>
