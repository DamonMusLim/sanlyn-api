<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>退税主表</title>
<link rel="stylesheet" href="/public/sanlyn-table.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font:13px/1.5 -apple-system,"PingFang SC",sans-serif;color:#111827}
.wrap{padding:14px}.top{background:#0f172a;color:#fff;padding:12px 16px;border-radius:10px 10px 0 0}
.title{font-size:17px;font-weight:800}.meta{font-size:11px;opacity:.75;margin-top:3px}
.bar{background:#1e293b;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar input,.bar select{padding:5px 8px;border:0;border-radius:6px;font-size:12px}

.declbox{margin-top:14px;border-top:2px dashed #cbd5e1;padding-top:10px}
.declhd{font-size:12px;color:#334155;margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tbd{color:#b0b7c3;font-size:11px}
table.decl th.ex,table.decl td.ex{background:#f6f7f9;color:#64748b;border-left:2px solid #cbd5e1}
table.decl th.ex{background:#eceff3;font-weight:500}
tr.bandrow td{padding:2px 6px;font-size:10px;border:0}
td.band-o{background:#eef2ff;color:#3730a3}
td.band-x{background:#f6f7f9;color:#94a3b8;border-left:2px solid #cbd5e1}
.probbar{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.declhd.bar{gap:8px;align-items:center;margin-bottom:8px}
.btn.collab{background:#059669;text-decoration:none;display:inline-block;line-height:1.5}
.btn.collab.off{background:#e2e8f0;color:#94a3b8;cursor:not-allowed}
.btn.up{background:#7c3aed}
.btn.up:disabled{opacity:.85}
.pb{font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600}
.pb.red{background:#fee2e2;color:#991b1b}
.pb.amber{background:#fef3c7;color:#92400e}
.pb.mute{background:#f1f5f9;color:#94a3b8;font-weight:400}
.vbadge{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.vbadge.ok{background:#dcfce7;color:#166534;border:1px solid #86efac}
.vbadge.mid{background:#e0f2fe;color:#075985;border:1px solid #7dd3fc}
.vbadge.no{background:#f1f5f9;color:#64748b;border:1px solid #cbd5e1}
.vbadge .sm{font-weight:400;opacity:.85}
tr.blg td{background:linear-gradient(#dbeafe,#eff6ff);border-top:3px solid #2563eb;padding:8px 12px;color:#1e3a8a}
.blg-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.blg-n{background:#2563eb;color:#fff;font-weight:800;font-size:15px;border-radius:6px;padding:1px 9px}
.blg-x{font-weight:700;font-size:13px}
.blg-bl{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:14px;letter-spacing:.5px}
.blg-warn{background:#fef3c7;color:#92400e;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px}
.blg-ok{background:#dcfce7;color:#166534;font-size:11px;border-radius:999px;padding:2px 9px}
.blg-s{font-size:11.5px;color:#334155;margin-top:3px}
tr.blf td{background:#eff6ff;border-bottom:3px solid #2563eb;padding:3px 12px 5px 12px;font-size:11px;color:#60a5fa}
tr.blm>td:first-child,tr.blm>td.blmc{border-left:10px solid #2563eb}
tr.main.blm>td{background:#f8fbff}
.blno{font-size:14px;color:#fff;background:#2563eb;font-weight:800;line-height:1.2;margin-top:4px;border-radius:5px;padding:2px 5px;display:inline-block;letter-spacing:.5px}
.declbox.clean{border-top-color:#bbf7d0}
.infobar{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:#475569;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:6px 10px;margin-bottom:8px}
.infobar .ib i{font-style:normal;color:#94a3b8;margin-right:4px}
table.decl tbody tr:nth-child(even) td{background:#fafbfc}
table.decl{margin-bottom:10px}
table.decl caption{text-align:left;font-size:12px;font-weight:700;color:#0f172a;padding:4px 0}
table.decl th{background:#eef2ff;font-size:11px;white-space:nowrap}
table.decl td{font-size:11px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.btn.xs{padding:2px 8px;font-size:11px}
.btn{padding:5px 12px;border:0;border-radius:6px;background:#2563eb;color:#fff;font-size:12px;cursor:pointer}
.cards{display:flex;gap:10px;padding:10px 16px;background:#fff;flex-wrap:wrap;border-bottom:1px solid #e5e7eb}
.card{border:1px solid #e5e7eb;border-radius:8px;padding:8px 14px;min-width:118px}
.card .k{font-size:11px;color:#6b7280}.card .v{font-size:18px;font-weight:800;margin-top:2px}
.panel{background:#fff;border-radius:0 0 10px 10px;overflow:auto;max-height:80vh}
table.tbl{border-collapse:collapse;width:100%;font-size:12px}
.tbl th{position:sticky;top:0;background:#1f2937;color:#fff;padding:7px 8px;text-align:left;white-space:nowrap;z-index:3}
.tbl td{border-bottom:1px solid #e5e7eb;padding:6px 8px;white-space:nowrap;vertical-align:middle}
tr.main{cursor:pointer}tr.main:hover td{background:#eff6ff}tr.main.open td{background:#e0f2fe}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.own{white-space:normal;max-width:230px;line-height:1.35}
.own .po{font-weight:700}.own .fa{color:#64748b;font-size:11px}
tr.det>td{padding:0;background:#f8fafc;border-bottom:2px solid #cbd5e1}
tr.det.hide{display:none}
div.hide{display:none}
.detbox{padding:8px 10px 12px 34px}
.dhd{font-size:11px;color:#475569;margin-bottom:6px;display:flex;gap:0;flex-wrap:wrap;align-items:center}
.dhd span{padding:2px 9px;background:#e2e8f0;border-right:1px solid #cbd5e1}
.dhd span:first-child{border-radius:5px 0 0 5px}.dhd span:last-child{border-radius:0 5px 5px 0;border-right:0}
.dhd b{color:#0f172a;font-family:ui-monospace,Menlo,monospace}
.dhd i{font-style:normal;color:#94a3b8}
.sub{border-collapse:collapse;font-size:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.13);border-radius:6px;overflow:hidden}
.sub th{background:#334155;color:#fff;padding:5px 10px;white-space:nowrap;text-align:left;font-weight:600}
.sub th.core{background:#1d4ed8}
.sub td{border-bottom:1px solid #e5e7eb;padding:5px 10px;white-space:nowrap}
.sub td.core{background:#eff6ff;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.sub td.w-nw{min-width:88px}.sub td.w-amt{min-width:104px}.sub td.w-rt{min-width:62px;text-align:center}
.sub td.w-rb{min-width:104px}
.sub tr.bad td{background:#fff5f5}.sub tr.bad td.core{background:#fee2e2}
.sub tr.bad td:first-child{box-shadow:inset 3px 0 0 #dc2626}
.sub tfoot td{font-weight:800;border-top:2px solid #334155;background:#f1f5f9}
.sub tfoot td.core{background:#dbeafe;font-size:13px}
.ownc{white-space:normal;max-width:260px;line-height:1.3}
.ownc .inv{font-family:ui-monospace,Menlo,monospace;font-size:11px}
.ownc .sm{color:#64748b;font-size:11px}
.pill{display:inline-block;padding:0 6px;border-radius:8px;font-size:11px;font-weight:700}
.p-ok{background:#dcfce7;color:#166534}.p-warn{background:#fef3c7;color:#92400e}
.p-bad{background:#fee2e2;color:#991b1b}.p-gray{background:#e5e7eb;color:#4b5563}.p-blue{background:#dbeafe;color:#1e40af}
.arw{display:inline-block;width:12px;color:#2563eb;font-weight:800}
tfoot.sumrow td{background:#0f172a;color:#fff;font-weight:800;position:sticky;bottom:0}
.empty{text-align:center;padding:16px;color:#64748b}
table.fac{border-collapse:collapse;font-size:12px;width:100%}
.fac th{background:#065f46;color:#fff;padding:6px 9px;text-align:left;white-space:nowrap}
.fac th.r,.fac td.r{text-align:right;font-variant-numeric:tabular-nums}
.fac td{border-bottom:1px solid #e5e7eb;padding:5px 9px;white-space:nowrap}
.fac tr.hot td{background:#fef2f2}
.fac tfoot td{font-weight:800;background:#f1f5f9;border-top:2px solid #065f46}
.fac .nm{font-weight:700;cursor:pointer;color:#065f46;text-decoration:underline}
tr.mon.cl td{background:#334155;opacity:.85}
tr.mon td{background:#0f172a;color:#fff;font-weight:800;font-size:13px;padding:8px 10px;cursor:pointer;position:sticky;top:30px;z-index:4}
tr.mon td .lab{position:sticky;left:6px;display:inline-block;background:#0f172a;padding:2px 8px;border-radius:6px;z-index:5}
tr.mon td .s{font-weight:500;font-size:11px;opacity:.8;margin-left:10px}
tr.mon td .g{color:#86efac}
tr.fold td{background:#f1f5f9;color:#475569;font-size:12px;padding:5px 10px 5px 34px;cursor:pointer;border-bottom:1px solid #cbd5e1}
tr.fold td b{color:#0f172a}
tr.done.hide,tr.done.hide+tr.det{display:none}
tr.done td{background:#fafafa;color:#64748b}
.sb{font-size:11px;color:#1e40af;background:#dbeafe;border-radius:6px;padding:0 5px;display:inline-block}

.loginbox{padding:24px;text-align:center}
.loginbox input{padding:7px 10px;border:1px solid #cbd5e1;border-radius:6px;margin:0 4px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="title">退税主表 · 以报关单为准</div>
<div class="meta">v2026.08.11-1 · HS/品名/数量/净重/报关金额/退税率 全部取自海关报关单 · 不用 OLI · 蓝色区=核心计算列 · 点行展开逐项 · <span id="stamp"></span></div></div>
<div class="bar">
 <select id="view">
  <option value="all">全部</option><option value="ckts_ok">🏛税局可申报</option><option value="grade_k">🏛税局级</option><option value="grade_c">✅报关单级</option><option value="grade_t">⚠️模版级（不可作依据）</option><option value="ready">可申报（料齐）</option>
  <option value="noorder">无订单</option><option value="norate">缺HS</option>
  <option value="noitem">缺报关逐项</option><option value="noinv">缺进项票</option><option value="over">🔴进项超报关额</option>
  <option value="done">已申报/申报中</option><option value="undone">未申报</option>
 </select>
 <select id="mon"></select>
 <select id="fac"></select>
 <input id="kw" placeholder="搜报关单/订单/工厂/品名/BL">
 <input id="from" value="2026-01-01" style="width:105px" title="起始出口日">
 <label class="sm">申报年月 <input id="sbym" size="6" placeholder="202608" oninput="SB_YM=this.value.trim();draw()"></label>
 <label class="sm">批次 <input id="sbpc" size="3" value="002" oninput="SB_PC=this.value.trim()||'002';draw()"></label>
 <label class="sm" style="font-weight:700"><input type="checkbox" id="onlybad" checked onchange="draw()"> 只看有问题的票</label>
 <button class="btn" onclick="reload()">刷新</button>
 <button class="btn" style="background:#059669" onclick="togFac()">🏭 工厂开票总览</button>
 <button class="btn" onclick="setAll(1)">全部展开</button>
 <button class="btn" onclick="setAll(0)">全部收起</button>
</div>
<div class="cards" id="cards"></div>
<div id="facwrap" style="display:none;background:#fff;padding:12px 16px;border-bottom:2px solid #cbd5e1"></div>
<div class="panel"><div id="boot" style="padding:20px;color:#64748b">Loading…</div>
<table class="tbl" id="grid" style="display:none"><thead id="th"></thead><tbody id="tb"></tbody><tfoot id="tf"></tfoot></table></div>
</div>
<script src="/public/sanlyn-table.js"></script>
<script>
var DATA=[];

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function m(v){return v==null?'—':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function gaps(r){if(isClosed(r))return [];var g=[];if(Number(r.inv_over)>0)g.push('🔴进项超报关额 '+m(r.inv_over));if(!r.item_count)g.push('缺报关逐项');else if(r.bad_lines)g.push('缺HS');
 if(!r.invoices)g.push('缺进项票');if(!r.order_nos)g.push('无订单');return g}
function statusCell(r){
 var h='<span class="pill '+(r.status==='已申报'?'p-ok':r.status==='申报中'?'p-blue':'p-gray')+'">'+esc(r.status)+'</span>';
 if(!r.batch) return h;
 var mm=String(r.batch).slice(0,6), ym=mm.slice(0,4)+'年'+mm.slice(4,6)+'月';
 h+='<br><span class="sb">'+ym+'申报 · '+esc(r.batch)+'</span>';
 var t=[]; if(r.apply_date)t.push(esc(r.apply_date)); if(r.flow_status)t.push(esc(r.flow_status));
 if(t.length)h+='<br><span class="sm">'+t.join(' · ')+'</span>';
 return h}
function facFB(r){return (Number(r.seller_count)===1&&r.factories)?r.factories:''}
/* 抬头条 = 单证/物流，不再重复 PO 和工厂 */
function dhead(r){
 var P=['<b style="color:#0f172a">'+esc(String(r.export_date).slice(0,7))+'月</b>'];
 var bl=r.bl_no||r.mbl_no||r.hbl_no;
 P.push('提单 '+(bl?'<b>'+esc(bl)+'</b>':'<i>未回填</i>'));
 var ctnq=(r.container_qty?r.container_qty+'×'+(r.container_type||'柜'):'');
 P.push('柜号 '+(r.containers?'<b>'+esc(r.containers)+'</b>'+(ctnq?' <i>('+esc(ctnq)+')</i>':''):'<i>—</i>')+
   (r.bl_siblings?' <span class="pill p-warn">本提单与 '+esc(r.bl_siblings)+' 共用柜，勿重复计柜</span>':''));
 P.push('船名航次 '+((r.vessel||r.voyage)?'<b>'+esc([r.vessel,r.voyage].filter(Boolean).join(' / '))+'</b>':'<i>—</i>'));
 if(r.so_no)P.push('SO <b>'+esc(r.so_no)+'</b>');
 P.push('合同号 '+(r.contract_no?'<b>'+esc(r.contract_no)+'</b>':'<i>无</i>'));
 if(r.etd)P.push('ETD <b>'+esc(r.etd)+'</b>');
 if(r.ckts_declarable)P.push('<b style="color:#b45309">✅ 税局标记：可申报</b>');
 if(Number(r.inv_over)>0)P.push('<b style="color:#b91c1c">🔴 价格倒挂：进项票超报关额 '+m(r.inv_over)+'（税局重点稽查）</b>');
 P.push('数据等级 '+(r.data_grade==='ckts'?'<b style="color:#065f46">🏛 税局出口退税联（最高口径）</b>'
   :r.data_grade==='customs'?'<b style="color:#166534">报关单级</b>':(r.data_grade==='template'?'<b style="color:#b45309">模版/预估 — 不可作退税依据</b>':'<i>无逐项</i>')));
 return '<div class="dhd">'+P.map(function(x){return '<span>'+x+'</span>'}).join('')+'</div>'}
/* 归属·开票 单元格：发票号在上，PO/工厂在下 */
function facCell(r,x){
 // 工厂三档证据：①进项票销方(实证) ②货源地→已登记工厂 ③货源地地名(待认)
 if(x.factory){
   // 工厂是「怎么判出来的」，跟「有没有票」是两件事，分开显示
   var src=x.factory_src||'';
   var LAB={'进项票逐行':'发票逐行对上（品名+箱数）','进项票金额':'发票金额对上',
            '订单品名':'按订单品名','订单箱数':'按订单箱数','整票唯一厂':'整票只有这一家'};
   var byInv=(src==='进项票逐行'||src==='进项票金额');
   var tail = byInv ? '' : (x.invoice_no ? ' ｜ 已挂票' : ' ｜ <b style="color:#b91c1c">票未到</b>');
   return '<td><b>'+facHtml(x.factory,x.factory_short)+'</b><br><span class="sm" style="color:'+(byInv?'#166534':'#64748b')+'">'
     + esc(LAB[src]||src||'已判定') + tail + '</span></td>' }
 if(x.region_factory) return '<td>'+esc(x.region_factory)+'<br><span class="sm">货源地 '+esc(x.region_name||x.region)+'</span></td>';
 if(Number(r.seller_count)===1&&r.factories) return '<td>'+esc(r.factories)+'<br><span class="sm">整票唯一销方</span></td>';
 if(x.region) return '<td><span class="pill p-warn">'+esc(x.region_name||x.region)+'</span><br><span class="sm">货源地·工厂待认</span></td>';
 if(r.order_factories) return '<td><span style="color:#94a3b8">'+esc(r.order_factories)+'</span><br><span class="sm">订单·未核实</span></td>';
 return '<td><span class="pill p-bad">无工厂</span></td>'}
function custCell(r){
 var c=r.customer||'';
 return '<td class="ownc">'+(c?esc(c):'<span class="pill p-gray">—</span>')+
   (r.order_nos?'<br><span class="sm">'+esc(r.order_nos)+'</span>':'')+'</td>'}
function invCell(r,x){
 var FB=facFB(r);
 if(x.invoice_no) return '<td class="ownc"><span class="inv">'+esc(x.invoice_no)+'</span></td>';
 if(FB&&r.invoices) return '<td class="ownc"><span class="inv" style="color:#64748b">'+esc(r.invoices)+'</span></td>';
 return '<td class="ownc"><span class="pill p-bad">缺进项票</span><br><span class="sm">'+
   (r.order_nos?esc(r.order_nos)+' · ':'')+esc(x.name||'')+' ¥'+m(x.amt)+'</span></td>'}
function ownCell(r,x){
 var FB=facFB(r), inv, fac;
 if(x.invoice_no){ inv='<span class="inv">'+esc(x.invoice_no)+'</span>' }
 else if(FB&&r.invoices){ inv='<span class="inv" style="color:#64748b">'+esc(r.invoices)+'</span>' }
 else { inv='<span class="pill p-bad">缺进项票</span>' }
 if(!x.factory&&!FB){ inv='<span class="pill p-bad">缺进项票</span>' }
 var ask='<span class="pill p-bad">⛔找不到 · 请补票</span><br><span class="sm">'+
   (r.order_nos?'订单 '+esc(r.order_nos)+' · ':'')+esc(x.name||'')+' ¥'+m(x.amt)+'</span>';
 if(x.factory){ fac='<b>'+esc(x.factory)+'</b>' }
 else if(FB){ fac=esc(FB) }
 else if(r.factories){ fac='<span class="pill p-warn">待分：'+esc(r.factories)+'</span><br>'+ask }
 else if(r.order_factories){ fac='<span class="pill p-gray">'+esc(r.order_factories)+'（订单，未核实）</span><br>'+ask }
 else { fac=ask }
 var po= r.order_nos?esc(r.order_nos):'<span class="pill p-bad">无订单</span>';
 return '<td class="ownc">'+inv+'<br><span class="sm">'+po+' · '+fac+'</span></td>'}

/* ===== 税局申报表格式（对齐电子税务局「出口明细/进货明细」导入模版） =====
   铁律：出口商品代码/美元离岸价/法定单位数量 一律取税局退税联原值（decl_code/usd_fob/legal_*），
        我们自己算不出来的一律显示「⛔待补」，绝不用报关单字段顶替去凑格式。 */
var SB_YM='', SB_PC='002';
function sbYM(){ return SB_YM || (new Date().getFullYear()+String(new Date().getMonth()+1).padStart(2,'0')) }
function gl(n){ return sbYM()+SB_PC+String(n).padStart(8,'0') }   /* 关联号 17 位 */
function nd(v){ return (v==null||v==='')?'<span class="tbd">待补</span>':esc(String(v)) }
function nn(v,d){ return (v==null||v==='')?'<span class="tbd">待补</span>':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}) }

/* 整票体检：把「需要人管的事」算出来。没有事就不该占屏幕。
   Damon 0812：「有问题在显示出来，没问题就不显示或者有需要才看」。 */
function digits2(v){ return String(v==null?'':v).replace(/\D/g,'') }
function lineBad(x){
 if(x.cd_hs==null && x.cd_amt==null && x.cd_qty==null) return null;   /* 我方没录逐项，另算 */
 var b=[];
 if(x.hs&&x.cd_hs){ var a=digits2(x.hs),c=digits2(x.cd_hs);
   if(a!==c && !(a.indexOf(c)===0||c.indexOf(a)===0)) b.push('HS') }
 if(x.cd_qty!=null&&x.cd_unit){
   var q=null;
   if(x.legal_unit&&x.legal_unit===x.cd_unit) q=x.legal_qty;
   else if(x.unit&&x.unit===x.cd_unit)        q=x.qty;
   if(q!=null&&Math.abs(Number(q)-Number(x.cd_qty))>0.01) b.push('数量') }
 if(x.amt!=null&&x.cd_amt!=null){
   var cur=(x.cd_cur||'CNY').toUpperCase();
   if(['CNY','RMB','142','人民币'].indexOf(cur)>=0 && Math.abs(x.amt-x.cd_amt)>1) b.push('金额') }
 if(x.nw!=null&&x.cd_nw!=null&&Math.abs(x.nw-x.cd_nw)>0.5) b.push('净重');
 return b.length?b:[] }
/* 「报关单已核验」徽章：只有真比对过才给。三档，绝不含糊：
   ✅ 税局↔我方逐项全对（最高，有退税联可比）
   🔵 报关单级已锁（逐项工厂已固化、无退税联可比 → 只说"我方数据已固化"，不吹"已核验"）

function verifyBadge(r){

 }

function probs(r){
 var it=r.items||[], P=[];
 var mis=0, misf=[], nodecl=0, noinv=0, nocd=0;
 /* 🩸 0813：cd_* 那几个字段只在【税局退税联】链路里才填。
    data_grade='customs' 的票本身就来自我们自己的报关单，cd_* 恒为 null，
    原来会误报「我方报关单缺 N 行逐项」（958349 实测）。只有能跟税局对比的票才谈这个。 */
 var canCompare = (r.data_grade === 'ckts');
 it.forEach(function(x){
  var b=lineBad(x);
  if(b===null){ if(canCompare) nocd++ }
  else if(b.length){ mis++; misf=misf.concat(b) }
  if(!x.decl_code) nodecl++;
  if(!x.invoice_no) noinv++;
 });
 if(mis)    P.push({k:'red', t:'税局↔海关 '+mis+' 行对不上（'+[...new Set(misf)].join('/')+'）'});
 if(nocd)   P.push({k:'amber',t:'我方报关单缺 '+nocd+' 行逐项'});
 if(r.real_rebate==null) P.push({k:'red', t:'进项票未齐，实退算不出'});
 else if(noinv) P.push({k:'amber',t:noinv+' 行没挂到进项票'});
 /* ⛔ 不进 P：这是我们这边退税联没拉到（隧道断），不是 Damon 要处理的事。
       0812 Damon 指出：票齐了就算结束，别拿我的抓数缺口占他的待办。
       改成静音提示，只在展开时显示。 */
 if(r.inv_over) P.push({k:'red', t:'🔴 进项超报关额 '+m(r.inv_over)});
 if(r.bad_lines) P.push({k:'red', t:r.bad_lines+' 行缺 HS，整票应退算不出'});
 return P }

/* 税局（出口退税联）↔ 我方报关单 逐项对。
   两边都是权威源，正常应该一模一样；不一样就是有一边错了，必须看见。

   ⚠️ 0812 踩的坑：一开始拿税局的【成交数量/单位】（箱 2,800）去比我方的【法定数量/单位】
   （千克 45,120），比出一堆假差异。税局一行同时有成交(qty/unit)和法定(legal_qty/legal_unit)
   两套，必须先按单位配对，配得上才比数；两套单位都配不上才算真的单位不符。
   HS 也一样：税局给 1404909090、我们库里存 1404.90.9000，只是写法不同 → 只比数字。

   容差：金额 ±1 元（退税联分位四舍五入）、净重 ±0.5kg；HS/数量/单位配上后必须完全相同。 */
function digits(v){ return String(v==null?'':v).replace(/\D/g,'') }
function cmpCell(x){
 if(x.cd_hs==null && x.cd_amt==null && x.cd_qty==null)
   return '<td class="ex sm"><span class="pill p-warn">我方报关单无此项</span></td>';
 var bad=[], note=[], okn=0;
 /* HS：只比数字；税局有时给8位、我们库里存10位 → 前缀相同就算一致，只做提示 */
 if(x.hs&&x.cd_hs){ var a=digits(x.hs), b=digits(x.cd_hs);
   if(a===b) okn++;
   else if(a&&b&&(a.indexOf(b)===0||b.indexOf(a)===0)){ okn++; note.push('HS 位数不同 '+a+'/'+b) }
   else bad.push('HS 税局'+x.hs+' / 我方'+x.cd_hs) }
 /* 数量：先按单位配对（税局一行有成交和法定两套），配不上就不比，不算错 */
 if(x.cd_qty!=null&&x.cd_unit){
   var pair=null;
   if(x.legal_unit&&x.legal_unit===x.cd_unit) pair={q:x.legal_qty,tag:'法定'};
   else if(x.unit&&x.unit===x.cd_unit)        pair={q:x.qty,tag:'成交'};
   if(pair){ if(pair.q!=null&&Math.abs(Number(pair.q)-Number(x.cd_qty))>0.01)
       bad.push(pair.tag+'数量 '+m(pair.q)+' / '+m(x.cd_qty)+' '+x.cd_unit); else okn++ }
   else note.push('数量口径不同 税局'+(x.legal_unit||x.unit||'?')+' / 我方'+x.cd_unit+'，未比');
 }
 /* 金额：税局给的是人民币。我方那行如果记的是外币（358365 存的是 USD 13,824），
    直接比会假报差 ¥86,814 —— 0812 我就这么误报过。币制不是 CNY 就改比美元离岸价。 */
 if(x.amt!=null&&x.cd_amt!=null){
   var cur=(x.cd_cur||'CNY').toUpperCase(), isCny=(cur==='CNY'||cur==='RMB'||cur==='142'||cur==='人民币');
   if(isCny){ if(Math.abs(x.amt-x.cd_amt)>1) bad.push('金额 '+m(x.amt)+' / '+m(x.cd_amt)); else okn++ }
   else if(x.usd_fob!=null&&x.cd_amt!=null&&(cur==='USD'||cur==='502'||cur==='美元')){
     if(Math.abs(x.usd_fob-x.cd_amt)>1) bad.push('美元离岸价 '+m(x.usd_fob)+' / '+m(x.cd_amt)); else okn++ }
   else note.push('币制 '+cur+'，金额未比');
 }
 if(x.nw!=null&&x.cd_nw!=null){ if(Math.abs(x.nw-x.cd_nw)>0.5) bad.push('净重 '+m(x.nw)+' / '+m(x.cd_nw)); else okn++ }
 var tail = note.length ? '<br><span style="color:#94a3b8">'+note.map(esc).join('<br>')+'</span>' : '';
 if(!bad.length) return '<td class="ex sm" title="HS·数量·金额·净重 '+okn+' 项全对"><span style="color:#16a34a">✓</span>'+
   (note.length?tail:'')+'</td>';
 return '<td class="ex sm" style="background:#fff1f2"><b style="color:#b91c1c">⚠ '+bad.length+' 处不符</b><br>'+
   bad.map(function(t){return '<span style="color:#b91c1c">'+esc(t)+'</span>'}).join('<br>')+tail+'</td>' }

/* 上传进项票 —— 直接复用协同页那条链路（Damon 定过：复用 customs-collab，不重造）：

   后端会 OCR 识别 → 跟应开金额比对（超额/不足/卖方不符都会标出来）→ 存 OSS → 落 finance_invoices_in。

function upBtns(r){
 /* 只给【这票还欠票的工厂】出上传按钮。
    0812 Damon：171960 上中砂的票早挂上了，还弹「传中砂的票」= 噪音。

 var owe={};
 (r.items||[]).forEach(function(x){ if(!x.invoice_no && x.factory) owe[x.factory]=1 });

  var facHasInv={}; its.forEach(function(x){ if(x.invoice_no && x.factory) facHasInv[x.factory]=1 });

 H+='</tbody><tfoot><tr><td>合计</td><td class="r">'+T.ok+'</td><td class="r">—</td><td class="r">—</td>'+
  '<td class="r">'+T.wait+'</td><td class="r">'+T.no+'</td><td class="r">'+m(T.noamt)+'</td>'+

function draw(){
 var v=document.getElementById('view').value,kw=document.getElementById('kw').value.trim();
 var rows=DATA.filter(function(r){return pass(r,v,kw)});
 /* 同一提单的报关单必须整组出现：只要组里有一张进了筛选，兄弟单一起带出来。
    Damon 0812：「一份BL——多张报关单都要一起。记得！」
    否则「只看有问题的票」会把已齐的兄弟单藏掉，看不出这票其实要跟谁一起报。
    ⚠️ 已封存月份（3月前全退完）不往回捞，那批不该出现在待办里。 */
 (function(){
  var inSet={}; rows.forEach(function(r){inSet[r.customs_no]=1});
  var bls={}; rows.forEach(function(r){var b=blKey(r); if(b) bls[b]=1});
  var add=DATA.filter(function(r){
    return !inSet[r.customs_no] && blKey(r) && bls[blKey(r)] && !isClosed(r) });
  if(add.length){ add.forEach(function(r){r._sib=1}); rows=rows.concat(add);
    rows.sort(function(a,b){ return String(b.export_date).localeCompare(String(a.export_date))
      || String(a.customs_no).localeCompare(String(b.customs_no)) }) }
 })();
 document.getElementById('th').innerHTML='<tr>'+COLS.map(function(c){return '<th>'+c+'</th>'}).join('')+'</tr>';
 var byM={},order=[];
 rows.forEach(function(r){var k=String(r.export_date).slice(0,7);
  if(!byM[k]){byM[k]=[];order.push(k)} byM[k].push(r)});
 var H='';
 order.forEach(function(k,mi){
  /* 折叠单位是「提单组」不是单票：组里只要有一张没料齐，整组都留在上面，
     不能把兄弟单折到「已料齐」里去 —— 那样就又看不见它们要一起报了。 */
  var g=byM[k], gs=groupByBL(g);
  var openG=gs.filter(function(x){return x.rows.some(function(r){return !isDone(r)})});
  var doneG=gs.filter(function(x){return x.rows.every(isDone)});
  var open=openG.reduce(function(a,x){return a.concat(x.rows)},[]);
  var done=doneG.reduce(function(a,x){return a.concat(x.rows)},[]);
  var fob=g.reduce(function(a,r){return a+(r.fob_cny||0)},0);
  var reb=g.filter(function(r){return (r.data_grade==='ckts'||r.data_grade==='customs')&&r.est_rebate!=null})
           .reduce(function(a,r){return a+Number(r.est_rebate)},0);
  var dreb=done.reduce(function(a,r){return a+(Number(r.rebate_expected)||0)},0);
  var bs={}; done.forEach(function(r){if(r.batch)bs[r.batch]=1});
  var closed = k < CLOSED_BEFORE;
  H+='<tr class="mon'+(closed?' cl':'')+'" onclick="togMon('+mi+')"><td colspan="10">'+
     '<span class="lab"><span class="arw" id="ma'+mi+'">'+(closed?'▸':'▾')+'</span> '+k.slice(0,4)+'年'+k.slice(5,7)+'月'+
     (closed?' <span class="pill p-ok">已完结·全部退税</span>':'')+'</span>'+
     '<span class="s">'+g.length+' 票 · 报关额 '+m(fob)+' · 可信应退 <span class="g">'+m(reb)+'</span>'+
     (done.length?' · 已申报 '+done.length+' 票（'+m(dreb)+'）'+(Object.keys(bs).length?' 批次 '+Object.keys(bs).sort().join('、'):''):'')+
     '</span></td></tr>';
  H+='<tbody class="mb" id="mb'+mi+'"'+(closed?' style="display:none"':'')+'>';
  openG.forEach(function(gg,gi){ H+=blHead(gg,gi);
    var multi=gg.rows.length>1;
    gg.rows.forEach(function(r,i){H+=rowHtml(r, isDone(r) && !multi, multi?{i:i+1,n:gg.rows.length}:null)});
    H+=blFoot(gg) });
  if(done.length){
   H+='<tr class="fold" onclick="togDone('+mi+')"><td colspan="10"><span id="da'+mi+'">▸</span> '+
      '已申报/已退税 <b>'+done.length+' 票</b> · 应退 <b>'+m(dreb)+'</b>'+
      (Object.keys(bs).length?' · 批次 '+Object.keys(bs).sort().join('、'):'')+' —— 点击展开</td></tr>';
   doneG.forEach(function(gg,gi){ H+=blHead(gg,'d'+gi);
     var multi=gg.rows.length>1;
     gg.rows.forEach(function(r,i){H+=rowHtml(r,true, multi?{i:i+1,n:gg.rows.length}:null)});
     H+=blFoot(gg) });
  }
  H+='</tbody>';
 });
 /* 🩸 tbody 不能嵌套：H 里每个月是一个 <tbody class="mb">，外面再套一层 <tbody id="tb">，
    浏览器解析时会把内层提出来变成兄弟节点。第二次 draw() 只换掉已经空了的 #tb，
    上一轮的月份 tbody 全留在表里 → 一改筛选行数就翻倍（61 票渲染出 81 行）。
    所以重画前必须先把上一轮遗留的 tbody.mb 清掉。 */
 (function(){ var tb=document.getElementById('tb'), tbl=tb.closest('table');
   if(tbl) tbl.querySelectorAll('tbody.mb').forEach(function(x){x.remove()});
   tb.outerHTML='<tbody id="tb">'+H+'</tbody>' })();
 var fob=rows.reduce(function(a,r){return a+(r.fob_cny||0)},0);
 var C=rows.filter(function(r){return (r.data_grade==='ckts'||r.data_grade==='customs')&&r.est_rebate!=null});
 var T=rows.filter(function(r){return r.data_grade==='template'&&r.est_rebate!=null});
 var reb=C.reduce(function(a,r){return a+Number(r.est_rebate)},0);
 var rebT=T.reduce(function(a,r){return a+Number(r.est_rebate)},0);
 var R=rows.filter(function(r){return r.real_rebate!=null});
 var real=R.reduce(function(a,r){return a+Number(r.real_rebate)},0);
 document.getElementById('tf').innerHTML='<tr class="sumrow"><td colspan="6">合计 '+rows.length+' 票 · <b>报关单级 '+C.length+' 票</b>'+
  ' · 进项票已齐 '+R.length+' 票'+
  (T.length?' · 模版级 '+T.length+' 票（¥'+m(rebT)+' 仅参考，不计入）':'')+'</td><td class="n">'+m(fob)+
  '</td><td class="n"><b style="color:#166534">'+m(real)+'</b><br><span class="sm" style="color:#94a3b8">估 '+m(reb)+'</span></td><td colspan="2"></td></tr>';
 var CARDS=[['当前票数',rows.length],
  ['实退合计（进项票已齐 '+R.length+' 票）','¥'+m(real)],
  ['报关额估上限（'+C.length+' 票）','¥'+m(reb)],
  ['进项票未齐',(C.length-R.length)+' 票'],
  ['🏛税局可申报',DATA.filter(function(r){return r.ckts_declarable}).length+' 票'],
  ['⚠️模版级',DATA.filter(function(r){return !isClosed(r)&&r.data_grade==='template'}).length+' 票'],
  ['缺报关逐项',DATA.filter(function(r){return !isClosed(r)&&!r.item_count}).length+' 票'],
  ['缺HS',DATA.filter(function(r){return !isClosed(r)&&r.bad_lines>0}).length+' 票'],
  ['缺进项票',DATA.filter(function(r){return !isClosed(r)&&!r.invoices}).length+' 票'],
  ['无订单',DATA.filter(function(r){return !isClosed(r)&&!r.order_nos}).length+' 票']];
 document.getElementById('cards').innerHTML=CARDS.map(function(c){return '<div class="card"><div class="k">'+c[0]+'</div><div class="v">'+c[1]+'</div></div>'}).join('')}

function num(x){var v=Number(x);return isFinite(v)?v:null}
function normalize(rows){
 rows.forEach(function(r){
  r.item_count=parseInt(r.item_count||0,10); r.bad_lines=parseInt(r.bad_lines||0,10);
  r.fob_cny=num(r.fob_cny)||0; r.est_rebate=(r.est_rebate==null?null:num(r.est_rebate));
  (r.items||[]).forEach(function(x){['amt','rate','line_rebate','nw','qty'].forEach(function(k){
   if(x[k]!=null)x[k]=num(x[k])})})});
 return rows}
async function reload(){
 var boot=document.getElementById('boot');
 boot.style.display='';boot.textContent='Loading…';document.getElementById('grid').style.display='none';
 try{
  var t=SanlynTable.token();
  var url='/api/db/tax-rebate-master?from='+encodeURIComponent(document.getElementById('from').value||'2026-01-01');
  var res=await fetch(url,{headers:t?{Authorization:'Bearer '+t}:{}});
  if(res.status===401){boot.innerHTML='<div class="loginbox">需要登录。请先在 <a href="/data">/data</a> 登录后再打开本页。</div>';return}
  var d=await res.json();
  if(!d.success)throw new Error(d.error||'接口错误');
  DATA=normalize(d.data||[]); fillFilters();
  boot.style.display='none';document.getElementById('grid').style.display='';
  document.getElementById('stamp').textContent=new Date().toLocaleString('zh-CN')+' · '+DATA.length+' 票';
  draw();
 }catch(e){
  /* 0812 踩过：draw() 抛错时 boot 已经 display:none，错误提示写进去也看不见 → 整页白。
     出错必须把 boot 重新显示出来，并且把 grid 藏掉。 */
  boot.style.display=''; document.getElementById('grid').style.display='none';
  boot.innerHTML='<div class="loginbox" style="color:#b91c1c">加载失败：'+SanlynTable.esc(e.message)+
    '<br><span class="sm">'+SanlynTable.esc(String(e.stack||'').split('\n').slice(0,3).join(' / '))+'</span></div>';
  console.error(e) }}
