<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>产品对账 · 巴匕</title>
<link rel="stylesheet" href="/public/sanlyn-table.css">
<style>.hl{background:#fef9c3}.st{cursor:pointer;font-weight:700}.st-ok{color:#15803d}.st-warn{color:#b45309}.st-bad{color:#b91c1c}.st-na{color:#6b7280}</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="title">产品对账 <span class="meta">巴匕 · 货款账</span></div><div class="meta">v2026.08.12-1 · <span id="stamp"></span></div></div></div>
  <div class="bar">
    <select id="company" style="height:32px;border:1px solid #d1d5db;border-radius:6px;min-width:260px"><option value="CN-00040">CN-00040</option></select>
    <input id="year" value="2026" placeholder="年份">
        <select id="factory" style="height:32px;border:1px solid #d1d5db;border-radius:6px;min-width:180px"><option value="">全部工厂</option></select>
    <select id="terms" style="height:32px;border:1px solid #d1d5db;border-radius:6px"><option value="">全部条款</option></select>
    <label style="display:flex;align-items:center;gap:4px;font-size:13px"><input type="checkbox" id="gaponly">只看缺口</label>
<button class="btn" id="reload">刷新</button>
    <button class="btn" id="exportBtn">导出Excel</button>
  </div>
  <div id="msg"></div><div class="panel" id="app"><div class="hint">Loading...</div></div>
</div>
<script src="/public/sanlyn-table.js"></script>
<script>
var LEDGER="product", ST=["未核","待补资料","已对平","需人工确认"], STC={"未核":"st-na","待补资料":"st-warn","已对平":"st-ok","需人工确认":"st-bad"};
function tkey(r){return r.bl_no||r.po_nos||""}
function foldTxt(v,sep){var p=String(v||"").split(sep).filter(Boolean);if(p.length<=1)return SanlynTable.esc(p[0]||"—");
  return '<span class="po-head">'+SanlynTable.esc(p[0].slice(0,12))+' <b class="po-more">+'+(p.length-1)+'</b></span><span class="po-full">'+SanlynTable.esc(p.join(" / "))+'</span>'}
function docsCell(r,h){var t=h.token(),bl=r.bl_no||"",docs=r.docs||[],links=[];
  var pos=(r.orders||[]).map(function(o){return o.po}).filter(Boolean);
  if(pos.length)links.push('<a target="_blank" href="/templates/export-docs-template.html?order_no='+encodeURIComponent(pos[0])+'&ids='+encodeURIComponent(pos.join(","))+'&mode=detail&token='+encodeURIComponent(t)+'">客户资料合并版(PL+SC+IV)</a>');
  if(bl){links=links.concat(docs.map(function(d){return '<a target="_blank" href="/api/db/shipping-plan-pdf?bl='+encodeURIComponent(bl)+'&type='+encodeURIComponent(d.doc_type)+'&token='+encodeURIComponent(t)+'">'+h.esc(d.doc_no)+'</a>'}));
    links.push('<a target="_blank" href="/api/db/shipping-plan-pdf?bl='+encodeURIComponent(bl)+'&type=fob_invoice&token='+encodeURIComponent(t)+'">海运费单</a>')}
  return links.length?'<span class="po-head">📎'+links.length+'</span><span class="po-full">'+links.join("<br>")+'</span>':'—'}
function stCell(r,h){var s=r.product_status||"未核";
  return '<span class="st '+STC[s]+'" onclick="setSt(\''+h.esc(tkey(r)).replace(/'/g,"")+'\')">'+h.esc(s)+'</span>'}
window.setSt=async function(key){
  var pick=prompt("状态: 1=未核 2=待补资料 3=已对平 4=需人工确认","3");if(pick===null)return;
  var s=ST[Number(pick)-1];if(!s){alert("输入1-4");return}
  var note=s==="需人工确认"?(prompt("备注(可空)")||""):"";
  try{var r=await fetch("/api/db/recon-confirm",{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:"Bearer "+SanlynTable.token()},body:JSON.stringify({ticket_key:key,ledger:LEDGER,status:s,note:note})});
    var j=await r.json();if(!r.ok||!j.success)throw new Error(j.error||r.statusText);table.load()}
  catch(e){alert("保存失败: "+e.message)}};
var table=SanlynTable.mount(document.getElementById("app"),{
  filter:function(r){return (Number(r.goods_cost||0)||Number(r.goods_sale||0)||Number(r.declared_amount||0)||Number(r.received_cny||0))&&baseFilter(r)},
  api:"/api/db/recon-master",params:function(){return {company:company.value,year:year.value}},
  exportUrl:"/api/db/recon-export",loginApi:"/api/db/auth-login",
  sumKeys:["goods_cost","goods_sale","declared_amount","received_cny"],
  columns:[
    {key:"etd",label:"日期",render:function(r,h){return h.esc(String(r.etd||"").slice(0,10))}},
    {key:"factory",label:"工厂",fold:true,render:function(r,h){return foldTxt(r.factory," / ")+(r.external_src?' <b title="外单(内部标记)" style="color:#b45309">·外</b>':"")}},
    {key:"customer",label:"客户",render:function(r,h){return h.esc(String(r.customer||"—").slice(0,16))}},
    {key:"po_nos",label:"PO号",type:"fold",sep:"+",show:3},
    {key:"bl_no",label:"BL",gap:"缺BL"},
    {key:"goods_cost",label:"工厂成本CNY",type:"num",gap:"缺成本"},
    {key:"goods_sale",label:"客户售价CNY",type:"num",gap:"缺销售"},
    {key:"declared_amount",label:"报关额",type:"num",gap:"缺报关"},
    {key:"received_cny",label:"已回款CNY",type:"num"},
    {key:"diff",label:"回款差额",render:function(r,h){var d=Number(r.received_cny||0)-Number(r.goods_sale||0);
      if(!Number(r.goods_sale||0)&&!Number(r.received_cny||0))return '<span class="st-na">—</span>';
      var cls=Math.abs(d)<1?"st-ok":(d<0?"st-bad":"st-warn");return '<span class="'+cls+'">'+h.money(d)+'</span>'}},
    {key:"docs",label:"文件",fold:true,render:docsCell},
    {key:"product_status",label:"状态",render:stCell},
    {key:"jump",label:"↗",render:function(r,h){return r.bl_no?'<a href="/public/recon-freight.html?bl='+encodeURIComponent(r.bl_no)+'">海运账</a>':""}}
  ]});
SanlynTable.companySelect(document.getElementById("company"),"CN-00040").then(function(){});
company.onchange=function(){table.load()};
reload.onclick=function(){table.load()};
function baseFilter(r){
  var f=document.getElementById("factory").value, t=document.getElementById("terms").value, g=document.getElementById("gaponly").checked;
  if(f&&String(r.factory||"").indexOf(f)<0)return false;
  if(t&&String(r.trade_terms||"")!==t)return false;
  if(g&&!(r.gap_flags||[]).length)return false;
  return true;}
function fillOpts(){var fs={},ts={};table.rows.forEach(function(r){
    String(r.factory||"").split(" / ").filter(Boolean).forEach(function(x){fs[x]=1});
    if(r.trade_terms)ts[r.trade_terms]=1});
  var F=document.getElementById("factory"),T=document.getElementById("terms");
  var fv=F.value,tv=T.value;
  F.innerHTML='<option value="">全部工厂</option>'+Object.keys(fs).sort().map(function(x){return '<option'+(x===fv?" selected":"")+'>'+SanlynTable.esc(x)+'</option>'}).join("");
  T.innerHTML='<option value="">全部条款</option>'+Object.keys(ts).sort().map(function(x){return '<option'+(x===tv?" selected":"")+'>'+SanlynTable.esc(x)+'</option>'}).join("");}
["factory","terms","gaponly"].forEach(function(id){document.getElementById(id).onchange=function(){table.render()}});
setInterval(function(){if(table.rows.length&&!document.getElementById("factory").dataset.f){document.getElementById("factory").dataset.f=1;fillOpts()}},400);
var _oldReload=reload.onclick;reload.onclick=function(){document.getElementById("factory").dataset.f="";_oldReload();setTimeout(fillOpts,1500)};
exportBtn.onclick=function(){table.exportExcel("recon-product-"+(company.value||"all")+".xlsx")};
var hlBl=new URLSearchParams(location.search).get("bl");
if(hlBl){var n=0,iv=setInterval(function(){n++;var trs=document.querySelectorAll("table.tbl tr");
  if(trs.length>1||n>40){clearInterval(iv);trs.forEach(function(tr){if(tr.textContent.indexOf(hlBl)>=0){tr.classList.add("hl");tr.scrollIntoView({block:"center"})}})}},250)}
</script>
</body>
</html>
