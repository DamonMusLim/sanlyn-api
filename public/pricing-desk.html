<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Damon 报价中心</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#171b22;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.app{height:100vh;display:grid;grid-template-rows:52px 1fr}.top{background:#1d222a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #10141a}.brand{font-weight:900;font-size:16px}.user{display:flex;gap:8px;align-items:center;color:#c6ced8}.btn{border:1px solid #cbd3dd;background:#fff;color:#202631;border-radius:7px;padding:8px 12px;font-weight:800;cursor:pointer}.btn.primary{background:#0f766e;border-color:#0f766e;color:#fff}.btn.danger{background:#fff;border-color:#e3b7b7;color:#a73434}.btn:disabled{opacity:.55;cursor:not-allowed}.grid{display:grid;grid-template-columns:minmax(650px,1fr) 390px;gap:14px;padding:14px;min-height:0}.pane{background:#fff;border:1px solid #d9e0e8;border-radius:8px;min-height:0;overflow:hidden}.left{display:grid;grid-template-rows:auto 1fr}.toolbar{padding:12px;border-bottom:1px solid #e3e8ef;display:flex;gap:10px;align-items:center}.search{flex:1;border:1px solid #cbd3dd;border-radius:7px;padding:9px 10px}.routes{overflow:auto}.lane{border-bottom:1px solid #e7ebf1}.lane-h{padding:12px 14px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}.lane-h.active{background:#e8f4f2}.route{font-weight:900}.meta{color:#697382;font-size:12px}.quote-table{width:100%;border-collapse:collapse}.quote-table th,.quote-table td{padding:8px 10px;border-top:1px solid #eef2f6;text-align:left;white-space:nowrap}.quote-table th{font-size:11px;color:#6c7582;background:#fafbfc}.old{display:none}.lane.show-old .old{display:table-row}.price{font-weight:900}.side{display:grid;grid-template-rows:auto 1fr;gap:14px;min-height:0}.card{padding:14px}.card h2{font-size:14px;margin:0 0 10px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:11px;font-weight:800;color:#697382;margin-bottom:4px}.field input{width:100%;border:1px solid #cbd3dd;border-radius:7px;padding:9px}.hint{margin-top:10px;padding:9px;border-radius:7px;background:#f4f7fa;color:#596370}.warn{background:#fff3dc;color:#8a5a00}.active-list{overflow:auto}.sale{padding:12px 14px;border-top:1px solid #eef2f6;display:grid;grid-template-columns:1fr auto;gap:10px}.login{max-width:360px;margin:90px auto;background:#fff;border:1px solid #d9e0e8;border-radius:8px;padding:20px}.login h1{font-size:17px;margin:0 0 14px}.login input{width:100%;border:1px solid #cbd3dd;border-radius:7px;padding:10px;margin-bottom:10px}.empty{padding:18px;color:#798392}.tag{display:inline-block;border-radius:999px;background:#edf2f7;color:#596474;font-weight:800;font-size:11px;padding:3px 7px}@media(max-width:980px){.app{height:auto}.grid{grid-template-columns:1fr}.side{grid-template-rows:auto auto}.quote-table{font-size:12px}.quote-table th,.quote-table td{padding:7px 6px}.top{padding:0 12px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const API="/api/db/pricing-desk";let token=localStorage.getItem("pd_token")||"",state={lanes:[],sel:null,q:""};
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const money=v=>v==null||v===""?"-":"USD "+Number(v).toLocaleString();
function api(path,opt={}){return fetch(API+path,{...opt,headers:{"Content-Type":"application/json",Authorization:"Bearer "+token,...(opt.headers||{})}}).then(r=>r.json().then(j=>{if(!r.ok||j.ok===false)throw new Error(j.error||r.statusText);return j}))}
function loginView(){root.innerHTML=`<div class="login"><h1>Damon 报价中心</h1><input id="u" placeholder="账号"><input id="p" type="password" placeholder="密码"><button class="btn primary" style="width:100%" onclick="login()">登录</button><div id="err" class="meta" style="margin-top:10px"></div></div>`}
async function login(){try{const r=await fetch("/api/db/auth-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("#u").value,password:$("#p").value})});const j=await r.json();if(!r.ok)throw new Error(j.error||"登录失败");if(!["admin","finance"].includes(String(j.user&&j.user.role||"").toLowerCase()))throw new Error("只允许 admin/finance");token=j.token;localStorage.setItem("pd_token",token);await load()}catch(e){$("#err").textContent=e.message}}
function appView(){root.innerHTML=`<div class="app"><div class="top"><div class="brand">Damon 报价中心</div><div class="user"><span>内部定价台</span><button class="btn" onclick="logout()">退出</button></div></div><div class="grid"><div class="pane left"><div class="toolbar"><input class="search" id="q" placeholder="搜索 起运港 / 目的港 / 船司" value="${esc(state.q)}" oninput="state.q=this.value;render()"><button class="btn" onclick="load()">刷新</button></div><div class="routes" id="lanes"></div></div><div class="side"><div class="pane card" id="pricing"></div><div class="pane active-list" id="active"></div></div></div></div>`;render()}
function logout(){localStorage.removeItem("pd_token");token="";loginView()}
async function load(){try{const j=await api("/quotes");state.lanes=j.lanes||[];state.sel=state.sel||state.lanes[0]?.key;appView()}catch(e){localStorage.removeItem("pd_token");token="";loginView();setTimeout(()=>{const er=$("#err");if(er)er.textContent=e.message},0)}}
function filtered(){const q=state.q.trim().toLowerCase();return !q?state.lanes:state.lanes.filter(l=>(l.key+" "+l.quotes.map(x=>x.carrier+" "+x.forwarder).join(" ")).toLowerCase().includes(q))}
function render(){const list=filtered();if(!state.sel&&list[0])state.sel=list[0].key;$("#lanes").innerHTML=list.length?list.map(l=>laneHtml(l)).join(""):`<div class="empty">没有报价</div>`;renderSide()}
function laneHtml(l){const fresh=l.quotes.filter(q=>!q.old).length,old=l.quotes.length-fresh;return `<div class="lane" id="lane-${esc(l.key)}"><div class="lane-h ${state.sel===l.key?"active":""}" onclick="state.sel='${esc(l.key)}';render()"><div><div class="route">${esc(l.pol)} → ${esc(l.pod)}</div><div class="meta">近30天 ${fresh} 条，旧价 ${old} 条，在售 ${l.active.length} 条</div></div><span class="tag">${money(l.suggestion.hq40)}</span></div>${state.sel===l.key?quotesHtml(l):""}</div>`}
function quotesHtml(l){const rows=l.quotes.map(q=>`<tr class="${q.old?"old":""}"><td>${esc(q.forwarder||q.supplier_id||"-")}</td><td>${esc(q.carrier||"-")}</td><td class="price">${money(q.gp20)}</td><td class="price">${money(q.hq40)}</td><td>${esc(q.sail_date||"-")}</td><td>${esc([q.free_days_base,q.free_days_ext].filter(x=>x!=null&&x!=="").join("+")||"-")}</td><td>${esc(q.remarks||"")}</td><td>${q.age_days==null?"-":q.age_days+"天"}</td><td><button class="btn" onclick="fillFrom(${q.id})">定价</button></td></tr>`).join("");return `<table class="quote-table"><thead><tr><th>货代</th><th>船司</th><th>20GP进价</th><th>40HQ进价</th><th>ETD</th><th>免箱</th><th>条款</th><th>价龄</th><th></th></tr></thead><tbody>${rows}</tbody></table>${l.quotes.some(q=>q.old)?`<div style="padding:8px 10px"><button class="btn" onclick="event.stopPropagation();this.closest('.lane').classList.toggle('show-old')">展开/折叠30天前</button></div>`:""}`}
function selected(){return state.lanes.find(l=>l.key===state.sel)}
function renderSide(){const l=selected();if(!l){$("#pricing").innerHTML=`<div class="empty">请选择航线</div>`;$("#active").innerHTML="";return}const s=l.suggestion;const warn=s.gp20_samples<3||s.hq40_samples<3;$("#pricing").innerHTML=`<h2>${esc(l.pol)} → ${esc(l.pod)} 定价卡</h2><div class="hint ${warn?"warn":""}">建议价：20GP ${money(s.gp20)}（${s.gp20_samples}样本） / 40HQ ${money(s.hq40)}（${s.hq40_samples}样本）</div><div id="risk" class="hint" style="display:none"></div><div class="form" style="margin-top:10px"><div class="field"><label>船司</label><input id="carrier" value="${esc(l.active[0]?.carrier||l.quotes[0]?.carrier||"")}"></div><div class="field"><label>成本行ID，可空</label><input id="rateId" oninput="markRisk()" value=""></div><div class="field"><label>20GP卖价</label><input id="gp20" type="number" oninput="markRisk()" value="${esc(s.gp20||"")}"></div><div class="field"><label>40HQ卖价</label><input id="hq40" type="number" oninput="markRisk()" value="${esc(s.hq40||"")}"></div></div><button class="btn primary" style="margin-top:10px;width:100%" onclick="publish()">上架</button><div id="msg" class="meta" style="margin-top:8px"></div>`;$("#active").innerHTML=`<div class="card"><h2>在售牌</h2></div>`+(l.active.length?l.active.map(saleHtml).join(""):`<div class="empty">当前航线暂无在售价</div>`);markRisk()}
function fillFrom(id){const l=selected(),q=l.quotes.find(x=>x.id===id);$("#rateId").value=id;$("#carrier").value=q.carrier||"";$("#gp20").value=l.suggestion.gp20||"";$("#hq40").value=l.suggestion.hq40||"";window.scrollTo({top:0,behavior:"smooth"})}
function saleHtml(r){return `<div class="sale"><div><div class="route">${esc(r.carrier||"-")}</div><div class="meta">20GP ${money(r.customer_gp20)} · 40HQ ${money(r.customer_hq40)} · ${esc(r.valid_from||"-")}</div></div><div><button class="btn" onclick="editSale(${r.id})">改价</button> <button class="btn danger" onclick="unpublish(${r.id})">下架</button></div></div>`}
function editSale(id){const l=selected(),r=l.active.find(x=>x.id===id);$("#rateId").value=r.id;$("#carrier").value=r.carrier||"";$("#gp20").value=r.customer_gp20||"";$("#hq40").value=r.customer_hq40||""}
function markRisk(){const l=selected(),q=l&&l.quotes.find(x=>String(x.id)===String($("#rateId")?.value||"")),risk=$("#risk");if(!risk)return;const gp=Number($("#gp20").value),hq=Number($("#hq40").value),bad=[];if(q&&Number.isFinite(gp)&&q.gp20&&gp<=q.gp20)bad.push("20GP零毛利");if(q&&Number.isFinite(hq)&&q.hq40&&hq<=q.hq40)bad.push("40HQ零毛利");risk.style.display=bad.length?"block":"none";risk.className="hint warn";risk.textContent=bad.join(" / ")}
async function publish(){const l=selected(),body={rate_id:$("#rateId").value||undefined,pol:l.pol,pod:l.pod,carrier:$("#carrier").value,customer_gp20:$("#gp20").value,customer_hq40:$("#hq40").value};try{await api("/publish",{method:"POST",body:JSON.stringify(body)});$("#msg").textContent="已上架";state.sel=l.key;await load()}catch(e){$("#msg").textContent=e.message}}
async function unpublish(id){if(!confirm("确认下架这条牌价？"))return;await api("/unpublish",{method:"POST",body:JSON.stringify({rate_id:id})});await load()}
token?load():loginView();
</script>
</body>
</html>
