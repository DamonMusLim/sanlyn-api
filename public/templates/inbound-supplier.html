<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>供应商来料填报 · Sanlyn</title>
<style>
:root{--bg:#f7f8fb;--panel:#fff;--line:#d9e0ea;--text:#172033;--muted:#64748b;--blue:#2563eb;--green:#15803d;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px}
.topbar{height:60px;display:flex;align-items:center;gap:12px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.mark{width:34px;height:34px;border-radius:8px;background:#ecfdf3;color:#067647;display:grid;place-items:center;font-weight:900}.title{font-size:16px;font-weight:900}.sub{font-size:11px;color:var(--muted);margin-top:2px}.pill{border:1px solid #bbf7d0;background:#f0fdf4;color:#166534;border-radius:999px;padding:4px 9px;font-size:11px;white-space:nowrap}
.main{max-width:1280px;margin:auto;padding:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}.section-title{font-weight:900;margin-bottom:10px}.toolbar{display:grid;grid-template-columns:1fr 150px 120px;gap:10px}.input,.select{width:100%;border:1px solid #cbd5e1;border-radius:7px;background:#fff;color:var(--text);padding:8px 9px;outline:none}.input:focus,.select:focus{border-color:#38bdf8}
.btn{border:1px solid #cbd5e1;border-radius:7px;background:#fff;color:#172033;padding:8px 11px;cursor:pointer;font-weight:900}.btn:disabled{opacity:.55;cursor:not-allowed}.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn-sm{padding:6px 9px;font-size:12px}
.table-wrap{overflow:auto}table{width:100%;min-width:1040px;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:middle}th{font-size:11px;color:var(--muted);background:#f8fafc}td{font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.muted{color:var(--muted)}.num{width:120px}.date{width:150px}.empty{text-align:center;color:var(--muted);padding:28px}.toast{position:fixed;right:16px;bottom:16px;background:#111827;color:#fff;border-radius:8px;padding:10px 12px;display:none;max-width:360px;z-index:9}.actions{display:flex;gap:7px;align-items:center}.status{width:120px}
@media(max-width:760px){.toolbar{grid-template-columns:1fr}.main{padding:12px}.topbar{padding:0 12px}.title{font-size:15px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="mark">料</div>
  <div><div class="title">供应商来料填报</div><div class="sub" id="supplier-name">供应商：—</div></div>
  <div style="margin-left:auto"><span class="pill" id="total-badge">—</span></div>
</div>

<div class="main">
  <div class="panel">
    <div class="section-title">来料单筛选</div>
    <div class="toolbar">
      <input class="input" id="q" placeholder="搜索工厂 / 物料 SKU / 名称 / 状态">
      <select class="select" id="status-filter"><option value="">全部状态</option><option value="ordered">已下单</option><option value="shipped">已发出</option><option value="arrived">已到货</option><option value="cancelled">已取消</option></select>
      <button class="btn btn-primary" id="refresh-btn">刷新</button>
    </div>
  </div>

  <div class="panel">
    <div class="section-title">我的来料单</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>收货工厂</th><th>物料 SKU</th><th>物料名</th><th>订单数量</th><th>ETA</th><th>送货地址</th><th>状态</th><th>备注</th><th>提交</th></tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">暂无来料单</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let rows = [];
const qs = id => document.getElementById(id);
const token = () => new URLSearchParams(location.search).get("token") || localStorage.getItem("token") || "";
const headers = () => token() ? {"Content-Type":"application/json",Authorization:"Bearer "+token()} : {"Content-Type":"application/json"};
const api = (url, opts = {}) => fetch(url, {credentials:"include", headers:headers(), ...opts}).then(r => r.json());
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const fmt = v => v === null || v === undefined || v === "" ? "—" : esc(v);
const date = v => v ? String(v).slice(0,10) : "";
function toast(msg){ const el=qs("toast"); el.textContent=msg; el.style.display="block"; setTimeout(()=>el.style.display="none",2600); }
function statusText(s){ return ({ordered:"已下单",shipped:"已发出",arrived:"已到货",cancelled:"已取消"}[s] || s || "—"); }
function filtered(){
  const q = qs("q").value.trim().toLowerCase();
  const st = qs("status-filter").value;
  return rows.filter(r => {
    const hay = [r.factory_code,r.material_sku,r.material_name,r.status,r.note].map(x => String(x || "").toLowerCase()).join(" ");
    return (!q || hay.includes(q)) && (!st || r.status === st);
  });
}
async function load(){
  const r = await api("/api/db/inbound-collab?view=supplier");
  if(!r.success) return toast(r.error || "加载失败");
  rows = r.data || [];
  qs("supplier-name").textContent = "供应商：" + (rows[0]?.supplier_code || "—");
  qs("total-badge").textContent = rows.length + " 单";
  render();
}
function render(){
  const list = filtered();
  qs("empty").style.display = list.length ? "none" : "block";
  qs("body").innerHTML = list.map(r => {
    return `<tr data-id="${esc(r.id)}">
      <td class="mono">${esc(r.factory_code)}</td>
      <td class="mono">${esc(r.material_sku)}</td>
      <td>${esc(fmt(r.material_name))}</td>
      <td><input class="input num" type="number" min="0" step="0.001" data-field="order_qty" value="${esc(r.order_qty || "")}"></td>
      <td><input class="input date" type="date" data-field="expected_arrival" value="${esc(date(r.expected_arrival))}"></td>
      <td>${esc(fmt(r.delivery_address))}</td>
      <td><select class="select status" data-field="status">${["ordered","shipped","arrived","cancelled"].map(s => `<option value="${s}" ${r.status === s ? "selected" : ""}>${statusText(s)}</option>`).join("")}</select></td>
      <td>${esc(fmt(r.note))}</td>
      <td><button class="btn btn-sm btn-primary" data-action="save">提交</button></td>
    </tr>`;
  }).join("");
}
function rowPayload(tr){
  return {
    id: tr.dataset.id,
    order_qty: tr.querySelector('[data-field="order_qty"]').value,
    expected_arrival: tr.querySelector('[data-field="expected_arrival"]').value,
    status: tr.querySelector('[data-field="status"]').value
  };
}
async function save(btn){
  const tr = btn.closest("tr");
  btn.disabled = true;
  const r = await api("/api/db/inbound-collab?view=supplier", {method:"PATCH", body:JSON.stringify(rowPayload(tr))});
  btn.disabled = false;
  toast(r.success ? "已提交" : r.error || "提交失败");
  if(r.success) load();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-action]");
  if(e.target.id === "refresh-btn") load();
  if(b?.dataset.action === "save") save(b);
});
qs("q").addEventListener("input", render);
qs("status-filter").addEventListener("change", render);
load();
</script>
</body>
</html>
