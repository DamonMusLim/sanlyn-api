<head>
<meta charset="UTF-8">
<title>知识树 · Sanlyn · 信息分类预览</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC",sans-serif;background:#0f172a;color:#e2e8f0;padding:20px;font-size:13px}
  .wrap{max-width:1400px;margin:0 auto}
  h1{font-size:20px;font-weight:600;margin-bottom:4px;color:#fff}
  .sub{color:#94a3b8;font-size:12px;margin-bottom:16px}

  .toolbar{display:flex;justify-content:space-between;align-items:center;background:#1e293b;padding:10px 14px;border-radius:8px;margin-bottom:14px}
  .toolbar .filters{display:flex;gap:6px;flex-wrap:wrap}
  .pill{padding:4px 10px;background:rgba(148,163,184,0.1);color:#94a3b8;border-radius:14px;font-size:11px;cursor:pointer;border:1px solid transparent}
  .pill.active{background:#2563eb;color:#fff;border-color:#3b82f6}
  .stats{font-size:11px;color:#94a3b8}
  .stats strong{color:#fde68a}

  .tree{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .branch{background:#1e293b;border-radius:8px;border:1px solid #334155;overflow:hidden;transition:all .2s}
  .branch:hover{border-color:#3b82f6;transform:translateY(-1px)}
  .branch.expanded{grid-column:span 2;border-color:#3b82f6}

  .branch-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:linear-gradient(135deg,#0f172a,#1e293b);border-bottom:1px solid #334155}
  .branch-head .name{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:#fff}
  .branch-head .name .ico{font-size:18px}
  .branch-head .name .badge{background:rgba(59,130,246,0.15);color:#93c5fd;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:600;margin-left:4px}
  .branch-head .name .badge.urgent{background:rgba(239,68,68,0.18);color:#fca5a5}
  .branch-head .chev{color:#64748b;font-size:11px;transition:transform .15s}
  .branch.expanded .chev{transform:rotate(90deg)}

  .branch-body{padding:8px 14px 12px}
  .item{padding:7px 0;border-bottom:1px solid rgba(51,65,85,0.5);font-size:12px;line-height:1.5}
  .item:last-of-type{border-bottom:none}
  .item .row1{color:#e2e8f0;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .item .row1 .id{font-family:ui-monospace,monospace;color:#7dd3fc;font-size:11px;flex-shrink:0}
  .item .row1 .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .row1 .amt{color:#fde68a;font-weight:600;font-family:ui-monospace,monospace;flex-shrink:0}
  .item .row2{color:#94a3b8;font-size:10px;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
  .item .row2 .tag{padding:0 4px;background:rgba(148,163,184,0.1);border-radius:2px}
  .item .row2 .tag.urgent{background:rgba(239,68,68,0.15);color:#fca5a5}
  .item .row2 .tag.ok{background:rgba(16,185,129,0.15);color:#86efac}
  .item .row2 .tag.warn{background:rgba(251,191,36,0.15);color:#fde68a}

  .branch-foot{padding:8px 14px;border-top:1px solid rgba(51,65,85,0.5);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#64748b;background:#0f172a}
  .branch-foot a{color:#60a5fa;text-decoration:none;cursor:pointer}
  .branch-foot a:hover{text-decoration:underline}

  /* Hidden items in collapsed mode */
  .branch:not(.expanded) .item.more{display:none}

  /* Accent colors per branch category */
  .branch.order{border-top:3px solid #f59e0b}
  .branch.ship{border-top:3px solid #06b6d4}
  .branch.finance{border-top:3px solid #ec4899}
  .branch.product{border-top:3px solid #8b5cf6}
  .branch.customer{border-top:3px solid #3b82f6}
  .branch.factory{border-top:3px solid #22c55e}
  .branch.customs{border-top:3px solid #f97316}
  .branch.doc{border-top:3px solid #a855f7}
  .branch.perm{border-top:3px solid #ef4444}
  .branch.task{border-top:3px solid #14b8a6}
  .branch.audit{border-top:3px solid #fbbf24}
  .branch.partner{border-top:3px solid #6366f1}
</style>
</head>

function render() {
  const wrap = document.getElementById('tree');
  wrap.innerHTML = '';
  BRANCHES.forEach((b, i) => {
    const items = b.items.map(it => `
      <div class="item ${it.more?'more':''}">
        <div class="row1">
          <span class="id">${it.id}</span>
          <span class="title">${it.title}</span>
          ${it.amt ? `<span class="amt">${it.amt}</span>` : ''}
        </div>
        ${it.tags && it.tags.length ? `<div class="row2">${it.tags.map(t=>`<span class="tag ${t[0]}">${t[1]||t[0]}</span>`).join('')}</div>` : ''}
      </div>
    `).join('');
    const totalShown = b.items.filter(x=>!x.more).length;
    wrap.insertAdjacentHTML('beforeend', `
      <div class="branch ${b.cat}" data-idx="${i}">
        <div class="branch-head" onclick="this.parentElement.classList.toggle('expanded')">
          <div class="name">
            <span class="ico">${b.ico}</span>
            <span>${b.name}</span>
            <span class="badge ${b.urgent?'urgent':''}">${b.badge}</span>
          </div>
          <span class="chev">▶</span>
        </div>
        <div class="branch-body">${items}</div>
        <div class="branch-foot">
          <span>显示 ${totalShown} / 共 ${b.count}</span>
          <a>查看全部 →</a>
        </div>
      </div>
    `);
  });
}
