<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>装柜存证 – Sanlyn OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1120;--card:rgba(15,23,42,0.75);--card-b:rgba(255,255,255,0.07);
  --blue:#2563eb;--blue-l:#3b82f6;--green:#10b981;--green-l:#34d399;
  --amber:#f59e0b;--red:#ef4444;--purple:#8b5cf6;
  --text:#f8fafc;--muted:#94a3b8;--dim:#475569;--ghost:#334155;
  --input-bg:rgba(255,255,255,0.04);--input-b:rgba(255,255,255,0.10);
}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  padding:0;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 50% at 20% -10%,rgba(37,99,235,0.10) 0%,transparent 60%),
             radial-gradient(ellipse 60% 40% at 80% 100%,rgba(16,185,129,0.06) 0%,transparent 55%);
}
.container{max-width:480px;margin:0 auto;padding:16px 16px 100px;position:relative}

/* Header */
.header{text-align:center;padding:24px 0 16px}
.header .logo{font-size:11px;font-weight:700;color:var(--blue-l);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.header h1{font-size:20px;font-weight:800;color:var(--text);margin-bottom:4px}
.header .sub{font-size:12px;color:var(--muted)}
.header .ship-id{display:inline-block;margin-top:10px;font-family:'DM Mono',monospace;font-size:14px;font-weight:700;color:var(--amber);background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.3);border-radius:8px;padding:6px 16px}

/* Section */
.section{margin-bottom:20px}
.section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.06)}

/* Card */
.card{background:var(--card);border:1px solid var(--card-b);border-radius:14px;padding:16px;margin-bottom:12px}

/* Input */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input{
  width:100%;padding:12px 14px;border-radius:10px;
  background:var(--input-bg);border:1.5px solid var(--input-b);
  color:var(--text);font-size:15px;font-weight:600;font-family:'DM Mono',monospace;
  outline:none;transition:border-color 0.2s;
}
.field input:focus{border-color:var(--blue-l)}
.field input::placeholder{color:var(--dim);font-family:'DM Sans',sans-serif;font-weight:400}

/* Photo Grid */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-slot{
  aspect-ratio:1;border-radius:10px;
  border:2px dashed rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.02);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;position:relative;overflow:hidden;transition:all 0.2s;
}
.photo-slot:hover,.photo-slot:active{border-color:var(--blue-l);background:rgba(37,99,235,0.06)}
.photo-slot .icon{font-size:24px;margin-bottom:4px}
.photo-slot .label{font-size:9px;color:var(--dim);font-weight:600}
.photo-slot.has-photo{border-color:var(--green);border-style:solid}
.photo-slot.has-photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photo-slot .remove{
  position:absolute;top:4px;right:4px;width:22px;height:22px;
  border-radius:50%;background:rgba(0,0,0,0.7);border:none;
  color:#fff;font-size:12px;cursor:pointer;display:none;
  align-items:center;justify-content:center;z-index:2;
}
.photo-slot.has-photo .remove{display:flex}

/* Single photo upload */
.photo-single{
  width:100%;min-height:120px;border-radius:12px;
  border:2px dashed rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.02);
  display:flex;align-items:center;justify-content:center;gap:12px;
  cursor:pointer;position:relative;overflow:hidden;transition:all 0.2s;padding:16px;
}
.photo-single:hover,.photo-single:active{border-color:var(--amber);background:rgba(245,158,11,0.04)}
.photo-single.has-photo{border-color:var(--green);border-style:solid;min-height:180px}
.photo-single.has-photo img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0;padding:8px}
.photo-single .remove{
  position:absolute;top:8px;right:8px;width:26px;height:26px;
  border-radius:50%;background:rgba(0,0,0,0.7);border:none;
  color:#fff;font-size:14px;cursor:pointer;display:none;
  align-items:center;justify-content:center;z-index:2;
}
.photo-single.has-photo .remove{display:flex}

/* Submit */
.submit-btn{
  width:100%;padding:16px;border:none;border-radius:14px;
  font-size:16px;font-weight:800;cursor:pointer;
  transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.submit-btn.ready{
  background:linear-gradient(135deg,#059669,#10b981);color:#fff;
  box-shadow:0 4px 24px rgba(16,185,129,0.3);
}
.submit-btn.disabled{background:rgba(255,255,255,0.05);color:var(--dim);cursor:not-allowed}
.submit-btn.loading{background:rgba(255,255,255,0.08);color:var(--muted);pointer-events:none}
.submit-btn.done{background:rgba(16,185,129,0.15);color:var(--green-l);border:1px solid rgba(16,185,129,0.3)}

/* Progress */
.progress{margin-top:12px;height:4px;border-radius:4px;background:rgba(255,255,255,0.06);overflow:hidden}
.progress-bar{height:100%;border-radius:4px;background:var(--green);transition:width 0.3s}

/* QR section */
.qr-section{text-align:center;margin-top:20px;padding:20px;background:var(--card);border:1px solid var(--card-b);border-radius:14px}
.qr-section canvas{margin:12px auto;display:block}

/* Status toast */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  padding:10px 20px;border-radius:10px;font-size:13px;font-weight:700;
  z-index:999;transition:all 0.3s;opacity:0;pointer-events:none;
}
.toast.show{opacity:1}
.toast.ok{background:rgba(16,185,129,0.9);color:#fff}
.toast.err{background:rgba(239,68,68,0.9);color:#fff}
.toast.info{background:rgba(37,99,235,0.9);color:#fff}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card,.section{animation:fadeUp 0.4s ease-out both}
.section:nth-child(2){animation-delay:0.05s}
.section:nth-child(3){animation-delay:0.1s}
.section:nth-child(4){animation-delay:0.15s}
.section:nth-child(5){animation-delay:0.2s}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="container" id="app">
  <div class="header">
    <div class="logo">Sanlyn OS · 装柜存证系统</div>
    <h1>📷 装柜存证上传</h1>
    <div class="sub">请在装柜现场拍照并填写信息</div>
    <div class="ship-id" id="shipId">加载中...</div>
  </div>

  <!-- 司机信息 -->
  <div class="section">
    <div class="section-title">🚛 司机信息</div>
    <div class="card">
      <div class="field">
        <label>车牌号 *</label>
        <input id="driverPlate" placeholder="如：鲁KA0650" maxlength="12"/>
      </div>
      <div class="field">
        <label>司机姓名 *</label>
        <input id="driverName" placeholder="请输入姓名"/>
      </div>
      <div class="field">
        <label>联系电话 *</label>
        <input id="driverPhone" type="tel" placeholder="手机号码" maxlength="13"/>
      </div>
    </div>
  </div>

  <!-- 箱号封号 -->
  <div class="section">
    <div class="section-title">📦 箱封信息</div>
    <div class="card">
      <div class="field">
        <label>箱号 Container No. *</label>
        <input id="containerNo" placeholder="如：SEGU4935454" maxlength="20" style="text-transform:uppercase"/>
      </div>
      <div class="field">
        <label>封号 Seal No. *</label>
        <input id="sealNo" placeholder="如：NJ722588" maxlength="20" style="text-transform:uppercase"/>
      </div>
    </div>
  </div>

  <!-- 9宫格照片 -->
  <div class="section">
    <div class="section-title">📷 装柜全景（9宫格）</div>
    <div class="card">
      <div style="font-size:11px;color:var(--muted);margin-bottom:10px">
        请从不同角度拍摄装柜过程，至少上传 4 张
      </div>
      <div class="photo-grid" id="gridPhotos"></div>
    </div>
  </div>

  <!-- 过磅单 -->
  <div class="section">
    <div class="section-title">⚖️ 过磅单</div>
    <div class="card">
      <div style="font-size:11px;color:var(--muted);margin-bottom:10px">
        拍摄过磅单或地磅显示屏
      </div>
      <div class="photo-single" id="weightTicket" onclick="pickWeightTicket()">
        <span style="font-size:32px">⚖️</span>
        <div>
          <div style="font-size:13px;font-weight:700;color:var(--muted)">点击拍照或选择图片</div>
          <div style="font-size:10px;color:var(--dim);margin-top:2px">过磅单 / 地磅屏幕</div>
        </div>
      </div>
      <input id="weightTicketInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="handleWeightTicket(this)"/>
    </div>
  </div>

  <!-- 提交 -->
  <div class="section">
    <button class="submit-btn disabled" id="submitBtn" onclick="handleSubmit()">
      请先填写必填信息
    </button>
    <div class="progress" id="progressWrap" style="display:none">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>
  </div>

  <!-- 完成状态 -->
  <div id="doneSection" style="display:none;text-align:center;padding:40px 0">
    <div style="font-size:48px;margin-bottom:12px">✅</div>
    <div style="font-size:18px;font-weight:800;color:var(--green-l);margin-bottom:6px">上传完成！</div>
    <div style="font-size:13px;color:var(--muted)">存证数据已同步，感谢配合</div>
  </div>
</div>

<script>
// ═══ Config ═══
var API = "https://sanlyn-api.vercel.app/api";
var OSS_UPLOAD = API + "/oss-upload";
var RAW_PATCH = API + "/db/raw-patch";
var AUDIT_LOG = API + "/db/audit-log";

// ═══ State ═══
var shipmentNo = "";
var gridFiles = [null,null,null,null,null,null,null,null,null]; // 9 slots
var weightFile = null;
var uploading = false;
var submitted = false;

// ═══ Init ═══
(function init() {
  var params = new URLSearchParams(window.location.search);
  shipmentNo = params.get("id") || params.get("shipmentNo") || "";
  document.getElementById("shipId").textContent = shipmentNo || "未指定单号";
  if (!shipmentNo) {
    document.getElementById("shipId").style.color = "#ef4444";
    document.getElementById("shipId").textContent = "⚠ 缺少单号参数";
  }
  renderGrid();
  // Pre-fill if data exists
  if (shipmentNo) loadExisting();
  // Watch inputs for submit button state
  ["driverPlate","driverName","driverPhone","containerNo","sealNo"].forEach(function(id){
    document.getElementById(id).addEventListener("input", updateSubmitBtn);
  });
})();

function loadExisting() {
  fetch(API + "/db/vault-read?contractNo=" + encodeURIComponent(shipmentNo) + "&table=shipping_plans")
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.vault) return;
      // Pre-fill driver info from raw-patch data
    })
    .catch(function(){});
  // Also try shipping plan raw data
  fetch(API + "/db/shipping")
    .then(function(r){ return r.json(); })
    .then(function(data){
      var list = data.data || data || [];
      var plan = list.find(function(p){ return (p.shipment_no || (p.raw||{}).shipmentNo) === shipmentNo; });
      if (!plan) return;
      var r = plan.raw || {};
      if (r.driverPlate) document.getElementById("driverPlate").value = r.driverPlate;
      if (r.driverName) document.getElementById("driverName").value = r.driverName;
      if (r.driverPhone) document.getElementById("driverPhone").value = r.driverPhone;
      if (r.containerNo) document.getElementById("containerNo").value = r.containerNo;
      if (r.sealNo) document.getElementById("sealNo").value = r.sealNo;
      updateSubmitBtn();
    })
    .catch(function(){});
}

// ═══ Toast ═══
function toast(msg, type) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show " + (type || "info");
  setTimeout(function(){ el.className = "toast"; }, 2500);
}

// ═══ 9-Grid Photos ═══
var GRID_LABELS = ["左前","正前","右前","左侧","正面","右侧","左后","正后","右后"];

function renderGrid() {
  var wrap = document.getElementById("gridPhotos");
  wrap.innerHTML = "";
  for (var i = 0; i < 9; i++) {
    var slot = document.createElement("div");
    slot.className = "photo-slot" + (gridFiles[i] ? " has-photo" : "");
    slot.dataset.idx = i;
    if (gridFiles[i]) {
      slot.innerHTML = '<img src="' + URL.createObjectURL(gridFiles[i]) + '"/>'
        + '<button class="remove" onclick="removeGrid(' + i + ')">×</button>';
    } else {
      slot.innerHTML = '<span class="icon">📷</span><span class="label">' + GRID_LABELS[i] + '</span>';
    }
    slot.addEventListener("click", (function(idx){
      return function(e){
        if (gridFiles[idx]) return; // already has photo, use remove button
        pickGridPhoto(idx);
      };
    })(i));
    wrap.appendChild(slot);
  }
}

function pickGridPhoto(idx) {
  var inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/*";
  inp.capture = "environment";
  inp.onchange = function(){
    if (inp.files && inp.files[0]) {
      gridFiles[idx] = inp.files[0];
      renderGrid();
      updateSubmitBtn();
    }
  };
  inp.click();
}

function removeGrid(idx) {
  gridFiles[idx] = null;
  renderGrid();
  updateSubmitBtn();
}

// ═══ Weight Ticket ═══
function pickWeightTicket() {
  if (weightFile) return;
  document.getElementById("weightTicketInput").click();
}

function handleWeightTicket(inp) {
  if (inp.files && inp.files[0]) {
    weightFile = inp.files[0];
    var el = document.getElementById("weightTicket");
    el.className = "photo-single has-photo";
    el.innerHTML = '<img src="' + URL.createObjectURL(weightFile) + '"/>'
      + '<button class="remove" onclick="removeWeightTicket(event)">×</button>';
    updateSubmitBtn();
  }
}

function removeWeightTicket(e) {
  e.stopPropagation();
  weightFile = null;
  var el = document.getElementById("weightTicket");
  el.className = "photo-single";
  el.innerHTML = '<span style="font-size:32px">⚖️</span><div><div style="font-size:13px;font-weight:700;color:var(--muted)">点击拍照或选择图片</div><div style="font-size:10px;color:var(--dim);margin-top:2px">过磅单 / 地磅屏幕</div></div>';
  el.onclick = pickWeightTicket;
  updateSubmitBtn();
}

// ═══ Submit Button State ═══
function updateSubmitBtn() {
  var btn = document.getElementById("submitBtn");
  if (submitted || uploading) return;
  var plate = document.getElementById("driverPlate").value.trim();
  var name = document.getElementById("driverName").value.trim();
  var phone = document.getElementById("driverPhone").value.trim();
  var cno = document.getElementById("containerNo").value.trim();
  var seal = document.getElementById("sealNo").value.trim();
  var photoCount = gridFiles.filter(Boolean).length;

  var ready = plate && name && phone && cno && seal && photoCount >= 4;
  var partial = plate || name || phone || cno || seal || photoCount > 0;

  if (ready) {
    btn.className = "submit-btn ready";
    btn.innerHTML = "📤 提交存证（" + photoCount + "张照片" + (weightFile ? " + 过磅单" : "") + "）";
  } else if (partial) {
    btn.className = "submit-btn disabled";
    var missing = [];
    if (!plate) missing.push("车牌");
    if (!name) missing.push("姓名");
    if (!phone) missing.push("电话");
    if (!cno) missing.push("箱号");
    if (!seal) missing.push("封号");
    if (photoCount < 4) missing.push("至少4张照片(已" + photoCount + "张)");
    btn.innerHTML = "还需填写：" + missing.join("、");
  } else {
    btn.className = "submit-btn disabled";
    btn.innerHTML = "请先填写必填信息";
  }
}

// ═══ Upload to OSS ═══
async function uploadFile(file, path) {
  var fd = new FormData();
  fd.append("file", file, file.name);
  fd.append("path", path);
  var res = await fetch(OSS_UPLOAD, { method: "POST", body: fd });
  var data = await res.json();
  if (!data.success && !data.url) throw new Error(data.error || "Upload failed");
  return data.url;
}

// ═══ Submit ═══
async function handleSubmit() {
  if (uploading || submitted) return;
  var plate = document.getElementById("driverPlate").value.trim();
  var name = document.getElementById("driverName").value.trim();
  var phone = document.getElementById("driverPhone").value.trim();
  var cno = document.getElementById("containerNo").value.trim().toUpperCase();
  var seal = document.getElementById("sealNo").value.trim().toUpperCase();
  var photos = gridFiles.filter(Boolean);

  if (!plate || !name || !phone || !cno || !seal || photos.length < 4) {
    toast("请填写所有必填信息", "err");
    return;
  }
  if (!shipmentNo) {
    toast("缺少单号参数", "err");
    return;
  }

  uploading = true;
  var btn = document.getElementById("submitBtn");
  btn.className = "submit-btn loading";
  btn.innerHTML = "⏳ 上传中...";
  document.getElementById("progressWrap").style.display = "block";

  var totalFiles = photos.length + (weightFile ? 1 : 0);
  var uploaded = 0;
  var photoUrls = [];
  var weightUrl = "";

  try {
    // Upload grid photos
    for (var i = 0; i < photos.length; i++) {
      var idx = gridFiles.indexOf(photos[i]);
      var path = "delivery/driver/" + shipmentNo + "/grid_" + GRID_LABELS[idx] + "_" + Date.now() + "_" + photos[i].name;
      var url = await uploadFile(photos[i], path);
      photoUrls.push({ position: GRID_LABELS[idx], url: url });
      uploaded++;
      updateProgress(uploaded, totalFiles);
      btn.innerHTML = "⏳ 上传中 " + uploaded + "/" + totalFiles + "...";
    }

    // Upload weight ticket
    if (weightFile) {
      var wPath = "delivery/driver/" + shipmentNo + "/weight_" + Date.now() + "_" + weightFile.name;
      weightUrl = await uploadFile(weightFile, wPath);
      uploaded++;
      updateProgress(uploaded, totalFiles);
    }

    btn.innerHTML = "⏳ 保存数据...";

    // Patch shipping_plan raw fields
    var now = new Date().toLocaleString("zh-CN", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false });
    var patches = {
      driverPlate: plate,
      driverName: name,
      driverPhone: phone,
      containerNo: cno,
      sealNo: seal,
      driverSubmittedAt: now,
    };
    if (weightUrl) patches.weightTicketUrl = weightUrl;
    if (photoUrls.length > 0) patches.driverPhotos9grid = JSON.stringify(photoUrls);

    await fetch(RAW_PATCH, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ shipmentNo: shipmentNo, patches: patches })
    });

    // Write audit log
    await fetch(AUDIT_LOG, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contractNo: shipmentNo,
        certKey: "driverEvidence",
        table: "shipping_plans",
        log: {
          icon: "📷",
          user: name + " (" + plate + ")",
          action: "司机上传装柜存证",
          time: now,
          detail: photos.length + "张照片" + (weightUrl ? " + 过磅单" : "") + " · 箱号" + cno + " · 封号" + seal
        }
      })
    });

    // Done!
    submitted = true;
    btn.className = "submit-btn done";
    btn.innerHTML = "✅ 上传完成";
    toast("存证上传成功！", "ok");

    // Show done section
    setTimeout(function(){
      document.getElementById("doneSection").style.display = "block";
      document.getElementById("doneSection").scrollIntoView({ behavior: "smooth" });
    }, 500);

  } catch (err) {
    uploading = false;
    btn.className = "submit-btn ready";
    btn.innerHTML = "❌ 上传失败，点击重试";
    toast("上传失败: " + (err.message || err), "err");
    console.error(err);
  }
}

function updateProgress(done, total) {
  var pct = Math.round((done / total) * 100);
  document.getElementById("progressBar").style.width = pct + "%";
}
</script>

</body>
</html>
