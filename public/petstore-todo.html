<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>宠物店 · 店员待办</title>
<link rel="stylesheet" href="/public/sanlyn-table.css">
<style>
  .sum{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .chip{padding:5px 12px;border-radius:14px;font-size:13px;border:1px solid #ddd;cursor:pointer;user-select:none}
  .chip:hover{filter:brightness(.95)}
  .c1{background:#FFC7CE}.c2{background:#FFE699}.c3{background:#FFF2CC}.c4{background:#DDEBF7}.c0{background:#eee}
  @media print{.bar,.sum,.meta{display:none}.wrap{padding:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="title">宠物店 · 店员待办</div>
    <div class="meta">金枋店 · <span id="stamp"></span></div></div></div>
  <div class="bar">
    <input id="shelf" placeholder="货架号前缀 如 3">
    <select id="type"><option value="">全部待办</option><option>已过期</option><option>无货位</option><option>快过期</option><option>无生产日期</option></select>
    <button class="btn" id="reload">刷新</button>
    <button class="btn" id="exportBtn">导出Excel</button>
    <button class="btn" id="printBtn">打印</button>
  </div>
  <div class="sum" id="sum"></div>
  <div id="msg"></div><div class="panel" id="app"><div class="hint">Loading...</div></div>
</div>
<script src="/public/sanlyn-table.js"></script>
<script>
function params(){return{shelf:document.getElementById("shelf").value.trim(),type:document.getElementById("type").value}}
var table=SanlynTable.mount(document.getElementById("app"),{
  api:"/api/db/petstore-todo",
  exportUrl:"/api/db/petstore-todo-export",
  loginApi:"/api/db/auth-login",
  params:params,
  columns:[
    {key:"todo_type",label:"待办"},{key:"shelf",label:"货架号"},
    {key:"product_name",label:"商品名称"},{key:"spec",label:"规格"},
    {key:"warn_status",label:"保质期状态"},{key:"production_date",label:"生产日期"},
    {key:"expire_date",label:"到期日"},{key:"stock",label:"库存",type:"num"},
    {key:"out_price",label:"门店售价",type:"num"},{key:"month_sale",label:"月销",type:"num"},
    {key:"product_code",label:"商品编码"},{key:"barcode",label:"条码"},
    {key:"category",label:"一级分类"}
  ]
});
async function loadSum(){
  var t=SanlynTable.token(), box=document.getElementById("sum");
  try{
    var r=await fetch("/api/db/petstore-todo?"+new URLSearchParams(params()).toString(),
                      {headers:t?{Authorization:"Bearer "+t}:{}});
    if(!r.ok)return;
    var j=await r.json(), s=j.summary||[];
    var cls={"已过期":"c1","无货位":"c2","快过期":"c3","无生产日期":"c4"};
    box.innerHTML='<span class="chip c0" data-t="">全部 '+(s.reduce(function(a,b){return a+b.n},0))+'</span>'+
      s.map(function(x){return '<span class="chip '+(cls[x.todo_type]||"")+'" data-t="'+x.todo_type+'">'+x.todo_type+' '+x.n+'</span>'}).join("");
    box.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){
      document.getElementById("type").value=c.dataset.t; table.load(); }});
  }catch(e){}
}
document.getElementById("reload").onclick=function(){table.load();loadSum()};
document.getElementById("printBtn").onclick=function(){window.print()};
document.getElementById("exportBtn").onclick=function(){table.exportExcel("店员待办.xlsx")};
loadSum();
</script>
</body></html>
