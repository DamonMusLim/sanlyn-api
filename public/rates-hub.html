<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>运价管理</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/public/hgj-ui.css">
<script src="/public/sanlyn-table.js"></script>
<script src="/public/wb-open-tab.js" data-protocol="sanlyn:open-tab"></script>
<style>
  body.hgj-page{min-height:100vh}
  .app{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:100vh}
  .side{width:180px;background:var(--hgj-side-bg);color:var(--hgj-side-text)}
  .brand{height:56px;padding:16px 18px;color:#fff;font-size:16px;font-weight:700}
  .side button{display:block;width:100%;height:48px;border:0;background:transparent;color:var(--hgj-side-text);font:16px/48px var(--hgj-font);text-align:left;padding:0 18px;cursor:pointer}
  .side button.on{background:var(--hgj-primary);color:#fff}
  .main{min-width:0;padding:0 14px 14px}
  .top{height:56px;display:flex;align-items:center;gap:12px}
  h1{margin:0;color:var(--hgj-title);font-size:18px;font-weight:700}
  .stamp{margin-left:auto;color:var(--hgj-muted);font-size:12px}
  .toolbar{padding:12px 14px;display:flex;gap:10px;align-items:end;flex-wrap:wrap}
  .field{display:grid;gap:4px}.field span{color:var(--hgj-muted);font-size:12px}
  input[type=text]{height:32px;width:132px;border:1px solid var(--hgj-line);border-radius:0;background:var(--hgj-card);color:var(--hgj-text);padding:0 8px}
  .check{height:32px;display:flex;align-items:center;gap:6px;color:var(--hgj-text);font-size:13px}
  .primary{height:32px;border:1px solid var(--hgj-primary);border-radius:0;background:var(--hgj-primary);color:#fff;padding:0 14px;cursor:pointer}
  .ghost{height:32px;border:1px solid var(--hgj-primary);border-radius:0;background:var(--hgj-primary-bg);color:var(--hgj-primary);padding:0 14px;cursor:pointer}
  .summary{padding:10px 14px;color:var(--hgj-muted);font-size:13px}
  .content{min-width:0}.sections{display:grid;grid-template-columns:1fr;gap:10px}.section{min-width:0}
  .section-head{height:42px;display:flex;align-items:center;gap:10px;padding:0 14px}
  .section-head .mini{margin-left:auto;color:var(--hgj-muted);font-size:12px}
  .table-wrap{overflow:auto;max-height:calc(100vh - 250px)}
  table{border-collapse:separate;border-spacing:0;min-width:100%;white-space:nowrap;font-size:12px}
  th,td{padding:7px 9px;border-bottom:1px solid var(--hgj-line);text-align:left;vertical-align:top}
  thead th{position:sticky;top:0;z-index:3;background:#F7F8FA;color:var(--hgj-title);font-weight:700}
  tbody tr:hover{background:#F7FBFF}.num{text-align:right;font-variant-numeric:tabular-nums}
  .na{color:var(--hgj-muted)}.bad{color:var(--hgj-danger);font-weight:700}.warn{background:#FFF7E8}
  .expired td,.draft td{color:var(--hgj-muted);background:#F7F8FA}
  .tag{display:inline-block;margin-left:6px;padding:1px 5px;border:1px solid var(--hgj-primary);border-radius:0;background:var(--hgj-primary-bg);color:var(--hgj-primary);font-size:11px}
  .group td{position:sticky;top:31px;z-index:2;background:var(--hgj-primary-bg);color:var(--hgj-primary);font-weight:700}
  .empty{padding:18px;color:var(--hgj-warn);line-height:1.7;white-space:normal}.err{padding:18px;color:var(--hgj-danger)}
  .linkbtn{border:0;background:transparent;color:var(--hgj-primary);cursor:pointer;padding:0}
  @media(max-width:860px){.app{grid-template-columns:1fr}.side{width:100%;display:flex;overflow:auto}.brand{display:none}.side button{width:auto;min-width:96px}.main{padding:0 10px 10px}.table-wrap{max-height:none}}
</style>
</head>
<body class="hgj-page">
<div class="app">
  <aside class="side">
    <div class="brand">运价管理</div>
    <button class="on" data-tab="ocean">海运运价</button>
    <button data-tab="charges">港杂费</button>
    <button data-tab="truck">拖车报价</button>
    <button data-tab="customs">报关报价</button>
    <button data-tab="insurance">货运保险</button>
  </aside>
  <main class="main">
    <div class="top">
      <h1>运价管理</h1>
      <div class="stamp" id="stamp">v2026.08.29-1 · 生成时间 --</div>
    </div>
    <section class="hgj-card toolbar">
      <label class="field"><span>起运港</span><input type="text" id="pol"></label>
      <label class="field"><span>目的港</span><input type="text" id="pod"></label>
      <label class="field"><span>船公司</span><input type="text" id="carrier"></label>
      <label class="check"><input type="checkbox" id="active"> 只看有效</label>
      <button class="primary" id="search">查询</button>
      <button class="ghost" id="csv">导出CSV</button>
    </section>
    <section class="hgj-card summary" id="sub">加载中...</section>
    <section id="content" class="content"></section>
  </main>
</div>
<script src="/public/rates-hub.js"></script>
</body>
</html>
