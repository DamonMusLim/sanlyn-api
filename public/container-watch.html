<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>盯箱宝</title>
  <link rel="stylesheet" href="/public/hgj-ui.css">
  <style>
    :root{--bg:var(--hgj-bg);--panel:var(--hgj-card);--text:var(--hgj-text);--muted:var(--hgj-muted);--line:var(--hgj-line);--accent:var(--hgj-primary);--chip:var(--hgj-primary-bg);--warn:var(--hgj-warn);--bad:var(--hgj-danger);--side:var(--hgj-side-bg)}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--hgj-font)}button,input{height:34px;border:1px solid var(--line);border-radius:0;background:var(--panel);color:var(--text);font:inherit;padding:0 11px}button{cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .app{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:100vh}.side{background:var(--side);color:#fff}.brand{height:56px;padding:17px 16px;font-weight:700}.navitem{height:48px;display:flex;align-items:center;padding:0 16px;color:#d9e6ff;border-left:3px solid transparent}.navitem.on{background:rgba(255,255,255,.08);border-left-color:var(--accent);color:#fff}
    .main{padding:18px 20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:12px}.title{font-size:16px;line-height:16px;margin:0 0 8px;padding-left:10px;border-left:3px solid var(--accent);color:var(--hgj-title)}.sub,.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#q{width:330px}
    .notice{border-left:3px solid var(--warn);padding:10px 14px;color:var(--hgj-title);font-weight:700}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}.metric{padding:13px 14px;background:var(--panel)}.num{font-size:24px;font-weight:700;margin-top:3px}.warn{color:var(--warn)}.bad{color:var(--bad)}
    .grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:10px}.panel{background:var(--panel);border:0;border-radius:0;box-shadow:none;margin-bottom:10px;overflow:hidden}.panel-head{display:flex;justify-content:space-between;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}.panel-title{font-weight:700;color:var(--hgj-title);padding-left:10px;border-left:3px solid var(--accent);line-height:16px}.body{padding:14px}
    .list{display:grid;gap:1px;background:var(--line);max-height:calc(100vh - 288px);overflow:auto}.row{border:0;background:var(--panel);padding:11px 12px;text-align:left;height:auto}.row.active{outline:2px solid var(--accent);outline-offset:-2px}.row strong,.row span{display:block;overflow-wrap:anywhere}.row span{color:var(--muted);font-size:12px;margin-top:4px}
    .pill{display:inline-block;border:1px solid var(--accent);border-radius:0;background:var(--chip);color:var(--accent);padding:2px 7px;font-size:12px}.pill.warn{border-color:var(--warn);background:transparent;color:var(--warn)}.pill.bad{border-color:var(--bad);background:transparent;color:var(--bad)}
    .alerts{display:grid;gap:8px}.alert{border-left:3px solid var(--bad);padding:10px 12px;background:var(--panel);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.alert button{height:28px;color:var(--accent)}
    .route{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line)}.route div{background:var(--panel);min-height:96px;padding:12px}.route b{display:block;font-size:13px;color:var(--hgj-title)}.route span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
    table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}th{background:var(--bg);color:var(--muted);font-size:12px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.field{border:1px solid var(--line);padding:8px}.field b{display:block;font-size:13px}.field span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.empty,.error{padding:24px;text-align:center;color:var(--muted)}.error{color:var(--bad)}
    @media(max-width:1000px){.app{display:block}.side{display:none}.main{padding:14px}.top,.grid{display:block}.actions{margin-top:10px}.metrics,.fields,.route{grid-template-columns:1fr}#q{width:100%}.list{max-height:none}table{display:block;overflow-x:auto;white-space:nowrap}}
  </style>
<script src="/public/wb-open-tab.js" data-protocol="sanlyn:open-tab"></script>
</head>
<body class="hgj-page">
  <div class="app">
    <aside class="side"><div class="brand">Sanlyn</div><div class="navitem on">盯箱宝</div></aside>
    <main class="main">
      <header class="top">
        <div><h1 class="title hgj-panel-title">盯箱宝</h1><div id="summary" class="sub">加载中</div></div>
        <div class="actions"><input id="q" placeholder="柜号 / BL / 订舱号 / 合同号 / 船名"><button id="reload" class="primary" type="button">查询</button></div>
      </header>
      <div class="notice hgj-card">本页只读；未接入显示缺字段和当前填充率，不反推箱动态，不对外发送消息。</div>
      <section class="metrics">
        <div class="metric hgj-card"><div class="muted">盯箱票数</div><div id="mRows" class="num">未接入</div></div>
        <div class="metric hgj-card"><div class="muted">业务预警</div><div id="mAlerts" class="num bad">未接入</div></div>
        <div class="metric hgj-card"><div class="muted">柜号填充率</div><div id="mCtn" class="num warn">未接入</div></div>
        <div class="metric hgj-card"><div class="muted">更新时间填充率</div><div id="mTrack" class="num warn">未接入</div></div>
      </section>
      <main class="grid">
        <section class="panel hgj-card"><div class="panel-head"><div class="panel-title">箱列表</div><span id="listCount" class="pill">未接入</span></div><div id="list" class="list"></div></section>
        <section>
          <section class="panel hgj-card"><div class="panel-head"><div class="panel-title">真实业务预警</div><span class="pill bad">可忽略</span></div><div id="alerts" class="body alerts"></div></section>
          <section class="panel hgj-card"><div class="panel-head"><div class="panel-title">箱动态</div><span id="statePill" class="pill">未接入</span></div><div id="route" class="body"></div></section>
          <section class="panel hgj-card"><div class="panel-head"><div class="panel-title">字段填充率</div><span class="pill bad">未接入不可忽略</span></div><div id="coverage" class="body fields"></div></section>
        </section>
      </main>
    </main>
  </div>
  <script src="/container-watch.js"></script>
</body>
</html>
