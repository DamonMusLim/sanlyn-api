<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>财务报表</title>
  <link rel="stylesheet" href="/public/hgj-ui.css">
  <style>
    :root{--bg:var(--hgj-bg);--panel:var(--hgj-card);--text:var(--hgj-text);--muted:var(--hgj-muted);--line:var(--hgj-line);--accent:var(--hgj-primary);--chip:var(--hgj-primary-bg);--warn:var(--hgj-warn);--bad:var(--hgj-danger);--side:var(--hgj-side-bg);--sideText:var(--hgj-side-text)}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--hgj-font)}button,input{height:34px;border:1px solid var(--line);border-radius:0;background:var(--panel);color:var(--text);font:inherit;padding:0 11px}button{cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .shell{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:100vh}.side{background:var(--side);color:var(--sideText)}.side h2{height:48px;margin:0;padding:0 16px;font-size:16px;line-height:48px;color:#fff}.side div{height:48px;padding:0 16px;line-height:48px}.side .on{background:rgba(255,255,255,.08);color:#fff;border-left:3px solid var(--accent)}
    .wrap{padding:22px;max-width:1380px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:14px}.title{font-size:16px;line-height:16px;margin:0 0 8px;padding-left:10px;border-left:3px solid var(--accent);color:var(--hgj-title);font-weight:700}.sub,.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .notice{border-left:3px solid var(--warn);padding:10px 14px;margin-bottom:10px;color:var(--hgj-title);font-weight:700}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}.metric{padding:13px 14px;background:var(--panel)}.num{font-size:24px;font-weight:700;margin-top:3px}.bad{color:var(--bad)}
    .grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:10px}.panel{background:var(--panel);border:0;border-radius:0;box-shadow:none;margin-bottom:10px;overflow:hidden}.panel-head{display:flex;justify-content:space-between;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}.panel-title{font-weight:700;color:var(--hgj-title);padding-left:10px;border-left:3px solid var(--accent);line-height:16px}.body{padding:14px}
    table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}th{background:var(--bg);color:var(--muted);font-size:12px}.pill{display:inline-block;border:1px solid var(--accent);border-radius:0;background:var(--chip);color:var(--accent);padding:2px 7px;font-size:12px}.pill.bad{border-color:var(--bad);background:transparent;color:var(--bad)}
    .fields{display:grid;gap:8px}.field{border:1px solid var(--line);padding:8px}.field b,.field span{display:block}.field span{color:var(--muted);font-size:12px;margin-top:3px}.empty,.error{padding:24px;text-align:center;color:var(--muted)}.error{color:var(--bad)}
    @media(max-width:900px){.shell{display:block}.side{display:none}.wrap{padding:14px}.top,.grid{display:block}.actions{margin-top:10px}.metrics{grid-template-columns:1fr}table{display:block;overflow-x:auto;white-space:nowrap}}
  </style>
</head>
<body class="hgj-page">
  <div class="shell">
    <aside class="side"><h2>海管家</h2><div class="on">财务报表</div><div>收付</div><div>核销</div><div>发票</div></aside>
    <main class="wrap">
      <header class="top">
        <div><h1 class="title hgj-panel-title">财务报表</h1><div id="summary" class="sub">加载中</div></div>
        <div class="actions"><input id="from" type="date" value="2026-01-01"><input id="to" type="date"><button id="reload" class="primary" type="button">查询</button></div>
      </header>
      <div class="notice hgj-card">本页只读；金额只展示真实财务字段，未设置显示未设置，零数据/缺字段显示未接入和填充率。</div>
      <section id="metrics" class="metrics"></section>
      <main class="grid">
        <section class="panel hgj-card"><div class="panel-head"><div class="panel-title">报表汇总</div><span class="pill">真实字段</span></div><div class="body"><table><thead><tr><th>模块</th><th>币种/方向</th><th>记录数</th><th>金额</th><th>状态</th></tr></thead><tbody id="sections"></tbody></table></div></section>
        <section class="panel hgj-card"><div class="panel-head"><div class="panel-title">字段填充率</div><span class="pill bad">未接入不可忽略</span></div><div id="coverage" class="body fields"></div></section>
      </main>
    </main>
  </div>
  <script src="/financial-report.js"></script>
</body>
</html>
