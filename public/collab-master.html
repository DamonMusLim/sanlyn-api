<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanlyn OS · 洋宝宝主控</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  background: #f0f2f5; color: #111; font-size: 13px; }
.portal-bar { background: #1a1d23; padding: 0 24px; display: flex; align-items: center;
  position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.portal-brand { color: #f1f5f9; font-size: 14px; font-weight: 800;
  letter-spacing: 1px; padding: 14px 0; margin-right: 24px; }
.portal-login-badge { margin-left: auto; font-size: 10px; color: #94a3b8; padding: 14px 0; }
.shell-narrow { max-width: 980px; margin: 0 auto; padding: 20px 16px; }
.card { background: #fff; border-radius: 10px; border: 1px solid #e0e4ea;
  overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 14px; }
.section { padding: 14px 16px; border-bottom: 1px solid #f0f2f5; }
.section:last-child { border-bottom: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px;
  border-radius: 20px; font-size: 11px; font-weight: 800; white-space: nowrap; }
.badge-green { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
.badge-amber { background: #fef9c3; color: #a16207; border: 1px solid #fde68a; }
.badge-blue { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }
.badge-red { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
.btn { padding: 7px 16px; border-radius: 7px; border: none;
  font-size: 12px; font-weight: 700; cursor: pointer; }
.btn-green { background: #059669; color: #fff; }
.btn-ghost { background: #f3f4f6; color: #374151; border: 1px solid #e0e4ea; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.seg-tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 2px solid #e0e4ea; overflow-x: auto; }
.seg-tab { padding: 10px 18px; font-size: 13px; font-weight: 800; color: #6b7280;
  cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; display: flex; gap: 7px; align-items: center; }
.seg-tab.active { color: #059669; border-bottom-color: #059669; }
.form-field { margin-bottom: 10px; }
.form-label { font-size: 11px; font-weight: 700; color: #374151; margin-bottom: 4px; display: block; }
.form-input { width: 100%; border: 1.5px solid #c8cdd6; border-radius: 6px;
  padding: 8px 10px; font-size: 13px; outline: none; font-family: inherit; background: #fff; }
.form-input:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,.12); }
textarea.form-input { resize: vertical; min-height: 60px; }
.toggle-row { display: flex; gap: 8px; flex-wrap: wrap; }
.tog { padding: 8px 16px; border-radius: 7px; border: 1.5px solid #c8cdd6;
  background: #fff; font-size: 12px; font-weight: 700; color: #4b5563;
  cursor: pointer; text-align: center; }
.tog.on-blue { border-color: #1a73e8; background: #dbeafe; color: #1d4ed8; }
.cargo-t { width: 100%; border-collapse: collapse; font-size: 11px; }
.cargo-t th { background: #f8fafc; padding: 6px 8px; text-align: left;
  border: 1px solid #c8cdd6; font-size: 10px; font-weight: 800; color: #374151; }
.cargo-t td { padding: 5px 7px; border: 1px solid #e0e4ea; vertical-align: top; }
.cargo-t input.cell-in { width: 100%; border: 1px solid #d1d5db; border-radius: 4px;
  padding: 5px 6px; font-size: 11px; outline: none; font-family: inherit; background: #fff; }
.chip { background: #fff; border: 1px solid #e0e4ea; border-radius: 8px; padding: 8px 14px; font-size: 12px; }
.chip b { color: #1a1d23; }
.chip span { color: #6b7280; }
.alert-callout { padding: 10px 14px; background: #fef2f2;
  border-left: 4px solid #dc2626; border-radius: 6px; margin-bottom: 10px; font-size: 12px; color: #991b1b; }
.missing { color: #b91c1c; background: #fef2f2; border: 1px solid #fca5a5; border-radius: 4px; padding: 1px 5px; font-weight: 800; }
.hidden { display: none !important; }
.center-state { text-align: center; padding: 70px 20px; color: #6b7280; }
.center-state .big { font-size: 44px; margin-bottom: 14px; }
.center-state h2 { font-size: 17px; font-weight: 800; color: #1a1d23; margin-bottom: 6px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #1a1d23; color: #fff; padding: 10px 22px; border-radius: 20px;
  font-size: 12px; font-weight: 700; display: none; z-index: 999; }
.toast.show { display: block; }
@media (max-width: 720px) { .grid2,.grid3 { grid-template-columns: 1fr; } .portal-bar { padding: 0 16px; } }
</style>
</head>
<body>
<div class="portal-bar"><div class="portal-brand">SANLYN OS</div><div class="portal-login-badge" id="topBadge">内部主控</div></div>

<div class="center-state" id="stateLoading"><div class="big">⏳</div><p>正在加载…</p></div>
<div class="center-state hidden" id="stateLogin"><div class="big">⛔</div><h2>请用 Sanlyn 账号登录</h2><p>主控视图只接受内部 JWT，不接受外部协同链接。</p></div>
<div class="center-state hidden" id="stateDead"><div class="big">⚠️</div><h2>无法打开主控</h2><p id="deadMsg">请检查计划编号或登录态。</p></div>

<div class="hidden" id="stateForm">
<div class="shell-narrow">
  <div class="card" style="border:2px solid #bfdbfe;">
    <div style="background:#eff6ff;padding:14px 16px;display:flex;align-items:center;gap:12px;">
      <div style="font-size:24px;">🛟</div>
      <div style="flex:1;">
        <div style="font-size:15px;font-weight:800;color:#1e3a8a;" id="bannerTitle">洋宝宝主控 · —</div>
        <div style="font-size:11px;color:#1d4ed8;margin-top:2px;" id="bannerSub">协同表第0视角 · 海运 / 工厂 / 客户 / 车队 / 报关</div>
      </div>
      <div class="badge badge-blue">Sanlyn JWT</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;" id="chips"></div>
  <div class="seg-tabs" id="tabs"></div>
  <div id="panel"></div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = '/api/db/booking-collab';
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const planRef = Q.get('plan_id') || Q.get('_id') || Q.get('id') || '';
let data = null, sheet = {}, curTab = 'ocean', owners = {}, statuses = {};
function show(id){ ['stateLoading','stateLogin','stateDead','stateForm'].forEach(s=>$(s).classList.add('hidden')); $(id).classList.remove('hidden'); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
function esc(v){ return v==null?'':String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function gv(id){ return ($(id)?.value||'').trim(); }
function fmtD(v){ if(!v) return ''; try{ return new Date(v).toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'}); }catch(e){ return String(v).slice(0,10); } }
function miss(v){ return (v!==undefined && v!==null && String(v)!=='') ? esc(v) : '<span class="missing">____待补____</span>'; }
function authToken(){
  const keys = ['token','jwt','authToken','sanlyn_token','sanlynToken','access_token','admin_token'];
  for(const k of keys){ const v = localStorage.getItem(k); if(v) return v; }
  const ck = Object.fromEntries(document.cookie.split(';').map(x=>x.trim().split('=').map(decodeURIComponent)).filter(x=>x[0]));
  for(const k of keys){ if(ck[k]) return ck[k]; }
  return '';
}
function authHeaders(json){
  const h = { Authorization: 'Bearer ' + authToken() };
  if(json) h['Content-Type'] = 'application/json';
  return h;
}
async function api(body){
  const qs = planRef ? '?plan_id=' + encodeURIComponent(planRef) : '';
  const opt = body ? { method:'POST', headers:authHeaders(true), body:JSON.stringify({plan_id:planRef, ...body}) }
                   : { headers:authHeaders(false) };
  const r = await fetch(API + '/master-view' + qs, opt);
  const d = await r.json().catch(()=>({}));
  if(!r.ok || !d.ok) throw new Error(d.error || '请求失败');
  return d;
}
function statusBadge(k){
  const st = (statuses[k]||{}).state || '待填';
  const cls = st==='已填' || st==='已回' ? 'badge-green' : 'badge-amber';
  return `<span class="badge ${cls}">${st}</span>`;
}
function ownerBadge(k){
  const o = owners[k] || 'self';
  return `<span class="badge ${o==='self'?'badge-blue':'badge-amber'}">${o==='self'?'自做 self · 可代填':'外发 agent · 只读'}</span>`;
}
function setOwner(k, v){
  owners[k] = v;
  const el = $(k + '_owner');
  if(el) el.value = v;
}
function commonHead(k, title){
  return `<div class="card"><div class="section" style="display:flex;align-items:center;gap:10px;justify-content:space-between;">
    <div><div style="font-size:14px;font-weight:800;color:#1a1d23;">${title}</div>
      <div style="font-size:11px;color:#6b7280;margin-top:2px;">状态按后端字段实时聚合，缺字段红标待补</div></div>
    <div style="display:flex;gap:8px;align-items:center;">${ownerBadge(k)}${statusBadge(k)}</div>
  </div></div>`;
}
function renderTabs(){
  const defs = [['ocean','海运'],['factory','工厂'],['customer','客户'],['trucking','车队'],['customs','报关']];
  $('tabs').innerHTML = defs.map(([k,l])=>`<div class="seg-tab ${curTab===k?'active':''}" onclick="curTab='${k}';render();">${l} ${statusBadge(k)}</div>`).join('');
}
function renderChips(){
  const chips = [];
  chips.push(`<div class="chip"><span>票号 </span><b>${miss(sheet.shipment_no)}</b></div>`);
  chips.push(`<div class="chip"><span>航线 </span><b>${miss(sheet.pol)} → ${miss(sheet.pod)}</b></div>`);
  chips.push(`<div class="chip"><span>柜型 </span><b>${miss(sheet.container_type)}${sheet.container_qty?' × '+esc(sheet.container_qty):''}</b></div>`);
  chips.push(`<div class="chip"><span>ETD </span><b>${sheet.etd?fmtD(sheet.etd):'<span class="missing">____待补____</span>'}</b></div>`);
  chips.push(`<div class="chip"><span>客户 </span><b>${miss(sheet.customer_name || sheet.customer_en)}</b></div>`);
  $('chips').innerHTML = chips.join('');
}
function renderKV(rows){
  return `<table class="cargo-t"><tbody>${rows.map(r=>`<tr><th style="width:160px;">${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</tbody></table>`;
}
function renderOcean(){
  const sailRows = (sheet.sailings||[]).map(x=>`<tr><td>${miss(x.carrier)}</td><td>${miss(x.vessel)} ${esc(x.voyage||'')}</td><td>${x.etd?fmtD(x.etd):'<span class="missing">____待补____</span>'}</td><td>${x.eta?fmtD(x.eta):'<span class="missing">____待补____</span>'}</td><td>${x.rate_usd!=null?'USD '+Number(x.rate_usd).toLocaleString():'<span class="missing">____待补____</span>'}</td></tr>`).join('');
  return commonHead('ocean','🚢 海运计划') + `<div class="card"><div class="section">${renderKV([
    ['SO', miss(sheet.so_no)], ['BL', miss(sheet.bl_no)], ['船司', miss(sheet.carrier_code)],
    ['船名航次', miss([sheet.vessel,sheet.voyage].filter(Boolean).join(' '))],
    ['截关', sheet.cargo_cutoff?fmtD(sheet.cargo_cutoff):'<span class="missing">____待补____</span>'],
    ['费用字段', sheet.freight_sale_usd!=null?('USD '+Number(sheet.freight_sale_usd).toLocaleString()):'<span class="missing">____待补____</span>'],
    ['出单公司', miss(sheet.issuing_company)]
  ])}</div>
  <div class="section"><div style="font-size:12px;font-weight:800;margin-bottom:8px;">可选船期</div>
    <table class="cargo-t"><thead><tr><th>船司</th><th>船名航次</th><th>ETD</th><th>ETA</th><th>报价</th></tr></thead><tbody>${sailRows || '<tr><td colspan="5"><span class="missing">____待补____</span></td></tr>'}</tbody></table>
  </div></div>`;
}
function renderFactory(){
  const attrs = sheet.factory_attrs || {};
  const cargo = Array.isArray(sheet.factory_cargo) ? sheet.factory_cargo : [];
  const cargoRows = cargo.map((x,i)=>`<tr><td>${i+1}</td><td>${miss(x.cargo_name)}</td><td>${miss(x.hs_code)}</td><td>${miss(x.pkg_qty)}</td><td>${miss(x.gw_kg)}</td><td>${miss(x.cbm_m3)}</td></tr>`).join('');
  return commonHead('factory','🏢 工厂段') + `<div class="card"><div class="section">${renderKV([
    ['货好日期', sheet.factory_cargo_ready?fmtD(sheet.factory_cargo_ready):'<span class="missing">____待补____</span>'],
    ['柜型', miss(sheet.factory_container_type || sheet.container_type)],
    ['货类', miss(sheet.factory_cargo_type)],
    ['备注', miss(sheet.factory_remarks)],
    ['电池/木包装/熏蒸', `${miss(attrs.battery)} / ${miss(attrs.wood_packaging)} / ${miss(attrs.fumigation)}`]
  ])}</div>
  <div class="section"><div style="font-size:12px;font-weight:800;margin-bottom:8px;">货物明细</div>
    <table class="cargo-t"><thead><tr><th>#</th><th>品名</th><th>HS</th><th>箱数</th><th>GW kg</th><th>CBM</th></tr></thead><tbody>${cargoRows || '<tr><td colspan="6"><span class="missing">____待补____</span></td></tr>'}</tbody></table>
  </div>
  <div class="section">${factoryForm()}</div></div>`;
}
function factoryForm(){
  if(owners.factory !== 'self') return readonlyAgent('factory');
  return `<div class="grid3">
    <div class="form-field"><label class="form-label">货好日期</label><input class="form-input" id="f_ready" type="date" value="${sheet.factory_cargo_ready?fmtD(sheet.factory_cargo_ready):''}"></div>
    <div class="form-field"><label class="form-label">柜型</label><input class="form-input" id="f_ct" value="${esc(sheet.factory_container_type||sheet.container_type||'')}"></div>
    <div class="form-field"><label class="form-label">货类</label><input class="form-input" id="f_cgt" value="${esc(sheet.factory_cargo_type||'普通货物')}"></div>
  </div>
  <div class="grid3">
    <div class="form-field"><label class="form-label">条款</label><input class="form-input" id="f_tt" value="${esc(sheet.freight_term||'')}"></div>
    <div class="form-field"><label class="form-label">车队 owner</label><select class="form-input" id="trucking_owner"><option value="self">self 自做</option><option value="agent">agent 外发</option></select></div>
    <div class="form-field"><label class="form-label">报关 owner</label><select class="form-input" id="customs_owner"><option value="self">self 自做</option><option value="agent">agent 外发</option></select></div>
  </div>
  <div class="form-field"><label class="form-label">备注</label><textarea class="form-input" id="f_remarks">${esc(sheet.factory_remarks||'')}</textarea></div>
  <button class="btn btn-green" onclick="saveFactory()">代填工厂段</button>`;
}
function renderCustomer(){
  const chosen = typeof sheet.customer_selected_sailing === 'string' ? (()=>{try{return JSON.parse(sheet.customer_selected_sailing)}catch(e){return {}}})() : (sheet.customer_selected_sailing || {});
  const sailBtns = (sheet.sailings||[]).map((x,i)=>`<div class="tog" onclick="pickSailing(${i})">${esc(x.carrier||'—')} · ${esc(x.vessel||'')} · ETD ${x.etd?fmtD(x.etd):'____待补____'}</div>`).join('');
  return commonHead('customer','👤 客户段') + `<div class="card"><div class="section">${renderKV([
    ['已选船期', miss([chosen.carrier, chosen.vessel, chosen.voyage].filter(Boolean).join(' '))],
    ['ETD', chosen.etd?fmtD(chosen.etd):'<span class="missing">____待补____</span>'],
    ['客户参考号', miss(sheet.customer_reference_no)],
    ['备注', miss(sheet.customer_remarks)]
  ])}</div><div class="section">${owners.customer==='self'?`
    <div class="toggle-row" id="sailingPick">${sailBtns || '<span class="missing">____待补____</span>'}</div>
    <div class="form-field" style="margin-top:10px;"><label class="form-label">客户备注</label><textarea class="form-input" id="c_remarks">${esc(sheet.customer_remarks||'')}</textarea></div>
    <button class="btn btn-green" onclick="saveCustomer()">代填客户确认</button>`:readonlyAgent('customer')}</div></div>`;
}
function renderTrucking(){
  const td = sheet.trucking_detail || {};
  const vs = Array.isArray(td.vehicles) ? td.vehicles : (td.plate ? [td] : []);
  const rows = vs.map((v,i)=>`<tr><td>${i+1}</td><td>${miss(v.plate)}</td><td>${miss(v.driver)}</td><td>${miss(v.driver_phone)}</td><td>${miss(v.cntr)}</td><td>${miss(v.seal_no)}</td></tr>`).join('');
  return commonHead('trucking','🚛 车队段') + `<div class="card"><div class="section"><table class="cargo-t"><thead><tr><th>#</th><th>车牌</th><th>司机</th><th>电话</th><th>柜号</th><th>封号</th></tr></thead><tbody>${rows || '<tr><td colspan="6"><span class="missing">____待补____</span></td></tr>'}</tbody></table></div><div class="section">${owners.trucking==='self'?truckForm(vs):readonlyAgent('trucking')}</div></div>`;
}
function truckForm(vs){
  const v = vs[0] || {};
  return `<div class="grid3">
    <div class="form-field"><label class="form-label">车牌</label><input class="form-input" id="t_plate" value="${esc(v.plate||'')}"></div>
    <div class="form-field"><label class="form-label">司机</label><input class="form-input" id="t_driver" value="${esc(v.driver||'')}"></div>
    <div class="form-field"><label class="form-label">司机电话</label><input class="form-input" id="t_phone" value="${esc(v.driver_phone||'')}"></div>
    <div class="form-field"><label class="form-label">柜号</label><input class="form-input" id="t_cntr" value="${esc(v.cntr||'')}"></div>
    <div class="form-field"><label class="form-label">封号</label><input class="form-input" id="t_seal" value="${esc(v.seal_no||'')}"></div>
    <div class="form-field"><label class="form-label">提箱时间</label><input class="form-input" id="t_pickup" type="datetime-local" value="${esc(v.pickup_time||'')}"></div>
  </div><button class="btn btn-green" onclick="saveTruck()">代填车队段</button>`;
}
function renderCustoms(){
  const ack = sheet.broker_ack || {};
  return commonHead('customs','🛂 报关段') + `<div class="card"><div class="section">${renderKV([
    ['接单确认', ack.confirmed ? '已确认' : '<span class="missing">____待补____</span>'],
    ['缺资料', miss(ack.missing_docs)],
    ['备注', miss(ack.remarks)],
    ['回填时间', ack.submitted_at ? esc(String(ack.submitted_at).replace('T',' ').slice(0,16)) : '<span class="missing">____待补____</span>']
  ])}</div><div class="section">${owners.customs==='self'?`
    <div class="form-field"><label class="form-label">缺资料</label><textarea class="form-input" id="b_missing">${esc(ack.missing_docs||'')}</textarea></div>
    <div class="form-field"><label class="form-label">备注</label><textarea class="form-input" id="b_remarks">${esc(ack.remarks||'')}</textarea></div>
    <button class="btn btn-green" onclick="saveBroker()">代填报关接单</button>`:readonlyAgent('customs')}</div></div>`;
}
function readonlyAgent(k){
  return `<div class="alert-callout"><b>外发 agent · 只读</b><br>${(statuses[k]||{}).done?'已回填。':'已发链接/待回填。'}主控不在此处代填，避免把外部链路 token 带入内部页面。</div>`;
}
function render(){
  renderTabs(); renderChips();
  if(curTab==='ocean') $('panel').innerHTML = renderOcean();
  if(curTab==='factory') $('panel').innerHTML = renderFactory();
  if(curTab==='customer') $('panel').innerHTML = renderCustomer();
  if(curTab==='trucking') $('panel').innerHTML = renderTrucking();
  if(curTab==='customs') $('panel').innerHTML = renderCustoms();
  if($('trucking_owner')) $('trucking_owner').value = owners.trucking || 'agent';
  if($('customs_owner')) $('customs_owner').value = owners.customs || 'agent';
}
async function refresh(){
  data = await api();
  sheet = data.booking_sheet || {};
  owners = data.owners || {};
  statuses = data.statuses || {};
  $('topBadge').textContent = sheet.shipment_no || '内部主控';
  $('bannerTitle').textContent = '🛟 洋宝宝主控 · ' + (sheet.shipment_no || '____待补____');
  render();
  show('stateForm');
}
async function saveFactory(){
  try{
    await api({ action:'factory-submit', cargo_ready_date:gv('f_ready'), container_type:gv('f_ct'), cargo_type:gv('f_cgt'),
      remarks:gv('f_remarks'), freight_term:gv('f_tt'), trucking_arrange:gv('trucking_owner'), customs_arrange:gv('customs_owner') });
    toast('✓ 工厂段已代填'); await refresh();
  }catch(e){ toast(e.message); }
}
let selectedSailing = null;
function pickSailing(i){ selectedSailing = (sheet.sailings||[])[i]; document.querySelectorAll('#sailingPick .tog').forEach((x,k)=>x.classList.toggle('on-blue',k===i)); }
async function saveCustomer(){
  if(!selectedSailing){ toast('请选择一个船期'); return; }
  try{ await api({ action:'customer-submit', selected_sailing:selectedSailing, remarks:gv('c_remarks') }); toast('✓ 客户段已代填'); await refresh(); }
  catch(e){ toast(e.message); }
}
async function saveTruck(){
  try{
    await api({ action:'trucking-submit', vehicles:[{plate:gv('t_plate'),driver:gv('t_driver'),driver_phone:gv('t_phone'),cntr:gv('t_cntr'),seal_no:gv('t_seal'),pickup_time:gv('t_pickup')} ] });
    toast('✓ 车队段已代填'); await refresh();
  }catch(e){ toast(e.message); }
}
async function saveBroker(){
  try{ await api({ action:'broker-submit', confirmed:true, missing_docs:gv('b_missing'), remarks:gv('b_remarks') }); toast('✓ 报关段已代填'); await refresh(); }
  catch(e){ toast(e.message); }
}
(async function boot(){
  if(!authToken()){ show('stateLogin'); return; }
  if(!planRef){ $('deadMsg').textContent='URL 需要 plan_id/_id/id。'; show('stateDead'); return; }
  try{ await refresh(); }catch(e){
    if(/auth|token|登录|Unauthorized|Forbidden/i.test(e.message)){ show('stateLogin'); return; }
    $('deadMsg').textContent = e.message; show('stateDead');
  }
})();
</script>
