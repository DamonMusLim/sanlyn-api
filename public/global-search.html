<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sanlyn 全局搜索</title>
  <link rel="stylesheet" href="/public/hgj-ui.css">
  <link rel="stylesheet" href="/public/wb-tabs.css">
  <style>
    body{margin:0;background:var(--hgj-bg);color:var(--hgj-text);font:16px/1.5 var(--hgj-font)}
    .page{max-width:1120px;margin:0 auto;padding:22px}.bar{display:flex;align-items:center;gap:16px;margin-bottom:14px}.brand{min-width:160px}.brand h1{font-size:16px;line-height:16px;margin:0;padding-left:10px;border-left:3px solid var(--hgj-primary);color:var(--hgj-title);font-weight:700}.meta{color:var(--hgj-muted);font-size:12px}.global-search{position:relative;flex:1;min-width:240px}.panel{background:var(--hgj-card);border:0;border-radius:0;box-shadow:none;padding:18px;margin-bottom:10px}.panel h2{font-size:16px;line-height:16px;margin:0 0 8px;padding-left:10px;border-left:3px solid var(--hgj-primary);color:var(--hgj-title);font-weight:700}.panel p{margin:6px 0;color:var(--hgj-muted)}
    @media(max-width:720px){.page{padding:14px}.bar{display:grid}.brand{min-width:0}.result{grid-template-columns:64px minmax(0,1fr)}}
  </style>
<script src="/public/wb-open-tab.js" data-protocol="sanlyn:open-tab"></script>
</head>
<body class="hgj-page">
  <div class="page">
    <header class="bar">
      <div class="brand">
        <h1 class="hgj-panel-title">全局搜索</h1>
        <div class="meta">v2026.08.26-1 · <span id="generatedAt"></span></div>
      </div>
      <div id="globalSearch" class="global-search"></div>
    </header>
    <section class="panel hgj-card">
      <h2 class="hgj-panel-title">独立测试页</h2>
      <p>可搜模块入口、提单号、订单号、客户/公司名、账单编号、集装箱号。少于 2 个字符不查库。</p>
      <p>模块入口来自后端固定白名单；业务数据依据 shipping_plans、orders、companies、customers、freight_supplier_bills、container_bookings、ports。</p>
    </section>
  </div>
  <script src="/global-search.js"></script>
  <script>
    document.getElementById("generatedAt").textContent="生成时间 "+new Date().toLocaleString("zh-CN");
    SanlynGlobalSearch.mount(document.getElementById("globalSearch"));
    if(window.parent!==window)window.parent.postMessage({type:"sanlyn:module-ready",title:"全局搜索",url:location.pathname+location.search},location.origin);
  </script>
</body>
</html>
