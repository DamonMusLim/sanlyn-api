<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>收付对账作战台</title>
  <style>
    :root{color-scheme:dark;--bg:#101316;--panel:#171c21;--panel2:#1d242a;--line:#303a43;--text:#e8edf2;--muted:#91a0ad;--risk:#b94a53;--todo:#c78a2c;--done:#2c936d;--stale:#66717c;--blue:#5b8dbd}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}
    header{position:sticky;top:0;z-index:3;background:rgba(16,19,22,.96);border-bottom:1px solid var(--line);padding:14px 18px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .brand{font-size:18px;font-weight:760}.muted{color:var(--muted)}.login,.search{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input{height:34px;background:#0c0f12;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:0 10px;min-width:150px}
    button{height:34px;border:1px solid #43505c;border-radius:6px;background:#242c34;color:var(--text);padding:0 12px;cursor:pointer}button:hover,.active{background:#2d3740;border-color:#6a7b89}.ghost{background:transparent}
    main{max-width:1360px;margin:0 auto;padding:16px 18px 28px}.queues{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;margin-bottom:12px}.queue{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left;height:auto}.queue.active{outline:2px solid var(--blue)}
    .q-title{font-size:13px;color:#cbd5df;margin-bottom:8px}.q-money{font-size:17px;font-weight:760;min-height:48px}.q-count{color:var(--muted);font-size:12px}.notice{display:none;margin:0 0 12px;padding:10px 12px;border:1px solid #60441e;background:#231b10;border-radius:8px;color:#f0c77a}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.list{display:flex;flex-direction:column;gap:8px}.row{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:12px}.row.child{margin-left:30px;background:#141a1f}.row.risk{border-left-color:var(--risk)}.row.todo{border-left-color:var(--todo)}.row.stale{border-left-color:var(--stale)}.row.done{border-left-color:var(--done)}
    .line{display:grid;grid-template-columns:minmax(220px,1fr) minmax(560px,2.2fr) minmax(150px,.7fr);gap:12px;align-items:center}.title{font-weight:760}.sub,.meta{color:var(--muted);font-size:12px;margin-top:3px}
    .settlements{display:flex;flex-direction:column;gap:7px}.settle{display:grid;grid-template-columns:minmax(150px,.9fr) minmax(290px,1.6fr) minmax(120px,.7fr);gap:8px;align-items:center;background:#10151a;border:1px solid #26313a;border-radius:6px;padding:8px;text-align:left;color:var(--text);height:auto}.settle:hover{border-color:#5e7181;background:#131a20}.settle.risk{background:#241519;border-color:#7c2e35}.settle.todo{border-color:#6b4c22}.settle.done{border-color:#245b48}.settle.stale{border-color:#4c5762}.rel{font-size:13px;font-weight:760}.party{color:#cbd5df;font-size:12px;margin-top:2px}.dir{font-size:11px;color:var(--muted);margin-top:2px}.linechips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
    .chip{display:inline-flex;align-items:center;min-height:24px;border-radius:999px;padding:3px 9px;border:1px solid transparent;font-size:12px;white-space:nowrap;max-width:100%}.chip.risk{background:#35191d;color:#f2a3aa;border-color:#7c2e35}.chip.todo{background:#332513;color:#f2c57e;border-color:#7b541d}.chip.done{background:#102c23;color:#9de2c1;border-color:#236a50}.chip.stale{background:#252b31;color:#c4ccd4;border-color:#4c5762}
    .amt{display:grid;grid-template-columns:repeat(3,minmax(92px,1fr));gap:6px;width:100%}.amt span{background:#10151a;border:1px solid #26313a;border-radius:6px;padding:5px 7px;color:#cdd6df;font-size:12px}.amt em{display:block;color:var(--muted);font-style:normal;font-size:11px}.action{width:100%;height:auto;min-height:34px;white-space:normal}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}#error{color:#ffb3b8;margin-left:8px}
    .typetabs{display:flex;gap:4px}.tt{height:32px;padding:0 14px;border:1px solid var(--line);background:#161c22;color:var(--muted);border-radius:6px;cursor:pointer;font-size:13px;font-weight:700}.tt.active{background:#243040;color:#cfe3ff;border-color:#3d6fa0}
    .actions{display:flex;flex-direction:column;gap:5px}.actions .action{width:100%;height:auto;min-height:30px;white-space:normal;font-size:12px;padding:5px 8px}.actions .action.done{opacity:.45;cursor:default}
    dialog{border:1px solid var(--line);border-radius:8px;background:#171c21;color:var(--text);padding:0;max-width:460px;width:calc(100% - 28px)}dialog::backdrop{background:rgba(0,0,0,.55)}.modal{padding:16px}.modal h3{margin:0 0 8px;font-size:16px}.modal p{margin:0 0 14px;color:#cbd5df}.modal-actions{display:flex;justify-content:flex-end;gap:8px}
    @media(max-width:960px){.queues{grid-template-columns:repeat(2,1fr)}.line{grid-template-columns:1fr}.settle{grid-template-columns:1fr}.linechips{justify-content:flex-start}.row.child{margin-left:12px}.amt{grid-template-columns:1fr 1fr}input{min-width:120px}}
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div><div class="brand">收付对账作战台</div><div class="muted" id="who">未登录</div></div>
      <form class="login" id="loginForm">
        <input id="username" autocomplete="username" placeholder="用户名">
        <input id="password" type="password" autocomplete="current-password" placeholder="密码">
        <button>登录</button><span id="error"></span>
      </form>
    </div>
  </header>
  <main>
    <section class="queues" id="queues"></section>
    <div class="notice" id="notice"></div>
    <div class="toolbar">
      <form class="search" id="searchForm"><input id="q" placeholder="搜索订单/合同/客户/CY单"><button>查询</button></form>
      <div class="typetabs" id="typetabs"><button class="tt active" data-type="all" type="button">全部</button><button class="tt" data-type="order" type="button">订单</button><button class="tt" data-type="shipment" type="button">海运</button></div>
      <div><button class="ghost" id="clearFilter" type="button">清筛选</button> <span class="muted" id="count"></span></div>
    </div>
    <section class="list" id="list"><div class="empty">登录后加载数据</div></section>
  </main>
  <dialog id="modal"><div class="modal"><h3 id="modalTitle"></h3><p id="modalText"></p><div class="modal-actions"><button class="ghost" id="modalSecond">取消</button><button id="modalMain">知道了</button></div></div></dialog>
  <script>
    const $=id=>document.getElementById(id);
    const state={token:localStorage.getItem("sanlyn_jwt")||localStorage.getItem("sanlyn_token")||"",rows:[],summary:[],filter:"all",type_filter:"all"};
    const labels={ar_due:"今日应收未收",ap_due:"今日应付未付",invoice_pending:"资料齐待开票",slip_pending:"客户水单待认领",risk:"异常待核"};
    function authHeaders(){return state.token?{Authorization:"Bearer "+state.token}:{}}
    async function api(path,opts={}){
      const r=await fetch(path,{...opts,headers:{"Content-Type":"application/json",...authHeaders(),...(opts.headers||{})}});
      const data=await r.json().catch(()=>({error:"请求失败"}));
      if(!r.ok)throw new Error(data.message||data.error||"请求失败");
      return data;
    }
    function fmt(n){return Number(n||0).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2})}
    function money(cur,n){return n==null?"—":`${cur||"CNY"} ${fmt(n)}`}
    function relTime(v){if(!v)return"无更新时间";const d=new Date(v);const days=Math.floor((Date.now()-d)/86400000);if(days<=0)return"今天";if(days<31)return`${days}天前`;return d.toISOString().slice(0,10)}
    function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
    function chip(text,tone,why=""){return `<button type="button" class="chip ${tone}" data-action="chip" data-title="${esc(text)}" data-text="${esc(why||text)}">${esc(text)}</button>`}
    function tag(text,tone){return `<span class="chip ${tone}">${esc(text)}</span>`}
    function queueMoney(q){return (q.amounts||[]).length?(q.amounts||[]).map(a=>`<div>${esc(a.currency)} ${fmt(a.amount)}</div>`).join(""):"<div>—</div>"}
    function linesOf(r){return r.settlement_lines||[]}
    function rowInFilter(r){
      if(state.filter==="all")return true;
      if(state.filter==="ar_due")return linesOf(r).some(l=>l.direction==="ar"&&l.due>1);
      if(state.filter==="ap_due")return linesOf(r).some(l=>l.direction==="ap"&&l.due>1);
      if(state.filter==="invoice_pending")return r.customer_side?.invoice_status==="pending";
      if(state.filter==="slip_pending")return r.type==="order"&&r.amounts.receivable_due>1&&!r.signals.customer_slip_uploaded;
      if(state.filter==="risk")return r.tone==="risk"||linesOf(r).some(l=>l.tone==="risk"||l.data_missing);
      return true;
    }
    function renderQueues(){
      const byKey=new Map((state.summary||[]).map(q=>[q.key,q]));
      $("queues").innerHTML=Object.keys(labels).map(key=>{
        const q=byKey.get(key)||{key,label:labels[key],amounts:[],count:0};
        return `<button class="queue ${state.filter===key?"active":""}" data-filter="${key}"><div class="q-title">${esc(q.label)}</div><div class="q-money">${queueMoney(q)}</div><div class="q-count">${q.count||0} 票/张</div></button>`;
      }).join("");
    }
    function lineStatusLabel(l){
      if(l.data_missing)return l.missing_reason||"数据缺失";
      if(l.status==="paid")return"闭环";
      if(l.status==="partial")return"部分核销";
      return"未闭环";
    }
    function invoiceLabel(l){
      if(!l.invoice_status)return"";
      if(l.invoice_status==="blocked")return"开票blocked";
      if(l.invoice_status==="pending")return l.counterparty_type==="forwarder"?"运费待开票":"待开票";
      if(l.invoice_status==="confirmed")return"待确认";
      if(l.invoice_status==="issued"||l.invoice_status==="invoiced")return"已开票";
      return l.invoice_status;
    }
    function settlementHtml(l){
      const side=l.direction==="ap"?"应付":"应收";
      const chips=[];
      if(l.data_missing)chips.push(tag(l.missing_reason||"数据缺失","risk"));
      const inv=invoiceLabel(l); if(inv)chips.push(tag(inv,l.tone||"todo"));
      chips.push(tag(lineStatusLabel(l),l.tone||"todo"));
      return `<button type="button" class="settle ${esc(l.tone||"")}" data-line-id="${esc(l.id)}" title="打开具体记录">
        <div><div class="rel">${esc(l.relation_label||"结算关系")}</div><div class="party">${esc(l.counterparty_name||l.missing_reason||"未补录")} ${l.counterparty_code?`· ${esc(l.counterparty_code)}`:""}</div><div class="dir">${side} · ${esc(l.counterparty_label||"对方")}</div></div>
        <div class="amt"><span><em>${side}${esc(l.currency)}</em>${money(l.currency,l.total)}</span><span><em>已结${esc(l.currency)}</em>${money(l.currency,l.paid)}</span><span><em>待结${esc(l.currency)}</em>${money(l.currency,l.due)}</span></div>
        <div class="linechips">${chips.join("")}</div>
      </button>`;
    }
    function rowHtml(r){
      const child=r.type==="shipment"&&!r.is_top_level;
      return `<article class="row ${r.tone} ${child?"child":""}" data-id="${esc(r.id)}">
        <div class="line">
          <div><div class="title">${esc(r.title)}</div><div class="sub">${esc(r.subtitle)}</div><div class="meta">经手:${esc(r.owner||"未指派")} · ${relTime(r.last_action_at)}</div></div>
          <div class="settlements">${linesOf(r).map(settlementHtml).join("")||'<div class="muted">无结算线</div>'}</div>
          ${rowActionsHtml(r)}
        </div>
      </article>`;
    }
    function rowActions(r){
      const c=r.customer_side||{}, f=r.factory_side||{}, acts=[], lines=linesOf(r);
      if(lines.some(l=>l.data_missing&&l.missing_reason==="缺货代")) acts.push(["补录货代",recordHash(r)]);
      if(lines.some(l=>l.direction==="ap"&&l.counterparty_type==="factory"&&l.due>1)) acts.push(["登记工厂付款",`payments?order_no=${encodeURIComponent(r.order_no||"")}&counterparty_type=factory`]);
      if(lines.some(l=>l.direction==="ap"&&l.counterparty_type==="forwarder"&&l.due>1)) acts.push(["登记货代付款",`payments?shipment_id=${encodeURIComponent(recordShipmentId(r)||"")}&counterparty_type=forwarder`]);
      if(r.type==="order"){
        if(c.invoice_status==="pending"||c.invoice_status==="confirmed") acts.push(["确认票面开票","invoices"]);
        else if(c.invoice_status==="blocked") acts.push(["补报关资料","customs"]);
        if(r.amounts.receivable_due>1&&!r.signals.customer_slip_uploaded) acts.push(["催客户传水单","payments"]);
        else if(r.amounts.receivable_due>1) acts.push(["催客户收款","payments"]);
      } else if(r.type==="shipment"){
        if(f.invoice_status!=="invoiced") acts.push(["运费待开票","invoices"]);
        if(r.amounts.receivable_due>1) acts.push(["催收运费","payments"]);
      }
      if(!acts.length) acts.push(["—已闭环",""]);
      return acts;
    }
    function rowActionsHtml(r){
      return `<div class="actions">`+rowActions(r).map(([label,hash])=>
        hash?`<button class="action" data-goto="${esc(hash)}" title="到 ${esc(label)} 环节">${esc(label)} ↗</button>`
            :`<button class="action done" disabled>${esc(label)}</button>`).join("")+`</div>`;
    }
    function gotoModule(hash){
      if(!hash)return;
      try{ if(window.parent&&window.parent!==window){window.parent.location.hash=hash;} else {window.location.href="/data#"+hash;} }
      catch(e){ window.open("/data#"+hash,"_blank"); }
    }
    function recordShipmentId(r){
      return r.shipment_id||r._id||(linesOf(r)[0]&&linesOf(r)[0].refs&&(linesOf(r)[0].refs.shipment_id||linesOf(r)[0].refs.shipment_no))||r.shipment_no||r.bl_no||"";
    }
    function recordHash(r){
      if(!r)return"";
      if(r.type==="order")return `orders?order_no=${encodeURIComponent(r.order_no||"")}`;
      return `shipping?shipment_id=${encodeURIComponent(recordShipmentId(r))}&shipment_no=${encodeURIComponent(r.shipment_no||"")}`;
    }
    function gotoRecord(row,line){
      if(line&&line.refs){
        if(line.refs.order_no)return gotoModule(`orders?order_no=${encodeURIComponent(line.refs.order_no)}`);
        if(line.refs.shipment_id||line.refs.shipment_no)return gotoModule(`shipping?shipment_id=${encodeURIComponent(line.refs.shipment_id||line.refs.shipment_no)}&shipment_no=${encodeURIComponent(line.refs.shipment_no||"")}`);
      }
      gotoModule(recordHash(row));
    }
    function render(){
      renderQueues();
      const tf=state.type_filter;
      const childrenOf=o=>state.rows.filter(x=>x.type==="shipment"&&x.parent_order_no===o.order_no);
      let html="",shown=0;
      if(tf==="shipment"){
        const ships=state.rows.filter(r=>r.type==="shipment").filter(rowInFilter);
        ships.forEach(x=>{html+=rowHtml(x)});shown=ships.length;
      } else {
        const top=state.rows.filter(r=>r.type==="order"||(tf==="all"&&r.is_top_level)).filter(r=>rowInFilter(r)||(r.type==="order"&&childrenOf(r).some(rowInFilter)));
        for(const r of top){
          html+=rowHtml(r);
          if(r.type==="order"&&tf==="all") childrenOf(r).filter(x=>state.filter==="all"||rowInFilter(x)).forEach(x=>html+=rowHtml(x));
        }
        shown=top.length;
      }
      $("list").innerHTML=html||'<div class="empty">没有匹配数据</div>';
      $("count").textContent=`显示 ${shown} / 总 ${state.rows.length} 票`;
    }
    async function load(){
      const q=encodeURIComponent($("q").value.trim());
      const [board,summary]=await Promise.all([api(`/api/db/recon-board?action=board&limit=500&q=${q}`),api("/api/db/recon-board?action=summary")]);
      state.rows=board.rows||[];state.summary=summary.summary?.queues||[];
      $("notice").style.display=board.unclassified_payments_count?"block":"none";
      $("notice").textContent=`另有 ${board.unclassified_payments_count||0} 笔未标方向付款，未计入收/付状态，待治理方向字段后归位。`;
      render();
    }
    function openModal(title,text){$("modalTitle").textContent=title;$("modalText").textContent=text;$("modal").showModal()}
    $("loginForm").addEventListener("submit",async e=>{
      e.preventDefault();$("error").textContent="";
      try{const d=await api("/api/db/auth-login",{method:"POST",body:JSON.stringify({username:$("username").value,password:$("password").value})});state.token=d.token;localStorage.setItem("sanlyn_token",d.token);$("who").textContent=`${d.user.username} · ${d.user.role}`;$("loginForm").style.display="none";await load()}catch(err){$("error").textContent=err.message}
    });
    $("searchForm").addEventListener("submit",e=>{e.preventDefault();load().catch(err=>$("error").textContent=err.message)});
    $("queues").addEventListener("click",e=>{const b=e.target.closest("[data-filter]");if(!b)return;state.filter=state.filter===b.dataset.filter?"all":b.dataset.filter;render()});
    $("clearFilter").addEventListener("click",()=>{state.filter="all";render()});
    $("typetabs").addEventListener("click",e=>{const b=e.target.closest("[data-type]");if(!b)return;state.type_filter=b.dataset.type;[...$("typetabs").children].forEach(c=>c.classList.toggle("active",c===b));render()});
    $("list").addEventListener("click",e=>{
      const g=e.target.closest("[data-goto]");if(g){gotoModule(g.dataset.goto);return;}
      const b=e.target.closest("[data-action]");if(b){openModal(b.dataset.title,b.dataset.text);return;}
      const rowEl=e.target.closest(".row");if(!rowEl)return;
      const row=state.rows.find(x=>x.id===rowEl.dataset.id);if(!row)return;
      const lineEl=e.target.closest("[data-line-id]");
      const line=lineEl?linesOf(row).find(x=>x.id===lineEl.dataset.lineId):null;
      gotoRecord(row,line);
    });
    $("modalSecond").addEventListener("click",()=>$("modal").close());$("modalMain").addEventListener("click",()=>$("modal").close());
    if(state.token){$("who").textContent="已登录（token）";load().catch(err=>{localStorage.removeItem("sanlyn_token");$("who").textContent="登录已过期，请重新登录";$("error").textContent=err.message})}
  </script>
</body>
</html>
