<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>收付对账作战台</title>
  <style>
    :root{color-scheme:dark;--bg:#101316;--panel:#171c21;--panel2:#1d242a;--line:#303a43;--text:#e8edf2;--muted:#91a0ad;--risk:#b94a53;--todo:#c78a2c;--done:#2c936d;--stale:#66717c;--blue:#5b8dbd}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}
    header{position:sticky;top:0;z-index:3;background:rgba(16,19,22,.96);border-bottom:1px solid var(--line);padding:14px 18px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .brand{font-size:18px;font-weight:760}.muted{color:var(--muted)}.login,.search{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input{height:34px;background:#0c0f12;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:0 10px;min-width:150px}
    button{height:34px;border:1px solid #43505c;border-radius:6px;background:#242c34;color:var(--text);padding:0 12px;cursor:pointer}button:hover,.active{background:#2d3740;border-color:#6a7b89}.ghost{background:transparent}
    main{max-width:1360px;margin:0 auto;padding:16px 18px 28px}.queues{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;margin-bottom:12px}.queue{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left;height:auto}.queue.active{outline:2px solid var(--blue)}
    .q-title{font-size:13px;color:#cbd5df;margin-bottom:8px}.q-money{font-size:17px;font-weight:760;min-height:48px}.q-count{color:var(--muted);font-size:12px}.notice{display:none;margin:0 0 12px;padding:10px 12px;border:1px solid #60441e;background:#231b10;border-radius:8px;color:#f0c77a}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.list{display:flex;flex-direction:column;gap:8px}.row{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:12px}.row.child{margin-left:30px;background:#141a1f}.row.risk{border-left-color:var(--risk)}.row.todo{border-left-color:var(--todo)}.row.stale{border-left-color:var(--stale)}.row.done{border-left-color:var(--done)}
    .line{display:grid;grid-template-columns:minmax(220px,1fr) minmax(560px,2.2fr) minmax(150px,.7fr);gap:12px;align-items:center}.title{font-weight:760}.sub,.meta{color:var(--muted);font-size:12px;margin-top:3px}
    .settlements{display:flex;flex-direction:column;gap:7px}.settle{display:grid;grid-template-columns:minmax(150px,.9fr) minmax(290px,1.6fr) minmax(120px,.7fr);gap:8px;align-items:center;background:#10151a;border:1px solid #26313a;border-radius:6px;padding:8px;text-align:left;color:var(--text);height:auto}.settle:hover{border-color:#5e7181;background:#131a20}.settle.risk{background:#241519;border-color:#7c2e35}.settle.todo{border-color:#6b4c22}.settle.done{border-color:#245b48}.settle.stale{border-color:#4c5762}.rel{font-size:13px;font-weight:760}.party{color:#cbd5df;font-size:12px;margin-top:2px}.dir{font-size:11px;color:var(--muted);margin-top:2px}.linechips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
    .chip{display:inline-flex;align-items:center;min-height:24px;border-radius:999px;padding:3px 9px;border:1px solid transparent;font-size:12px;white-space:nowrap;max-width:100%}.chip.risk{background:#35191d;color:#f2a3aa;border-color:#7c2e35}.chip.todo{background:#332513;color:#f2c57e;border-color:#7b541d}.chip.done{background:#102c23;color:#9de2c1;border-color:#236a50}.chip.stale{background:#252b31;color:#c4ccd4;border-color:#4c5762}
    .amt{display:grid;grid-template-columns:repeat(3,minmax(92px,1fr));gap:6px;width:100%}.amt span{background:#10151a;border:1px solid #26313a;border-radius:6px;padding:5px 7px;color:#cdd6df;font-size:12px}.amt em{display:block;color:var(--muted);font-style:normal;font-size:11px}.action{width:100%;height:auto;min-height:34px;white-space:normal}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}#error{color:#ffb3b8;margin-left:8px}
    .typetabs{display:flex;gap:4px}.tt{height:32px;padding:0 14px;border:1px solid var(--line);background:#161c22;color:var(--muted);border-radius:6px;cursor:pointer;font-size:13px;font-weight:700}.tt.active{background:#243040;color:#cfe3ff;border-color:#3d6fa0}
    .acct-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}.acct-title{font-size:15px;font-weight:760;color:var(--text)}.totals{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}.totalbox{min-width:300px;background:#10151a;border:1px solid #2c3a45;border-radius:6px;padding:6px}.acct-lines{display:flex;flex-direction:column;gap:7px;margin-top:8px}.ref{font-size:13px;font-weight:760;color:var(--text)}
    .detail{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:#10151a;border:1px solid #26313a;border-top:none;border-radius:0 0 6px 6px;margin-top:-7px;padding:7px 10px 8px;font-size:12px;color:#cdd6df}.detail .f{display:flex;gap:4px;align-items:center;white-space:nowrap}.detail .f em{color:var(--muted);font-style:normal}.detail .slip-link{color:#7fb2e0;text-decoration:none}.detail .slip-link:hover{text-decoration:underline}.detail .ship-info{margin-left:auto;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
    .actions{display:flex;flex-direction:column;gap:5px}.actions .action{width:100%;height:auto;min-height:30px;white-space:normal;font-size:12px;padding:5px 8px}.actions .action.done{opacity:.45;cursor:default}
    dialog{border:1px solid var(--line);border-radius:8px;background:#171c21;color:var(--text);padding:0;max-width:460px;width:calc(100% - 28px)}
    dialog.wide{max-width:880px}
    .paytable{width:100%;border-collapse:collapse;font-size:12.5px}
    .paytable th,.paytable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    .paytable th{color:#8b98a5;font-weight:500;white-space:nowrap}
    .paytable td:nth-child(1),.paytable td:nth-child(2){white-space:nowrap}
    .paytable td:nth-child(3){text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
    .paytable td:nth-child(4){min-width:120px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .paytable td:nth-child(5){max-width:250px;word-break:break-all}
    .paytable td:nth-child(6){white-space:nowrap}dialog::backdrop{background:rgba(0,0,0,.55)}.modal{padding:16px}.modal h3{margin:0 0 8px;font-size:16px}.modal p{margin:0 0 14px;color:#cbd5df}.modal-actions{display:flex;justify-content:flex-end;gap:8px}
    @media(max-width:960px){.queues{grid-template-columns:repeat(2,1fr)}.line{grid-template-columns:1fr}.settle{grid-template-columns:1fr}.linechips{justify-content:flex-start}.row.child{margin-left:12px}.amt{grid-template-columns:1fr 1fr}input{min-width:120px}.acct-head{flex-direction:column}.totals{justify-content:flex-start}}
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div><div class="brand">收付对账作战台</div><div class="muted" id="who">未登录</div></div>
      <form class="login" id="loginForm">
        <input id="username" autocomplete="username" placeholder="用户名">
        <input id="password" type="password" autocomplete="current-password" placeholder="密码">
        <button>登录</button><span id="error"></span>
      </form>
    </div>
  </header>
  <main>
    <section class="queues" id="queues"></section>
    <div class="notice" id="notice"></div>
    <div class="toolbar">
      <form class="search" id="searchForm"><input id="q" placeholder="搜索订单/合同/客户/CY单"><button>查询</button></form>
      <div class="typetabs" id="typetabs"><button class="tt" data-view="cust" type="button">应收·客户</button><button class="tt" data-view="factory" type="button">应付·工厂</button><button class="tt" data-view="forwarder" type="button">应付·货代</button><button class="tt active" data-view="order" type="button">订单闭环</button></div>
      <div><button class="ghost" id="clearFilter" type="button">清筛选</button> <span class="muted" id="count"></span></div>
    </div>
    <section class="list" id="list"><div class="empty">登录后加载数据</div></section>
  </main>
  <dialog id="modal"><div class="modal"><h3 id="modalTitle"></h3><p id="modalText"></p><div class="modal-actions"><button class="ghost" id="modalSecond">取消</button><button id="modalMain">知道了</button></div></div></dialog>
  <script>
    const $=id=>document.getElementById(id);
    const state={token:localStorage.getItem("sanlyn_jwt")||localStorage.getItem("sanlyn_token")||"",rows:[],summary:[],filter:"all",view:"order"};
    const labels={ar_due:"今日应收未收",ap_due:"今日应付未付",invoice_pending:"资料齐待开票",slip_pending:"客户水单待认领",price_review:"改价待审",risk:"异常待核"};
    function authHeaders(){return state.token?{Authorization:"Bearer "+state.token}:{}}
    async function api(path,opts={}){
      const r=await fetch(path,{...opts,headers:{"Content-Type":"application/json",...authHeaders(),...(opts.headers||{})}});
      const data=await r.json().catch(()=>({error:"请求失败"}));
      if(!r.ok)throw new Error(data.message||data.error||"请求失败");
      return data;
    }
    function fmt(n){return Number(n||0).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2})}
    function money(cur,n){return n==null?"—":`${cur||"CNY"} ${fmt(n)}`}
    function relTime(v){if(!v)return"无更新时间";const d=new Date(v);const days=Math.floor((Date.now()-d)/86400000);if(days<=0)return"今天";if(days<31)return`${days}天前`;return d.toISOString().slice(0,10)}
    function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
    function chip(text,tone,why=""){return `<button type="button" class="chip ${tone}" data-action="chip" data-title="${esc(text)}" data-text="${esc(why||text)}">${esc(text)}</button>`}
    function tag(text,tone){return `<span class="chip ${tone}">${esc(text)}</span>`}
    function queueMoney(q){return (q.amounts||[]).length?(q.amounts||[]).map(a=>`<div>${esc(a.currency)} ${fmt(a.amount)}</div>`).join(""):"<div>—</div>"}
    function linesOf(r){return r.settlement_lines||[]}
    function rowInFilter(r){
      if(state.filter==="all")return true;
      if(state.filter==="ar_due")return linesOf(r).some(l=>l.direction==="ar"&&l.due>1);
      if(state.filter==="ap_due")return linesOf(r).some(l=>l.direction==="ap"&&l.due>1);
      if(state.filter==="invoice_pending")return r.customer_side?.invoice_status==="pending";
      if(state.filter==="slip_pending")return r.type==="order"&&r.amounts.receivable_due>1&&!r.signals.customer_slip_uploaded;
      if(state.filter==="price_review")return r.type==="shipment"&&r.pending_price_review;
      if(state.filter==="risk")return r.tone==="risk"||linesOf(r).some(l=>l.tone==="risk"||l.data_missing);
      return true;
    }
    function renderQueues(){
      const byKey=new Map((state.summary||[]).map(q=>[q.key,q]));
      $("queues").innerHTML=Object.keys(labels).map(key=>{
        const q=byKey.get(key)||{key,label:labels[key],amounts:[],count:0};
        return `<button class="queue ${state.filter===key?"active":""}" data-filter="${key}"><div class="q-title">${esc(q.label)}</div><div class="q-money">${queueMoney(q)}</div><div class="q-count">${q.count||0} 票/张</div></button>`;
      }).join("");
    }
    function lineStatusLabel(l){
      if(l.data_missing)return l.missing_reason||"数据缺失";
      if(l.status==="paid")return"闭环";
      if(l.status==="partial")return"部分核销";
      return"未闭环";
    }
    function invoiceLabel(l){
      if(!l.invoice_status)return"";
      if(l.invoice_status==="blocked")return"开票blocked";
      if(l.invoice_status==="pending")return l.counterparty_type==="forwarder"?"运费待开票":"待开票";
      if(l.invoice_status==="confirmed")return"待确认";
      if(l.invoice_status==="issued"||l.invoice_status==="invoiced")return"已开票";
      return "";
    }
    function overpayChip(l){
      const over=Number(l.paid||0)-Number(l.total||0);
      if(over<=1)return"";
      if(l.direction==="ar")return tag(`超收¥${fmt(over)}`,"risk");
      if(l.direction==="ap")return tag(`超付¥${fmt(over)}`,"risk");
      return"";
    }
    function invoiceConfirmChip(r){
      if(r.type!=="shipment")return"";
      const status=r.invoice_confirm_status||"none";
      const actor=r.confirm_actor?` · ${r.confirm_actor}`:"";
      const at=r.confirm_at?` · ${relTime(r.confirm_at)}`:"";
      if(status==="pending_our_review")return chip("⚠改价待审","risk",`港杂费改价待我方审批${actor}${at}`);
      if(status==="external_confirmed")return chip("已确认","done",`对方已确认港杂费开票信息${actor}${at}`);
      return chip("待对方确认","stale","对方尚未确认港杂费开票信息");
    }
    function settlementHtml(l){
      const side=l.direction==="ap"?"应付":"应收";
      const chips=[];
      if(l.data_missing)chips.push(tag(l.missing_reason||"数据缺失","risk"));
      const inv=invoiceLabel(l); if(inv)chips.push(tag(inv,l.tone||"todo"));
      chips.push(tag(lineStatusLabel(l),l.tone||"todo"));
      const over=overpayChip(l); if(over)chips.push(over);
      return `<button type="button" class="settle ${esc(l.tone||"")}" data-line-id="${esc(l.id)}" title="打开具体记录">
        <div><div class="rel">${esc(l.relation_label||"结算关系")}</div><div class="party">${esc(l.counterparty_name||l.missing_reason||"未补录")} ${l.counterparty_code?`· ${esc(l.counterparty_code)}`:""}</div><div class="dir">${side} · ${esc(l.counterparty_label||"对方")}</div></div>
        <div class="amt"><span><em>${side}${esc(l.currency)}</em>${money(l.currency,l.total)}</span><span><em>已结${esc(l.currency)}</em>${money(l.currency,l.paid)}</span><span><em>待结${esc(l.currency)}</em>${money(l.currency,l.due)}</span></div>
        <div class="linechips">${chips.join("")}</div>
      </button>`;
    }
    function feeChipsHtml(r){
      if(r.type!=="shipment"||!Array.isArray(r.fees)||!r.fees.length)return"";
      const L={freight:"海运费",port:"港杂/其他",truck:"车队",customs:"报关",unknown:"未分类"};
      const st=f=>f.paid>1?(f.due<=1?["已付","done"]:["部分付","todo"]):["无付款记录","stale"];
      const chips=[];
      for(const k of ["freight","port","truck","customs"]){
        const fs=r.fees.filter(f=>f.fee_class===k);
        if(!fs.length){chips.push(tag(`${L[k]} —`,"stale"));continue;}
        for(const f of fs){const s=st(f);chips.push(tag(`${L[k]} ${money(f.currency,f.amount)} ${s[0]}`,s[1]));}
      }
      for(const f of r.fees.filter(f=>f.fee_class==="unknown")){const s=st(f);chips.push(tag(`${L.unknown} ${money(f.currency,f.amount)} ${s[0]}`,s[1]));}
      return `<div class="linechips" style="justify-content:flex-start;margin-top:6px">${chips.join("")}</div>`;
    }
    function orderDatesMeta(r){
      if(r.type!=="order")return"";
      return `下单:${fmtDate(r.order_date)} · 交货:${fmtDate(r.delivery_date)} · `;
    }
    // 数据可疑徽章:0价格/无锚、方向错挂、只有水单没入账 —— 让"不能当真"的单一眼可见
    function dataAlertChips(r){
      if(r.type!=="order")return"";
      const c=r.customer_side||{},s=r.slip||{},chips=[];
      const anchored=c.anchored!=null?c.anchored:r.anchored;
      if(!anchored) chips.push(tag("❗未报关·应收无价","risk"));
      else if(!(c.receivable>1)) chips.push(tag("❗0价格·待核","risk"));
      if(s.direction_warn) chips.push(tag("❗水单方向错挂·非客户付款","risk"));
      if((s.alloc||0)>1 && !((c.received||0)>1)) chips.push(tag("⚠有水单未入账","todo"));
      return chips.length?`<div class="linechips" style="justify-content:flex-start;margin-top:6px">${chips.join("")}</div>`:"";
    }
    function rowHtml(r){
      const child=r.type==="shipment"&&!r.is_top_level;
      return `<article class="row ${r.tone} ${child?"child":""}" data-id="${esc(r.id)}">
        <div class="line">
          <div><div class="title">${esc(r.title)}</div><div class="sub">${esc(r.subtitle)}</div><div class="meta">${orderDatesMeta(r)}经手:${esc(r.owner||"未指派")} · ${relTime(r.last_action_at)}</div><div class="linechips" style="justify-content:flex-start;margin-top:7px">${invoiceConfirmChip(r)}</div>${dataAlertChips(r)}${feeChipsHtml(r)}</div>
          <div class="settlements">${linesOf(r).map(settlementHtml).join("")||'<div class="muted">无结算线</div>'}</div>
          ${rowActionsHtml(r)}
        </div>
      </article>`;
    }
    function rowActions(r){
      const acts=[], lines=linesOf(r);
      if(lines.some(l=>l.data_missing&&l.missing_reason==="缺货代")) acts.push(["补录货代",recordHash(r)]);
      if(lines.some(l=>l.direction==="ap"&&l.counterparty_type==="forwarder"&&l.due>1)) acts.push(["登记货代付款",`payments?shipment_id=${encodeURIComponent(recordShipmentId(r)||"")}&counterparty_type=forwarder`]);
      const next=r.next_action||{};
      if(next.label){
        const kind=next.kind||"none";
        let hash="";
        if(kind==="confirm_invoice") hash="invoices";
        else if(kind==="copy_slip_link") hash="payments";
        else if(kind==="goto_payment"){
          if(next.label==="催客户收款"||next.label==="催收运费") hash="payments";
          else if(next.label==="登记货代付款") hash=`payments?shipment_id=${encodeURIComponent(recordShipmentId(r)||"")}&counterparty_type=forwarder`;
          else hash=`payments?order_no=${encodeURIComponent(r.order_no||"")}&counterparty_type=factory`;
        }
        if(!acts.some(a=>a[0]===next.label)) acts.push([next.label,hash]);
      }
      if(!acts.length) acts.push(["—已闭环",""]);
      return acts;
    }
    function rowActionsHtml(r){
      const review=r.type==="shipment"&&r.pending_price_review?`<button class="action" data-review="approve" data-row-id="${esc(r.id)}">通过改价</button><button class="action" data-review="reject" data-row-id="${esc(r.id)}">驳回改价</button>`:"";
      return `<div class="actions">`+review+rowActions(r).map(([label,hash])=>
        hash?`<button class="action" data-goto="${esc(hash)}" title="到 ${esc(label)} 环节">${esc(label)} ↗</button>`
            :`<button class="action done" disabled>${esc(label)}</button>`).join("")+`</div>`;
    }
    function objectLineInFilter(l,view){
      if(state.filter==="all")return true;
      if(state.filter==="ar_due")return view==="cust"&&l.due>1;
      if(state.filter==="ap_due")return view!=="cust"&&l.due>1;
      if(state.filter==="risk")return l.tone==="risk"||l.data_missing;
      return true;
    }
    function objectLines(view){
      return state.rows.flatMap(r=>linesOf(r).map(l=>({l,r}))).filter(({l})=>{
        if(view==="cust")return l.direction==="ar"&&objectLineInFilter(l,view);
        if(view==="factory")return l.direction==="ap"&&l.counterparty_type==="factory"&&objectLineInFilter(l,view);
        return l.direction==="ap"&&l.counterparty_type==="forwarder"&&objectLineInFilter(l,view);
      });
    }
    function lineRef(l){
      const refs=l.refs||{};
      return refs.order_no||refs.shipment_no||l.relation_label||"关联记录";
    }
    function fmtDate(v){if(!v)return"—";const d=new Date(v);if(isNaN(d))return esc(String(v));return d.toISOString().slice(0,10)}
    function poField(r){return `<div class="f"><em>PO</em>${esc(r.order_no||r.contract_no||"—")}</div>`}
    function deliveryField(r){
      const s=r.shipping||{};
      const v=r.delivery_date||r.deliver_at||s.eta||s.etd;
      return `<div class="f"><em>交货</em>${fmtDate(v)}</div>`;
    }
    function anchorPriceField(r){
      const c=r.customer_side||{};
      const anchored=c.anchored!=null?c.anchored:r.anchored;
      const pending=(c.receivable_status||r.receivable_status)==="pending_customs";
      if(anchored===false||pending)return `<div class="f">${tag("待报关","todo")}</div>`;
      const cur=c.currency||"CNY",amt=c.receivable;
      if(amt==null)return `<div class="f">${tag("待报关","todo")}</div>`;
      return `<div class="f"><em>价格</em>${money(cur,amt)}</div>`;
    }
    function monthField(r){
      const s=r.shipping||{};
      const v=r.month||r.settle_month||s.etd||r.delivery_date;
      if(!v)return `<div class="f"><em>月份</em>—</div>`;
      const d=new Date(v);
      return `<div class="f"><em>月份</em>${isNaN(d)?esc(String(v)):d.toISOString().slice(0,7)}</div>`;
    }
    function receivedField(r,view){
      const c=r.customer_side||{};
      const cur=c.currency||(linesOf(r)[0]&&linesOf(r)[0].currency)||"CNY";
      const v=view==="cust"?c.received:r.received;
      return `<div class="f"><em>代收款</em>${money(cur,v)}</div>`;
    }
    function slipField(r,view){
      const url=view==="cust"?r.slip_file_url:(r.slip_file_url||null);
      if(url)return `<a class="slip-link" href="${esc(url)}" target="_blank" rel="noopener">查看水单</a>`;
      return tag("未提交","stale");
    }
    function slipAmountField(r){
      const s=r.slip||{},cur=s.currency||"CNY";
      const v=s.alloc||0;
      return `<div class="f"><em>水单金额</em>${v>1?money(cur,v):tag("无","stale")}${s.direction_warn?` ${tag("⚠含我方付款"+money(cur,s.ap_alloc)+"·未计已收","risk")}`:""}</div>`;
    }
    function receiptField(r){
      const s=r.slip||{},n=s.receipt_count||0;
      if(n>0&&s.file_url)return `<div class="f"><em>回单</em><a class="slip-link" href="${esc(s.file_url)}" target="_blank" rel="noopener">${n} 份 · 查看</a></div>`;
      return `<div class="f"><em>回单</em>${tag("未上传","stale")}</div>`;
    }
    function shippingInfoHtml(r){
      const s=r.shipping||{};
      const parts=[`<span>${esc(s.carrier_code||"—")}${s.vessel?` / ${esc(s.vessel)}`:""}</span>`,`<span>ETD ${fmtDate(s.etd)}</span>`,`<span>柜号 ${esc(s.container_no||"—")}</span>`];
      return `<div class="ship-info">${parts.join("")}</div>`;
    }
    function forwarderDetailHtml(r){
      const s=r.shipping||{};
      const payCur=(r.customer_side&&r.customer_side.currency)||(linesOf(r)[0]&&linesOf(r)[0].currency)||"CNY";
      return `<div class="detail">
        <div class="f"><em>CY柜号</em>${esc(s.container_no||"—")}</div>
        <div class="f"><em>发货人</em>${esc(s.shipper||"—")}</div>
        <div class="f"><em>收货人</em>${esc(s.consignee||r.consignee||"—")}</div>
        ${monthField(r)}
        <div class="f"><em>代收款</em>${money(payCur,r.received)}</div>
        <div class="f"><em>水单</em>${slipField(r,"forwarder")}</div>
      </div>`;
    }
    function customerDetailHtml(r){
      const s=r.shipping||{};
      return `<div class="detail">
        ${poField(r)}
        ${deliveryField(r)}
        ${anchorPriceField(r)}
        ${monthField(r)}
        ${receivedField(r,"cust")}
        <div class="f"><em>发货人</em>${esc(s.shipper||"—")}</div>
        <div class="f"><em>收货人</em>${esc(s.consignee||r.consignee||"—")}</div>
        <div class="f"><em>水单</em>${slipField(r,"cust")}</div>
        ${slipAmountField(r)}
        ${receiptField(r)}
        ${shippingInfoHtml(r)}
        ${dataAlertChips(r)}
      </div>`;
    }
    function objectLineHtml(item,view){
      const {l,r}=item,side=view==="cust"?"应收":"应付",paid=view==="cust"?"已收":"已付",due=view==="cust"?"待收":"待付";
      const chips=[]; if(l.data_missing)chips.push(tag(l.missing_reason||"数据缺失","risk"));
      const inv=invoiceLabel(l); if(inv)chips.push(tag(inv,l.tone||"todo"));
      chips.push(tag(lineStatusLabel(l),l.tone||"todo"));
      const over=overpayChip(l); if(over)chips.push(over);
      const detail=view==="forwarder"?forwarderDetailHtml(r):(view==="cust"?customerDetailHtml(r):"");
      return `<button type="button" class="settle ${esc(l.tone||"")}" data-row-id="${esc(r.id)}" data-line-id="${esc(l.id)}" title="打开具体记录">
        <div><div class="ref">${esc(lineRef(l))}</div><div class="party">${esc(l.relation_label||"结算关系")}</div><div class="dir">${esc(r.title||"")} ${r.subtitle?`· ${esc(r.subtitle)}`:""}</div></div>
        <div class="amt"><span><em>${side}${esc(l.currency)}</em>${money(l.currency,l.total)}</span><span><em>${paid}${esc(l.currency)}</em>${money(l.currency,l.paid)}</span><span><em>${due}${esc(l.currency)}</em>${money(l.currency,l.due)}</span></div>
        <div class="linechips">${chips.join("")}</div>
      </button>${detail}`;
    }
    function collabTarget(view,name){
      if(view==="factory")return{hash:"customs_collab",label:"🤝 开票协同",who:"工厂"};
      if(view==="forwarder")return{hash:"shipment_collab",label:"🤝 货件协同",who:"货代"};
      return{hash:"payments?customer="+encodeURIComponent(name||"").replace(/'/g,"%27"),label:"🤝 收款/水单",who:"客户"};
    }
    function objectCardHtml(group,view){
      const first=group.items[0].l,side=view==="cust"?"应收":"应付",paid=view==="cust"?"已收":"已付",due=view==="cust"?"待收":"待付";
      const name=first.counterparty_name||first.missing_reason||"未补录",code=first.counterparty_code?` · ${first.counterparty_code}`:"";
      const ct=collabTarget(view,name);
      const totals=new Map();
      group.items.forEach(({l})=>{
        const t=totals.get(l.currency||"CNY")||{total:0,paid:0,due:0};
        t.total+=Number(l.total||0);t.paid+=Number(l.paid||0);t.due+=Number(l.due||0);totals.set(l.currency||"CNY",t);
      });
      const sums=[...totals.entries()].map(([cur,t])=>`<div class="amt totalbox"><span><em>${side}${esc(cur)}</em>${money(cur,t.total)}</span><span><em>${paid}${esc(cur)}</em>${money(cur,t.paid)}</span><span><em>${due}${esc(cur)}</em>${money(cur,t.due)}</span></div>`).join("");
      return `<article class="row ${esc(group.tone)}">
        <div class="acct-head"><div><div class="acct-title">${esc(name+code)}</div><div class="sub">${esc(first.relation_label||first.counterparty_label||"结算对象")} · ${group.items.length} 笔</div><button type="button" class="action" data-goto="${esc(ct.hash)}" title="打开该${esc(ct.who)}的协同台" style="width:auto;min-height:28px;margin-top:7px;padding:4px 11px;font-size:12px">${ct.label} ↗</button></div><div class="totals">${sums}</div></div>
        <div class="acct-lines">${group.items.map(x=>objectLineHtml(x,view)).join("")}</div>
      </article>`;
    }
    function renderObjectView(view){
      const groups=new Map();
      objectLines(view).forEach(item=>{
        const l=item.l,key=l.counterparty_code||l.counterparty_name||l.missing_reason||"未补录";
        if(!groups.has(key))groups.set(key,{key,items:[],due:0,tone:"done"});
        const g=groups.get(key);g.items.push(item);g.due+=Number(l.due||0);
        if(l.tone==="risk"||l.data_missing)g.tone="risk";else if(g.tone!=="risk"&&l.tone)g.tone=l.tone;
      });
      const list=[...groups.values()].sort((a,b)=>b.due-a.due);
      $("list").innerHTML=list.map(g=>objectCardHtml(g,view)).join("")||'<div class="empty">没有匹配数据</div>';
      const lineCount=list.reduce((n,g)=>n+g.items.length,0);
      $("count").textContent=`${list.length} 个对象 · ${lineCount} 笔`;
    }
    function gotoModule(hash){
      if(!hash)return;
      try{ if(window.parent&&window.parent!==window){window.parent.location.hash=hash;} else {window.location.href="/data#"+hash;} }
      catch(e){ window.open("/data#"+hash,"_blank"); }
    }
    function recordShipmentId(r){
      return r.shipment_id||r._id||(linesOf(r)[0]&&linesOf(r)[0].refs&&(linesOf(r)[0].refs.shipment_id||linesOf(r)[0].refs.shipment_no))||r.shipment_no||r.bl_no||"";
    }
    function recordHash(r){
      if(!r)return"";
      if(r.type==="order")return `orders?order_no=${encodeURIComponent(r.order_no||"")}`;
      return `shipping?shipment_id=${encodeURIComponent(recordShipmentId(r))}&shipment_no=${encodeURIComponent(r.shipment_no||"")}`;
    }
    function payRowsHtml(d){
      const dirCn=x=>x.direction==="in"?"收":"付";
      const rows=[];
      for(const p of d.payments||[]) rows.push(`<tr><td>${esc(p.pay_date||"—")}</td><td>${dirCn(p)}</td><td style="text-align:right">${money(p.currency,p.amount)}</td><td>${esc(p.counterparty||p.forwarder_cn||"—")}</td><td>${esc(p.pay_item||"")} ${esc(p.contract_no||p.order_no||"")}</td><td>${p.tt_slip_url?`<a href="${esc(p.tt_slip_url)}" target="_blank" rel="noopener">水单</a>`:"—"}</td></tr>`);
      for(const s of d.slips||[]) rows.push(`<tr><td>${esc(s.pay_date||"—")}</td><td>水单</td><td style="text-align:right">${money(s.currency,s.amount_alloc||s.amount)}</td><td>${esc(s.sender_name||"—")}</td><td>${esc(s.contract_no||s.order_no||s.bl_no||"")}</td><td>${s.file_url?`<a href="${esc(s.file_url)}" target="_blank" rel="noopener">查看</a>`:"—"}</td></tr>`);
      for(const f of d.flows||[]) rows.push(`<tr><td>${esc(String(f.tx_date||"").slice(0,10))}</td><td>流水·${dirCn(f)}</td><td style="text-align:right">${money(f.currency,f.amount)}</td><td>${esc(f.counterparty_name||"—")}</td><td>${esc((f.memo||"").slice(0,26))}</td><td>${esc(f.entity_code||"")}</td></tr>`);
      if(!rows.length)return `<div class="muted" style="padding:10px 0">ERP 里没查到这条线的付款/水单记录——可能挂在别的单号下,或还没录入。</div>`;
      return `<table class="paytable"><thead><tr><th>日期</th><th>类型</th><th style="text-align:right">金额</th><th>对方</th><th>单号/摘要</th><th>凭证</th></tr></thead><tbody>${rows.join("")}</tbody></table>`;
    }
    async function gotoRecord(row,line){
      const refs=(line&&line.refs)||{};
      const qs=new URLSearchParams();
      if(refs.order_no||row.order_no)qs.set("order_no",refs.order_no||row.order_no||"");
      if(refs.contract_no||row.contract_no)qs.set("contract_no",refs.contract_no||row.contract_no||"");
      if(refs.bl_no||row.bl_no)qs.set("bl_no",refs.bl_no||row.bl_no||"");
      if(line&&line.counterparty_type==="forwarder"&&line.counterparty_name)qs.set("forwarder",line.counterparty_name);
      try{
        const d=await api(`/api/db/recon-board?action=line-payments&${qs.toString()}`);
        const scopeNote=(d.payments||[]).some(p=>p.scope==="forwarder_recent")?`<div class="muted" style="margin:4px 0">该票暂无挂链付款,以下为这家货代最近付款记录(供核对)。</div>`:"";
        $("modalTitle").textContent=`${row.title||""} · 付款/水单明细`;
        $("modalText").innerHTML=scopeNote+payRowsHtml(d)+`<div style="margin-top:10px"><button class="action" data-goto="${esc(recordHash(row))}" style="width:auto;padding:4px 12px">打开原始记录 ↗</button></div>`;
        $("modal").classList.add("wide");
        $("modal").showModal();
      }catch(e){ gotoModule(recordHash(row)); }
    }
    function render(){
      renderQueues();
      if(state.view!=="order")return renderObjectView(state.view);
      const tf="all";
      const childrenOf=o=>state.rows.filter(x=>x.type==="shipment"&&x.parent_order_no===o.order_no);
      let html="",shown=0;
      if(tf==="shipment"){
        const ships=state.rows.filter(r=>r.type==="shipment").filter(rowInFilter);
        ships.forEach(x=>{html+=rowHtml(x)});shown=ships.length;
      } else {
        const top=state.rows.filter(r=>r.type==="order"||(tf==="all"&&r.is_top_level)).filter(r=>rowInFilter(r)||(r.type==="order"&&childrenOf(r).some(rowInFilter)));
        for(const r of top){
          html+=rowHtml(r);
          if(r.type==="order"&&tf==="all") childrenOf(r).filter(x=>state.filter==="all"||rowInFilter(x)).forEach(x=>html+=rowHtml(x));
        }
        shown=top.length;
      }
      $("list").innerHTML=html||'<div class="empty">没有匹配数据</div>';
      $("count").textContent=`显示 ${shown} / 总 ${state.rows.length} 票`;
    }
    async function load(){
      const q=encodeURIComponent($("q").value.trim());
      const [board,summary]=await Promise.all([api(`/api/db/recon-board?action=board&limit=500&q=${q}`),api("/api/db/recon-board?action=summary")]);
      state.rows=board.rows||[];state.summary=summary.summary?.queues||[];
      $("notice").style.display=board.unclassified_payments_count?"block":"none";
      $("notice").textContent=`另有 ${board.unclassified_payments_count||0} 笔未标方向付款，未计入收/付状态，待治理方向字段后归位。`;
      render();
    }
    async function reviewPrice(row,decision){
      const refs=(row.invoice_confirm_refs||[]).filter(x=>x.status==="pending_our_review");
      if(!refs.length)return openModal("无法审批","这票当前没有待审改价。");
      let note="";
      if(decision==="reject"){
        const v=window.prompt("驳回备注（可选）","");
        if(v===null)return;
        note=v;
      }
      await Promise.all(refs.map(x=>api("/api/db/recon-board?action=review-price",{method:"POST",body:JSON.stringify({ref:x.ref,kind:x.kind,decision,note})})));
      await load();
    }
    function openModal(title,text){$("modal").classList.remove("wide");$("modalTitle").textContent=title;$("modalText").textContent=text;$("modal").showModal()}
    $("modal").addEventListener("click",e=>{const g=e.target.closest("[data-goto]");if(g){$("modal").close();gotoModule(g.dataset.goto);}});
    $("loginForm").addEventListener("submit",async e=>{
      e.preventDefault();$("error").textContent="";
      try{const d=await api("/api/db/auth-login",{method:"POST",body:JSON.stringify({username:$("username").value,password:$("password").value})});state.token=d.token;localStorage.setItem("sanlyn_token",d.token);$("who").textContent=`${d.user.username} · ${d.user.role}`;$("loginForm").style.display="none";await load()}catch(err){$("error").textContent=err.message}
    });
    $("searchForm").addEventListener("submit",e=>{e.preventDefault();load().catch(err=>$("error").textContent=err.message)});
    $("queues").addEventListener("click",e=>{const b=e.target.closest("[data-filter]");if(!b)return;state.filter=state.filter===b.dataset.filter?"all":b.dataset.filter;render()});
    $("clearFilter").addEventListener("click",()=>{state.filter="all";render()});
    $("typetabs").addEventListener("click",e=>{const b=e.target.closest("[data-view]");if(!b)return;state.view=b.dataset.view;[...$("typetabs").children].forEach(c=>c.classList.toggle("active",c===b));render()});
    $("list").addEventListener("click",e=>{
      const review=e.target.closest("[data-review]");
      if(review){const row=state.rows.find(x=>x.id===review.dataset.rowId);if(row)reviewPrice(row,review.dataset.review).catch(err=>$("error").textContent=err.message);return;}
      const g=e.target.closest("[data-goto]");if(g){gotoModule(g.dataset.goto);return;}
      const b=e.target.closest("[data-action]");if(b){openModal(b.dataset.title,b.dataset.text);return;}
      const lineEl=e.target.closest("[data-line-id]");
      if(lineEl&&lineEl.dataset.rowId){
        const row=state.rows.find(x=>x.id===lineEl.dataset.rowId);if(!row)return;
        return gotoRecord(row,linesOf(row).find(x=>x.id===lineEl.dataset.lineId));
      }
      const rowEl=e.target.closest(".row");if(!rowEl)return;
      const row=state.rows.find(x=>x.id===rowEl.dataset.id);if(!row)return;
      const line=lineEl?linesOf(row).find(x=>x.id===lineEl.dataset.lineId):null;
      gotoRecord(row,line);
    });
    $("modalSecond").addEventListener("click",()=>$("modal").close());$("modalMain").addEventListener("click",()=>$("modal").close());
    if(state.token){$("who").textContent="已登录（token）";load().catch(err=>{localStorage.removeItem("sanlyn_token");$("who").textContent="登录已过期，请重新登录";$("error").textContent=err.message})}
  </script>
</body>
</html>
