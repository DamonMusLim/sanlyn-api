<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工厂开票上传</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f6f8fb;
  --panel:#ffffff;
  --text:#172033;
  --muted:#667085;
  --line:#e6eaf0;
  --soft:#f1f5f9;
  --blue:#2563eb;
  --green:#16a34a;
  --green-bg:#ecfdf3;
  --red:#dc2626;
  --red-bg:#fff1f2;
  --shadow:0 10px 30px rgba(15,23,42,.08);
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
}
button,input{font:inherit}
.page{max-width:1120px;margin:0 auto;padding:22px 16px 56px}
.hero{
  background:linear-gradient(135deg,#ffffff 0%,#eef6ff 100%);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
}
.heroTop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.factoryName{font-size:30px;line-height:1.15;font-weight:850;letter-spacing:0;margin:0 0 8px}
.subtitle{margin:0;color:var(--muted);font-size:14px}
.heroAmount{text-align:right;min-width:230px}
.heroMonth{color:var(--muted);font-size:13px;margin-bottom:5px}
.heroTotal{font-size:30px;font-weight:900;color:var(--blue);line-height:1.1}
.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:14px 0 18px;
}
.monthInputs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.monthInputs input{
  height:36px;
  border:1px solid var(--line);
  border-radius:10px;
  padding:0 10px;
  background:#fff;
  color:var(--text);
}
.btn{
  border:1px solid transparent;
  border-radius:10px;
  height:38px;
  padding:0 14px;
  background:var(--blue);
  color:#fff;
  font-weight:750;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  white-space:nowrap;
}
.btn.secondary{background:#fff;color:var(--text);border-color:var(--line)}
.btn.ghost{background:transparent;color:var(--blue);border-color:#bfdbfe}
.btn:disabled{opacity:.55;cursor:not-allowed}
.notice{
  border-radius:12px;
  padding:12px 14px;
  margin-bottom:14px;
  font-size:14px;
}
.notice.err{background:var(--red-bg);color:var(--red);border:1px solid #fecdd3}
.notice.ok{background:var(--green-bg);color:var(--green);border:1px solid #bbf7d0}
.empty{
  text-align:center;
  color:var(--muted);
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:56px 18px;
}
.monthBlock{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
  overflow:hidden;
}
.monthHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:18px 20px;
  border-bottom:1px solid var(--line);
  background:#fbfdff;
}
.monthTitle{font-size:20px;font-weight:900}
.monthSum{text-align:right}
.monthSumLabel{font-size:12px;color:var(--muted)}
.monthSumValue{font-size:22px;font-weight:900;color:var(--blue)}
.rows{display:flex;flex-direction:column}
.invoiceRow{
  display:grid;
  grid-template-columns:minmax(170px,1.2fr) minmax(90px,.55fr) minmax(130px,.8fr) minmax(132px,.7fr) auto;
  gap:14px;
  align-items:center;
  padding:16px 20px;
  border-bottom:1px solid var(--line);
}
.invoiceRow:last-child{border-bottom:0}
.invoiceRow.unopened{background:linear-gradient(90deg,rgba(255,241,242,.9),#fff 46%)}
.cellLabel{display:none;color:var(--muted);font-size:12px;margin-bottom:4px}
.orderNo{font-size:16px;font-weight:850;word-break:break-word}
.qty,.amount{font-size:16px;font-weight:800}
.amount.unopened{color:var(--red)}
.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:54px;
  height:28px;
  border-radius:999px;
  padding:0 10px;
  font-size:13px;
  font-weight:850;
}
.badge.red{color:var(--red);background:var(--red-bg);border:1px solid #fecdd3}
.badge.green{color:var(--green);background:var(--green-bg);border:1px solid #bbf7d0}
.invoiceInfo{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.45}
.actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.fileInput{display:none}
.ocrBox{
  grid-column:1/-1;
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
  color:#334155;
  font-size:13px;
  line-height:1.55;
}
.modalMask{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.5);
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:50;
}
.modalMask.show{display:flex}
.modal{
  width:680px;
  max-width:100%;
  max-height:86vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  box-shadow:0 24px 80px rgba(15,23,42,.22);
  border:1px solid var(--line);
}
.modalHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:16px 18px;
  border-bottom:1px solid var(--line);
}
.modalTitle{font-size:18px;font-weight:900}
.modalBody{padding:16px 18px}
.detailGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:16px;
}
.detailCard{background:var(--soft);border-radius:12px;padding:11px}
.detailK{font-size:12px;color:var(--muted);margin-bottom:5px}
.detailV{font-size:15px;font-weight:850}
.sectionTitle{font-weight:900;margin:18px 0 10px}
.invoiceLine{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:11px 0;
  border-bottom:1px solid var(--line);
  font-size:14px;
}
.invoiceLine:last-child{border-bottom:0}
.linkBtn{
  border:0;
  background:transparent;
  color:var(--blue);
  padding:0;
  cursor:pointer;
  font-weight:800;
}
@media(max-width:760px){
  .page{padding:12px 10px 42px}
  .hero{padding:18px 16px;border-radius:16px}
  .heroTop{display:block}
  .factoryName{font-size:25px}
  .heroAmount{text-align:left;margin-top:18px;min-width:0}
  .heroTotal{font-size:28px}
  .toolbar{display:block}
  .monthInputs{margin-bottom:10px}
  .toolbar .btn{width:100%}
  .monthHead{align-items:flex-start;padding:16px}
  .monthTitle{font-size:18px}
  .monthSumValue{font-size:20px}
  .invoiceRow{
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:15px 16px;
  }
  .cellLabel{display:block}
  .orderCell,.statusCell,.actions,.ocrBox{grid-column:1/-1}
  .statusCell{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .actions{justify-content:stretch}
  .actions .btn,.actions label{flex:1}
  .detailGrid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main class="page">
  <section class="hero">
    <div class="heroTop">
      <div>
        <h1 class="factoryName" id="factoryName">工厂开票上传</h1>
        <p class="subtitle">按订单上传已开具发票；红色“未开”请优先处理。</p>
      </div>
      <div class="heroAmount">
        <div class="heroMonth" id="rangeLabel">本期</div>
        <div class="heroTotal" id="rangeTotal">¥0.00</div>
      </div>
    </div>
  </section>

  <div class="toolbar">
    <div class="monthInputs">
      <span>月份</span>
      <input id="fromMonth" type="month" value="2026-01" />
      <span>至</span>
      <input id="toMonth" type="month" value="2026-12" />
    </div>
    <button class="btn secondary" id="reloadBtn" type="button">刷新</button>
  </div>

  <div id="message"></div>
  <div id="content" class="empty">加载中...</div>
</main>

<div class="modalMask" id="detailMask">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modalHead">
      <div class="modalTitle">订单详情</div>
      <button class="btn secondary" type="button" id="closeDetail">关闭</button>
    </div>
    <div class="modalBody" id="detailBody"></div>
  </div>
</div>

<script>
(function(){
  const API = "/api/db/customs-collab";
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const code = params.get("c") || "";
  const mt = params.get("mt") || "";

  const state = {
    rows: [],
    factoryName: "",
    busyKey: "",
    ocr: {}
  };

  function query(obj){
    const p = new URLSearchParams();
    Object.entries(obj).forEach(([k,v]) => {
      if (v !== undefined && v !== null && v !== "") p.set(k, v);
    });
    return p.toString();
  }

  async function request(url, options){
    const res = await fetch(url, options);
    const body = await res.json().catch(() => ({}));
    if (!res.ok || body.success === false) throw new Error(body.error || "请求失败");
    return body;
  }

  function money(v){
    if (v === null || v === undefined || v === "") return "¥0.00";
    const n = Number(v);
    if (!Number.isFinite(n)) return "¥0.00";
    return "¥" + n.toLocaleString("zh-CN", { minimumFractionDigits:2, maximumFractionDigits:2 });
  }

  function plainMoney(v){
    const n = Number(v);
    return Number.isFinite(n) ? n : 0;
  }

  function numberText(v){
    if (v === null || v === undefined || v === "") return "-";
    const n = Number(v);
    return Number.isFinite(n) ? n.toLocaleString("zh-CN") : String(v);
  }

  function monthName(ym){
    if (!/^\d{4}-\d{2}$/.test(String(ym || ""))) return ym || "未分月";
    const y = ym.slice(0,4);
    const m = String(Number(ym.slice(5,7)));
    return y + "年" + m + "月";
  }

  function showMessage(type, text){
    $("message").innerHTML = text ? `<div class="notice ${type}">${escapeHtml(text)}</div>` : "";
  }

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[ch]));
  }

  function hasInvoice(row){
    if (typeof row.has_invoice === "boolean") return row.has_invoice;
    if (Array.isArray(row.invoices) && row.invoices.length) return true;
    return Number(row.valid_invoice_count || 0) > 0;
  }

  function invoiceText(row){
    const invoices = Array.isArray(row.invoices) ? row.invoices : [];
    if (!invoices.length) return "";
    return invoices.map(inv => {
      const no = inv.invoice_no || "发票";
      const amt = inv.amount_incl_tax || inv.amount || "";
      return amt ? `${no} ${money(amt)}` : no;
    }).join("；");
  }

  function visibleOrderNo(row){
    return row.order_no || row.contract_no || "-";
  }

  function visibleQty(row){
    return row.qty || row.qty_ctn || row.cartons || "-";
  }

  function rowAmount(row){
    return row.expected_amount ?? row.effective_expected_amount ?? 0;
  }

  function groupRows(rows){
    const map = {};
    rows.forEach(row => {
      const key = row.period || String(row.export_date || "").slice(0,7) || "未分月";
      if (!map[key]) map[key] = [];
      map[key].push(row);
    });
    return Object.keys(map).sort().reverse().map(month => ({
      month,
      rows: map[month],
      total: map[month].reduce((sum, row) => sum + plainMoney(rowAmount(row)), 0)
    }));
  }

  function refreshTop(groups){
    const rows = state.rows;
    const factory = state.factoryName || rows[0]?.factory_name || "工厂开票上传";
    const total = rows.reduce((sum, row) => sum + plainMoney(rowAmount(row)), 0);
    const from = $("fromMonth").value;
    const to = $("toMonth").value;

    $("factoryName").textContent = factory;
    $("rangeLabel").textContent = from === to ? monthName(from) + " 应开金额合计" : monthName(from) + " - " + monthName(to) + " 应开金额合计";
    $("rangeTotal").textContent = money(total);
  }

  function render(){
    const content = $("content");
    const groups = groupRows(state.rows);
    refreshTop(groups);

    if (!code && !mt) {
      content.className = "empty";
      content.textContent = "链接缺少短码";
      return;
    }

    if (!state.rows.length) {
      content.className = "empty";
      content.textContent = "当前月份暂无需要开票上传的订单";
      return;
    }

    content.className = "";
    content.innerHTML = groups.map(group => `
      <section class="monthBlock">
        <div class="monthHead">
          <div class="monthTitle">📅 ${escapeHtml(monthName(group.month))}</div>
          <div class="monthSum">
            <div class="monthSumLabel">该月应开金额合计</div>
            <div class="monthSumValue">${money(group.total)}</div>
          </div>
        </div>
        <div class="rows">
          ${group.rows.map(renderRow).join("")}
        </div>
      </section>
    `).join("");
  }

  function renderRow(row){
    const key = row.customs_no || "";
    const opened = hasInvoice(row);
    const rowClass = opened ? "invoiceRow" : "invoiceRow unopened";
    const amountClass = opened ? "amount" : "amount unopened";
    const badge = opened ? `<span class="badge green">已开</span>` : `<span class="badge red">未开</span>`;
    const invText = opened ? (invoiceText(row) || "已上传发票") : "尚未上传发票";
    const busy = state.busyKey === key;
    const ocr = state.ocr[key] ? `<div class="ocrBox">${state.ocr[key]}</div>` : "";

    return `
      <div class="${rowClass}">
        <div class="orderCell">
          <div class="cellLabel">订单号</div>
          <div class="orderNo">${escapeHtml(visibleOrderNo(row))}</div>
        </div>
        <div>
          <div class="cellLabel">数量</div>
          <div class="qty">${escapeHtml(numberText(visibleQty(row)))}</div>
        </div>
        <div>
          <div class="cellLabel">金额</div>
          <div class="${amountClass}">${money(rowAmount(row))}</div>
        </div>
        <div class="statusCell">
          <div>
            ${badge}
            <div class="invoiceInfo">${escapeHtml(invText)}</div>
          </div>
        </div>
        <div class="actions">
          <label class="btn" data-upload="${escapeHtml(key)}">
            ${busy ? "上传中..." : "上传发票"}
            <input class="fileInput" type="file" accept="image/*,.pdf" ${busy ? "disabled" : ""} />
          </label>
          <button class="btn ghost" type="button" data-detail="${escapeHtml(key)}">查看详情</button>
        </div>
        ${ocr}
      </div>
    `;
  }

  async function load(){
    showMessage("", "");
    $("content").className = "empty";
    $("content").textContent = "加载中...";

    try {
      const data = await request(API + "?" + query({
        action:"factory_list",
        c:code,
        mt:mt,
        from:$("fromMonth").value || "2026-01",
        to:$("toMonth").value || "2026-12"
      }));
      state.rows = Array.isArray(data.rows) ? data.rows : [];
      state.factoryName = data.factory?.name || state.rows[0]?.factory_name || "";
      render();
    } catch (err) {
      $("content").className = "empty";
      $("content").textContent = "加载失败";
      showMessage("err", err.message || String(err));
    }
  }

  async function upload(customsNo, file){
    if (!customsNo || !file) return;

    state.busyKey = customsNo;
    showMessage("", "");
    render();

    try {
      const fd = new FormData();
      fd.append("customs_no", customsNo);
      fd.append("file", file);

      const result = await request(API + "?" + query({ action:"upload", c:code, mt:mt }), {
        method:"POST",
        body:fd
      });

      const parts = [];
      if (result.invoice_no) parts.push("发票号：" + result.invoice_no);
      if (result.amount_incl_tax !== null && result.amount_incl_tax !== undefined) parts.push("金额：" + money(result.amount_incl_tax));
      if (result.warning) parts.push("提示：" + result.warning);
      if (!parts.length) parts.push("发票已上传，等待识别结果入库");

      state.ocr[customsNo] = "OCR识别结果：" + parts.join("；");
      showMessage("ok", "发票已上传");
      await load();
    } catch (err) {
      showMessage("err", err.message || String(err));
    } finally {
      state.busyKey = "";
      render();
    }
  }

  async function openDetail(customsNo){
    if (!customsNo) return;
    showMessage("", "");

    try {
      const data = await request(API + "?" + query({
        action:"detail",
        customs_no:customsNo,
        c:code,
        mt:mt
      }));

      const row = state.rows.find(x => x.customs_no === customsNo) || {};
      const invoices = Array.isArray(data.invoices) ? data.invoices : [];
      const body = $("detailBody");

      body.innerHTML = `
        <div class="detailGrid">
          <div class="detailCard">
            <div class="detailK">订单号</div>
            <div class="detailV">${escapeHtml(visibleOrderNo(row))}</div>
          </div>
          <div class="detailCard">
            <div class="detailK">数量</div>
            <div class="detailV">${escapeHtml(numberText(visibleQty(row)))}</div>
          </div>
          <div class="detailCard">
            <div class="detailK">金额</div>
            <div class="detailV">${money(rowAmount(row))}</div>
          </div>
        </div>
        <div class="sectionTitle">已上传发票</div>
        ${
          invoices.length
          ? invoices.map(inv => `
            <div class="invoiceLine">
              <div>
                <strong>${escapeHtml(inv.invoice_no || "发票")}</strong>
                <div class="invoiceInfo">${escapeHtml(String(inv.issue_date || "").slice(0,10) || "")}</div>
              </div>
              <div>
                ${money(inv.amount_incl_tax)}
                ${inv.file_url ? `<div><a class="linkBtn" href="${escapeHtml(inv.file_url)}" target="_blank" rel="noopener">查看文件</a></div>` : ""}
              </div>
            </div>
          `).join("")
          : `<div class="invoiceInfo">暂无发票</div>`
        }
      `;

      $("detailMask").classList.add("show");
    } catch (err) {
      showMessage("err", err.message || String(err));
    }
  }

  $("reloadBtn").addEventListener("click", load);
  $("fromMonth").addEventListener("change", load);
  $("toMonth").addEventListener("change", load);
  $("closeDetail").addEventListener("click", () => $("detailMask").classList.remove("show"));
  $("detailMask").addEventListener("click", e => {
    if (e.target === $("detailMask")) $("detailMask").classList.remove("show");
  });

  document.addEventListener("change", e => {
    const input = e.target.closest(".fileInput");
    if (!input) return;
    const label = input.closest("[data-upload]");
    upload(label.getAttribute("data-upload"), input.files[0]);
    input.value = "";
  });

  document.addEventListener("click", e => {
    const btn = e.target.closest("[data-detail]");
    if (!btn) return;
    openDetail(btn.getAttribute("data-detail"));
  });

  load();
})();
</script>
</body>
</html>
