<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工厂开票上传</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f6f8fb;--panel:#fff;--text:#172033;--muted:#667085;--line:#e6eaf0;--soft:#f1f5f9;--blue:#2563eb;--green:#16a34a;--green-bg:#ecfdf3;--red:#c0392b;--red-bg:#fff1f2;--yellow:#fff8d6;--shadow:0 10px 30px rgba(15,23,42,.08)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
button,input{font:inherit}.page{max-width:1120px;margin:0 auto;padding:22px 16px 56px}
.hero{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:22px;margin-bottom:18px}
.heroTop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.factoryName{font-size:30px;line-height:1.15;font-weight:850;letter-spacing:0;margin:0 0 8px}.subtitle{margin:0;color:var(--muted);font-size:14px}.heroAmount{text-align:right;min-width:230px}.heroMonth{color:var(--muted);font-size:13px;margin-bottom:5px}.heroTotal{font-size:30px;font-weight:900;color:var(--blue);line-height:1.1}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 18px}.monthInputs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}.monthInputs input{height:36px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;color:var(--text)}
.btn{border:1px solid transparent;border-radius:10px;height:38px;padding:0 14px;background:var(--blue);color:#fff;font-weight:750;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}.btn.secondary{background:#fff;color:var(--text);border-color:var(--line)}.btn.ghost{background:transparent;color:var(--blue);border-color:#bfdbfe}.btn.redLine{background:#fff;color:var(--red);border-color:#e6b0aa}.btn:disabled{opacity:.55;cursor:not-allowed}
.notice{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}.notice.err{background:var(--red-bg);color:var(--red);border:1px solid #fecdd3}.notice.ok{background:var(--green-bg);color:var(--green);border:1px solid #bbf7d0}
.empty{text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:16px;padding:56px 18px}.monthBlock{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}.monthHead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);background:#fbfdff}.monthTitle{font-size:20px;font-weight:900}.monthSum{text-align:right}.monthSumLabel{font-size:12px;color:var(--muted)}.monthSumValue{font-size:22px;font-weight:900;color:var(--blue)}
.rows{display:flex;flex-direction:column}.invoiceRow{display:grid;grid-template-columns:minmax(170px,1.2fr) minmax(90px,.55fr) minmax(130px,.8fr) minmax(132px,.7fr) auto;gap:14px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}.invoiceRow:last-child{border-bottom:0}.invoiceRow.unopened{background:linear-gradient(90deg,rgba(255,241,242,.9),#fff 46%)}.cellLabel{display:none;color:var(--muted);font-size:12px;margin-bottom:4px}.orderNo{font-size:16px;font-weight:850;word-break:break-word}.qty,.amount{font-size:16px;font-weight:800}.amount.unopened{color:var(--red)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:54px;height:28px;border-radius:999px;padding:0 10px;font-size:13px;font-weight:850}.badge.red{color:var(--red);background:var(--red-bg);border:1px solid #fecdd3}.badge.green{color:var(--green);background:var(--green-bg);border:1px solid #bbf7d0}.invoiceInfo{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.45}.actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}.fileInput{display:none}.ocrBox{grid-column:1/-1;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:#334155;font-size:13px;line-height:1.55}
.modalMask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modalMask.show{display:flex}.modal{width:1040px;max-width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 24px 80px rgba(15,23,42,.22);border:1px solid var(--line)}.modalHead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}.modalTitle{font-size:18px;font-weight:900}.modalBody{padding:16px 18px}
.copyBtn{height:24px;border:1px solid #e6b0aa;background:#fff;color:var(--red);border-radius:6px;padding:0 7px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}.copyField{display:inline-flex;align-items:center;gap:6px;max-width:100%}.copyText{word-break:break-word}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;z-index:80;display:none;max-width:86vw}.toast.show{display:block}
.invoiceTpl{border:2px solid var(--red);color:#3b1a17;background:#fff;padding:18px}.invoiceTplTitle{text-align:center;color:var(--red);font-size:25px;font-weight:900;letter-spacing:0;margin:0 0 14px}.partyGrid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--red);border-bottom:0}.partyBox{padding:10px 12px;min-height:92px}.partyBox+ .partyBox{border-left:1px solid var(--red)}.partyTitle{color:var(--red);font-weight:900;margin-bottom:8px}.partyLine{display:grid;grid-template-columns:112px 1fr;gap:8px;margin:7px 0;font-size:14px}.partyLine span:first-child{color:#6b2b25}
.tplTable{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid var(--red)}.tplTable th,.tplTable td{border:1px solid var(--red);padding:7px 6px;font-size:13px;vertical-align:middle}.tplTable th{color:var(--red);font-weight:900;background:#fff7f6}.tplTable td.r,.tplTable th.r{text-align:right}.tplTable td.c,.tplTable th.c{text-align:center}.tplTable .nameCol{width:20%}.tplTable .specCol{width:15%}.tplTable .unitCol{width:7%}.tplTable .qtyCol{width:9%}.tplTable .priceCol{width:10%}.tplTable .amtCol{width:13%}.tplTable .rateCol{width:8%}.tplTable .taxCol{width:11%}.tplTable .opCol{width:7%}.tplWarn{border:1px solid #fecdd3;background:var(--red-bg);color:var(--red);font-weight:900;padding:10px 12px;margin-bottom:10px;border-radius:8px}
.totalBar{display:grid;grid-template-columns:1fr 180px 180px;border-left:1px solid var(--red);border-right:1px solid var(--red);border-bottom:1px solid var(--red)}.totalCell{padding:9px 10px;border-left:1px solid var(--red);font-weight:900}.totalCell:first-child{border-left:0;color:var(--red)}.grandTotal{display:flex;align-items:center;justify-content:space-between;gap:12px;border-left:1px solid var(--red);border-right:1px solid var(--red);border-bottom:1px solid var(--red);padding:11px 12px;font-size:16px}.grandTotal strong{color:var(--red);font-size:19px}
.remarkBox{display:grid;grid-template-columns:90px 1fr;border-left:1px solid var(--red);border-right:1px solid var(--red);border-bottom:1px solid var(--red)}.remarkLabel{padding:12px;color:var(--red);font-weight:900;border-right:1px solid var(--red)}.remarkValue{padding:12px;background:var(--yellow);font-weight:900}.tplActions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}.uploadedBox{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.uploadedTitle{font-weight:900;margin-bottom:8px}.uploadedLine{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.linkBtn{border:0;background:transparent;color:var(--blue);padding:0;cursor:pointer;font-weight:800}
@media(max-width:760px){.page{padding:12px 10px 42px}.hero{padding:18px 16px;border-radius:16px}.heroTop{display:block}.factoryName{font-size:25px}.heroAmount{text-align:left;margin-top:18px;min-width:0}.heroTotal{font-size:28px}.toolbar{display:block}.monthInputs{margin-bottom:10px}.toolbar .btn{width:100%}.monthHead{align-items:flex-start;padding:16px}.monthTitle{font-size:18px}.monthSumValue{font-size:20px}.invoiceRow{grid-template-columns:1fr 1fr;gap:12px;padding:15px 16px}.cellLabel{display:block}.orderCell,.statusCell,.actions,.ocrBox{grid-column:1/-1}.statusCell{display:flex;align-items:center;justify-content:space-between;gap:10px}.actions{justify-content:stretch}.actions .btn,.actions label{flex:1}.partyGrid{grid-template-columns:1fr}.partyBox+ .partyBox{border-left:0;border-top:1px solid var(--red)}.partyLine{grid-template-columns:1fr}.invoiceTpl{padding:10px}.tplTable{min-width:860px}.tplScroll{overflow:auto}.totalBar{grid-template-columns:1fr}.totalCell{border-left:0;border-top:1px solid var(--red)}.grandTotal{display:block}.remarkBox{grid-template-columns:1fr}.remarkLabel{border-right:0;border-bottom:1px solid var(--red)}}
</style>
</head>
<body>
<main class="page">
  <section class="hero">
    <div class="heroTop">
      <div>
        <h1 class="factoryName" id="factoryName">工厂开票上传</h1>
        <p class="subtitle">按订单开具并上传发票；红色“未开”请优先处理。</p>
      </div>
      <div class="heroAmount">
        <div class="heroMonth" id="rangeLabel">本期</div>
        <div class="heroTotal" id="rangeTotal">¥0.00</div>
      </div>
    </div>
  </section>
  <div class="toolbar">
    <div class="monthInputs">
      <span>月份</span><input id="fromMonth" type="month" value="2026-01" />
      <span>至</span><input id="toMonth" type="month" value="2026-12" />
    </div>
    <button class="btn secondary" id="reloadBtn" type="button">刷新</button>
  </div>
  <div id="message"></div>
  <div id="content" class="empty">加载中...</div>
</main>

<div class="modalMask" id="detailMask">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modalHead">
      <div class="modalTitle" id="detailTitle">开票模板</div>
      <button class="btn secondary" type="button" id="closeDetail">关闭</button>
    </div>
    <div class="modalBody" id="detailBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="templates/invoice-official.js"></script>
<script>
(function(){
  const API="/api/db/customs-collab";
  const $=id=>document.getElementById(id);
  const params=new URLSearchParams(location.search);
  const code=params.get("c")||(location.pathname.match(/\/f\/([^\/?#]+)/)||[])[1]||"";
  const mt=params.get("mt")||"";
  const state={rows:[],factoryName:"",busyKey:"",ocr:{},toastTimer:null};

  function query(obj){const p=new URLSearchParams();Object.entries(obj).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=="")p.set(k,v)});return p.toString()}
  async function request(url,options){const res=await fetch(url,options);const body=await res.json().catch(()=>({}));if(!res.ok||body.success===false)throw new Error(body.error||"请求失败");return body}
  function money(v){if(v===null||v===undefined||v==="")return"¥0.00";const n=Number(v);if(!Number.isFinite(n))return"¥0.00";return"¥"+n.toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2})}
  function moneyNum(v){const n=Number(v);return Number.isFinite(n)?n:0}
  function numberText(v){if(v===null||v===undefined||v==="")return"-";const n=Number(v);return Number.isFinite(n)?n.toLocaleString("zh-CN",{maximumFractionDigits:2}):String(v)}
  function monthName(ym){if(!/^\d{4}-\d{2}$/.test(String(ym||"")))return ym||"未分月";return ym.slice(0,4)+"年"+String(Number(ym.slice(5,7)))+"月"}
  function showMessage(type,text){$("message").innerHTML=text?`<div class="notice ${type}">${escapeHtml(text)}</div>`:""}
  function escapeHtml(s){return String(s==null?"":s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
  function attr(s){return escapeHtml(s).replace(/`/g,"&#96;")}
  function hasInvoice(row){if(typeof row.has_invoice==="boolean")return row.has_invoice;if(Array.isArray(row.invoices)&&row.invoices.length)return true;return Number(row.valid_invoice_count||0)>0}
  function invoiceText(row){const invoices=Array.isArray(row.invoices)?row.invoices:[];if(!invoices.length)return"";return invoices.map(inv=>{const no=inv.invoice_no||"发票";const amt=inv.amount_incl_tax||inv.amount||"";return amt?`${no} ${money(amt)}`:no}).join("；")}
  function visibleOrderNo(row){return row.order_no||row.contract_no||"-"}
  function visibleQty(row){return row.qty||row.qty_ctn||row.cartons||"-"}
  function rowAmount(row){if(row.amount_anchored===false)return 0;return row.expected_amount??row.effective_expected_amount??0}
  function copyBtn(value,label){const v=value==null?"":String(value);return `<button class="copyBtn" type="button" data-copy="${attr(v)}" data-copy-label="${attr(label)}">复制</button>`}
  function copyField(value,label){return `<span class="copyField"><span class="copyText">${escapeHtml(value||"-")}</span>${copyBtn(value||"",label)}</span>`}
  function toast(text){const el=$("toast");el.textContent=text;el.classList.add("show");clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.classList.remove("show"),1800)}
  function upperMoney(v){const n=Math.round(moneyNum(v)*100);if(!n)return"零元整";const cn=["零","壹","贰","叁","肆","伍","陆","柒","捌","玖"],u=["分","角","元","拾","佰","仟","万","拾","佰","仟","亿","拾","佰","仟","万"];let s="",zero=false;String(n).split("").reverse().forEach((d,i)=>{d=Number(d);if(d){s=cn[d]+u[i]+s;zero=false}else if(!zero&&s){s=cn[0]+s;zero=true}});return s.replace(/零(万|亿|元)/g,"$1").replace(/零+/g,"零").replace(/亿万/,"亿").replace(/零$/,"")+(n%100?"":"整")}
  async function copyText(value,label){const text=String(value||"");if(!text)return;try{await navigator.clipboard.writeText(text)}catch(_){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}toast("已复制:"+String(label||text))}
  function slipList(row){return Array.isArray(row.slips)?row.slips:[]}
  function groupRows(rows){const map={};rows.forEach(row=>{const key=row.period||String(row.export_date||"").slice(0,7)||"未分月";if(!map[key])map[key]=[];map[key].push(row)});return Object.keys(map).sort().reverse().map(month=>({month,rows:map[month],total:map[month].reduce((s,r)=>s+moneyNum(rowAmount(r)),0)}))}
  function refreshTop(){const rows=state.rows;const factory=state.factoryName||rows[0]?.factory_name||"工厂开票上传";const total=rows.reduce((s,r)=>s+moneyNum(rowAmount(r)),0);const from=$("fromMonth").value;const to=$("toMonth").value;$("factoryName").textContent=factory;$("rangeLabel").textContent=from===to?monthName(from)+" 应开金额合计":monthName(from)+" - "+monthName(to)+" 应开金额合计";$("rangeTotal").textContent=money(total)}
  function render(){
    const content=$("content");const groups=groupRows(state.rows);refreshTop();
    if(!code&&!mt){content.className="empty";content.textContent="链接缺少短码";return}
    if(!state.rows.length){content.className="empty";content.textContent="当前月份暂无需要开票上传的订单";return}
    content.className="";
    content.innerHTML=groups.map(group=>`
      <section class="monthBlock">
        <div class="monthHead"><div class="monthTitle">${escapeHtml(monthName(group.month))}</div><div class="monthSum"><div class="monthSumLabel">该月应开金额合计</div><div class="monthSumValue">${money(group.total)}</div></div></div>
        <div class="rows">${group.rows.map(renderRow).join("")}</div>
      </section>`).join("");
  }
  function renderRow(row){
    const key=row.customs_no||"";const opened=hasInvoice(row);const rowClass=opened?"invoiceRow":"invoiceRow unopened";const amountClass=opened?"amount":"amount unopened";const badge=opened?`<span class="badge green">已开</span>`:`<span class="badge red">未开</span>`;const invText=opened?(invoiceText(row)||"已上传发票"):"尚未上传发票";const busy=state.busyKey===key;const ocr=state.ocr[key]?`<div class="ocrBox">${state.ocr[key]}</div>`:"";const paid=Number(row.paid_amount||0);const slips=Number(row.slip_count||0);const paidBadge=paid>0?`<span class="badge green">已付</span>`:`<span class="badge red">未付</span>`;const paidText=paid>0?("我司已付 "+money(paid)+(slips?" · "+slips+"张水单":"")):"我司尚未付款";const slipBtn=slips>0?`<button class="btn ghost" type="button" data-slips="${escapeHtml(key)}">查看水单</button>`:"";
    return `<div class="${rowClass}">
      <div class="orderCell"><div class="cellLabel">订单号</div><div class="orderNo">${escapeHtml(visibleOrderNo(row))}</div></div>
      <div><div class="cellLabel">箱数</div><div class="qty">${escapeHtml(numberText(visibleQty(row)))}</div></div>
      <div><div class="cellLabel">开票金额</div><div class="${amountClass}">${row.amount_anchored===false?`<span style="color:#b45309">待报关资料</span>`:(rowAmount(row)?money(rowAmount(row)):"待我司确认")}</div>${row.ratio_alert?`<div style="color:#dc2626;font-size:11px;font-weight:700;margin-top:3px">⚠ 报关价异常(${row.ratio_alert}倍销售),待核</div>`:""}${row.amount_anchored===false?`<div style="color:#b45309;font-size:11px;font-weight:700;margin-top:3px">⚠ 金额未锚定报关,以我司最终确认为准</div>`:""}</div>
      <div class="statusCell"><div class="cellLabel">开票</div><div>${badge}<span class="invoiceInfo"${opened?` data-detail="${escapeHtml(key)}" style="cursor:pointer;text-decoration:underline dotted"`:""}> ${escapeHtml(invText)}</span></div><div class="cellLabel" style="margin-top:8px">付款</div><div>${paidBadge}<span class="invoiceInfo"> ${escapeHtml(paidText)}</span></div></div>
      <div class="actions">
        <label class="btn" data-upload="${escapeHtml(key)}">${busy?"上传中...":(opened?"修改发票":"上传发票")}<input class="fileInput" type="file" accept="image/*,.pdf" ${busy?"disabled":""} /></label>
        <button class="btn redLine" type="button" data-detail="${escapeHtml(key)}">开票模板</button>
        ${slipBtn}
      </div>${ocr}</div>`;
  }
  async function load(){
    showMessage("","");$("content").className="empty";$("content").textContent="加载中...";
    try{const data=await request(API+"?"+query({action:"factory_list",c:code,mt:mt,from:$("fromMonth").value||"2026-01",to:$("toMonth").value||"2026-12"}));state.rows=Array.isArray(data.rows)?data.rows:[];state.factoryName=data.factory?.name||state.rows[0]?.factory_name||"";render()}
    catch(err){$("content").className="empty";$("content").textContent="加载失败";showMessage("err",err.message||String(err))}
  }
  async function upload(customsNo,file){
    if(!customsNo||!file)return;state.busyKey=customsNo;showMessage("","");render();
    try{const fd=new FormData();fd.append("customs_no",customsNo);fd.append("file",file);const result=await request(API+"?"+query({action:"upload",c:code,mt:mt}),{method:"POST",body:fd});const parts=[];if(result.invoice_no)parts.push("发票号："+result.invoice_no);if(result.amount_incl_tax!==null&&result.amount_incl_tax!==undefined)parts.push("金额："+money(result.amount_incl_tax));if(result.warning)parts.push("提示："+result.warning);if(!parts.length)parts.push("发票已上传，等待识别结果入库");state.ocr[customsNo]="OCR识别结果："+parts.join("；");showMessage("ok","发票已上传");await load()}
    catch(err){showMessage("err",err.message||String(err))}
    finally{state.busyKey="";render()}
  }
  function taxAmount(line){const amt=moneyNum(line.amount);const rate=Number(line.vat_rate)||0;return rate>0?amt*rate:0}
  function renderSlipViewer(row){
    const slips=slipList(row);
    return `<div class="uploadedBox" style="margin-top:0;border-top:0;padding-top:0"><div class="uploadedTitle">${escapeHtml(visibleOrderNo(row))} 付款水单</div>${slips.length?slips.map(s=>`<div class="uploadedLine"><div><strong>${money(s.amount)}</strong><div class="invoiceInfo">${escapeHtml(String(s.slip_date||"").slice(0,10)||"未填付款日")}</div></div><div>${s.file_url?`<a class="linkBtn" href="${escapeHtml(s.file_url)}" target="_blank" rel="noopener">查看文件</a>`:`<span class="invoiceInfo">暂无文件</span>`}</div></div>`).join(""):`<div class="invoiceInfo">我司尚未付款</div>`}</div>`;
  }
  function renderInvoiceTemplate(tpl,customsNo,invoices){
    const lines=Array.isArray(tpl?.lines)?tpl.lines:[];const total=lines.reduce((s,l)=>s+moneyNum(l.amount),0);const taxTotal=lines.reduce((s,l)=>s+taxAmount(l),0);const grossTotal=total+taxTotal;
    const warn=tpl?.over_baoguan?`<div class="tplWarn">⚠ 采购价超过报关申报价，请联系我司核对（报关资料待更新）</div>`:"";
    const remark=`PO号：${tpl?.po_no||"-"} ｜ 工厂号：${tpl?.factory_ref||"—"} ｜ 开户行：${tpl?.seller?.bank_name||"-"}/${tpl?.seller?.bank_account||"-"}`;
    const uploaded=`<div class="uploadedBox"><div class="uploadedTitle">已上传发票</div>${invoices.length?invoices.map(inv=>`<div class="uploadedLine"><div><strong>${escapeHtml(inv.invoice_no||"发票")}</strong><div class="invoiceInfo">${escapeHtml(String(inv.issue_date||"").slice(0,10)||"")}</div></div><div>${money(inv.amount_incl_tax)}${inv.file_url?`<div><a class="linkBtn" href="${escapeHtml(inv.file_url)}" target="_blank" rel="noopener">查看文件</a></div>`:""}</div></div>`).join(""):`<div class="invoiceInfo">暂无发票</div>`}</div>`;
    return `${warn}${InvoiceOfficial.render({
      docTitle:"电子发票",
      title:"增值税专用发票",
      currency:"CNY",
      buyer:tpl?.buyer||{},
      seller:tpl?.seller||{},
      items:lines.map(l=>({name:l.name,spec:l.spec||"",unit:l.unit||"箱",qty:l.qty||1,price:l.unit_price_ex||0,amount:l.amount||0,rate:l.vat_rate||0,tax:taxAmount(l)})),
      total_ex:total,
      total_tax:taxTotal,
      total:grossTotal,
      remark,
      editable:false,
      footerHtml:`<div class="tplActions"><label class="btn" data-upload="${escapeHtml(customsNo)}">上传已开发票<input class="fileInput" type="file" accept="image/*,.pdf" /></label></div>${uploaded}`
    })}`;
  }
  async function openDetail(customsNo){
    if(!customsNo)return;showMessage("","");
    try{
      const data=await request(API+"?"+query({action:"detail",customs_no:customsNo,c:code,mt:mt}));
      const row=state.rows.find(x=>x.customs_no===customsNo)||{};
      const tpl=data.invoice_template||{buyer:{},seller:{},lines:[],order_no:visibleOrderNo(row),total_incl:rowAmount(row)};
      const qtySum=(tpl.lines||[]).reduce((s,l)=>s+moneyNum(l.qty),0);
      if((!row.qty||row.qty==="-")&&qtySum){row.qty=qtySum;render()}
      $("detailTitle").textContent="开票模板";
      $("detailBody").innerHTML=renderInvoiceTemplate(tpl,customsNo,Array.isArray(data.invoices)?data.invoices:[]);
      $("detailMask").classList.add("show");
    }catch(err){showMessage("err",err.message||String(err))}
  }
  function openSlips(customsNo){
    const row=state.rows.find(x=>x.customs_no===customsNo)||{};
    $("detailTitle").textContent="付款水单";
    $("detailBody").innerHTML=renderSlipViewer(row);
    $("detailMask").classList.add("show");
  }

  $("reloadBtn").addEventListener("click",load);
  $("fromMonth").addEventListener("change",load);
  $("toMonth").addEventListener("change",load);
  $("closeDetail").addEventListener("click",()=>$("detailMask").classList.remove("show"));
  $("detailMask").addEventListener("click",e=>{if(e.target===$("detailMask"))$("detailMask").classList.remove("show")});
  document.addEventListener("change",e=>{const input=e.target.closest(".fileInput");if(!input)return;const label=input.closest("[data-upload]");upload(label.getAttribute("data-upload"),input.files[0]);input.value=""});
  document.addEventListener("click",e=>{const copy=e.target.closest("[data-copy]");if(copy){copyText(copy.getAttribute("data-copy"),copy.getAttribute("data-copy-label")||copy.getAttribute("data-copy"));return}const slips=e.target.closest("[data-slips]");if(slips){openSlips(slips.getAttribute("data-slips"));return}const btn=e.target.closest("[data-detail]");if(btn)openDetail(btn.getAttribute("data-detail"))});
  load();
})();
</script>
</body>
</html>
