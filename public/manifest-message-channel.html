<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>报文数据通道</title>
  <link rel="stylesheet" href="/public/hgj-ui.css">
  <style>
    :root{--bg:var(--hgj-bg);--panel:var(--hgj-card);--text:var(--hgj-text);--muted:var(--hgj-muted);--line:var(--hgj-line);--accent:var(--hgj-primary);--bad:var(--hgj-danger);--warn:var(--hgj-warn);--chip:var(--hgj-primary-bg)}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--hgj-font)}.wrap{max-width:1280px;margin:0 auto;padding:22px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:14px}.title{font-size:16px;line-height:16px;margin:0 0 8px;padding-left:10px;border-left:3px solid var(--accent);color:var(--hgj-title);font-weight:700}.sub,.muted{color:var(--muted);font-size:13px}
    button,input{border:1px solid var(--line);border-radius:0;background:var(--panel);color:var(--text);height:34px;padding:0 11px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.notice{border-left:3px solid var(--warn);padding:10px 14px;margin-bottom:10px;color:var(--hgj-title);font-weight:700}
    .grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:10px}.panel{background:var(--panel);border:0;border-radius:0;box-shadow:none;margin-bottom:10px;overflow:hidden}.panel-head{display:flex;justify-content:space-between;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}.panel-title{font-weight:700;color:var(--hgj-title);padding-left:10px;border-left:3px solid var(--accent);line-height:16px}.body{padding:14px}.list{display:grid;gap:1px;background:var(--line)}.row{border:0;background:var(--panel);padding:11px 12px;text-align:left;height:auto}.row.active{outline:2px solid var(--accent);outline-offset:-2px}.row strong{display:block;font-size:14px;overflow-wrap:anywhere}.row span{display:block;color:var(--muted);font-size:12px;margin-top:4px;overflow-wrap:anywhere}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}.metric{padding:13px 14px;background:var(--panel)}.metric .num{font-size:24px;font-weight:700;margin-top:3px}.pill{display:inline-block;border:1px solid var(--accent);border-radius:0;background:var(--chip);color:var(--accent);padding:2px 7px;font-size:12px}.bad{color:var(--bad)}.warn{color:var(--warn)}
    table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}th{background:var(--bg);color:var(--muted);font-size:12px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.field{border:1px solid var(--line);padding:8px}.field b{display:block;font-size:13px}.field span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.empty,.error{padding:24px;text-align:center;color:var(--muted)}.error{color:var(--bad)}pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--bg);padding:10px;border:1px solid var(--line)}
    @media(max-width:900px){.wrap{padding:14px}.top,.grid{display:block}.metrics,.fields{grid-template-columns:1fr}table{display:block;overflow-x:auto;white-space:nowrap}}
  </style>
</head>
<body class="hgj-page">
  <div class="wrap">
    <header class="top"><div><h1 class="title hgj-panel-title">报文数据通道</h1><div id="summary" class="sub">加载中</div></div><div class="actions"><input id="search" placeholder="舱单号 / BL / 委托单位"><button id="reload" type="button">刷新</button><button id="validate" type="button">生成并校验</button><button id="save" class="primary" type="button">落地待发</button></div></header>
    <div class="notice hgj-card">本页只生成、校验并保存待发报文，不会向海关、船公司或第三方平台发送。</div>
    <section class="metrics"><div class="metric hgj-card"><div class="muted">舱单记录</div><div id="mRows" class="num">未接入</div></div><div class="metric hgj-card"><div class="muted">抬头填充</div><div id="mHeader" class="num">未接入</div></div><div class="metric hgj-card"><div class="muted">待发表</div><div id="mOutbox" class="num bad">未接入</div></div><div class="metric hgj-card"><div class="muted">发送状态</div><div class="num bad">不发送</div></div></section>
    <main class="grid"><section class="panel hgj-card"><div class="panel-head"><div class="panel-title">舱单列表</div><span id="listCount" class="pill">未接入</span></div><div id="list" class="list"></div></section><section><section class="panel hgj-card"><div class="panel-head"><div class="panel-title">当前舱单</div><span id="readyPill" class="pill">未接入</span></div><div id="detail" class="body"></div></section><section class="panel hgj-card"><div class="panel-head"><div class="panel-title">字段填充率</div><span class="pill">真实字段</span></div><div id="coverage" class="body fields"></div></section><section class="panel hgj-card"><div class="panel-head"><div class="panel-title">待发落地</div><span class="pill">禁止外发</span></div><div id="outbox" class="body"></div></section><section class="panel hgj-card"><div class="panel-head"><div class="panel-title">报文预览</div><span id="previewPill" class="pill">未接入</span></div><div class="body"><pre id="preview">未接入 · 尚未生成报文；缺待发表 manifest_message_outbox 时不能落地，当前填充率 未接入。</pre></div></section></section></main>
  </div>
  <script src="/manifest-message-channel.js"></script>
</body>
</html>
