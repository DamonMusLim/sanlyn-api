<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工厂开票门户</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#18212f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1120px;margin:0 auto;padding:22px 14px 56px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:14px}.brand{font-size:22px;font-weight:800}.sub{font-size:13px;color:#667085;margin-top:4px}.tag{border:1px solid #cfd8e3;background:#fff;border-radius:6px;padding:7px 10px;font-size:13px}.card{background:#fff;border:1px solid #d9e0e8;border-radius:8px;margin:14px 0;padding:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}.empty{text-align:center;padding:42px 12px;color:#667085}.invoice{position:relative;border:2px solid #b91c1c;padding:16px 16px 14px;color:#621313;background:#fffdfb}.invTitle{text-align:center;font-size:28px;font-weight:800;color:#b91c1c;letter-spacing:0;margin:2px 0 12px}.officialTop{display:grid;grid-template-columns:110px 1fr 230px;gap:12px;align-items:start;margin-bottom:10px}.qrBox{width:96px;height:96px;border:1px solid #b91c1c;background:#fff}.seal{justify-self:center;width:118px;height:58px;border:2px solid rgba(185,28,28,.35);border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(185,28,28,.42);font-size:14px;font-weight:800;transform:rotate(-8deg);margin-top:8px}.invMeta{display:grid;gap:8px;color:#7f1d1d;font-size:13px;line-height:1.45}.metaLine{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #f3caca;padding-bottom:4px}.placeholder{color:#9ca3af}.banner{border-radius:6px;padding:10px 12px;margin:10px 0;font-weight:700}.red{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}.orange{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}.histBar{background:#f4f5f7;border:1px solid #e1e6ef;color:#4b5563;border-radius:6px;margin:10px 0;padding:8px 10px;font-size:12px;line-height:1.55}.histBar b{color:#374151}.sourceTag{display:inline-block;margin-left:6px;padding:1px 5px;border-radius:999px;background:#f3e8ff;color:#7e22ce;font-size:11px;font-weight:800;vertical-align:middle}.partyWrap{display:grid;grid-template-columns:1fr 1fr;border:1px solid #efb5b5;border-bottom:0}.party{display:grid;grid-template-columns:34px 1fr;min-height:92px}.party+.party{border-left:1px solid #efb5b5}.pLabel{display:flex;align-items:center;justify-content:center;border-right:1px solid #efb5b5;color:#9f1239;font-weight:800;writing-mode:vertical-rl;letter-spacing:2px}.pGrid{display:grid;gap:8px;padding:10px 12px}.field{font-size:14px;line-height:1.45}.field b{font-weight:700;color:#4b1111}.small{font-size:12px;color:#7f1d1d}.tableBox{overflow:auto;border-left:1px solid #efb5b5;border-right:1px solid #efb5b5}table{width:100%;border-collapse:collapse;min-width:920px;table-layout:fixed}th,td{border-bottom:1px solid #efb5b5;border-right:1px solid #f3caca;padding:7px 8px;font-size:13px;text-align:left;vertical-align:middle}th:last-child,td:last-child{border-right:0}th{color:#9f1239;background:#fff7f7;text-align:center;font-weight:800}.nameCol{width:24%}.specCol{width:13%}.unitCol{width:8%}.qtyCol{width:10%}.priceCol,.amountCol,.taxCol{width:12%}.rateCol{width:9%}.num{text-align:right;font-variant-numeric:tabular-nums}.center{text-align:center}.sumLabel{text-align:center;font-weight:800;color:#9f1239;background:#fffdfb}.grand{display:grid;grid-template-columns:1fr 260px;border:1px solid #efb5b5;border-top:0;font-size:15px}.grand>div{padding:10px 12px}.grandSmall{border-left:1px solid #efb5b5}.amountNote{margin-top:6px;font-size:12px;color:#6b7280}.amountNote.warn{color:#b91c1c;font-weight:800}.money{font-size:20px;font-weight:900;color:#991b1b}.remarkBox{display:grid;grid-template-columns:54px 1fr;border:1px solid #efb5b5;border-top:0;min-height:58px}.remarkLabel{display:flex;align-items:center;justify-content:center;border-right:1px solid #efb5b5;color:#9f1239;font-weight:800}.remarkBody{padding:9px 12px;font-size:12px;color:#6b7280}.issuer{display:flex;justify-content:flex-end;border:1px solid #efb5b5;border-top:0;padding:9px 12px;color:#621313}.cp{cursor:pointer;border-radius:4px;transition:background .12s,outline-color .12s}.cp:hover{background:#fff1f2}.cp.copied{outline:2px solid #16a34a;background:#ecfdf5;color:#166534}.btn{border:1px solid #cbd5e1;background:#fff;color:#1f2937;border-radius:6px;padding:8px 11px;cursor:pointer;font-weight:700}.primary{border:0;background:#1d4ed8;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.upload{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}.upload input{border:1px solid #cbd5e1;border-radius:6px;padding:8px;background:#fff}.status{margin-top:8px;font-size:13px;color:#475467}.ok{color:#15803d}.err{color:#b91c1c}.uploaded{display:grid;gap:8px}.uprow{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #e6ebf2;padding-top:8px;font-size:13px}@media(max-width:760px){.top{display:block}.officialTop{grid-template-columns:98px 1fr}.seal{display:none}.invMeta{grid-column:1/3}.partyWrap{grid-template-columns:1fr}.party+.party{border-left:0;border-top:1px solid #efb5b5}.grand{grid-template-columns:1fr}.grandSmall{border-left:0;border-top:1px solid #efb5b5}.upload{display:grid}.upload input,.btn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="brand">SANLYN 工厂开票门户</div><div class="sub" id="factory">加载中...</div></div><div class="tag">增值税专用发票模板</div></div>
  <div id="msg" class="card empty">正在读取待开发票...</div>
  <div id="app" style="display:none"></div>
</div>
<script src="templates/invoice-official.js"></script>
<script>
const qs=new URLSearchParams(location.search),CODE=qs.get("c")||"",MT=qs.get("mt")||"",API="/api/db/factory-portal";
let DATA=null;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money=n=>(Number(n)||0).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
const qty=n=>(Number(n)||0).toLocaleString("zh-CN",{maximumFractionDigits:3});
const rate=n=>Number(n||0).toLocaleString("zh-CN",{style:"percent",maximumFractionDigits:0});
const cpAttr=(v,cls="")=>`class="cp${cls?" "+cls:""}" onclick="copyCell(this)" data-copy="${esc(v??"")}" title="点击复制"`;
function q(){return MT?"mt="+encodeURIComponent(MT):"c="+encodeURIComponent(CODE)}
function show(t,cls=""){ $("msg").className="card empty "+cls;$("msg").style.display="";$("msg").textContent=t;$("app").style.display="none" }
function upperMoney(n){
  let s=(Math.round((Number(n)||0)*100)/100).toFixed(2),[i,d]=s.split("."),u="零壹贰叁肆伍陆柒捌玖",a=["","拾","佰","仟"],b=["","万","亿"],out="";
  if(i==="0")out="零";else{let groups=[];while(i){groups.unshift(i.slice(-4));i=i.slice(0,-4)}groups.forEach((g,gi)=>{let part="",z=false;g.padStart(4,"0").split("").forEach((c,ci)=>{let num=Number(c),pos=3-ci;if(num){if(z){part+="零";z=false}part+=u[num]+a[pos]}else if(part)z=true});if(part)out+=part+b[groups.length-1-gi]});}
  const j=Number(d[0]),f=Number(d[1]);
  return out+"元"+(j?u[j]+"角":"")+(f?u[f]+"分":j?"":"整");
}
async function load(){
  if(!CODE&&!MT)return show("链接缺少参数，请联系我司重新发送。","err");
  try{const r=await fetch(API+"?"+q()),d=await r.json();if(!r.ok)throw new Error(d.error||"链接无效或已过期");DATA=d;$("factory").textContent=(d.factory?.name||d.factory?.code||"工厂")+" · 待开发票";render()}
  catch(e){show(e.message||"网络错误，请稍后重试。","err")}
}
function render(){
  const gaps=DATA.gaps||[],ups=DATA.uploaded||[];$("msg").style.display="none";$("app").style.display="";
  $("app").innerHTML=(gaps.length?gaps.map(renderGap).join(""):'<div class="card empty ok">暂无待开发票</div>')+renderUploaded(ups);
}
function party(label,rows){
  return `<div class="party"><div class="pLabel">${label}</div><div class="pGrid">${rows.map(r=>`<div class="field"><b>${r[0]}：</b><span ${cpAttr(r[1]||"")}>${esc(r[1]||"")}</span></div>`).join("")}</div></div>`;
}
function historyRef(g){
  const h=g.invoice_history;
  if(!h)return `<div class="histBar"><b>🆕 新供应商无历史开票记录</b>，品名暂按报关申报，请贵司按实际开票格式核对。</div>`;
  const d=String(h.last_invoice_date||"").slice(0,10)||"-",names=(h.hist_names||[]).slice(0,3).join("/")||"-";
  return `<div class="histBar"><b>📋 参考·历史开票口径</b> 上次这样开(${esc(d)})：品名=${esc(names)} · 单位=${esc(h.hist_unit||"-")} · 税率=${rate(h.hist_tax_rate)}。本模板品名已按历史填充，单位/数量按报关箱数，如贵司按千克开请按净重折算。</div>`;
}
function amountNote(g){
  const customs=Number(g.customs_amount)||0,oli=Number(g.oli_ref_amount)||0;
  if(g.amount_source==="oli_fallback")return `<div class="amountNote warn">⚠报关金额缺失，暂按采购价，请先补报关资料再开票</div>`;
  const ref=Math.abs(customs-oli)>5?`（OLI采购价¥${money(oli)}仅参考）`:"";
  return `<div class="amountNote">金额按报关申报口径¥${money(customs)}${ref}</div>`;
}
function renderGap(g,i){
  const lines=g.invoice_lines||[],buyer=g.buyer||{},seller=g.seller||{},total=Number(g.total_incl??g.amount_incl_tax)||0;
  const ex=Number(g.amount_ex)||lines.reduce((s,l)=>s+Number(l.subtotal_ex||0),0),tax=Number(g.tax_amount)||lines.reduce((s,l)=>s+Number(l.tax_amount||0),0);
  const miss=g.buyer_missing||g.seller_missing,missText=[g.buyer_missing?"购买方":"",g.seller_missing?"销售方":""].filter(Boolean).join("/");
  const bank=[seller.bank_name,seller.bank_account].filter(Boolean).join(" / ");
  const items=lines.map(l=>({name:l.goods_name+(l.name_source==="history"?"（历史）":""),spec:"",unit:l.unit||"包",qty:l.qty_bags||1,price:l.unit_price_ex||0,amount:l.subtotal_ex||0,rate:l.tax_rate||0,tax:l.tax_amount||0}));
  const footer=`${historyRef(g)}${amountNote(g)}<div class="upload"><input id="file${i}" type="file" accept=".pdf,image/*" ${miss?"disabled":""}><button class="btn primary" onclick="upload(${i})" ${miss?"disabled":""}>上传发票</button><button class="btn" onclick="copyTotal(${i})">复制金额</button></div><div id="st${i}" class="status"></div>`;
  const html=InvoiceOfficial.render({docTitle:"电子发票",title:"增值税专用发票",currency:"CNY",buyer,seller,items,total_ex:ex,total_tax:tax,total,remark:bank?`开户行/账号：${bank}`:"",editable:false,footerHtml:footer,index:i});
  return `<div class="card" data-i="${i}">${miss?`<div class="banner red">⚠ ${missText}开票信息未维护，暂不能开票，请联系我司</div>`:""}${html}</div>`;
}
function renderUploaded(ups){
  if(!ups.length)return "";
  return `<div class="card"><b>已上传发票</b><div class="uploaded">${ups.map(u=>`<div class="uprow"><span>${esc(u.invoice_no)} · ${esc(u.review_status)}</span><b>¥${money(u.amount_incl_tax)}</b></div>`).join("")}</div></div>`;
}
async function copyTotal(i){const g=DATA.gaps[i],total=Number(g.total_incl??g.amount_incl_tax)||0;await navigator.clipboard.writeText(total.toFixed(2));$("st"+i).textContent="金额已复制"}
async function copyCell(el){const text=el.dataset.copy??el.textContent.trim();await navigator.clipboard.writeText(text);el.classList.add("copied");setTimeout(()=>el.classList.remove("copied"),1000)}
async function upload(i){
  const g=DATA.gaps[i],f=$("file"+i).files[0],st=$("st"+i);if(g.buyer_missing||g.seller_missing){st.textContent="开票信息未维护，暂不能上传";st.className="status err";return}
  if(!f){st.textContent="请选择发票文件";st.className="status err";return}
  const fd=new FormData();fd.append("file",f);fd.append("contract_no",g.contract_no||"");fd.append("customs_no",g.customs_no||"");
  st.textContent="识别中...";st.className="status";
  try{const r=await fetch(API+"?action=upload&"+q(),{method:"POST",body:fd}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||"上传失败");st.className="status "+(d.warning?"err":"ok");st.innerHTML=`识别结果：发票号 ${esc(d.invoice_no||"-")}，金额 ¥${money(d.amount_incl_tax)}，状态 ${esc(d.review_status||"-")}${d.warning?"；"+esc(d.warning):""}`}
  catch(e){st.textContent=e.message||"上传失败";st.className="status err"}
}
load();
</script>
</body>
</html>
<!--
本次改动：每张发票卡重排为“电子发票（增值税专用发票）”红色官方表格式布局。
本次改动：左上角仅保留空二维码框，右上角发票号码/开票日期标为开票时生成，不编造号码。
本次改动：购买方/销售方改为左右信息块，销售方只显示名称和税号，银行账号移入备注小字。
本次改动：明细表改为项目名称、规格型号、单位、数量、单价、金额、税率/征收率、税额八列。
本次改动：移除发票版式中的对外合同号和报关单号展示，上传仍沿用原字段提交。
原因：贴近新版电子专票视觉，同时保留报关口径金额、历史品名标、复制、上传/OCR和隔离数据逻辑。
-->
