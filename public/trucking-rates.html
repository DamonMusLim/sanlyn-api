<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拖车/报关报价</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#172033;font:13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.wrap{max-width:1280px;margin:0 auto;padding:20px}header{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:12px}h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;color:#667085}.tabs,.bar,.panel{background:#fff;border:1px solid #d9e0e8;border-radius:8px;padding:10px;margin-bottom:10px}.tabs,.bar{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.tab{height:32px;border:1px solid #b7c2d0;background:#fff;color:#23314d;border-radius:6px;padding:0 12px;font-weight:800;cursor:pointer}.tab.on,.btn{background:#23314d;color:#fff;border-color:#23314d}.field{display:grid;gap:4px}.field label{font-size:11px;font-weight:800;color:#667085}input,select{height:32px;border:1px solid #cfd6e1;border-radius:6px;background:#fff;padding:0 8px;min-width:120px}.grow{flex:1}.btn,.smallbtn{height:32px;border-radius:6px;padding:0 14px;font-weight:800;cursor:pointer}.smallbtn{height:28px;border:1px solid #23314d;background:#23314d;color:#fff;padding:0 10px}.smallbtn:disabled{background:#eef1f5;border-color:#cfd6e1;color:#667085;cursor:not-allowed}.msg{padding:10px;border:1px solid #ead18f;background:#fff9e7;color:#6f4a10;border-radius:8px;margin-bottom:10px}.msg a{color:#23314d;font-weight:900}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}.metric{background:#fff;border:1px solid #d9e0e8;border-radius:8px;padding:12px}.metric b{display:block;font-size:22px}.table{overflow:auto;background:#fff;border:1px solid #d9e0e8;border-radius:8px}table{width:100%;border-collapse:collapse;min-width:1180px}th,td{border-bottom:1px solid #eef1f5;padding:8px 9px;text-align:left;vertical-align:top;white-space:nowrap}th{background:#172033;color:#fff;font-size:11px;font-weight:800;position:sticky;top:0}.num{text-align:right;font-variant-numeric:tabular-nums}.muted{color:#667085}.lowest{background:#e8f7ef;color:#087443;font-weight:900}.empty{padding:26px;text-align:center;color:#667085}.side{display:inline-block;border:1px solid #bfd7cc;background:#eef8f3;color:#087443;border-radius:5px;padding:1px 6px;font-size:12px}.hist{border-color:#f7c566;background:#fff7df;color:#9a5b00}.histrow{background:#fffaf0}.trace{font-size:12px;color:#667085;line-height:1.55}.trace pre{max-width:360px;white-space:pre-wrap;word-break:break-all;background:#f8fafc;border:1px solid #e4e7ec;border-radius:6px;padding:8px;margin:6px 0 0;color:#344054}.err{color:#b42318;background:#fff1f0;border-color:#ffd1cc}.ok{color:#087443;background:#ecfdf3;border-color:#abefc6}@media(max-width:820px){.wrap{padding:14px}header,.bar,.grid{display:grid;grid-template-columns:1fr}.field input,.field select{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>拖车/报关报价</h1><div class="sub" id="stamp">v2026.08.27-4 · 加载中</div></div>
    <button class="btn" id="reload">刷新</button>
  </header>
  <div class="tabs">
    <button class="tab on" data-service="truck">拖车比价</button>
    <button class="tab" data-service="customs">报关报价</button>
  </div>
  <div id="truckContext" class="msg">加载提货地覆盖情况</div>
  <div class="bar" id="adoptContext">
    <div class="field"><label>BL No.</label><input id="adopt_bl_no" placeholder="必填"></div>
    <div class="field"><label>link_plan_id</label><input id="adopt_link_plan_id" placeholder="必填"></div>
    <div class="field"><label>账期</label><input id="adopt_bill_month" placeholder="YYYY-MM"></div>
  </div>
  <div class="bar" id="filters"></div>
  <div class="msg">历史成交价来自实际账单，含多柜/杂费等未拆分成分，仅供参考，不等于报价</div>
  <div id="message" class="msg">加载中</div>
  <section class="grid">
    <div class="metric"><span class="muted">报价行数</span><b id="rowCount">0</b></div>
    <div class="metric"><span class="muted">服务商总数</span><b id="partnerCount">0</b></div>
    <div class="metric"><span class="muted">有报价服务商</span><b id="quotedCount">0</b></div>
    <div class="metric"><span class="muted">最低价</span><b id="minRate">-</b></div>
  </section>
  <section id="content"></section>
</div>
<script>
var state={service:"truck",rows:[],partners:[]};
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])})}
function token(){return localStorage.getItem("sanlyn_jwt")||localStorage.getItem("sanlyn_token")||localStorage.getItem("token")||""}
function money(v){if(v==null||v==="")return "-";var n=Number(v);return Number.isFinite(n)?n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):esc(v)}
function side(v){return v?'<span class="side">'+(v==="cost"?"成本":"卖价")+"</span>":"-"}
function valid(r){return [r.valid_from,r.valid_to].filter(Boolean).join(" ~ ")||"-"}
function tax(v){return v===true?"含税":v===false?"不含税":"-"}
function isHist(r){return r&&r.source==="derived_from_bills"}
function sourceBadge(r){return isHist(r)?'<span class="side hist">历史成交</span>':'<span class="side">'+esc((r&&r.rate_source)||"service_rates")+"</span>"}
function statusBadge(r){return r.pending_confirm?'<span class="side" style="border-color:#f7c566;background:#fff7df;color:#9a5b00">待确认</span>':""}
function trace(r){var raw=r.raw||{};if(!isHist(r))return "-";var js;try{js=JSON.stringify(raw,null,2)}catch(e){js=String(raw)}return '<details class="trace"><summary>查看 raw</summary>BL '+esc(raw.bl_no||"-")+'<br>账期 '+esc(raw.bill_month||"-")+'<br>供应商 '+esc(raw.supplier_raw||"-")+'<br>金额 '+money(r.rate)+' '+esc(r.currency||"")+'<br>费用类别 '+esc(raw.cost_category||"-")+'<br>bill_id '+esc(raw.bill_id||"-")+'<pre>'+esc(js)+'</pre></details>'}
function feeStatusLabel(v){return {fee_recorded:"费用已录入",fee_completed:"费用已完成","费用已录入":"费用已录入","费用已完成":"费用已完成"}[v]||v||"-"}
function initContext(){var q=new URLSearchParams(location.search);$("adopt_bl_no").value=q.get("bl_no")||q.get("q")||"";$("adopt_link_plan_id").value=q.get("link_plan_id")||q.get("plan_id")||"";$("adopt_bill_month").value=q.get("bill_month")||new Date().toISOString().slice(0,7)}
function adoptButton(r){if(isHist(r))return '<button class="smallbtn" disabled title="历史成交来自账单，不等于报价">采用此价</button><div class="muted">历史成交只读</div>';if(r.rate_source==="trucking_routes")return '<button class="smallbtn" disabled title="trucking_routes 是线路报价来源，暂不直接生成费用行">采用此价</button><div class="muted">线路报价只读</div>';if(!r.executor_company_id)return '<button class="smallbtn" disabled title="该报价未绑定承运商，无法生成费用行">采用此价</button><div class="muted">该报价未绑定承运商，无法生成费用行</div>';return '<button class="smallbtn" data-adopt="'+esc(r.id)+'">采用此价</button>'}
function openWorkbenchTab(title,url){if(window.parent!==window)window.parent.postMessage({type:"sanlyn:open-tab",title:title,url:url},location.origin);else window.open("/wb-tabs?open="+encodeURIComponent(url),"_blank","noopener")}
function activeFilters(){var q=new URLSearchParams();q.set("service",state.service);["pickup_place","pol","container_type","tier","price_side","customs_port","customs_type","unit"].forEach(function(k){var el=$(k);if(el&&el.value.trim())q.set(k,el.value.trim())});q.set("active_only",$("active_only").checked?"true":"false");return q}
function filterHtml(){
  if(state.service==="customs")return '<div class="field"><label>报关口岸</label><input id="customs_port" placeholder="全部"></div><div class="field"><label>报关类型</label><input id="customs_type" placeholder="全部"></div><div class="field"><label>计费单位</label><select id="unit"><option value="">全部</option><option value="per_ticket">票</option><option value="per_batch">批</option></select></div><div class="field"><label>属性</label><select id="price_side"><option value="">全部</option><option value="cost">成本</option><option value="sell">卖价</option></select></div><label><input id="active_only" type="checkbox" checked> 只看有效</label><button class="btn" id="search">查询</button>';
  return '<div class="field grow"><label>提货地</label><input id="pickup_place" placeholder="工厂/城市"></div><div class="field"><label>装货港 POL</label><input id="pol" placeholder="全部"></div><div class="field"><label>箱型</label><input id="container_type" placeholder="20GP / 40HQ"></div><div class="field"><label>轻重档</label><select id="tier"><option value="">全部</option><option value="light">light</option><option value="heavy">heavy</option><option value="xheavy">xheavy</option></select></div><div class="field"><label>属性</label><select id="price_side"><option value="">全部</option><option value="cost">成本</option><option value="sell">卖价</option></select></div><label><input id="active_only" type="checkbox" checked> 只看有效</label><button class="btn" id="search">查询</button>';
}
function routeKey(r){return [r.pickup_place||r.factory_name||"-",r.pol||"-",r.container_type||"-",r.tier||"-",r.price_side||"-"].join("|")}
function routeLabel(k){var p=k.split("|");return p[0]+" -> "+p[1]+" / "+p[2]+" / "+p[3]+" / "+(p[4]==="cost"?"成本":p[4]==="sell"?"卖价":"属性未填")}
function mergeKey(r){return [r.company_name||"",r.pickup_place||r.factory_name||"",r.pol||"",r.container_type||"",r.tier||""].map(function(x){return String(x).trim().toLowerCase()}).join("|")}
function truckMatrix(){
  var groups={}, mins={}, sources={};state.rows.forEach(function(r){var k=routeKey(r),mk=mergeKey(r);(groups[k]=groups[k]||[]).push(r);(sources[mk]=sources[mk]||new Set()).add(isHist(r)?"derived_from_bills":(r.rate_source||"service_rates"));var n=Number(r.rate);if(!isHist(r)&&Number.isFinite(n))mins[k]=mins[k]==null?n:Math.min(mins[k],n)});
  var html="";
  Object.keys(groups).forEach(function(k){var rows=groups[k],quoted=new Set(rows.filter(function(r){return !isHist(r)}).map(function(r){return r.company_id||r.company_name}).filter(Boolean)).size,sub=quoted<2?"未接入：该线路仅 "+quoted+" 家报价":"同线路横向比价，绿色标出报价最低价";html+='<div class="panel"><b>'+esc(routeLabel(k))+'</b><div class="sub">'+esc(sub)+'</div><div class="table"><table><thead><tr><th>承运商</th><th>来源</th><th>提货城市</th><th>装港码头</th><th>距离km</th><th>车型</th><th>价格</th><th>币种</th><th>计费单位</th><th>含税</th><th>有效期</th><th>属性</th><th>溯源</th><th>备注</th><th>动作</th></tr></thead><tbody>';
    rows.forEach(function(r){var low=!isHist(r)&&Number(r.rate)===mins[k],conflict=(sources[mergeKey(r)]||new Set()).size>1;html+='<tr class="'+(isHist(r)?"histrow":"")+'"><td>'+esc(r.company_name||"未绑定承运商")+(conflict?' <span class="side" style="border-color:#fda29b;background:#fff1f0;color:#b42318">来源冲突</span>':"")+'</td><td>'+sourceBadge(r)+'</td><td>'+esc(r.pickup_city||r.pickup_place||"-")+'</td><td>'+esc(r.pol_terminal||"-")+'</td><td class="num">'+esc(r.distance_km==null?"-":r.distance_km)+'</td><td>'+esc(r.vehicle_type||"-")+'</td><td class="num '+(low?"lowest":"")+'">'+money(r.rate)+(low?" 最低":"")+'</td><td>'+esc(r.currency||"-")+'</td><td>'+esc(r.unit||"-")+'</td><td>'+esc(tax(r.tax_included))+'</td><td>'+esc(valid(r))+'</td><td>'+side(r.price_side)+'</td><td>'+trace(r)+'</td><td>'+statusBadge(r)+" "+esc(r.notes||"")+'</td><td>'+adoptButton(r)+'</td></tr>'});
    html+="</tbody></table></div></div>";
  });
  return html || '<div class="table"><div class="empty">未接入：该线路仅 0 家有报价</div></div>';
}
function customsTable(){
  if(!state.rows.length)return '<div class="table"><div class="empty">未接入：报关报价尚无数据，需先录入</div></div>';
  return '<div class="table"><table><thead><tr><th>报关行</th><th>来源</th><th>报关口岸</th><th>报关类型</th><th>计费单位</th><th>属性</th><th>价格</th><th>币种</th><th>有效期</th><th>溯源</th><th>备注</th><th>动作</th></tr></thead><tbody>'+state.rows.map(function(r){return '<tr class="'+(isHist(r)?"histrow":"")+'"><td>'+esc(r.company_name||"未绑定报关行")+'</td><td>'+sourceBadge(r)+'</td><td>'+esc(r.customs_port||r.pol||"-")+'</td><td>'+esc(r.customs_type||"-")+'</td><td>'+esc(r.unit||"-")+'</td><td>'+side(r.price_side)+'</td><td class="num">'+money(r.rate)+'</td><td>'+esc(r.currency||"-")+'</td><td>'+esc(valid(r))+'</td><td>'+trace(r)+'</td><td>'+esc(r.notes||"")+'</td><td>'+adoptButton(r)+'</td></tr>'}).join("")+"</tbody></table></div>";
}
function draw(data){
  state.rows=data.rows||[];state.partners=data.partners||[];$("message").className="msg"+(data.success?"":" err");$("message").textContent=data.message||"";
  var ctx=data.trucking_context;$("truckContext").style.display=state.service==="truck"?"block":"none";if(ctx)$("truckContext").textContent="提货地维度仅覆盖 "+ctx.trucking_route_count+" 条线路（shipping_plans.factory_company_id "+ctx.shipping_plan_count+" 票中仅 "+ctx.shipping_plan_factory_company_id_count+" 票有值，历史票无法反推提货地）";
  $("rowCount").textContent=state.rows.length;$("partnerCount").textContent=state.partners.length;$("quotedCount").textContent=(data.coverage&&data.coverage.quoted_partner_count)||0;
  var nums=state.rows.filter(function(r){return !isHist(r)}).map(function(r){return Number(r.rate)}).filter(Number.isFinite);$("minRate").textContent=nums.length?money(Math.min.apply(null,nums)):"-";
  $("content").innerHTML=state.service==="truck"?truckMatrix():customsTable();
  $("stamp").textContent=(data.version||"v2026.08.27-4")+" · 生成时间 "+new Date(data.generated_at||Date.now()).toLocaleString("zh-CN");
}
async function load(){
  try{var r=await fetch("/api/db/trucking-rates?"+activeFilters().toString(),{headers:{Authorization:"Bearer "+token()}});var j=await r.json();if(!r.ok||!j.success)throw new Error(j.error||r.statusText);draw(j)}catch(e){$("message").className="msg err";$("message").textContent="读取失败："+e.message;$("content").innerHTML=""}
}
async function adopt(id,btn){btn.disabled=true;btn.textContent="写入中";try{var r=await fetch("/api/db/trucking-rates",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token()},body:JSON.stringify({rate_id:id,bl_no:$("adopt_bl_no").value.trim(),link_plan_id:$("adopt_link_plan_id").value.trim(),bill_month:$("adopt_bill_month").value.trim()})});var j=await r.json();if(!r.ok||!j.success)throw new Error(j.message||j.error||r.statusText);$("message").className="msg ok";$("message").innerHTML='写入成功：费用行 '+esc(j.bill_id)+' · '+esc(feeStatusLabel(j.bill&&j.bill.fee_status))+' <a href="#" data-ocean-url="'+esc(j.ocean_url||"/ocean")+'">在账单中查看</a>';btn.textContent="已采用"}catch(e){$("message").className="msg err";$("message").textContent="采用失败："+e.message;btn.disabled=false;btn.textContent="采用此价"}}
function setService(s){state.service=s;document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.dataset.service===s)});$("filters").innerHTML=filterHtml();$("search").onclick=load;load()}
document.addEventListener("click",function(e){var b=e.target.closest("[data-adopt]");if(b){adopt(b.dataset.adopt,b);return}var a=e.target.closest("[data-ocean-url]");if(a){e.preventDefault();openWorkbenchTab("账单管理",a.dataset.oceanUrl)}})
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){setService(b.dataset.service)}});$("reload").onclick=load;initContext();setService("truck");
</script>
</body>
</html>
