<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拖车/报关报价</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#172033;font:13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.wrap{max-width:1280px;margin:0 auto;padding:20px}header{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:12px}h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;color:#667085}.tabs,.bar,.panel{background:#fff;border:1px solid #d9e0e8;border-radius:8px;padding:10px;margin-bottom:10px}.tabs,.bar{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.tab{height:32px;border:1px solid #b7c2d0;background:#fff;color:#23314d;border-radius:6px;padding:0 12px;font-weight:800;cursor:pointer}.tab.on,.btn{background:#23314d;color:#fff;border-color:#23314d}.field{display:grid;gap:4px}.field label{font-size:11px;font-weight:800;color:#667085}input,select{height:32px;border:1px solid #cfd6e1;border-radius:6px;background:#fff;padding:0 8px;min-width:120px}.grow{flex:1}.btn{height:32px;border-radius:6px;padding:0 14px;font-weight:800;cursor:pointer}.msg{padding:10px;border:1px solid #ead18f;background:#fff9e7;color:#6f4a10;border-radius:8px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}.metric{background:#fff;border:1px solid #d9e0e8;border-radius:8px;padding:12px}.metric b{display:block;font-size:22px}.table{overflow:auto;background:#fff;border:1px solid #d9e0e8;border-radius:8px}table{width:100%;border-collapse:collapse;min-width:960px}th,td{border-bottom:1px solid #eef1f5;padding:8px 9px;text-align:left;vertical-align:top;white-space:nowrap}th{background:#172033;color:#fff;font-size:11px;font-weight:800;position:sticky;top:0}.num{text-align:right;font-variant-numeric:tabular-nums}.muted{color:#667085}.lowest{background:#e8f7ef;color:#087443;font-weight:900}.empty{padding:26px;text-align:center;color:#667085}.side{display:inline-block;border:1px solid #bfd7cc;background:#eef8f3;color:#087443;border-radius:5px;padding:1px 6px;font-size:12px}.err{color:#b42318;background:#fff1f0;border-color:#ffd1cc}@media(max-width:820px){.wrap{padding:14px}header,.bar,.grid{display:grid;grid-template-columns:1fr}.field input,.field select{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>拖车/报关报价</h1><div class="sub" id="stamp">v2026.08.26-1 · 加载中</div></div>
    <button class="btn" id="reload">刷新</button>
  </header>
  <div class="tabs">
    <button class="tab on" data-service="truck">拖车比价</button>
    <button class="tab" data-service="customs">报关报价</button>
  </div>
  <div class="bar" id="filters"></div>
  <div id="message" class="msg">加载中</div>
  <section class="grid">
    <div class="metric"><span class="muted">报价行数</span><b id="rowCount">0</b></div>
    <div class="metric"><span class="muted">服务商总数</span><b id="partnerCount">0</b></div>
    <div class="metric"><span class="muted">有报价服务商</span><b id="quotedCount">0</b></div>
    <div class="metric"><span class="muted">最低价</span><b id="minRate">-</b></div>
  </section>
  <section id="content"></section>
</div>
<script>
var state={service:"truck",rows:[],partners:[]};
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])})}
function token(){return localStorage.getItem("sanlyn_jwt")||localStorage.getItem("sanlyn_token")||localStorage.getItem("token")||""}
function money(v){if(v==null||v==="")return "-";var n=Number(v);return Number.isFinite(n)?n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):esc(v)}
function side(v){return v?'<span class="side">'+(v==="cost"?"成本":"卖价")+"</span>":"-"}
function valid(r){return [r.valid_from,r.valid_to].filter(Boolean).join(" ~ ")||"-"}
function activeFilters(){var q=new URLSearchParams();q.set("service",state.service);["pickup_place","pol","container_type","tier","price_side","customs_port","customs_type","unit"].forEach(function(k){var el=$(k);if(el&&el.value.trim())q.set(k,el.value.trim())});q.set("active_only",$("active_only").checked?"true":"false");return q}
function filterHtml(){
  if(state.service==="customs")return '<div class="field"><label>报关口岸</label><input id="customs_port" placeholder="全部"></div><div class="field"><label>报关类型</label><input id="customs_type" placeholder="全部"></div><div class="field"><label>计费单位</label><select id="unit"><option value="">全部</option><option value="per_ticket">票</option><option value="per_batch">批</option></select></div><div class="field"><label>属性</label><select id="price_side"><option value="">全部</option><option value="cost">成本</option><option value="sell">卖价</option></select></div><label><input id="active_only" type="checkbox" checked> 只看有效</label><button class="btn" id="search">查询</button>';
  return '<div class="field grow"><label>提货地</label><input id="pickup_place" placeholder="工厂/城市"></div><div class="field"><label>装货港 POL</label><input id="pol" placeholder="全部"></div><div class="field"><label>箱型</label><input id="container_type" placeholder="20GP / 40HQ"></div><div class="field"><label>轻重档</label><select id="tier"><option value="">全部</option><option value="light">light</option><option value="heavy">heavy</option></select></div><div class="field"><label>属性</label><select id="price_side"><option value="">全部</option><option value="cost">成本</option><option value="sell">卖价</option></select></div><label><input id="active_only" type="checkbox" checked> 只看有效</label><button class="btn" id="search">查询</button>';
}
function routeKey(r){return [r.pickup_place||r.factory_name||"-",r.pol||"-",r.container_type||"-",r.tier||"-",r.price_side||"-"].join("|")}
function routeLabel(k){var p=k.split("|");return p[0]+" -> "+p[1]+" / "+p[2]+" / "+p[3]+" / "+(p[4]==="cost"?"成本":p[4]==="sell"?"卖价":"属性未填")}
function truckMatrix(){
  var groups={}, mins={};state.rows.forEach(function(r){var k=routeKey(r);(groups[k]=groups[k]||[]).push(r);var n=Number(r.rate);if(Number.isFinite(n))mins[k]=mins[k]==null?n:Math.min(mins[k],n)});
  var html="";
  Object.keys(groups).forEach(function(k){var rows=groups[k],quoted=new Set(rows.map(function(r){return r.company_id}).filter(Boolean)).size,sub=quoted<2?"未接入：该线路仅 "+quoted+" 家有报价":"同线路横向比价，绿色标出最低价";html+='<div class="panel"><b>'+esc(routeLabel(k))+'</b><div class="sub">'+esc(sub)+'</div><div class="table"><table><thead><tr><th>承运商</th><th>车型</th><th>价格</th><th>币种</th><th>计费单位</th><th>有效期</th><th>来源</th><th>备注</th></tr></thead><tbody>';
    rows.forEach(function(r){var low=Number(r.rate)===mins[k];html+='<tr><td>'+esc(r.company_name||"未绑定承运商")+'</td><td>'+esc(r.vehicle_type||"-")+'</td><td class="num '+(low?"lowest":"")+'">'+money(r.rate)+(low?" 最低":"")+'</td><td>'+esc(r.currency||"-")+'</td><td>'+esc(r.unit||"-")+'</td><td>'+esc(valid(r))+'</td><td>'+side(r.price_side)+'</td><td>'+esc(r.notes||"")+'</td></tr>'});
    html+="</tbody></table></div></div>";
  });
  return html || '<div class="table"><div class="empty">未接入：该线路仅 0 家有报价</div></div>';
}
function customsTable(){
  if(!state.rows.length)return '<div class="table"><div class="empty">未接入：报关报价尚无数据，需先录入</div></div>';
  return '<div class="table"><table><thead><tr><th>报关行</th><th>报关口岸</th><th>报关类型</th><th>计费单位</th><th>属性</th><th>价格</th><th>币种</th><th>有效期</th><th>备注</th></tr></thead><tbody>'+state.rows.map(function(r){return '<tr><td>'+esc(r.company_name||"未绑定报关行")+'</td><td>'+esc(r.customs_port||r.pol||"-")+'</td><td>'+esc(r.customs_type||"-")+'</td><td>'+esc(r.unit||"-")+'</td><td>'+side(r.price_side)+'</td><td class="num">'+money(r.rate)+'</td><td>'+esc(r.currency||"-")+'</td><td>'+esc(valid(r))+'</td><td>'+esc(r.notes||"")+'</td></tr>'}).join("")+"</tbody></table></div>";
}
function draw(data){
  state.rows=data.rows||[];state.partners=data.partners||[];$("message").className="msg"+(data.success?"":" err");$("message").textContent=data.message||"";
  $("rowCount").textContent=state.rows.length;$("partnerCount").textContent=state.partners.length;$("quotedCount").textContent=(data.coverage&&data.coverage.quoted_partner_count)||0;
  var nums=state.rows.map(function(r){return Number(r.rate)}).filter(Number.isFinite);$("minRate").textContent=nums.length?money(Math.min.apply(null,nums)):"-";
  $("content").innerHTML=state.service==="truck"?truckMatrix():customsTable();
  $("stamp").textContent=(data.version||"v2026.08.26-1")+" · 生成时间 "+new Date(data.generated_at||Date.now()).toLocaleString("zh-CN");
}
async function load(){
  try{var r=await fetch("/api/db/trucking-rates?"+activeFilters().toString(),{headers:{Authorization:"Bearer "+token()}});var j=await r.json();if(!r.ok||!j.success)throw new Error(j.error||r.statusText);draw(j)}catch(e){$("message").className="msg err";$("message").textContent="读取失败："+e.message;$("content").innerHTML=""}
}
function setService(s){state.service=s;document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.dataset.service===s)});$("filters").innerHTML=filterHtml();$("search").onclick=load;load()}
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){setService(b.dataset.service)}});$("reload").onclick=load;setService("truck");
</script>
</body>
</html>
