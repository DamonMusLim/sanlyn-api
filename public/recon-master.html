<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>对账主表</title>
<link rel="stylesheet" href="/public/sanlyn-table.css">
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="title">对账主表</div><div class="meta">v2026.08.11-1 · <span id="stamp"></span></div></div></div>
  <div class="bar">
    <select id="company" style="height:32px;border:1px solid #d1d5db;border-radius:6px;min-width:260px"><option value="CN-00040">CN-00040</option></select>
    <input id="year" value="2026" placeholder="年份">
        <select id="factory" style="height:32px;border:1px solid #d1d5db;border-radius:6px;min-width:180px"><option value="">全部工厂</option></select>
    <select id="terms" style="height:32px;border:1px solid #d1d5db;border-radius:6px"><option value="">全部条款</option></select>
    <label style="display:flex;align-items:center;gap:4px;font-size:13px"><input type="checkbox" id="gaponly">只看缺口</label>
<button class="btn" id="reload">刷新</button>
    <button class="btn" id="exportBtn">导出Excel</button>
    <button class="btn" id="editToggle" style="background:#6b7280">🔒 只读</button>
  </div>
  <div id="msg"></div><div class="panel" id="app"><div class="hint">Loading...</div></div>
</div>
<script src="/public/sanlyn-table.js"></script>
<script>
function onePo(r){var pos=String(r.po_nos||"").split("+").filter(Boolean);return pos.length===1?pos[0]:""}
function planKey(r){return r.bl_no||""}
function docsCell(r,h){var t=h.token(),bl=r.bl_no||"",name=String(r.customer||"-"),docs=r.docs||[],links=[];
  var pos=(r.orders||[]).map(function(o){return o.po}).filter(Boolean);
  if(pos.length)links.push('<a target="_blank" href="/templates/export-docs-template.html?order_no='+encodeURIComponent(pos[0])+'&ids='+encodeURIComponent(pos.join(","))+'&mode=detail&token='+encodeURIComponent(t)+'">客户资料合并版(PL+SC+IV)</a>');
  if(bl){links=links.concat(docs.map(function(d){return '<a target="_blank" href="/api/db/shipping-plan-pdf?bl='+encodeURIComponent(bl)+'&type='+encodeURIComponent(d.doc_type)+'&token='+encodeURIComponent(t)+'">'+h.esc(d.doc_no)+'</a>'}));
    links.push('<a target="_blank" href="/api/db/shipping-plan-pdf?bl='+encodeURIComponent(bl)+'&type=fob_invoice&token='+encodeURIComponent(t)+'">海运费单</a>');
    links.push('<a target="_blank" href="/api/db/shipping-plan-pdf?bl='+encodeURIComponent(bl)+'&type=fob_portcharge&token='+encodeURIComponent(t)+'">港杂单</a>')}
  if(!links.length)return h.esc(name);
  // links 顺序: 合并版在最上
  return '<span class="po-head">'+h.esc(name.slice(0,10))+' 📎'+links.length+'</span><span class="po-full">'+h.esc(name)+'<br>'+links.join("<br>")+'</span>'}
function factoryCell(r,h){var ext=r.external_src?' <b title="外单(内部标记)" style="color:#b45309">·外</b>':'';
  var parts=String(r.factory||"").split(" / ").filter(Boolean),pos=String(r.po_nos||"").split("+").filter(Boolean);
  var links=pos.map(function(p){return '<a target="_blank" href="/data#orders?order_no='+encodeURIComponent(p)+'">'+h.esc(p)+' 订单账</a>'});
  if(!parts.length&&!links.length)return '<span class="nil">-</span>';
  return '<span class="po-head">'+h.esc((parts[0]||"-").slice(0,10))+ext+(parts.length>1?' <b class="po-more">+'+(parts.length-1)+'</b>':'')+' 📎</span><span class="po-full">'+h.esc(parts.join(" / ")||"-")+'<br>'+links.join("<br>")+'</span>'}
function rowEdit(r){var out=[];(r.orders||[]).forEach(function(o){if(!o.po)return;
  out.push({label:o.po+" 工厂成本",kind:"order",key:o.po,field:"goods_cost",value:o.cost||0});
  out.push({label:o.po+" 客户售价",kind:"order",key:o.po,field:"goods_sale",value:o.sale||0})});
  if(r.bl_no){out.push({label:"海运销售 USD",kind:"plan",key:r.bl_no,field:"freight_sale_usd",value:r.ocean_sale_usd||0});
    out.push({label:"港杂销售 CNY",kind:"plan",key:r.bl_no,field:"freight_sale_cny",value:r.port_sale_cny||0})}
  return out}
var table=SanlynTable.mount(document.getElementById("app"),{
  filter:baseFilter,
  api:"/api/db/recon-master",params:function(){return {company:company.value,year:year.value}},
  exportUrl:"/api/db/recon-export",editApi:"/api/db/recon-edit",loginApi:"/api/db/auth-login",
  sumKeys:["goods_cost","goods_sale","ocean_cost_usd","truck_cost_cny","barge_cost_cny","ocean_sale_usd","port_sale_cny","declared_amount"],
  rowEdit:rowEdit,
  columns:[
    {key:"etd",label:"日期",render:function(r,h){return h.esc(String(r.etd||"").slice(0,10))}},
    {key:"factory",label:"出货人(工厂)",fold:true,render:factoryCell},
    {key:"customer",label:"收货人(客户)",fold:true,render:docsCell},
    {key:"po_nos",label:"PO号",type:"fold",sep:"+",show:3},
    {key:"bl_no",label:"BL",gap:"缺BL"},
    {key:"trade_terms",label:"条款"},
    {key:"goods_cost",label:"货品成本",type:"num",gap:"缺成本",group:"外贸",edit:function(r){var p=onePo(r);return p?{kind:"order",key:p,field:"goods_cost"}:null}},
    {key:"goods_sale",label:"货品销售",type:"num",gap:"缺销售",group:"外贸",edit:function(r){var p=onePo(r);return p?{kind:"order",key:p,field:"goods_sale"}:null}},
    {key:"declared_amount",label:"报关额",type:"num",gap:"缺报关",group:"外贸"},
    {key:"ocean_cost_usd",label:"成本USD",type:"num",group:"海运"},
    {key:"truck_cost_cny",label:"拖车CNY",type:"num",group:"海运"},
    {key:"barge_cost_cny",label:"驳船CNY",type:"num",group:"海运"},
    {key:"ocean_sale_usd",label:"销售USD",type:"num",group:"海运",edit:function(r){var k=planKey(r);return k?{kind:"plan",key:k,field:"freight_sale_usd"}:null}},
    {key:"port_sale_cny",label:"港杂CNY",type:"num",group:"海运",edit:function(r){var k=planKey(r);return k?{kind:"plan",key:k,field:"freight_sale_cny"}:null}},
    {key:"gap_flags",label:"缺口",gap:true,render:function(r,h){var g=r.gap_flags||[];if(!g.length&&r.pipeline)return '<span class="st-na">未出运</span>';return h.esc(g.join("/"))}}
  ]});
SanlynTable.companySelect(document.getElementById("company"),"CN-00040").then(function(){});
company.onchange=function(){table.load()};
reload.onclick=function(){table.load()};
function baseFilter(r){
  var f=document.getElementById("factory").value, t=document.getElementById("terms").value, g=document.getElementById("gaponly").checked;
  if(f&&String(r.factory||"").indexOf(f)<0)return false;
  if(t&&String(r.trade_terms||"")!==t)return false;
  if(g&&!(r.gap_flags||[]).length)return false;
  return true;}
function fillOpts(){var fs={},ts={};table.rows.forEach(function(r){
    String(r.factory||"").split(" / ").filter(Boolean).forEach(function(x){fs[x]=1});
    if(r.trade_terms)ts[r.trade_terms]=1});
  var F=document.getElementById("factory"),T=document.getElementById("terms");
  var fv=F.value,tv=T.value;
  F.innerHTML='<option value="">全部工厂</option>'+Object.keys(fs).sort().map(function(x){return '<option'+(x===fv?" selected":"")+'>'+SanlynTable.esc(x)+'</option>'}).join("");
  T.innerHTML='<option value="">全部条款</option>'+Object.keys(ts).sort().map(function(x){return '<option'+(x===tv?" selected":"")+'>'+SanlynTable.esc(x)+'</option>'}).join("");}
["factory","terms","gaponly"].forEach(function(id){document.getElementById(id).onchange=function(){table.render()}});
setInterval(function(){if(table.rows.length&&!document.getElementById("factory").dataset.f){document.getElementById("factory").dataset.f=1;fillOpts()}},400);
var _oldReload=reload.onclick;reload.onclick=function(){document.getElementById("factory").dataset.f="";_oldReload();setTimeout(fillOpts,1500)};
exportBtn.onclick=function(){table.exportExcel("recon-"+company.value+".xlsx")};
editToggle.onclick=function(){table.setEditMode(!table.editMode);
  editToggle.textContent=table.editMode?"✏️ 编辑中":"🔒 只读";
  editToggle.style.background=table.editMode?"#b91c1c":"#6b7280"};
</script>
</body>
</html>
