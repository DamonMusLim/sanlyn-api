<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工厂协同预览 v2</title>
<style>
:root{--bg:#08090b;--card:#111317;--card2:#171a1f;--line:#23272e;--line2:#2f343c;--tx:#e8ebef;--tx2:#a8b0bb;--tx3:#6b7280;--blue:#3b82f6;--blue-bg:#12233f;--green:#34d399;--green-bg:#0f2a22;--amber:#fbbf24;--amber-bg:#2b2210;--red:#f87171;--red-bg:#2c1517;--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased}.top{position:sticky;top:0;z-index:30;background:rgba(8,9,11,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.top-in{max-width:860px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{font-weight:700;letter-spacing:.14em;font-size:12.5px}.brand span{color:var(--blue)}.stamp{font:12px var(--mono);color:var(--tx3)}.wrap{max-width:860px;margin:0 auto;padding:15px 18px 90px;display:flex;flex-direction:column;gap:11px}.note{background:var(--amber-bg);border:1px solid #4a3a12;border-radius:7px;padding:9px 14px;font-size:12.5px;color:var(--amber)}.hero{background:linear-gradient(180deg,#1b1508,#12141a);border:1px solid #4a3a12;border-radius:10px;padding:13px 17px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.hero.ship{background:linear-gradient(180deg,#0d2a22,#12141a);border-color:#1c4638}.hero .t{font-weight:700;font-size:15px}.hero .t em{font-style:normal;color:var(--amber)}.hero.ship .t em{color:var(--green)}.pill{font-size:11.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--tx2);white-space:nowrap}.pill.warn{background:var(--amber-bg);border-color:#4a3a12;color:var(--amber)}.pill.ok{background:var(--green-bg);border-color:#1c4638;color:var(--green)}.blk{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}.blk.done{background:var(--card2);border-color:#1c4638}.blk.hide{display:none}.hd{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left}.hd:focus-visible,.btn:focus-visible,.filebtn:focus-within{outline:2px solid var(--blue);outline-offset:2px}.hd .ic{width:23px;height:23px;flex:0 0 23px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:11.5px;background:var(--line2);color:var(--tx3)}.blk.done .hd .ic{background:var(--green);color:#062018;font-weight:700}.hd .tt{font-weight:700;font-size:14.5px;flex:0 0 auto}.hd .sum{font-size:12.5px;color:var(--green);font-family:var(--mono);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.hd .todo{font-size:12px;color:var(--amber);flex:1}.hd .car{margin-left:auto;color:var(--tx3);font-size:11px;transition:transform .2s}.blk.open .hd .car{transform:rotate(90deg)}.bd{padding:0 16px 14px;display:flex;flex-direction:column;gap:11px}.blk:not(.open) .bd{display:none}.dates,.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px}.dt,.kvi{background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:8px 11px}.dt .l,.kvi .l{font-size:10.5px;color:var(--tx3)}.dt .v,.kvi .v{font-family:var(--mono);font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}.dt.pick{border-color:#2b5187;background:var(--blue-bg)}.dt.pick .v{color:#9cc4ff}.dt.warn .v,.kvi.warn2 .v{color:var(--amber)}.dt.mut .v{color:var(--tx3);font-weight:400}.kvi.hot{border-color:#1c4638;background:var(--green-bg)}.kvi.hot .v{color:var(--green)}.kvi.warn2{border-color:#4a3a12;background:var(--amber-bg)}.upl{border:1.5px dashed var(--line2);border-radius:8px;padding:14px;background:var(--card2);display:flex;gap:12px;align-items:center;flex-wrap:wrap}.upl .ic2{font-size:20px}.upl .tx{flex:1;min-width:170px}.upl .tx b{display:block;font-size:13.5px;color:var(--tx)}.upl .tx span,.hint{font-size:11.5px;color:var(--tx3)}.btn,.filebtn{background:var(--blue);color:#fff;border:0;border-radius:7px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}.btn.g,.filebtn.g{background:transparent;color:var(--tx2);border:1px solid var(--line2);font-weight:400}.filebtn input{display:none}.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:7px}table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:620px}th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}thead th{background:var(--card2);font-size:10.5px;color:var(--tx3);font-weight:600;white-space:nowrap}tbody tr:last-child td{border-bottom:0}td.n,th.n{text-align:right;font-family:var(--mono);white-space:nowrap}.src{font-family:var(--mono);font-size:10px;color:var(--tx3);border:1px solid var(--line2);padding:1px 5px;border-radius:4px}.attrs{display:flex;flex-wrap:wrap;gap:15px}.attr{display:flex;flex-direction:column;gap:5px}.attr .q{font-size:12.5px;color:var(--tx2);display:flex;gap:6px;align-items:center}.frm{font-size:10px;color:var(--tx3);border:1px solid var(--line2);border-radius:4px;padding:0 5px}.opts{display:flex;flex-wrap:wrap;gap:6px}.opt{padding:5px 13px;border:1px solid var(--line2);border-radius:6px;background:var(--card2);color:var(--tx2);font-size:12.5px}.opt.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}.blocked{border:1px dashed var(--line2);border-radius:8px;padding:11px 14px;font-size:12.5px;color:var(--tx3);display:flex;gap:9px;align-items:flex-start}.blocked b{color:var(--tx2)}.act{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.self{border:1px solid var(--line2);border-radius:7px;padding:9px 12px;font:12px var(--mono);color:var(--tx3)}.err{border-color:#4a3a12;background:var(--amber-bg);color:var(--amber)}@media(max-width:520px){.top-in{align-items:flex-start}.hero{align-items:flex-start}.hd .tt{flex:1}.hd .sum,.hd .todo{flex-basis:100%;order:2}.hd .car{order:1}.wrap{padding-left:12px;padding-right:12px}}
</style></head><body>
<div class="top"><div class="top-in"><div class="brand">SANLYN <span>OS</span></div><div class="stamp" id="stamp"></div></div></div>
<div class="wrap">
  <div id="load" class="note">正在读取真实协同接口...</div>
  <div class="hero" id="hero"><div class="t"><em id="factoryName">—</em> — 本票货物确认</div><div class="row"><span class="pill warn" id="statusPill">读取中</span><span class="pill" id="containerPill">—</span></div></div>
  <div class="blk open"><button class="hd"><span class="ic">0</span><span class="tt">沿用条</span><span class="todo">沿用上次，无需重复确认</span><span class="car">▸</span></button><div class="bd"><div class="kv" id="reuseGrid"></div><div class="act"><button class="btn g" id="changeBtn">这次有变化 →</button><span class="hint">仅预览占位，不提交后端。</span></div></div></div>
  <div class="blk open" id="cargoBlk"><button class="hd"><span class="ic" id="cargoIc">1</span><span class="tt">交货与货品资料</span><span class="todo">请确认交货期与货品</span><span class="sum" id="cargoSum" hidden></span><span class="car">▸</span></button><div class="bd">
    <div class="dates" id="dateGrid"></div>
    <div class="upl" id="upl"><span class="ic2">📤</span><span class="tx"><b id="fileText">上传装箱单 PL</b><span id="fileSub">PDF · Excel · 图片；预览版暂不真上传</span></span><label class="filebtn">选择文件<input type="file" id="plFile" accept=".pdf,.xls,.xlsx,image/*"></label></div>
    <div class="tscroll"><table><thead><tr><th>品名</th><th>条码</th><th>规格</th><th class="n">箱数</th><th class="n">NW</th><th class="n">GW</th><th class="n">CBM</th></tr></thead><tbody id="cargoRows"></tbody></table></div>
    <div class="attrs" id="attrs"></div><div class="hint">货物属性只展示接口已有值；缺失项显示未设定。</div>
  </div></div>
  <div class="blk hide" id="oceanBlk"><button class="hd"><span class="ic">🚢</span><span class="tt">海运信息</span><span class="sum" id="oceanSum"></span><span class="car">▸</span></button><div class="bd" id="oceanBd"></div></div>
  <div class="blk hide" id="driverBlk"><button class="hd"><span class="ic">🚛</span><span class="tt">司机与装柜</span><span class="sum" id="driverSum"></span><span class="car">▸</span></button><div class="bd" id="driverBd"></div></div>
  <div class="self" id="selfCheck">本页渲染了 0 个字段，禁见字段命中 0 个</div>
</div>
<script>
(function(){
  var rendered=[], forbidden=["pol","pod","etd","eta","atd","ata","vessel","voyage","carrier_code","so_no","bl_no","release_type","sailings","cargo_cutoff","customer_name","customer","customer_en","shipment_no","_id","freight_sale_usd","pricing","rate_usd","amount","unit_price","declare_amount"];
  var baseWL=["valid","role","booking_sheet","billing","ext_ref","container_type","container_qty","orders","factory_cargo","factory_attrs","collab_uploads","containers_detail","trucking_detail","factory_cargo_ready","factory_submitted","factory_submitted_at","factory_purchase_term","freight_term","plan_freight_term","trucking_arrange","customs_arrange","has_quarantine","fe_cert","collab_status","flow_status","is_booked","factory_entry","factory_loading_done","scope_missing","cargo_ready_date","loading_address","loading_contact","total_cartons","gross_weight_kg","total_cbm","factory_container_type","factory_cargo_type","factory_remarks"];
  var shipperExtra=["pol","pod","etd","eta","atd","ata","vessel","voyage","carrier_code","so_no","bl_no","release_type","sailings","cargo_cutoff"];
  var $=function(s){return document.querySelector(s)}, esc=function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]})};
  function token(){var q=new URLSearchParams(location.search).get("token"); if(q)return q; var m=location.pathname.match(/\/m\/booking\/([^/?#]+)/); return m?m[1]:"";}
  function roleKind(r){return r==="shipper_booking"||r==="customer_booking"?"shipper":"factory"}
  function wl(role){return new Set(baseWL.concat(roleKind(role)==="shipper"?shipperExtra:[]))}
  function allowed(path,role){return wl(role).has(path.split(".").pop())}
  function read(obj,path,role){var parts=path.split("."),cur=obj; for(var i=0;i<parts.length;i++){if(cur==null)return null; cur=cur[parts[i]]} if(!allowed(path,role))return null; rendered.push(path); return cur}
  function first(obj,role,paths){for(var i=0;i<paths.length;i++){var v=read(obj,paths[i],role); if(v!==null&&v!==undefined&&String(v)!=="")return v} return null}
  function txt(v,empty){return v===null||v===undefined||v===""?(empty||"—"):v}
  function fmtD(v,empty){if(!v)return empty||"—"; var s=String(v); return /^\d{4}-\d{2}-\d{2}/.test(s)?s.slice(0,10):s}
  function kv(label,val,cls){return '<div class="kvi '+(cls||"")+'"><div class="l">'+esc(label)+'</div><div class="v">'+esc(txt(val))+'</div></div>'}
  function normalizeArrange(v){var m={agent:"代理安排",babi:"我方安排",factory:"工厂安排",self:"自行安排"}; return v?m[v]||v:"未设定"}
  function stageOf(s){var fs=s.flow_status||"", cs=s.collab_status||"", booked=!!(s.so_no||s.bl_no)||["booked","loaded","arranged","已订舱"].includes(fs)||s.is_booked===true, shipped=["departed","in_transit","arrived"].includes(fs); return shipped?"shipped":(booked?"booked":"pre")}
  function cargoItems(s,role){var fc=read(s,"factory_cargo",role), out=[]; if(Array.isArray(fc)&&fc.length) out=fc.map(function(x){return{name:x.product_name||x.description||x.name||x.cargo_name,barcode:x.barcode,size:x.size||x.spec,ctns:x.ctns||x.cartons||x.qty_ctn,nw:x.nw_kgs||x.nw_kg,gw:x.gw_kgs||x.gw_kg,cbm:x.cbm}}); var orders=read(s,"orders",role); if(!out.length&&Array.isArray(orders)) orders.forEach(function(o){(o.items||[]).forEach(function(it){out.push({name:it.product_name||it.description||it.sku,barcode:it.barcode,size:it.size,ctns:it.ctns,nw:it.nw_kgs,gw:it.gw_kgs,cbm:it.cbm})})}); return out}
  function attrValue(a,names){for(var i=0;i<names.length;i++){if(a&&a[names[i]]!==undefined&&a[names[i]]!==null&&String(a[names[i]])!=="")return a[names[i]]}return null}
  function boolText(v){if(v===null)return"未设定"; if(v===true||v==="yes"||v==="Y"||v==="true"||v==="1")return"是"; if(v===false||v==="no"||v==="N"||v==="false"||v==="0")return"否"; return v}
  function render(j){rendered=[]; var role=j.role||"factory_booking", kind=roleKind(role), s=j.booking_sheet||{}, st=stageOf(s), shipped=st==="shipped", booked=st!=="pre";
    $("#load").textContent=j.valid?"真实接口已读取 · role="+role:"无法读取真实接口："+(j.error||"token 缺失/无效"); $("#load").classList.toggle("err",!j.valid);
    var ref=first(s,role,["ext_ref"]), fac=first(s,role,["factory_entry.label"]); if(!fac){var os=read(s,"orders",role); fac=(Array.isArray(os)&&os[0]&&os[0].factory)||"—"}
    $("#factoryName").textContent=txt(ref)+" · "+txt(fac); $("#containerPill").textContent=txt(first(s,role,["container_type"]))+" × "+txt(first(s,role,["container_qty"]),"未设定"); $("#hero").classList.toggle("ship",shipped);
    $("#statusPill").className="pill "+(shipped?"ok":"warn"); $("#statusPill").textContent=shipped?"已出运":(booked?"已订舱 · 请按时交货":"需要您操作");
    $("#reuseGrid").innerHTML=[kv("成交方式",normalizeArrange(first(s,role,["factory_purchase_term","freight_term","plan_freight_term"]))),kv("拖车",normalizeArrange(first(s,role,["trucking_arrange"]))),kv("报关",normalizeArrange(first(s,role,["customs_arrange"]))),kv("报检",txt(first(s,role,["has_quarantine"]),"未设定")),kv("产地证",txt(first(s,role,["fe_cert"]),"未设定"))].join("");
    var dates=[["计划交货日",["cargo_ready_date"]],["确认交货日",["factory_cargo_ready"],"pick"],["最晚交货日",["latest_delivery_date","last_delivery_date","cargo_ready_deadline"],"warn"],["实际交货日",["actual_delivery_date","loading_done_at","factory_submitted_at"],shipped?"":"mut"]]; $("#dateGrid").innerHTML=dates.map(function(d){return'<div class="dt '+(d[2]||"")+'"><div class="l">'+d[0]+'</div><div class="v">'+esc(fmtD(first(s,role,d[1]),d[0]==="实际交货日"&&!shipped?"未交货":"—"))+'</div></div>'}).join("");
    var items=cargoItems(s,role); $("#cargoRows").innerHTML=items.length?items.map(function(x){return"<tr><td>"+esc(txt(x.name))+"</td><td>"+esc(txt(x.barcode))+"</td><td>"+esc(txt(x.size))+"</td><td class=n>"+esc(txt(x.ctns))+"</td><td class=n>"+esc(txt(x.nw))+"</td><td class=n>"+esc(txt(x.gw))+"</td><td class=n>"+esc(txt(x.cbm))+"</td></tr>"}).join(""):"<tr><td colspan=7>接口未返回货品明细</td></tr>";
    var a=read(s,"factory_attrs",role)||{}, attrs=[["货物性质",attrValue(a,["cargo_type","cargo_property","dangerous"]),["普通货物","危险品"]],["电池 / 液体",attrValue(a,["battery","liquid","battery_liquid"]),["是","否"]],["实木包装",attrValue(a,["wood_packaging","wood","solid_wood"]),["是","否"]]]; $("#attrs").innerHTML=attrs.map(function(x){var v=boolText(x[1]), src=x[1]===null?"未设定":"来自本票"; return'<div class=attr><div class=q>'+esc(x[0])+' <span class=frm>'+src+'</span></div><div class=opts>'+x[2].map(function(o){return'<span class="opt '+(v===o?'on':'')+'">'+o+'</span>'}).join("")+(v!=="是"&&v!=="否"&&v!=="未设定"?'<span class="opt on">'+esc(v)+'</span>':'')+'</div></div>'}).join("");
    $("#cargoBlk").classList.toggle("done",shipped||s.factory_submitted===true); $("#cargoIc").textContent=(shipped||s.factory_submitted===true)?"✓":"1"; $("#cargoSum").hidden=!(shipped||s.factory_submitted===true); $("#cargoSum").textContent="SKU "+items.length+" · 箱数 "+txt(first(s,role,["total_cartons"]),"—");
    $("#oceanBlk").classList.toggle("hide",!booked); $("#driverBlk").classList.toggle("hide",!booked); if(booked){$("#oceanBlk").classList.add("open"); var od=[]; if(kind==="shipper"){od=[kv("船名 / 航次",(txt(first(s,role,["vessel"]))+" "+txt(first(s,role,["voyage"]))).trim(),"hot"),kv("预计开船 ETD",fmtD(first(s,role,["etd"]))),kv("预计到港 ETA",fmtD(first(s,role,["eta"]))),kv("截关",fmtD(first(s,role,["cargo_cutoff"])),"warn2"),kv("起运港 → 卸货港",txt(first(s,role,["pol"]))+" → "+txt(first(s,role,["pod"])))]; $("#oceanSum").textContent=txt(first(s,role,["vessel"]),"船期已订")+" · "+fmtD(first(s,role,["etd"]))}else{var cds=read(s,"containers_detail",role)||[], addr=cds[0]&&(cds[0].loading_address||cds[0].loading_contact); od=[kv("最晚交货日",fmtD(first(s,role,["latest_delivery_date","last_delivery_date","cargo_ready_deadline"])),"warn2"),kv("预计装柜日",fmtD(first(s,role,["factory_cargo_ready"])),"hot"),kv("柜型 / 柜量",txt(first(s,role,["container_type"]))+" × "+txt(first(s,role,["container_qty"]))),kv("装柜地址",txt(addr))]; if(shipped)od.unshift(kv("状态","已出运","hot")); $("#oceanSum").textContent=shipped?"已出运 · 实际交货 "+fmtD(first(s,role,["factory_submitted_at"])):"要在最晚交货日前交到"} $("#oceanBd").innerHTML='<div class=kv>'+od.join("")+'</div>'+(kind==="factory"?'<div class=blocked><span>🔒</span><div><b>船期、港口、订舱号、提单号不在工厂页显示。</b><br><span>这里只保留交货与装柜所需信息。</span></div></div>':'');
      var cs=read(s,"containers_detail",role)||[], td=read(s,"trucking_detail",role)||{}, veh=Array.isArray(td.vehicles)?td.vehicles:[]; var cards=(cs.length?cs:veh).map(function(c,i){c=c||{};return[["柜号",c.container_no||c.cntr,"hot"],["封铅",c.seal_no,"hot"],["司机",c.driver_name||c.driver],["车牌",c.plate||c.trailer_plate],["皮重",c.tare_weight_kg||c.tare_kg],["VGM",c.vgm_weight_kg],["柜型",c.container_type||first(s,role,["container_type"])]].map(function(x){return kv(x[0],x[1]||"待指派",x[2])}).join("")}).join(""); $("#driverSum").textContent=cs.length&&cs[0].container_no?cs[0].container_no:"待装柜 / 待指派"; $("#driverBd").innerHTML='<div class=kv>'+(cards||kv("状态","待装柜 / 待指派","warn2")+kv("柜型 / 柜量",txt(first(s,role,["container_type"]))+" × "+txt(first(s,role,["container_qty"]))))+'</div><div class=hint>由我方物流和车队维护，工厂这里只读。</div>';
    }
    var hits=rendered.filter(function(p){return forbidden.includes(p.split(".").pop())&&kind==="factory"}); $("#selfCheck").textContent="本页渲染了 "+rendered.length+" 个字段，禁见字段命中 "+hits.length+" 个"; $("#selfCheck").classList.toggle("err",hits.length>0); $("#stamp").textContent="v2026.08.23-1 · "+new Date().toLocaleString("zh-CN");
  }
  document.querySelectorAll(".hd").forEach(function(h){h.addEventListener("click",function(){h.closest(".blk").classList.toggle("open")})}); $("#changeBtn").onclick=function(){alert("预览版占位：这次有变化，后续接后端变更流程。")}; $("#plFile").onchange=function(){var f=this.files&&this.files[0]; if(!f)return; $("#fileText").textContent="已选择 "+f.name; $("#fileSub").textContent="预览版暂不真上传"; $("#upl").classList.add("done")};
  var tk=token(); if(!tk){render({valid:false,error:"URL 缺少 token",role:"factory_booking",booking_sheet:{}});return} fetch("/api/db/booking-collab/validate?token="+encodeURIComponent(tk)).then(function(r){return r.json()}).then(render).catch(function(e){render({valid:false,error:e.message,role:"factory_booking",booking_sheet:{}})});
})();
</script></body></html>
