<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>订单进度</title>
  <style>
    :root{color-scheme:light;--bg:#f6f7f8;--panel:#fff;--text:#171a1f;--muted:#6b7280;--line:#e5e7eb;--blue:#2563eb;--red:#dc2626;--amber:#d97706;--green:#15803d}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .wrap{max-width:640px;margin:0 auto;padding:16px}
    h1{font-size:20px;line-height:1.3;margin:0 0 4px}
    .sub{color:var(--muted);font-size:13px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
    .stage{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:700;background:#eef2ff;color:#3730a3;margin-top:8px}
    .event{border-left:3px solid var(--line);padding:8px 0 8px 12px;margin-bottom:2px}
    .event .t{font-weight:700}
    .event .m{color:var(--muted);font-size:12.5px;margin-top:2px}
    .error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:8px;padding:14px;margin-bottom:12px}
    .hidden{display:none}
    .foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:20px}
  </style>
</head>
<body>
  <main class="wrap">
    <h1 id="orderTitle">订单进度</h1>
    <div class="sub" id="orderSub"></div>
    <div id="msg"></div>
    <div id="box" class="hidden">
      <div class="panel">
        <div class="sub">当前阶段</div>
        <div class="stage" id="stageBadge">—</div>
      </div>
      <div class="panel">
        <div class="sub" style="margin-bottom:8px">进度动态</div>
        <div id="events"></div>
      </div>
    </div>
    <div class="foot">Sanlyn OS · 本页面为专属只读链接，请勿转发</div>
  </main>
  <script>
    const API_BASE = "https://api.sanlyn.cn";
    const STAGE_LABELS = { pending:"待处理", scheduled:"已排期", ready:"货已备好", shipped:"已出运", in_transit:"在途", customs:"清关中", delivered:"已送达" };
    function qs(k){ return new URLSearchParams(location.search).get(k); }
    function esc(s){ return String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
    async function load() {
      const token = qs("token");
      const msg = document.getElementById("msg");
      if (!token) { msg.innerHTML = '<div class="error">缺少访问令牌</div>'; return; }
      try {
        const r = await fetch(API_BASE + "/api/public/order-timeline?token=" + encodeURIComponent(token));
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || "加载失败");
        document.getElementById("orderTitle").textContent = "订单进度 · " + (d.order.contract_no || d.order.order_no || "");
        document.getElementById("orderSub").textContent = d.viewer.role === "factory" ? "工厂视图" : "客户视图";
        document.getElementById("stageBadge").textContent = STAGE_LABELS[d.order.current_stage] || d.order.current_stage || "—";
        const el = document.getElementById("events");
        if (!d.events.length) {
          el.innerHTML = '<div class="sub">暂无进度更新</div>';
        } else {
          el.innerHTML = d.events.map(e => (
            '<div class="event"><div class="t">' + esc(e.title) + '</div>' +
            '<div class="m">' + esc((e.occurred_at || "").slice(0, 16).replace("T", " ")) + '</div></div>'
          )).join("");
        }
        document.getElementById("box").classList.remove("hidden");
      } catch (e) {
        msg.innerHTML = '<div class="error">' + esc(e.message) + '</div>';
      }
    }
    load();
  </script>
</body>
</html>
